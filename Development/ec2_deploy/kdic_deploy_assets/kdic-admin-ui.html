root.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.view){state.view=t.dataset.view;render();return;}const a=t.dataset.action;if(a==='login'){login();return;}if(a==='theme'){state.dark=!state.dark;localStorage.setItem('kdic-admin-theme',state.dark?'dark':'light');render();}if(a==='refresh')refreshAll();if(a==='refresh-monitoring')refreshMonitoring();if(a==='refresh-pipeline')refreshPipeline();if(a==='select-pipeline-node')selectPipelineNode(t.dataset.id);if(a==='save-pipeline-label')savePipelineLabel();if(a==='reset-pipeline-label')resetPipelineLabel();if(a==='save-pipeline-settings')savePipelineSettings();if(a==='refresh-guardrails')refreshGuardrails();if(a==='add-guardrail')addGuardrail();if(a==='delete-guardrail')deleteGuardrail(t.dataset.index);if(a==='save-guardrail-draft')saveGuardrailDraft();if(a==='clear-guardrail-draft')clearGuardrailDraft();if(a==='test-guardrails')testGuardrails();if(a==='apply-guardrails')applyGuardrails();if(a==='rollback-guardrails')rollbackGuardrails(t.dataset.id);if(a==='refresh-prompts')refreshPrompts();if(a==='save-prompt-draft')savePromptDraft().catch(e=>toast(e.message,true));if(a==='clear-prompt-draft')clearPromptDraft();if(a==='compare-prompts')comparePrompts();if(a==='search-index')searchIndex();if(a==='select-hit')loadDocument(t.dataset.id);if(a==='upload-dataset')uploadDataset();if(a==='delete-dataset')deleteDataset();if(a==='clear-datasets')clearDatasets();if(a==='save-config')saveConfig();if(a==='run-eval')runEval();if(a==='generate-eval-report')generateEvalReport();if(a==='open-eval-job')openEvalJob(t.dataset.id);if(a==='delete-eval-job')deleteEvalJob(t.dataset.id);if(a==='clear-eval-jobs')clearEvalJobs();if(a==='reset-eval-policy'){state.evalPolicy={evaluation_depth:20,metric_ks:{hit:3,recall:5,mrr:10,map:10,complete:5,ndcg:5,precision:5,f1:5},curve_ks:[1,3,5,10,20]};render();}if(a==='copy-draft')render();if(a==='stage-add')stageAdd();if(a==='stage-remove')stageRemove(t.dataset.id);if(a==='undo-add')undoDraft('add',t.dataset.id);if(a==='undo-remove')undoDraft('remove',t.dataset.id);if(a==='test-key')testKey();if(a==='rotate-key')rotateKey();if(a==='toggle-key'){const input=document.getElementById('new-api-key');if(input){input.type=input.type==='password'?'text':'password';t.textContent=input.type==='password'?'보기':'숨기기';}}if(a==='apply-changes')applyChanges();if(a==='clear-config-draft')clearConfigDraft();if(a==='clear-draft')clearDraft();if(a==='rollback')rollback(t.dataset.id);if(a==='delete-history')deleteHistory(t.dataset.id);if(a==='clear-history')clearHistory();if(a==='run-chat-compare')runChatCompare();if(a==='load-basis'&&state.chatJob?.job_id)api('/api/basis',{method:'POST',body:JSON.stringify({job_id:state.chatJob.job_id})}).then(x=>{state.chatBasis=x;render();}).catch(x=>toast(x.message,true));if(a==='logout')api('/api/admin-ui/logout',{method:'POST',body:'{}'}).then(()=>location.reload());});

  ['bm25_weight','BM25 가중치','0~1 · Dense와 합계 1','number',0,1,.05],

function selectedParameterPreset(){return (state.parameterPresets||[]).find(row=>row.preset_id===state.selectedPresetId)||null;}
function parameterPresetOptions(selectedId=state.selectedPresetId){return `<option value="">저장된 설정 선택</option>${(state.parameterPresets||[]).map(row=>`<option value="${attr(row.preset_id)}" ${row.preset_id===selectedId?'selected':''}>${esc(row.name)}</option>`).join('')}`;}
function parameterValuesBase(){return {...(state.draft?.candidate_config||state.draft?.active_config||{})};}
function pipelineParameterValues(){if(!state.pipelineParameterValues)state.pipelineParameterValues=parameterValuesBase();return {...state.pipelineParameterValues};}
function parameterInput(field,values,kind='quick'){const [key,label,help,type,min,max,step]=field,value=values[key];if(type==='boolean')return `<label><span><b>${label}</b><small>${help}</small></span><select data-${kind}-param="${key}"><option value="true" ${value?'selected':''}>사용</option><option value="false" ${!value?'selected':''}>미사용</option></select></label>`;return `<label><span><b>${label}</b><small>${help}</small></span><input class="${kind==='quick'?'quick-param-input':''}" data-${kind}-param="${key}" type="number" min="${min}" max="${max}" step="${step}" value="${attr(value)}"></label>`;}
function capturePipelineParameters(){const values=pipelineParameterValues();document.querySelectorAll('[data-pipeline-setting],[data-quick-param]').forEach(input=>{const key=input.dataset.pipelineSetting||input.dataset.quickParam;if(!key||key==='query_fusion_rrf_k')return;values[key]=input.type==='checkbox'?input.checked:input.tagName==='SELECT'?input.value==='true':num(input.value);});state.pipelineParameterValues=values;return {...values};}
function presetValueChips(values){const labels={dense_weight:'Dense',bm25_weight:'BM25',candidate_depth:'후보',final_top_k:'Top-K',min_relevance_score:'임계치',parent_context_max_chars:'Parent',parent_child:'P-C'};return Object.entries(labels).map(([key,label])=>`<span>${label} ${values[key]===true?'사용':values[key]===false?'미사용':esc(String(values[key]))}</span>`).join('');}
function pipelineParameterWorkspace(){const values=pipelineParameterValues();return `<section class="pipeline-parameter-workspace"><span class="section-kicker">QUICK PARAMETER EDIT</span><h3>빠른 파라미터 수정</h3><p>숫자를 입력한 뒤 <b>Enter</b> 또는 <b>↑·↓</b>로 다음 항목으로 이동할 수 있습니다. RRF는 복합 질의용 내부 자동 설정으로 여기서 변경하지 않습니다.</p><div class="quick-param-grid">${parameterEditorFields.map(field=>parameterInput(field,values,'quick')).join('')}</div><div class="pipeline-preset-save"><input id="pipeline-preset-name" maxlength="60" value="${attr(state.parameterPresetName||'')}" placeholder="예: 후보 30 · 임계치 0.20"><button class="primary-btn" data-action="save-parameter-preset">이름 붙여 설정 저장</button></div></section>`;}
function pipelineSettingsPanel(){const node=state.pipelineNode,values=pipelineParameterValues();if(!node)return `<aside class="panel pipeline-setting-panel"><span class="section-kicker">PARAMETER WORKSPACE</span><h2>파라미터 편집 준비</h2><p>파이프라인 블록을 선택하면 관련 항목을 보고, 아래 빠른 수정에서 전체 값을 한 번에 조정할 수 있습니다.</p>${pipelineParameterWorkspace()}</aside>`;const common=`<span class="section-kicker">${node.configurable?'PARAMETER WORKSPACE':'DISPLAY CUSTOM'}</span><h2>${esc(node.label)}</h2><p>${esc(node.description)}</p>${pipelineLabelEditor(node)}`;if(node.setting_view==='runtime'){const fields=(node.settings||[]).filter(key=>key!=='query_fusion_rrf_k');return `<aside class="panel pipeline-setting-panel">${common}<div class="setting-fields">${fields.map(key=>pipelineSettingField(key,values[key])).join('')}</div><p class="muted-note">이 블록에서 바꾼 값은 아래 빠른 수정에도 함께 반영됩니다. 저장은 이름을 붙여 한 번만 실행하세요.</p>${pipelineParameterWorkspace()}</aside>`;}const target=node.setting_view;if(target==='prompts'||target==='guardrails')return `<aside class="panel pipeline-setting-panel">${common}<div class="pipeline-locked-note">${target==='prompts'?'이 단계의 동작은 버전 관리되는 답변 프롬프트에서 수정합니다.':'이 단계의 동작은 가드레일 규칙에서 수정합니다.'}</div><div class="pipeline-setting-actions"><button class="primary-btn" data-view="${attr(target)}">${target==='prompts'?'프롬프트 초안 열기':'가드레일 열기'} →</button></div>${pipelineParameterWorkspace()}</aside>`;return `<aside class="panel pipeline-setting-panel">${common}<div class="pipeline-locked-note">이 블록은 표시명만 변경할 수 있습니다. 동작 변경은 로컬에서 코드 검증 후 배포해야 합니다.</div>${pipelineParameterWorkspace()}</aside>`;}

async function refreshParameterPresets(){const out=await api('/api/admin-ui/parameter-presets');state.parameterPresets=out.items||[];if(state.selectedPresetId&&!state.parameterPresets.some(row=>row.preset_id===state.selectedPresetId))state.selectedPresetId='';}
async function saveParameterPreset(){const name=(document.getElementById('pipeline-preset-name')?.value||state.parameterPresetName||'').trim();if(!name)return toast('저장할 파라미터 설정 이름을 입력해 주세요.',true);try{const row=await api('/api/admin-ui/parameter-presets',{method:'POST',body:JSON.stringify({name,values:capturePipelineParameters()})});await refreshParameterPresets();state.selectedPresetId=row.preset_id;state.parameterPresetName='';render();toast(`파라미터 설정 ‘${row.name}’을 창고에 저장했습니다. 아직 운영 챗봇에는 반영되지 않았습니다.`);}catch(e){toast(e.message,true);}}
async function loadPresetToDraft(id){const presetId=id||state.selectedPresetId;if(!presetId)return toast('파라미터 설정을 먼저 선택해 주세요.',true);try{const out=await api(`/api/admin-ui/parameter-presets/${encodeURIComponent(presetId)}/load-draft`,{method:'POST',body:'{}'});state.selectedPresetId=out.preset.preset_id;state.pipelineParameterValues={...out.preset.values};state.draft=out.draft;render();toast(`‘${out.preset.name}’을 반영 초안으로 불러왔습니다. 승인 전까지 운영값은 바뀌지 않습니다.`);}catch(e){toast(e.message,true);}}
async function deleteParameterPreset(id){const preset=(state.parameterPresets||[]).find(row=>row.preset_id===id);if(!preset)return;if(!confirm(`‘${preset.name}’ 파라미터 설정을 창고에서 삭제할까요? 운영값과 반영 이력은 바뀌지 않습니다.`))return;try{await api(`/api/admin-ui/parameter-presets/${encodeURIComponent(id)}`,{method:'DELETE'});await refreshParameterPresets();render();toast('파라미터 설정을 창고에서 삭제했습니다.');}catch(e){toast(e.message,true);}}
function runtimeView(){const presets=state.parameterPresets||[],active=state.draft?.active_config||{};return `${heading('PARAMETER LIBRARY','파라미터 설정 창고','파라미터는 파이프라인에서 조정한 뒤 이름을 붙여 저장합니다. 여기서는 저장된 설정을 선택·반영 초안으로 불러오기·삭제만 합니다.')}<section class="panel" style="padding:20px"><div class="preset-toolbar"><label><span>설정 선택</span><select id="library-preset-select">${parameterPresetOptions()}</select></label><button class="secondary-btn" data-action="load-selected-preset-draft">선택 설정을 반영 초안으로 불러오기</button></div><p class="muted-note">반영 초안으로 불러온 뒤 검색 비교 평가와 챗봇 테스트를 거쳐 반영 센터에서 승인하세요.</p></section><section class="preset-list">${presets.length?presets.map(row=>`<article class="preset-card ${row.preset_id===state.selectedPresetId?'selected':''}"><div><h3>${esc(row.name)}</h3><p>저장 ${fmtDate(row.updated_at)} · 운영값과 ${(Object.keys(active).filter(key=>active[key]!==row.values[key]).length)}개 항목 다름</p><div class="preset-values">${presetValueChips(row.values)}</div></div><div class="row-actions"><button class="secondary-btn" data-action="select-parameter-preset" data-id="${attr(row.preset_id)}">선택</button><button class="secondary-btn" data-action="load-preset-draft" data-id="${attr(row.preset_id)}">반영 초안으로 불러오기</button><button class="icon-danger" data-action="delete-parameter-preset" data-id="${attr(row.preset_id)}">삭제</button></div></article>`).join(''):'<section class="panel empty-list">아직 저장된 파라미터 설정이 없습니다. 파이프라인의 빠른 파라미터 수정에서 이름을 입력해 저장하세요.</section>'}</section>`;}
function metricKSlider(name,value){return `<label><span>${metricNames[name]} K</span><div class="metric-k-range"><input type="range" min="1" max="50" step="1" value="${attr(value)}" data-metric-range="${name}"><input id="metric-candidate-${name}" type="number" min="1" max="200" value="${attr(value)}"></div></label>`;}
function evalPolicyFields(policy=state.evalPolicy){const p=normalizeEvalPolicy(policy),baseline=p.baseline_metric_ks,candidate=p.candidate_metric_ks;return `<div class="eval-policy"><div class="policy-head"><div><span class="section-kicker">EVALUATION DEPTH</span><h3>개선안 평가 기준</h3><p>현재안의 지표 K는 고정하고, 개선안 지표 K만 숫자 입력 또는 슬라이더로 설정합니다.</p></div><button class="secondary-btn" data-action="reset-independent-eval-policy">표준 지표 복원</button></div><div class="eval-depth-row"><label><span>평가 검색 깊이</span><input id="eval-depth" type="number" min="1" max="200" value="${attr(p.evaluation_depth)}"><small>현재안·개선안의 모든 지표 K 이상</small></label><div class="evaluation-caution">공통 구간 차트와 Recall 곡선은 사용하지 않습니다. 지표 표와 질문별 검색 결과로 비교합니다.</div></div><div class="metric-k-layout"><section class="metric-k-card"><div><strong>현재안 지표 K</strong><small>고정 기준</small></div><div class="preset-values">${Object.entries(baseline).map(([key,value])=>`<span>${metricNames[key]} @${value}</span>`).join('')}</div></section><section class="metric-k-card candidate"><div><strong>개선안 지표 K</strong><small>슬라이더 또는 숫자 입력</small></div><div class="metric-k-grid">${Object.keys(metricNames).map(name=>metricKSlider(name,candidate[name])).join('')}</div></section></div></div>`;}
function readEvalPolicy(){const base=normalizeEvalPolicy(state.evalPolicy),candidate={};Object.keys(metricNames).forEach(name=>candidate[name]=num(document.getElementById(`metric-candidate-${name}`)?.value));return {evaluation_depth:num(document.getElementById('eval-depth')?.value),baseline_metric_ks:base.baseline_metric_ks,candidate_metric_ks:candidate,curve_ks:[]};}
function validateEvalPolicy(candidate,policy){const required=Math.max(...Object.values(policy.baseline_metric_ks),...Object.values(policy.candidate_metric_ks));if(!policy.evaluation_depth||policy.evaluation_depth<required)throw new Error(`평가 검색 깊이는 최소 ${required}이어야 합니다.`);const active=state.draft?.active_config||{};const limit=Math.min(num(active.candidate_depth)||200,num(candidate.candidate_depth)||200);if(policy.evaluation_depth>limit)throw new Error(`평가 검색 깊이는 현재안·개선안 후보 깊이의 최솟값 ${limit} 이하여야 합니다.`);return policy;}
function evaluationViewV2(){const options=state.datasets.map(d=>`<option value="${attr(d.dataset_id)}" ${state.datasetId===d.dataset_id?'selected':''}>${esc(d.filename)} (${d.usable_count}/${d.row_count})</option>`).join(''),preset=selectedParameterPreset();let progress='';if(state.evalJob&&state.evalJob.status==='running')progress=`<section class="panel evaluation-progress"><div><span>검색 평가 실행 중</span><strong>${state.evalJob.progress||0}%</strong></div><i><em style="width:${state.evalJob.progress||0}%"></em></i><p>${state.evalJob.processed||0}개 질문 처리 · 답변 생성 없이 검색 계층만 평가</p></section>`;let result='';if(state.evalResult){const r=state.evalResult,b=r.baseline,c=r.candidate,defs=metricDefinitions(r);result=`<section class="panel result-compare"><div class="panel-head"><div><span class="section-kicker">COMPARISON RESULT</span><h2>${esc(r.evaluation_scope)}</h2><p>평가 검색 깊이 ${r.evaluation_policy?.evaluation_depth||'—'} · 현재안과 개선안의 지표 K를 독립 계산</p></div><span class="test-badge">${b.question_count}문항</span></div><div class="chart-grid-layout">${metricBarChart(r)}</div><div class="eval-metric-table"><div class="eval-row eval-head"><span>지표</span><span>현재안</span><span>개선안</span><span>변화</span></div>${defs.map(d=>{const delta=r.delta[d.name],av=b[d.baseline_key],bv=c[d.candidate_key];return `<div class="eval-row"><b>${d.label}<small>현재 @${d.baseline_k} · 개선 @${d.candidate_k}</small></b><span>${pct(av)} <small>@${d.baseline_k}</small></span><span>${pct(bv)} <small>@${d.candidate_k}</small></span><strong class="${delta>0?'rank-up':delta<0?'rank-down':'rank-same'}">${delta==null?'—':`${delta>0?'+':''}${(delta*100).toFixed(1)}%p`}</strong></div>`;}).join('')}<div class="eval-row"><b>평균 지연시간</b><span>${Number(b.latency_avg_ms||0).toFixed(0)}ms</span><span>${Number(c.latency_avg_ms||0).toFixed(0)}ms</span><strong class="${r.delta.latency_avg_ms<0?'rank-up':r.delta.latency_avg_ms>0?'rank-down':'rank-same'}">${r.delta.latency_avg_ms>0?'+':''}${Number(r.delta.latency_avg_ms||0).toFixed(0)}ms</strong></div></div>${llmReportPanel(r)}<details class="raw-toggle"><summary>질문별 결과 ${r.details.length}건 보기</summary><div class="question-results">${r.details.map(row=>`<article><b>${esc(row.question_id)} · ${esc(row.question)}</b><small>Gold ${esc(row.gold_chunk_ids.join(', '))}${row.multi_chunk_required?' · 다중 청크':''}</small><span>현재안: ${esc(row.baseline_retrieved.join(', '))}</span><span>개선안: ${esc(row.candidate_retrieved.join(', '))}</span></article>`).join('')}</div></details></section>`;}const history=state.evalJobs.map(job=>`<div class="history-row"><span><b>${esc(job.dataset_filename||job.dataset_id)}</b><small>${fmtDate(job.created_at)} · ${esc(job.job_id)}</small></span>${statusBadge(job.status)}<code>${job.evaluation_policy?.evaluation_depth?`Depth ${job.evaluation_policy.evaluation_depth}`:'—'}</code><div class="row-actions">${job.status==='done'?`<button class="secondary-btn" data-action="open-eval-job" data-id="${attr(job.job_id)}">결과 보기</button>`:''}<button class="icon-danger" data-action="delete-eval-job" data-id="${attr(job.job_id)}" ${job.status==='running'?'disabled':''}>지우기</button></div></div>`).join('')||'<div class="empty-list">저장된 평가 실행 이력이 없습니다.</div>';return `${heading('BATCH RETRIEVAL EVAL','평가데이터셋 검색 비교','저장한 파라미터 설정을 현재 운영안과 비교합니다.')}<section class="panel eval-setup"><div class="panel-head"><div><span class="section-kicker">DATASET</span><h2>1. 평가데이터셋 관리</h2></div><div class="row-actions"><button class="icon-danger" data-action="delete-dataset" ${!state.datasetId?'disabled':''}>선택 파일 지우기</button><button class="icon-danger" data-action="clear-datasets" ${!state.datasets.length?'disabled':''}>전체 비우기</button></div></div><div class="upload-row"><input id="dataset-file" type="file" accept=".xlsx,.csv"><button class="secondary-btn" data-action="upload-dataset">파일 검증·등록</button><select id="dataset-select"><option value="">등록된 파일 선택</option>${options}</select></div>${state.datasetId?datasetNotice():''}</section><section class="panel eval-setup"><div class="panel-head"><div><span class="section-kicker">PARAMETER PRESET</span><h2>2. 개선안 설정과 평가 기준</h2></div><button class="secondary-btn" data-view="runtime">파라미터 창고 열기</button></div><div class="preset-selector"><label><span>비교할 개선안</span><select id="eval-preset-select">${parameterPresetOptions()}</select></label><button class="secondary-btn" data-action="select-eval-preset">선택 적용</button></div>${preset?`<div class="preset-values" style="margin:12px 0">${presetValueChips(preset.values)}</div>`:'<div class="evaluation-caution">파이프라인에서 저장한 파라미터 설정을 선택해 주세요.</div>'}${evalPolicyFields()}<div class="form-actions"><p>선택한 설정 <b>${esc(preset?.name||'없음')}</b>을 현재 운영안과 비교합니다.</p><button class="primary-btn" data-action="run-eval" ${!state.datasetId||!preset?'disabled':''}>현재안·개선안 평가 실행</button></div></section>${progress}${result}<section class="panel jobs-panel"><div class="panel-head"><div><span class="section-kicker">EVALUATION HISTORY</span><h2>평가 실행 이력</h2></div><button class="icon-danger" data-action="clear-eval-jobs" ${!state.evalJobs.some(j=>j.status!=='running')?'disabled':''}>완료 이력 비우기</button></div>${history}</section>`;}
async function runEval(){const preset=selectedParameterPreset();if(!state.datasetId)return toast('평가데이터셋을 먼저 선택해 주세요.',true);if(!preset)return toast('파라미터 창고에서 비교할 개선안 설정을 선택해 주세요.',true);try{const candidate={...preset.values},policy=validateEvalPolicy(candidate,readEvalPolicy()),diff=evalChangeSummary(candidate),metricKChanged=Object.keys(policy.baseline_metric_ks).some(key=>policy.baseline_metric_ks[key]!==policy.candidate_metric_ks[key]);if(!diff.rank.length&&!metricKChanged)return toast('선택한 설정과 현재안의 검색 순위·지표 K가 같습니다. 다른 설정을 선택하거나 개선안 지표 K를 조정해 주세요.',true);state.evalPolicy=policy;state.evalResult=null;state.evalJob=await api('/api/admin-ui/evaluations/run',{method:'POST',body:JSON.stringify({dataset_id:state.datasetId,candidate,...policy})});render();for(let i=0;i<7200;i++){await sleep(1000);state.evalJob=await api(`/api/admin-ui/evaluations/jobs/${encodeURIComponent(state.evalJob.job_id)}`);if(state.evalJob.status==='done'){state.evalResult=state.evalJob.result;await refreshEvalJobs();render();toast('현재안·선택한 파라미터 설정의 검색평가가 완료되었습니다.');return;}if(state.evalJob.status==='error'){await refreshEvalJobs();render();return toast(state.evalJob.error,true);}render();}}catch(e){toast(e.message,true);}}
function chatView(){const preset=selectedParameterPreset(),d=state.draft||{},active=d.active_config||{},promptChanges=d.prompt_changes||[],candidate=preset?.values||null,result=state.chatComparison;const resultArea=result?chatChangeDetails('이번 답변 비교에 실제 적용된 개선안',active,result.candidate_config||candidate,result.changed_prompts||promptChanges,true)+`<section class="chat-ab-layout">${chatCompareCard('현재안 챗봇',result.baseline)}${chatCompareCard(`개선안 챗봇 · ${preset?.name||'저장 설정'}`,result.candidate,true)}</section><div class="prompt-actions"><button class="primary-btn" data-view="apply">검토 완료 · 반영센터로 이동 →</button></div>`:'<section class="panel empty-list">파라미터 설정을 선택하고 질문을 실행하면 현재안과 개선안 답변을 나란히 표시합니다.</section>';return `${heading('END-TO-END COMPARISON','최종 챗봇 답변 비교','파라미터 창고에서 선택한 설정과 현재 운영안을 같은 질문으로 실행해 비교합니다.')}<div class="risk-banner"><b>!</b><span><strong>비교 실행 중에는 운영 챗봇 요청이 잠시 대기합니다.</strong>개선 설정이 일반 사용자 답변에 섞이지 않도록 두 실행을 안전하게 격리합니다.</span></div><section class="panel chat-compare-compose"><div class="panel-head" style="margin-bottom:10px"><div><span class="section-kicker">PARAMETER PRESET</span><h2 style="font-size:14px">비교할 개선안 선택</h2></div><button class="secondary-btn" data-view="runtime">창고 열기</button></div><div class="preset-selector"><label><span>저장된 파라미터 설정</span><select id="chat-preset-select">${parameterPresetOptions()}</select></label><button class="secondary-btn" data-action="select-chat-preset">선택 적용</button></div>${preset?`<div class="preset-values" style="margin:12px 0">${presetValueChips(preset.values)}</div>${chatChangeDetails(`선택한 설정 ‘${preset.name}’ 변경값`,active,candidate,promptChanges)}`:'<div class="evaluation-caution">파이프라인에서 이름을 붙여 저장한 파라미터 설정을 선택해 주세요.</div>'}<textarea id="chat-question" style="margin-top:14px">${esc(state.chatQuestion)}</textarea><div class="button-row"><button class="secondary-btn" data-view="evaluation">검색평가 확인</button><button class="primary-btn" data-action="run-chat-compare" ${state.chatCompareBusy||!preset?'disabled':''}>${state.chatCompareBusy?'현재안·개선안 생성 중…':'선택한 설정으로 최종 답변 비교'}</button></div></section>${resultArea}`;}
async function runChatCompare(){const preset=selectedParameterPreset(),q=state.chatQuestion.trim();if(!q)return toast('질문을 입력해 주세요.',true);if(!preset)return toast('파라미터 창고에서 개선안 설정을 선택해 주세요.',true);const candidate={...preset.values},active=state.draft?.active_config||{},hasParameterChange=Object.keys(active).some(key=>active[key]!==candidate[key]),hasPromptChange=(state.draft?.prompt_changes||[]).length>0;if(!hasParameterChange&&!hasPromptChange)return toast('선택한 설정에 현재안과 다른 파라미터·프롬프트가 없습니다.',true);const savedCandidate={...(state.draft?.candidate_config||active)},savedHasChange=Object.keys(active).some(key=>active[key]!==savedCandidate[key]);state.chatCompareBusy=true;state.chatComparison=null;render();try{state.draft=await api('/api/admin-ui/draft/config',{method:'PUT',body:JSON.stringify({values:candidate})});state.chatComparison=await api('/api/admin-ui/chat/compare',{method:'POST',body:JSON.stringify({question:q})});toast(`현재안과 ‘${preset.name}’ 설정의 최종 답변 비교를 완료했습니다.`);}catch(e){toast(e.message,true);}finally{try{state.draft=savedHasChange?await api('/api/admin-ui/draft/config',{method:'PUT',body:JSON.stringify({values:savedCandidate})}):await api('/api/admin-ui/draft/config',{method:'DELETE'});}catch(e){toast('비교 전 반영 초안 복원에 실패했습니다.',true);}state.chatCompareBusy=false;render();}}
function applyViewV2(){const d=state.draft||{},changes=Object.entries(d.candidate_config||{}).filter(([k,v])=>d.active_config?.[k]!==v),prompts=d.prompt_changes||[],history=d.history||[];const added=(d.add||[]).map(c=>`<span class="editable-chip">${esc(c.chunk_id)}<button data-action="undo-add" data-id="${attr(c.chunk_id)}" aria-label="추가 초안 취소">×</button></span>`).join('')||'<span class="empty-inline">없음</span>',removed=(d.remove||[]).map(id=>`<span class="editable-chip danger">${esc(id)}<button data-action="undo-remove" data-id="${attr(id)}" aria-label="제거 초안 취소">↶</button></span>`).join('')||'<span class="empty-inline">없음</span>';return `${heading('CHANGE CONTROL','통합 반영 센터','파라미터 창고의 설정을 반영 초안으로 불러온 뒤 프롬프트·청크 초안과 함께 승인합니다.')}<section class="panel" style="padding:18px;margin-bottom:14px"><span class="section-kicker">PARAMETER LIBRARY</span><h2 style="margin:5px 0;font-size:14px">저장된 파라미터 설정 불러오기</h2><div class="preset-selector"><label><span>반영할 설정</span><select id="apply-preset-select">${parameterPresetOptions()}</select></label><button class="secondary-btn" data-action="load-selected-preset-draft">선택 설정을 반영 초안으로 불러오기</button></div><p class="muted-note">불러오기만으로 운영에는 반영되지 않습니다. 아래 변경 내역을 확인한 뒤 통합 반영하세요.</p></section><section class="change-review"><article class="panel config-card"><div class="panel-head"><h2>파라미터 ${changes.length}건</h2><button class="icon-danger" data-action="clear-config-draft" ${!changes.length?'disabled':''}>비우기</button></div><dl>${changes.length?pairs(changes.map(([k,v])=>[chatParameterLabels[k]||k,`${d.active_config[k]} → ${v}`])):'<div><dt>변경 없음</dt><dd>—</dd></div>'}</dl></article><article class="panel config-card"><h2>프롬프트 ${prompts.length}건</h2><div class="chip-list">${prompts.map(x=>`<span>${esc(x)}</span>`).join('')||'<span class="empty-inline">없음</span>'}</div></article><article class="panel config-card"><h2>청크 추가 ${d.add?.length||0}건</h2><div class="chip-list">${added}</div></article><article class="panel config-card"><h2>청크 제거 ${(d.remove||[]).length}건</h2><div class="chip-list danger">${removed}</div></article></section><section class="panel apply-panel"><div><span class="section-kicker">FINAL APPROVAL</span><h2>통합 운영 반영</h2><p>확인 문구 <b>운영 반영</b>을 입력하면 검증한 초안이 하나의 버전으로 저장되고 다음 질문부터 적용됩니다.</p></div><input id="apply-confirm" placeholder="운영 반영"><button class="danger-btn" data-action="apply-changes" ${!d.has_changes?'disabled':''}>통합 반영하기</button><button class="secondary-btn" data-action="clear-draft" ${!d.has_changes?'disabled':''}>모든 초안 비우기</button></section><section class="panel jobs-panel"><div class="panel-head"><div><span class="section-kicker">PERSISTENT ROLLBACK</span><h2>통합 반영 이력</h2></div><button class="icon-danger" data-action="clear-history" ${!history.length?'disabled':''}>이력 전체 비우기</button></div>${history.length?history.map(h=>{const s=h.summary||{},pc=(s.prompts||[]).length,cc=Object.keys(s.config||{}).length;return `<div class="history-row"><span><b>${esc(s.label||'이전 운영 상태')} · ${esc(h.version_id)}</b><small>${fmtDate(h.created_at)}</small></span><code>파라미터 ${cc} · 프롬프트 ${pc} · 청크 +${(s.added||[]).length}/-${(s.removed||[]).length}</code><div class="row-actions"><button class="secondary-btn" data-action="rollback" data-id="${attr(h.version_id)}">이 상태로 복구</button><button class="icon-danger" data-action="delete-history" data-id="${attr(h.version_id)}">지우기</button></div></div>`;}).join(''):'<div class="empty-list">첫 운영 반영 시 초기 상태가 자동으로 저장됩니다.</div>'}</section>`;}
async function bootstrap(){try{const [summary,config,capabilities,indices,jobs,monitoring,datasets,evalJobs,draft,keyStatus,pipelineGraph,guardrails,prompts,presets]=await Promise.all([api('/api/admin-ui/summary'),api('/api/admin-ui/runtime-config'),api('/api/admin-ui/capabilities'),api('/api/admin-ui/indices'),api('/api/admin-ui/jobs?limit=100'),api('/api/admin-ui/monitoring?hours=24&limit=200'),api('/api/admin-ui/evaluations/datasets'),api('/api/admin-ui/evaluations/jobs'),api('/api/admin-ui/draft'),api('/api/admin-ui/api-keys/status'),api('/api/admin-ui/pipeline/graph'),api('/api/admin-ui/guardrails'),api('/api/admin-ui/prompts'),api('/api/admin-ui/parameter-presets')]);Object.assign(state,{summary,config,capabilities,indices:indices.items||[],jobs:jobs.items||[],monitoring,datasets:datasets.items||[],evalJobs:evalJobs.items||[],draft,keyStatus,pipelineGraph,guardrails,prompts,parameterPresets:presets.items||[]});state.index=pickIndex(state.indices);state.datasetId=state.datasets.at(-1)?.dataset_id||'';render();if(state.index)await searchIndex(false);}catch(error){if(error.status===401)return renderLogin();root.innerHTML=`<section class="panel connection-error"><div class="boot-logo">!</div><h1>AWS 관리자 API에 연결하지 못했습니다.</h1><p>${esc(error.message)}</p></section>`;}}
async function refreshAll(silent=false){state.busy=true;render();try{const [summary,config,indices,jobs,monitoring,datasets,evalJobs,draft,keyStatus,prompts,pipelineGraph,presets]=await Promise.all([api('/api/admin-ui/summary'),api('/api/admin-ui/runtime-config'),api('/api/admin-ui/indices'),api('/api/admin-ui/jobs?limit=100'),api(`/api/admin-ui/monitoring?hours=${state.monitorHours}&limit=200`),api('/api/admin-ui/evaluations/datasets'),api('/api/admin-ui/evaluations/jobs'),api('/api/admin-ui/draft'),api('/api/admin-ui/api-keys/status'),api('/api/admin-ui/prompts'),api('/api/admin-ui/pipeline/graph'),api('/api/admin-ui/parameter-presets')]);Object.assign(state,{summary,config,indices:indices.items||[],jobs:jobs.items||[],monitoring,datasets:datasets.items||[],evalJobs:evalJobs.items||[],draft,keyStatus,prompts,pipelineGraph,parameterPresets:presets.items||[]});if(!silent)toast('실제 런타임 상태를 새로고침했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
root.addEventListener('click',e=>{const t=e.target.closest('button[data-action]');if(!t)return;const a=t.dataset.action;if(!['save-parameter-preset','select-parameter-preset','load-preset-draft','load-selected-preset-draft','delete-parameter-preset','select-eval-preset','select-chat-preset','save-pipeline-settings','reset-independent-eval-policy'].includes(a))return;e.stopImmediatePropagation();if(a==='save-parameter-preset')return saveParameterPreset();if(a==='select-parameter-preset'){state.selectedPresetId=t.dataset.id||'';const preset=selectedParameterPreset();if(preset)state.pipelineParameterValues={...preset.values};return render();}if(a==='load-preset-draft')return loadPresetToDraft(t.dataset.id);if(a==='load-selected-preset-draft'){const id=document.getElementById('library-preset-select')?.value||document.getElementById('apply-preset-select')?.value||state.selectedPresetId;state.selectedPresetId=id;return loadPresetToDraft(id);}if(a==='delete-parameter-preset')return deleteParameterPreset(t.dataset.id);if(a==='select-eval-preset'){state.selectedPresetId=document.getElementById('eval-preset-select')?.value||'';state.evalResult=null;return render();}if(a==='select-chat-preset'){state.selectedPresetId=document.getElementById('chat-preset-select')?.value||'';state.chatComparison=null;return render();}if(a==='save-pipeline-settings')return savePipelineSettings();if(a==='reset-independent-eval-policy'){state.evalPolicy={evaluation_depth:20,baseline_metric_ks:{...standardMetricKs},candidate_metric_ks:{...standardMetricKs},curve_ks:[]};return render();}},true);
root.addEventListener('input',e=>{if(e.target.id==='pipeline-preset-name')state.parameterPresetName=e.target.value;if(e.target.matches?.('[data-metric-range]')){const target=document.getElementById(`metric-candidate-${e.target.dataset.metricRange}`);if(target)target.value=e.target.value;}if(String(e.target?.id||'').startsWith('metric-candidate-')){const range=document.querySelector(`[data-metric-range="${e.target.id.replace('metric-candidate-','')}"]`);if(range)range.value=Math.min(50,Math.max(1,num(e.target.value)));}},true);
root.addEventListener('keydown',e=>{const field=e.target.closest?.('.quick-param-input');if(!field)return;if(!['ArrowUp','ArrowDown','Enter'].includes(e.key))return;const fields=[...document.querySelectorAll('.quick-param-input')];const index=fields.indexOf(field);if(index<0)return;e.preventDefault();const next=e.key==='ArrowUp'?fields[index-1]:fields[index+1];if(next){next.focus();next.select();}},true);
bootstrap();
})();
