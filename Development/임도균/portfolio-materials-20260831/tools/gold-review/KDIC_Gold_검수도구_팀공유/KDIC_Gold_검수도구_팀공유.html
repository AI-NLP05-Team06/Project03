    window.__KDIC_CHUNKS_JSONL__ = "{\"chunk_id\": \"DP-001_chunk_000\", \"parent_doc_id\": \"DP-001\", \"document_id\": \"DP-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"보호한도\", \"section_title\": \"\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystProtLmts/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"예금자보호제도는 다수의 소액예금자를 우선 보호하고 부실 금융회사를 선택한 예금자도 일정부분 책임을 분담한다는 차원에서 예금의 전액을 보호하지 않고 일정액만을 보호하고 있습니다.\\n\\n원금과 소정이자를 합하여 1인당 1억원까지만 보호되며 초과금액은 보호되지 않습니다.\\n\\n예금보험에 가입한 금융회사에 예금등 채권의 지급정지 등 예금자보호법상 보험사고 1 가 발생한 시점에 해당 금융회사에 예금 등 보호대상 금융상품을 보유하고 있다면 원금과 소정의 이자 2 를 합쳐 금융회사별로 1인당 1억원까지 보호됩니다. 예금 등 보호대상 금융상품으로 운용되는 확정기여형퇴직연금(DC형), 개인형퇴직연금(IRP), 중소기업퇴직연금기금의 적립금 3 과 연금저축(신탁·보험), 사고보험금 각각에 대하여는 일반 예금등 보호대상 금융상품과 분리하여 별도로 가입자 4 1인당 1억원까지 보호됩니다. ※ 예금보험공사로부터 예금보험금 지급을 통해 보호받지 못한 나머지 예금등 채권은 파산한 금융회사가 선순위채권을 변제하고 남는 재산이 있는 경우 이를 다른 채권자들과 함께 채권액에 비례하여 분배받음으로써 그 전부 또는 일부를 돌려받을 수 있습니다. 또한 앞에서 설명한 보호금액 1억원(외화예금 포함)은 예금의 종류별 또는 지점별 보호금액이 아니라 동일한 금융회사 내에서 예금자 1인이 보호받을 수 있는 총금액입니다. 이때, 예금자 1인이라함은 개인뿐만 아니라 법인도 대상이 되며, 예금의 지급이 정지되거나 파산한 금융회사의 예금자가 해당 금융회사에 대출이 있는 경우에는 예금에서 대출금을 먼저 상환(상계)시키고 남은 예금을 기준으로 보호합니다.\\n\\n도움말(각주설명)\\n\\n1. 보험사고 : 예금보험에 가입한 금융회사의 예금등 채권의 지급정지나 영업 인가·허가의 취소, 해산결의 또는 파산선고 등의 사유로 예금등 채권을 지급할 수 없는 상황 1억원 이하 예금자는 기존 계약조건 대로 계약인수금융회사와 계속 거래하실 수 있습니다.(다만, 계약인수금융회사와의 협의 결과에 따라 인수 조건은 달라질 수 있습니다.)\\n2. 이자 : 약정이자와 공사 결정이자(예금보험공사가 시중은행 1년만기 정기예금의 평균금리를 감안하여 정한 이자) 중 적은 금액\\n3. 적립금 : 퇴직보험, 퇴직일시금신탁 포함\\n4. 가입자 : 퇴직보험, 퇴직일시금신탁의 피보험자 또는 수익자 포함\", \"content_hash\": \"ee5a195f116ddb9ed7124334a977cb1b048b9d1a1e07e2d0e2ffac212a76dfc1\", \"heading_path\": []}\n{\"chunk_id\": \"DP-002_chunk_000\", \"parent_doc_id\": \"DP-002\", \"document_id\": \"DP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"예금자보호제도\", \"section_title\": \"예금보험의 구조\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSyst/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험의 구조\\n\\n금융회사가 평소에 예금보험료를 예금보험공사에 납부하고 예금보험공사는 수납받은 예금보험료를 기금으로 적립하고 있다가 금융회사가 부실화되어 고객의 예금을 지급할 수 없을 경우 예금보험공사에서 고객에게 예금보험금을 지급하여 금융시장의 안정을 유지합니다.\", \"content_hash\": \"eba15bdaa06bcb1b357dbf81858d8b23faf10cda6c16a633ae54a8776cbc4b18\", \"heading_path\": [\"예금보험의 구조\"]}\n{\"chunk_id\": \"DP-002_chunk_001\", \"parent_doc_id\": \"DP-002\", \"document_id\": \"DP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"예금자보호제도\", \"section_title\": \"예금 지급불능 사태를 방지\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSyst/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금 지급불능 사태를 방지\\n\\n금융회사가 영업정지나 파산 등으로 고객의 예금을 지급하지 못하게 될 경우 해당 예금자는 물론 전체 금융제도의 안정성도 큰 타격을 입게 됩니다. 이러한 사태를 방지하기 위하여 우리나라에서는 예금자보호법을 제정하여 고객들의 예금을 보호하는 제도를 갖추어 놓고 있는데, 이를 '예금보험제도'라고 합니다.\", \"content_hash\": \"93fa3830be003909f913842b23fe2af96383651f640fc0e27a71ba380c8c60e8\", \"heading_path\": [\"예금 지급불능 사태를 방지\"]}\n{\"chunk_id\": \"DP-002_chunk_002\", \"parent_doc_id\": \"DP-002\", \"document_id\": \"DP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"예금자보호제도\", \"section_title\": \"보험의 원리를 이용하여 예금자를 보호\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSyst/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 보험의 원리를 이용하여 예금자를 보호\\n\\n예금보험은 그 명칭에서 알 수 있듯이 \\\"동일한 종류의 위험을 가진 사람들이 평소에 기금을 적립하여 만약의 사고에 대비한다\\\"는 보험의 원리를 이용하여 예금자를 보호하는 제도입니다. 즉, 예금자보호법에 의해 설립된 예금보험공사가 평소에 금융회사로부터 보험료(예금보험료)를 받아 기금(예금보험기금)을 적립한 후, 금융회사가 예금을 지급할 수 없게 되면 금융회사를 대신하여 예금(예금보험금)을 지급하게 됩니다.\", \"content_hash\": \"9dc3ff32fe9d525a971b5c36870095f60af821d689b9bc7dcc7503a94393bd98\", \"heading_path\": [\"보험의 원리를 이용하여 예금자를 보호\"]}\n{\"chunk_id\": \"DP-002_chunk_003\", \"parent_doc_id\": \"DP-002\", \"document_id\": \"DP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"예금자보호제도\", \"section_title\": \"법에 의해 운영되는 공적보험\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSyst/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 법에 의해 운영되는 공적보험\\n\\n또한, 예금보험은 예금자를 보호하기 위한 목적으로 법에 의해 운영되는 공적보험이기 때문에 예금을 대신 지급할 재원이 금융회사가 납부한 예금보험료만으로도 부족할 경우에는 예금보험공사가 직접 채권(예금보험기금채권)을 발행하는 등의 방법을 통해 재원을 조성하게 됩니다.\", \"content_hash\": \"f8d28ec9a69338fefd4a8609df71327a6194473a945325b1a55c6efc1927fb2a\", \"heading_path\": [\"법에 의해 운영되는 공적보험\"]}\n{\"chunk_id\": \"DP-003_chunk_000\", \"parent_doc_id\": \"DP-003\", \"document_id\": \"DP-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"보호대상 금융회사 개요\", \"section_title\": \"\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystProtSumr.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"보호대상 금융회사는 은행, 보험회사(생명보험·손해보험회사), 투자매매업자·투자중개업자*, 종합금융회사, 상호저축은행 입니다.\\n\\n* 「자본시장과 금융투자업에 관한 법률」제12조에 따라 증권을 대상으로 투자매매업·투자중개업의 인가를 받은 투자매매업자·투자중개업자 및 동법 제324조 제1항에 따라 인가를 받은 증권금융회사\", \"content_hash\": \"fd5dfa632225b7c9beb00dec3a9641abcc5c9d2d894c1dca9f13a9c9dc046360\", \"heading_path\": []}\n{\"chunk_id\": \"DP-003_chunk_001\", \"parent_doc_id\": \"DP-003\", \"document_id\": \"DP-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"보호대상 금융회사 개요\", \"section_title\": \"보호대상금융회사\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystProtSumr.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 보호대상금융회사\\n\\n부보금융회사 변동현황\\n\\n엑셀 다운받기\\n\\n부보금융회사 목록\\n\\n엑셀 다운받기 한글 다운받기\\n\\n※ 업데이트 주기 : 분기 2026/03/31\", \"content_hash\": \"35358215f28718ca852b9773d765a4299e5f6ba51d248c0c267b57ffa3706e72\", \"heading_path\": [\"보호대상금융회사\"]}\n{\"chunk_id\": \"DP-003_chunk_002\", \"parent_doc_id\": \"DP-003\", \"document_id\": \"DP-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"보호대상 금융회사 개요\", \"section_title\": \"보호대상금융회사\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystProtSumr.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 보호대상금융회사\\n\\n| 구분 | 구분 2 | 국내 | 외국 2 아래 도움말 참조 | 계 |\\n| --- | --- | --- | --- | --- |\\n| 은행 | 은행 | 19 | 33 | 52 |\\n| 투자매매업자·투자중개업자 1 아래 도움말 참조 | 증권 | 48 | 12 | 60 |\\n| 투자매매업자·투자중개업자 1 아래 도움말 참조 | 자산운용 | 44 | 0 | 44 |\\n| 투자매매업자·투자중개업자 1 아래 도움말 참조 | 선물 | 2 | 0 | 2 |\\n| 투자매매업자·투자중개업자 1 아래 도움말 참조 | 증권금융 | 1 | 0 | 1 |\\n| 투자매매업자·투자중개업자 1 아래 도움말 참조 | 기타 | 0 | 0 | 0 |\\n| 투자매매업자·투자중개업자 1 아래 도움말 참조 | 합계 | 95 | 12 | 107 |\\n| 보험회사 | 생명보험 | 22 | 0 | 22 |\\n| 보험회사 | 손해보험 | 17 | 6 | 23 |\\n| 종합금융회사 | 종합금융회사 | 0 | 0 | 0 |\\n| 상호저축은행 및 상호저축은행중앙회 | 상호저축은행 및 상호저축은행중앙회 | 80 | 0 | 80 |\\n| 계 | 계 | 233 | 51 | 284 |\", \"content_hash\": \"681d65944ff3185a9f77f9fa5325a998c8e6794fa8fad6e0f18ef360406eb6b7\", \"heading_path\": [\"보호대상금융회사\"]}\n{\"chunk_id\": \"DP-003_chunk_003\", \"parent_doc_id\": \"DP-003\", \"document_id\": \"DP-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"보호대상 금융회사 개요\", \"section_title\": \"농협은행, 수협은행 및 외국은행 국내지점\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystProtSumr.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 농협은행, 수협은행 및 외국은행 국내지점\\n\\n농협은행, 수협은행 및 외국은행 국내지점은 보호대상 금융회사입니다. (농·수협 지역조합, 신용협동조합, 새마을금고는 현재 예금보험공사의 보호대상 금융회사는 아니며, 관련 법률에 따른 자체 기금에 의해 보호됩니다. 다만, 「자본시장과 금융투자업에 관한 법률」에 따라 증권을 대상으로 투자매매업 및 투자중개업 인가를 받은 경우(단, 농협 지역조합은 제외)에는 예금보험공사의 보호대상 금융회사이며, 해당 업무와 관련된 예금등에 대해서는 예금보험공사가 보호합니다.)\\n\\n도움말(각주설명)\\n\\n1. 투자매매업자 · 투자중개업자 : 「자본시장과 금융투자업에 관한 법률」제12조에 따라 증권을 대상으로 투자매매업·투자중개업의 인가를 받은 투자매매업자·투자중개업자 및 동법 제324조 제1항에 따라 인가를 받은 증권금융회사\\n2. 외국은행 : 외국금융회사 국내 지점\", \"content_hash\": \"cf69879adf2d22327df8a87f324d43c20d914f395de6b7b6837adb2fa8d74b00\", \"heading_path\": [\"농협은행, 수협은행 및 외국은행 국내지점\"]}\n{\"chunk_id\": \"DP-004_chunk_000\", \"parent_doc_id\": \"DP-004\", \"document_id\": \"DP-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"보호대상 금융상품 개요\", \"section_title\": \"\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystProtTrgtPrdctSumr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"예금보험공사는 예금보험 가입 금융회사가 취급하는 '예금' 등 만을 보호합니다. 그런데 여기서 꼭 알아두어야 할 점은 모든 금융상품이 보호대상 '예금' 등에 해당하지 않는다는 것입니다.\\n\\n예를 들어, 실적 배당형 상품인 투자신탁 상품은 보호대상 금융상품이 아닙니다. 운용실적이 좋은 경우에는 큰 수익을 올릴 수 있지만, 운용실적이 나쁜 경우에는 원금 손실도 발생할 수 있습니다.\", \"content_hash\": \"1495b2b49cf10faad33379f7d51248be9e6aaf6c8eb02b3857e759354ffcf038\", \"heading_path\": []}\n{\"chunk_id\": \"DP-004_chunk_001\", \"parent_doc_id\": \"DP-004\", \"document_id\": \"DP-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"보호대상 금융상품 개요\", \"section_title\": \"보호대상 금융상품\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystProtTrgtPrdctSumr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 보호대상 금융상품\\n\\n도움말(각주설명)\\n\\n1. 주택도시기금에 의해 정부가 별도로 관리(주택도시기금법 제14조 제2항)\\n2. 부보금융회사가 조달하여 저축은행의 예금보호대상 금융상품으로 운용되는 경우\\n\\n* 정부·지방자치단체(국·공립학교 포함), 한국은행, 금융감독원, 예금보험공사, 부보금융회사의 예금 등은 보호대상에서 제외 * 확정기여형, 개인형 퇴직연금제도 및 중소기업퇴직연금기금 편입 금융상품 중 예금보호대상으로 운용되는 금융상품은 합산하여 1억원까지 별도 보호하며, 사고보험금과 연금저축(신탁·보험)은 각각 1억원 한도로 별도보호\", \"content_hash\": \"f7bbe91e130848684b410e53b7bdc7bb32ad0cb3e8100e4edd2294dfe36dbf80\", \"heading_path\": [\"보호대상 금융상품\"]}\n{\"chunk_id\": \"DP-004_chunk_002\", \"parent_doc_id\": \"DP-004\", \"document_id\": \"DP-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"보호대상 금융상품 개요\", \"section_title\": \"은행 보호 금융상품\", \"chunk_type\": \"table_group\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystProtTrgtPrdctSumr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 보호대상 금융상품\\n\\n#### 은행 보호 금융상품\\n\\n- 보통예금, 기업자유예금, 별단예금, 당좌예금 등 요구불예금 정기예금, 저축예금, 주택청약예금, 표지어음 등 저축성예금 정기적금, 주택청약부금, 상호부금 등 적립식예금 외화예금 예금보호대상 금융상품으로 운용되는 확정기여형 퇴직연금제도 및 개인형 퇴직연금 제도의 적립금 중소기업퇴직연금기금에 편입된 금융상품 중 예금보호 대상으로 운용되는 금융상품 개인종합자산관리계좌(ISA)에 편입된 금융상품 중 예금보호 대상으로 운용되는 금융상품 원본이 보전되는 금전신탁 등\", \"content_hash\": \"cb2994e66c082d5bd62d2416124f714ffa8aa4f72392592f2d8cc4fc7c2dabda\", \"heading_path\": [\"보호대상 금융상품\", \"은행 보호 금융상품\"], \"table_group_key\": \"은행\", \"protection_type\": \"보호\"}\n{\"chunk_id\": \"DP-004_chunk_003\", \"parent_doc_id\": \"DP-004\", \"document_id\": \"DP-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"보호대상 금융상품 개요\", \"section_title\": \"은행 비보호 금융상품\", \"chunk_type\": \"table_group\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystProtTrgtPrdctSumr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 보호대상 금융상품\\n\\n#### 은행 비보호 금융상품\\n\\n- 양도성예금증서(CD), 환매조건부채권(RP) 금융투자상품(수익증권, 뮤추얼펀드, MMF 등) 은행 발행채권 주택청약저축 1 아래 도움말 참조 , 주택청약종합저축 1 아래 도움말 참조 등 확정급여형 퇴직연금제도의 적립금 특정금전신탁 등 실적배당형 신탁 개발신탁\", \"content_hash\": \"4d7082b6d342f5be060118f297b328dd7af79519dd73d7f51f8b9a06040ed36c\", \"heading_path\": [\"보호대상 금융상품\", \"은행 비보호 금융상품\"], \"table_group_key\": \"은행\", \"protection_type\": \"비보호\"}\n{\"chunk_id\": \"DP-004_chunk_004\", \"parent_doc_id\": \"DP-004\", \"document_id\": \"DP-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"보호대상 금융상품 개요\", \"section_title\": \"투자 매매업자·투자 중개업자 보호 금융상품\", \"chunk_type\": \"table_group\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystProtTrgtPrdctSumr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_nu
