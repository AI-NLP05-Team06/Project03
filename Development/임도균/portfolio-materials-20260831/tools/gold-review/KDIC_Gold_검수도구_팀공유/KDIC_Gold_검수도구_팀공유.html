ents\": [], \"content\": \"### 예금자 본인이 찾을 경우\\n\\n- 예금자 본인의 확인 증명\\n- 예금자 본인의 도장\\n\\n- 주민등록증, 경로우대증, 운전면허증, 여권 등 공공기관에서 발행한 사진이 들어간 본인임을 확인할 수 있는 증명\\n- 학생인 경우 학생증(학원증 등은 불가)\\n\\n- 도장은 통장의 거래도장과 관계없음(서명가능)\", \"content_hash\": \"378ca9d25da32475801ee0f33d01567762d5f2daa67e1854973b4703d91ec642\", \"heading_path\": [\"예금자 본인이 찾을 경우\"]}\n{\"chunk_id\": \"BI-001_chunk_001\", \"parent_doc_id\": \"BI-001\", \"document_id\": \"BI-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"신청시 구비서류\", \"section_title\": \"대리인이 찾을 경우\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyPossDcmnt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 대리인이 찾을 경우\\n\\n- 대리인 본인의 확인 증명\\n- 예금자 본인의 자필위임장\\n\\n- 주민등록증, 경로우대증, 운전면허증, 여권 등 공공기관에서 발행한 사진이 들어간 본인임을 확인할 수 있는 증명\\n- 학생인 경우 학생증(학원증 등은 불가)\\n- 미성년자는 대리인이 될 수 없음\\n\\n- 양식 : 지급대행점(또는 공사 홈페이지) 비치\\n- 예금자 본인의 도장은 인감증명서상의 인감과 일치하여야 함\", \"content_hash\": \"b5fc7d192c5f493cd7771b8841251fd7254e8902a035b5eba790698f3c01427f\", \"heading_path\": [\"대리인이 찾을 경우\"]}\n{\"chunk_id\": \"BI-001_chunk_002\", \"parent_doc_id\": \"BI-001\", \"document_id\": \"BI-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"신청시 구비서류\", \"section_title\": \"예금자 본인이 군복무 중일 경우\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyPossDcmnt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금자 본인이 군복무 중일 경우\\n\\n- 대리인 본인의 확인 증명\\n- 위임장 하단에 복무확인서상 부대장의 확인필\\n- 복무확인서\\n- 대리인의 도장\\n\\n- 주민등록증, 경로우대증, 운전면허증, 여권 등 공공기관에서 발행한 사진이 들어간 본인임을 확인할 수 있는 증명\\n- 학생인 경우 학생증(학원증 등은 불가)\\n- 미성년자는 대리인이 될 수 없음\\n\\n- 위임장에 확인 사실만 나타나면 됨 (예 : 위와 같이 위임한 사실을 확인합니다. 제 000 부 대 장 직인 )\\n\\n- 해당 군부대에서 발급\\n\\n- 통장 거래도장과는 관계없음(서명가능)\", \"content_hash\": \"1f9de994161321311e2da9e8b8661604f41e8b822b26189d37270e2a11feb58e\", \"heading_path\": [\"예금자 본인이 군복무 중일 경우\"]}\n{\"chunk_id\": \"BI-001_chunk_003\", \"parent_doc_id\": \"BI-001\", \"document_id\": \"BI-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"신청시 구비서류\", \"section_title\": \"예금자가 미성년자인 경우 : 본인이 아닌 친권자 혹은 후견인이 예금보험금 수령\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyPossDcmnt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금자가 미성년자인 경우 : 본인이 아닌 친권자 혹은 후견인이 예금보험금 수령\\n\\n- 친권자 본인의 확인 증명\\n- 친권자 여부를 확인할 수 있는 증명\\n- 친권자의 도장\\n- 친권자 합의서\\n\\n- 주민등록증, 경로우대증, 운전면허증, 여권 등 공공기관에서 발행한 사진이 들어간 본인임을 확인할 수 있는 증명\\n- 미성년자 본인이 찾아올 경우 친권자의 동의서 필요 (인감증명 및 인감도장 날인)\\n\\n- 친권자를 확인할 수 있는 증명서(가족관계증명서 및 미성년자 기준의 기본증명서)\\n- 후견인인 경우 후견인임을 확인할 수 있는 증명서\\n\\n- 통장 거래도장과는 관계없음 (서명가능)\\n\\n- 친권은 부모가 혼인중인 때에는 부모가 공동으로 행사 (「민법」② )\\n- 동행할 수 없는 친권자의 경우 인감증명서 필요\", \"content_hash\": \"9718c402a627acdcda12de755946b9369cd77231174734908e735a9cf5c936d3\", \"heading_path\": [\"예금자가 미성년자인 경우 : 본인이 아닌 친권자 혹은 후견인이 예금보험금 수령\"]}\n{\"chunk_id\": \"BI-001_chunk_004\", \"parent_doc_id\": \"BI-001\", \"document_id\": \"BI-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"신청시 구비서류\", \"section_title\": \"예금자가 사망한 경우\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyPossDcmnt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [\"1588-0037\"], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금자가 사망한 경우\\n\\n- 제적등본 또는 가족관계증명서\\n- 상속인 본인의 확인증명\\n- (공동·상속)미수령금 지분신고서\\n- 상속인의 도장\\n- 소액 상속 간편 지급 안내\\n\\n- 제적정리가 안된 경우 예금자 본인이 사망하였다는 증명 (사망진단서, 사망확인서또는 주민등록등본상에 사망사실이 기재되면 됨) 및 예금자 본인의 가족관계증명서\\n\\n- 주민등록증, 경로우대증, 운전면허증, 여권 등 공공기관에서 발행한 사진이 들어간 본인임을 확인할 수 있는 증명서\\n- 학생인 경우 학생증(단 학원증 등은 해당 없음)\\n- 단, 미성년자는 그 친권자가 권리를 행사할 수 있음\\n\\n- 원칙적으로 모든 1순위 상속권자의 이름 및 지분이 모두 포함되고 해당되는 사람이 모두 대행점에 찾아와야 하나 상속인들의 포기각서나 동의서(양식에 구애받지 않고 동의한 사실이 나타나면 됨)를 받으면 예외적으로 방문없이 신청이 가능하며, 추후 동 각서나 동의서를 제출하지 않은 사람들만으로 미수령금을 수령할 수 있음\\n- 동의서 징구시 각 개인의 인감증명서가 첨부되어야 하며 동의서 상의 도장이 인감증명서의 인감과 일치하여야함\\n- 미성년자의 동의서는 친권자의 동의가 있어야 함(친권자의 인감증명서 필요)\\n- 해외거주 및 군복무로 인해 인감증명이 불가능한 경우, 해외거주자는 대사관의 공증을 받거나 해당국이 발급한 아포스티유를 첨부하여야 하고, 군 복무자는 복무확인서 및 부대장이 확인한 동의서로 갈음할 수 있음\\n\\n- 통장 거래도장과는 관계없음 (서명가능)\\n\\n- 상속 예금등이 3백만 원 이하인 경우, 상속인 1인이 간편 지급을 신청할 수 있습니다.\\n- 상속인 1인이 간편 지급을 신청하는 경우 ‘(공동‧상속)미수령금 지분신고서’ 대신 ‘손해담보약정서’ 제출이 필요합니다.\\n- 상속인 간 분쟁이 예상되거나, 향후 추가 배당 고려 시 3백만 원을 초과하는 경우 간편 지급이 거절될 수 있습니다.\\n- 소액 판단 기준 등 자세한 사항은 예금보험공사(☎1588-0037, ARS연결 후 ③번)로 문의주시기 바랍니다.\", \"content_hash\": \"25948792f255928675fff82cec89207f91d901f2b8989c9382e657b5d41f60b0\", \"heading_path\": [\"예금자가 사망한 경우\"]}\n{\"chunk_id\": \"BI-001_chunk_005\", \"parent_doc_id\": \"BI-001\", \"document_id\": \"BI-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"신청시 구비서류\", \"section_title\": \"예금자가 국외거주 외국인, 유학생, 상사주재원인 경우\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyPossDcmnt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금자가 국외거주 외국인, 유학생, 상사주재원인 경우\\n\\n- 대리인 본인의 확인 증명\\n- 예금자 본인의 자필위임장\\n- 대리인의 도장\\n\\n- 주민등록증, 경로우대증, 운전면허증, 여권 등 공공기관에서 발행한 사진이 들어간 본인임을 확인할 수 있는 증명\\n- 학생인 경우 학생증(단, 학원증 등은 불가)\\n- 단, 미성년자는 대리인이 될 수 없음\\n\\n- 현지 대사관의 공증을 받거나 해당국이 발급한 아포스티유를 첨부한 예금자 본인 명의의 위임장이어야 함\\n\\n- 통장 거래도장과는 관계없음 (서명가능)\", \"content_hash\": \"c459e2cd6a3de43c39a73f55fc90bb7d3197689b63e66648eb506d80c12462cd\", \"heading_path\": [\"예금자가 국외거주 외국인, 유학생, 상사주재원인 경우\"]}\n{\"chunk_id\": \"BI-001_chunk_006\", \"parent_doc_id\": \"BI-001\", \"document_id\": \"BI-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"신청시 구비서류\", \"section_title\": \"양식 다운로드\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyPossDcmnt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 양식 다운로드\\n\\n| 내용 | 첨부 | 첨부 2 |\\n| --- | --- | --- |\\n| 예금보험금 등 지급청구 및 동의서 | HWP 다운로드 | PDF 다운로드 |\\n| 위임장 | HWP 다운로드 | PDF 다운로드 |\\n| 친권자합의서 | HWP 다운로드 | PDF 다운로드 |\\n| 지분신고서 및 수령권한 위임 동의서 | HWP 다운로드 | PDF 다운로드 |\\n| 손해담보 약정서 | HWP 다운로드 | PDF 다운로드 |\", \"content_hash\": \"4c5fc07ac4f46731309e963820f4889c1ab79d290de239f50a8fe2b28b4a4c5f\", \"heading_path\": [\"양식 다운로드\"]}\n{\"chunk_id\": \"BI-002_chunk_000\", \"parent_doc_id\": \"BI-002\", \"document_id\": \"BI-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"예금보험금 신청절차\", \"section_title\": \"부보금융회사 보험사고 발생\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"process_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyProc/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 부보금융회사 보험사고 발생\\n\\n- 1종 보험사고\\n- 2종 보험사고\\n\\n- 금융회사의 재무상황 악화 등으로 인해 예금의 지급이 정지된 경우\\n\\n- 금융회사가 인 · 허가 취소, 청산, 파산선고된 경우\", \"content_hash\": \"441cacdeb1f544dcec9ffe553ec111636383f9af669a963bc9695adb5155de5c\", \"heading_path\": [\"부보금융회사 보험사고 발생\"]}\n{\"chunk_id\": \"BI-002_chunk_001\", \"parent_doc_id\": \"BI-002\", \"document_id\": \"BI-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"예금보험금 신청절차\", \"section_title\": \"공사 예금보험금 지급 공고 및 안내\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"process_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyProc/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 공사 예금보험금 지급 공고 및 안내\\n\\n1. 서울지역에서 발행하는 일간지 및 주요 사무소가 소재한 지역의 일간지에 지급기한, 구비서류 등이 포함된 예금보험금 지급 공고\\n2. 예금보험공사 홈페이지(www.kdic.or.kr)에 관련 내용 게재\\n3. 예금보험금 수령 대상자에 대한 우편물 및 휴대폰 안내 문자 발송\\n\\n우편주소 및 휴대폰 번호 정보 등은 해당 보험사고 금융회사에서 제공받으므로 예금자의 최신 정보가 반영되어 있지 않은 경우 정확하게 전달되지 않을 수 있음\", \"content_hash\": \"2d8af40b8a653ff5a031b9924a410eb0a6fce67a05c1172215441e11d14a3e8e\", \"heading_path\": [\"공사 예금보험금 지급 공고 및 안내\"]}\n{\"chunk_id\": \"BI-002_chunk_002\", \"parent_doc_id\": \"BI-002\", \"document_id\": \"BI-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"예금보험금 신청절차\", \"section_title\": \"예금자의 예금보험금 지급 신청\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"process_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyProc/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금자의 예금보험금 지급 신청\\n\\n- 지급대행기관 방문신청 시\\n\\n- 홈페이지, 우편물 등을 통해 해당 금융회사에 대한 예금보험금 지급대행기관을 확인 후 이용하기 편리한 곳에 직접 방문하여 신청하면, 통상 익영업일내에 예금보험금이 입금 완료됨\\n\\n우편주소 및 휴대폰 번호 정보 등은 해당 보험사고 금융회사에서 제공받으므로 예금자의 최신 정보가 반영되어 있지 않은 경우 정확하게 전달되지 않을 수 있음\\n\\n- 인터넷 신청 시\\n\\n- 예금보험공사의 인터넷 예금지급시스템(https://fins.kdic.or.kr) 에 접속하여 본인확인 절차를 거쳐 예금보험금 지급신청이 가능하며, 통상 익영업일내에 예금보험금 입금이 완료됨\", \"content_hash\": \"54a48691148b02018c02c24c8957840397bdcbaf29680440dc3f3c21850585de\", \"heading_path\": [\"예금자의 예금보험금 지급 신청\"]}\n{\"chunk_id\": \"BI-002_chunk_003\", \"parent_doc_id\": \"BI-002\", \"document_id\": \"BI-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"예금보험금 신청절차\", \"section_title\": \"예금보험금 지급보류 및 지급보류의 해제 경우\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"process_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyProc/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험금 지급보류 및 지급보류의 해제 경우\\n\\n* 아래의 사유로 지급이 보류된 예금보험금은 사유가 해소된 이후 지급이 가능하며, 아래의 사유 중 부실금융 회사의 부실관련자 및 그 특수관계인에 대한 예금은 예금자보호법에 따라 6개월 지급보류 후 귀책사유가 없다고 판단될 경우에만 지급이 가능합니다.\\n\\n- 예금보험금 지급보류 대상\\n- 예금보험금 지급보류의 해제\\n\\n- 부실관련자(상호저축은행법상 예금 연대책임자 및 재정보증인 포함) 및 특수관계인, 계열회사 및 그 임원\\n- 보증으로 인한 보류자, 담보로 제공된 예금 및 질권설정된 예금\\n- 타인에 의한 (가)압류 예금\\n- 무자원 입금된 예금\\n\\n- 보증, 담보, 질권, (가)압류 : 보류사유 해소시\\n- 기타 : 공사의 사실관계 조사 후 지급보류 해제 기준에 따라 처리 * 부실관련자 및 그 특수관계인의 예금에 대한 지급보류는 예금자보호법에 근거하여 6개월 동안 가능하며, 해당 기간 동안 부실책임조사를 통해 귀책사유가 있는 것으로 판단될 경우 가압류 등 추가적인 채권보전조치로 지급보류가 지속될 수 있음\", \"content_hash\": \"e88c788b97369b45e938d8af4a1267da9323dc8cfd4b81cc7de3c58a1e6e2991\", \"heading_path\": [\"예금보험금 지급보류 및 지급보류의 해제 경우\"]}\n{\"chunk_id\": \"BI-003_chunk_000\", \"parent_doc_id\": \"BI-003\", \"document_id\": \"BI-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"예금보험금이란?\", \"section_title\": \"\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtExpln/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"예금보험에 가입한 금융회사가 예금의 지급정지, 영업 인 · 허가의 취소, 해산 또는 파산 등으로 고객의 예금을 지급할 수 없게 되는 경우를 “보험사고’라 하며, 이 경우, 공사의 최고 의사결정기구인 예금보험위원회의 결정 등을 거쳐 예금자에게 예금보험금/개산지급금/가지급금을 지급하게 됩니다.\", \"content_hash\": \"1da2b971dcd52eb311801cfbe8fdcec14a768c88e47441c90ca6d63a31e62d8d\", \"heading_path\": []}\n{\"chunk_id\": \"BI-003_chunk_001\", \"parent_doc_id\": \"BI-003\", \"document_id\": \"BI-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"예금보험금이란?\", \"section_title\": \"예금보험금이란?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtExpln/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험금이란?\\n\\n예금보험에 가입한 금융회사가 예금의 지급정지, 영업 인 · 허가의 취소, 해산 또는 파산 등 보험사고로 인하여 고객의 예금을 지급할 수 없는 경우 예금보험공사가 해당 금융회사를 대신하여 지급하는 금전을 말합니다.\", \"content_hash\": \"fe7ca0019267a62f6c0ba6ef86dd32110bf5dbf8c6c98549003f3dd61df4ef85\", \"heading_path\": [\"예금보험금이란?\"]}\n{\"chunk_id\": \"BI-003_chunk_002\", \"parent_doc_id\": \"BI-003\", \"document_id\": \"BI-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"예금보험금이란?\", \"section_title\": \"가지급금이란?\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtExpln/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험금이란?\\n\\n#### 가지급금이란?\\n\\n보험사고 발생 금융회사 예금자의 장기간 금융거래 중단에 따른 경제적 불편을 최소화하기 위해 예금보험금 지급 이전에 예금보험금 지급한도 내에서 예금보험위원회가 정하는 금액(원금 기준)을 예금자의 신청에 의해 미리 지급하는 금전을 말합니다.\", \"content_hash\": \"093d358f94753fa22f12b39246e03ee67928556228a370c478efe4a7521056f2\", \"heading_path\": [\"예금보험금이란?\", \"가지급금이란?\"]}\n{\"chunk_id\": \"BI-003_chunk_003\", \"parent_doc_id\": \"BI-003\", \"document_id\": \"BI-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"예금보험금이란?\", \"section_title\": \"개산지급금이란?\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtExpln/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험금이란?\\n\\n#### 개산지급금이란?\\n\\n장기간에 걸친 파산절차로 인한 예금자의 불편을 해소해 드리기 위해 예금자가 향후 파산배당으로 받게 될 예상배당률을 고려하여 예금자의 보호한도 초과 예금 등 채권을 예금자의 청구에 의하여 공사가 매입하고, 그 매입의 대가로 예금자에게 지급하는 금전을 의미합니다. 개산지급금을 수령하지 않은 예금자는 해당 금융회사의 파산절차에 따라 배당금을 수령하시면 됩니다.\", \"content_hash\": \"711a9a8a011515818145639f1c2ad3787a2d5e178895441b388f33d177d2c191\", \"heading_path\": [\"예금보험금이란?\", \"개산지급금이란?\"]}\n{\"chunk_id\": \"BI-003_chunk_004\", \"parent_doc_id\": \"BI-003\", \"document_id\": \"BI-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"예금보험금이란?\", \"section_title\": \"예금보험금이란?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtExpln/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [{\"url\": \"https://fins.kdic.or.kr/mm/lgn/selectNonMbrLgn.do\", \"anchor_text\": \"예금보험금/개산지급금/가지급금 신청 바로가기\", \"link_role\": \"action\", \"action_type\": \"apply\", \"source_tag\": \"button\", \"action_id\": \"dd3c2e2cc49293fb\", \"resource_group_id\": \"\", \"interaction_type\": \"navigate\", \"target_layer_id\": \"\", \"target_document_id\": \"\"}], \"related_documents\": [], \"content\": \"### 예금보험금이란?\\n\\n보험사고 발생 금융회사의 예금자께서는 하단의 「예금보험금/개산지급금/가지급금 신청 바로가기」 에 접속하여 예금보험금/개산지급금/가지급금을 신청하실 수 있습니다.\", \"content_hash\": \"b089f738b89b289181d4dfa64f600ec4cbd59f2942a8168933ab807b4fb6c191\", \"heading_path\": [\"예금보험금이란?\"]}\n{\"chunk_id\": \"BI-003_chunk_005\", \"parent_doc_id\": \"BI-003\", \"document_id\": \"BI-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"예금보험금이란?\", \"section_title\": \"예금이 지급정지된 경우(1종 보험사고)\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtExpln/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험금이 지급되는 경우\\n\\n#### 예금이 지급정지된 경우(1종 보험사고)\\n\\n금융회사의 재무상황 악화 등으로 금융당국이 예금의 지급정지명령을 내린 경우에는 일정기간 동안 해당 금융회사에 대한 재산실사 등을 통해 경영정상화 가능성을 판단하며 정상화가 불가능해질 경우 제3자 계약이전 등을 추진하게 되는데 이 때 계약이전 1 등이 실패하여 파산이 불가피할 경우 공사가 예금보험금을 지급하게 됩니다. 또한 보험사고 이후 해당 금융회사가 제3자(또는 가교금융회사) 계약이전 등을 통하여 영업이 재개되는 경우 계약이전된 예금의 예금자는 당초 약정대로 보험사고 이전과 같이 정상적인 금융거래를 하실 수 있으며, 계약이전에서 제외된 예금에 대하여는 공사가 1인당 1억원(원금 + 소정이자 2 )을 한도로 예금보험금을 지급하여 드립니다.\", \"content_hash\": \"d106ecb3f81c940f3ca19ec8c9efbd056705ae07ede64a4f7c6296614988401f\", \"heading_path\": [\"예금보험금이 지급되는 경우\", \"예금이 지급정지된 경우(1종 보험사고)\"]}\n{\"chunk_id\": \"BI-003_chunk_006\", \"parent_doc_id\": \"BI-003\", \"document_id\": \"BI-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"예금보험금이란?\", \"section_title\": \"인허가취소 · 해산 · 파산의 경우(2종 보험사고)\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtExpln/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험금이 지급되는 경우\\n\\n#### 인허가취소 · 해산 · 파산의 경우(2종 보험사고)\\n\\n금융회사가 인허가 취소,해산,파산되는 경우에도 예금자의 청구에 의해 예금에 대한 예금보험금을 지급하게 됩니다.\", \"content_hash\": \"f389edfb00553cdd57eeb5305cf6c14265e4bd3f39983448d9d7f7d700290cf6\", \"heading_path\": [\"예금보험금이 지급되는 경우\", \"인허가취소 · 해산 · 파산의 경우(2종 보험사고)\"]}\n{\"chunk_id\": \"BI-003_chunk_007\", \"parent_doc_id\": \"BI-003\", \"document_id\": \"BI-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"예금보험금이란?\", \"section_title\": \"예금보험금이 지급되는 경우\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtExpln/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험금이 지급되는 경우\\n\\n보험사고 시 적용 이자율 2026년 7월 중 보험사고 발생 시 예금보험금은 아래의 공사 공시이율과 약정이율 중 낮은 금리를 적용 ※ 은행·저축은행·종합금융업 : 2.27% , 투자매매·투자중개업 : 0.67% , 보험업 : 2.50%\", \"content_hash\": \"4aa5e32921ef6c63f55be4be1da2e01625676b281a43751396f0ad682a4eba59\", \"heading_path\": [\"예금보험금이 지급되는 경우\"]}\n{\"chunk_id\": \"BI-003_chunk_008\", \"parent_doc_id\": \"BI-003\", \"document_id\": \"BI-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"예금보험금이란?\", \"section_title\": \"신청안내\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금보험금 안내\", \"target_business_function\": \"예금보험금 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtExpln/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [\"1588-0037\"], \"related_links\": [{\"url\": \"https://fins.kdic.or.kr/mm/lgn/selectNonMbrLgn.do\", \"anchor_text\": \"예금보험금/개산지급금/가지급금 신청 바로가기\", \"link_role\": \"action\", \"action_type\": \"apply\", \"source_tag\": \"button\", \"action_id\": \"dd3c2e2cc49293fb\", \"resource_group_id\": \"\", \"interaction_type\": \"navigate\", \"target_layer_id\": \"\", \"target_document_id\": \"\"}], \"related_documents\": [], \"content\": \"### 신청안내\\n\\n- 보험금/개산지급금/가지급금 신청은 본인명의 공인인증서, 금융인증서나 간편인증 등을 통해 하단의 「예금보험금/개산지급금/가지급금 신청 바로가기」에 접속하여 신청하시거나, 예금자 본인의 신분증, 도장(서명가능)을 지참하여 지급대행지점을 방문하여 신청하시면 됩니다. 다만, 대리인으로 하여금 예금보험금/개산지급금/가지급금을 수령하게 할 경우에는 위임장, 위임자의 인감증명서, 대리인의 실명증표 등을 추가로 구비하여야 합니다.\\n- 예금보험금/개산지급금/가지급금의 신청시에는 「예금등 채권양도증서」 등 소정의 서류를 징구하게 되오니 참고하시기 바랍니다\\n- 기타 문의사항은 예금보험금(또는 가지급금) 지급대행지점이나 보험사고 발생 금융회사, 예금보험공사 안내 전화번호(1588-0037)로 문의하시면 자세한 안내를 받으실 수 있습니다.\\n- 예금자등의 예금보험금청구권은 「예금자보호법」제31조제7항의 규정에 의하여 예금보험금지급 개시일로부터 5년간 행사하지 아니하면 시효로 인하여 소멸하기 때문에 예금보험금이 지급되지 않습니다.\\n- * 현재 정상 영업중인 은행·보험 및 우체국의 휴면계좌 관련 정보는 전국은행연합회의 『 휴면계좌통합조회시스템』(www.sleepmoney.or.kr) 을 이용 바랍니다.\\n- * 공사 홈페이지 접속을 통한 인터넷 신청은 미성년자 및 법인의 경우에는 불가하오니 이점 참고하시기 바랍니다.\\n\\n도움말(각주설명)\\n\\n1. 계약이전 : 금융당국의 명령 또는 당사자간의 합의에 따라 부실금융회사의 자산과 부채를 다른 금융회사로 이전하는 것으로, 이 경우 모든 자산과 부채가 반드시 포괄승계되는 것은 아니며 구체적인 계약이전 내용에 따라 승계되는 자산과 부채의 범위가 달라짐\\n2. 소정이자 : 공사 공시이율과 영업정지된 금융회사의 약정이율 중 낮은 이율로 계산된 이자\\n\\n- 공사 공시이율\\n- 만기가 지난 예금의 약정이자는 만기후 이율\\n\\n- (은행·저축은행·종합금융업) 은행의 1년 만기 정기예금(만기지급식) 금리의 평균 이자율\\n- (투자매매·투자중개업) 투자자예탁금 평균 이용료율\\n- (보험업) 금융감독원에서 고시하는 평균 공시이율\", \"content_hash\": \"f52d543e1eaae1d125ba91ac60b81c1530d2f954258046ed459ed12de1d08c5c\", \"heading_path\": [\"신청안내\"]}\n{\"chunk_id\": \"BI-004_chunk_000\", \" ectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\", \"related_service\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 고객 미수령금이란?\\n\\n부실화된 금융회사의 예금자 등이 찾아가지 아니한 금액을 말합니다.\", \"content_hash\": \"bbc0521cff2839f5c8ef93c3f066fec642397a45f5c9e0696d76ee6ccd53e454\", \"heading_path\": [\"고객 미수령금이란?\"]}\n{\"chunk_id\": \"UN-001_chunk_002\", \"parent_doc_id\": \"UN-001\", \"document_id\": \"UN-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"고객미수령금\", \"section_title\": \"고객 미수령금의 종류\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystNramtInqAplyNramtGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\", \"related_service\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 고객 미수령금의 종류\\n\\n- 예금보험금\\n- 파산배당금\\n- 개산지급금 정산금\\n\\n- 예금보험에 가입한 금융회사가 예금의 지급정지, 영업 인·허가의 취소 등 보험사고로 인하여 고객의 예금을 지급할 수 없을 때 공사가 해당 금융회사를 대신하여 지급하는 보험금을 말합니다.\\n\\n- 금융회사가 파산하는 경우 남은 자산을 현금화하여 채권자들에게 그 채권액 비율대로 배당하는 금액을 말합니다.\\n\\n- 파산배당금 등으로 회수한 금액에서 소요비용을 공제한 금액이 수령한 개산지급금을 초과하는 때에 그 초과금액을 예금자에게 추가로 지급하는데, 이를 개산지급금 정산금이라고 합니다.\", \"content_hash\": \"959a879ff1deaae2fc5ee920b0790a3318eb2da609ea2f407089e8fd8dd95c2f\", \"heading_path\": [\"고객 미수령금의 종류\"]}\n{\"chunk_id\": \"UN-001_chunk_003\", \"parent_doc_id\": \"UN-001\", \"document_id\": \"UN-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"고객미수령금\", \"section_title\": \"파산 금융회사 정보 검색\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystNramtInqAplyNramtGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\", \"related_service\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 파산 금융회사 정보 검색\\n\\n예금보험공사가 관리하고 있는 파산금융회사의 상세정보를 확인할 수 있습니다.\", \"content_hash\": \"adbb8c7e3e9bbd5b6ef48c7dee14ddde07aa076a0cf14d26180cf0e0747c2c7d\", \"heading_path\": [\"파산 금융회사 정보 검색\"]}\n{\"chunk_id\": \"UN-001_chunk_004\", \"parent_doc_id\": \"UN-001\", \"document_id\": \"UN-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"고객미수령금\", \"section_title\": \"지급대행점 목록 및 방문신청시 구비 서류\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystNramtInqAplyNramtGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\", \"related_service\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 지급대행점 목록 및 방문신청시 구비 서류\\n\\n예금보험공사는 미수령금 종류별·부실금융회사별로 독립되어 있던 지급대행점 운영 체계를 개선하여 미수령금 종류별·부실금융회사별 구분없이 ‘16.10월부터 전국 지급대행점 어디에서든 미수령금을 통합 신청할 수 있도록 하였습니다.\", \"content_hash\": \"26dcf526129bd99f7db879d5c40bdc0c8bbea976e08256dd31cc7f5a2907ff05\", \"heading_path\": [\"지급대행점 목록 및 방문신청시 구비 서류\"]}\n{\"chunk_id\": \"UN-002_chunk_000\", \"parent_doc_id\": \"UN-002\", \"document_id\": \"UN-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"통합신청 소개와 신청 방법 안내\", \"section_title\": \"예금자 대상 전화문의 안내\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ua/aplygudn/DpstrTrgtTelQustGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [\"02-1588-0037\", \"02-758-1117\"], \"related_links\": [{\"url\": \"https://www.kdic.or.kr/voc/\", \"anchor_text\": \"‘고객의소리(https://www.kdic.or.kr/voc/)’\", \"link_role\": \"content\", \"source_tag\": \"a\"}], \"related_documents\": [], \"content\": \"### 예금자 대상 전화문의 안내\\n\\n개명 등으로 인해 변경된 명의(성명)로 미수령금을 신청하시는 경우 지급이 불가하오니, 이러한 경우 추가안내를 위해 02-1588-0037 로 문의해주시기 바랍니다.\\n\\n(서비스 번호 3번 또는 미수령금 담당자 전화연결 요청)\\n\\n- 고객 문의 02-1588-0037\\n- 예금보험공사 IT서비스 데스크 02-758-1117\\n- 09:00 ~ 18:00 (공휴일, 토/일요일 휴무)\\n\\n궁금한 사항이 있으시면 02-1588-0037 로 문의해 주세요.\\n\\n* ARS 연결 후 예금보험금, 파산배당금, 정산금 수령 등 문의는 3번을 누르세요. (예금명의자 본인이 아닌 경우 안내에 제한이 있습니다)\\n\\n공사는 채권신고, 자산매각, 배당 및 종결 등 파산절차를 진행 함에 있어 파산채권자의 의견을 듣고, 적극 반영하고자 노력하고 있습니다. 궁금한 사항 또는 건의하실 말씀이 있으신 경우 예금보험공사 홈페이지 ‘고객의소리(https://www.kdic.or.kr/voc/)’ 또는 웹메일(pasan@kdic.or.kr)로 언제든지 연락주시기 바랍니다. 예금보험공사는 예금자 여러분의 불편을 덜어 드리기 위해 더욱 노력하겠습니다.\\n\\n예금보험공사\", \"content_hash\": \"0b58d1b601a25c75a9868d4d9185e4c1f719f39bcb09da81dbaa188aae29aa65\", \"heading_path\": [\"예금자 대상 전화문의 안내\"]}\n{\"chunk_id\": \"UN-003_chunk_000\", \"parent_doc_id\": \"UN-003\", \"document_id\": \"UN-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"통합신청 소개와 신청방법 안내\", \"section_title\": \"고객 미수령금이란?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ua/aplygudn/NramtItgrAplyItrdMthdGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 고객 미수령금이란?\\n\\n고객 미수령금이란, 부실화된 금융회사의 예금자 등이 찾아가지 아니한 금액을 가리킵니다. 예금보험공사는 고객 미수령금을 통합 관리하고 있으며, 지속적인 홍보 및 안내를 통한 적극적인 미수령금 찾아주기 서비스를 제공하고 있습니다.\", \"content_hash\": \"e3026977b28930ff7c0c42b60a0eed338409daeba4c092529e840e650acb0e6f\", \"heading_path\": [\"고객 미수령금이란?\"]}\n{\"chunk_id\": \"UN-003_chunk_001\", \"parent_doc_id\": \"UN-003\", \"document_id\": \"UN-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"통합신청 소개와 신청방법 안내\", \"section_title\": \"예금보험금\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ua/aplygudn/NramtItgrAplyItrdMthdGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 고객 미수령금의 종류\\n\\n#### 예금보험금\\n\\n예금보험에 가입한 금융회사가 예금의 지급정지, 영업 인·허가의 취소 등 보험사고로 인하여 고객의 예금을 지급할 수 없을 때 공사가 해당 금융회사를 대신하여 지급하는 예금보험금을 말합니다.\", \"content_hash\": \"3589b52bc912ec40d445648d170a237ad2e52049d05249b42ee958ea889bef8e\", \"heading_path\": [\"고객 미수령금의 종류\", \"예금보험금\"]}\n{\"chunk_id\": \"UN-003_chunk_002\", \"parent_doc_id\": \"UN-003\", \"document_id\": \"UN-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"통합신청 소개와 신청방법 안내\", \"section_title\": \"개산지급금\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ua/aplygudn/NramtItgrAplyItrdMthdGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 고객 미수령금의 종류\\n\\n#### 개산지급금\\n\\n파산절차 장기화에 따른 예금자의 불편을 해소하기 위해 1억원 초과 예금자로부터 예금 등 채권을 매입하고, 파산배당으로 회수가능한 추정 금액 중 일부를 미리 지급하는데, 이를 개산지급금이라 합니다.\", \"content_hash\": \"ca95f7f25f8ae45861d42c4dda0f09fd22a7d869b7ccd0027e1ce2ab8f9d16de\", \"heading_path\": [\"고객 미수령금의 종류\", \"개산지급금\"]}\n{\"chunk_id\": \"UN-003_chunk_003\", \"parent_doc_id\": \"UN-003\", \"document_id\": \"UN-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"통합신청 소개와 신청방법 안내\", \"section_title\": \"정산금 (개산지급금 정산금)\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ua/aplygudn/NramtItgrAplyItrdMthdGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 고객 미수령금의 종류\\n\\n#### 정산금 (개산지급금 정산금)\\n\\n파산배당금 등으로 회수한 금액에서 소요비용을 공제한 금액이 수령한 개산지급금을 초과하는 때에 그 초과금액을 예금자에게 추가로 지급하는데, 이를 개산지급금 정산금이라고 합니다.\", \"content_hash\": \"29d8b74178f36a111924b41f70bbd90adede54682760bbede460cf8411bcbc36\", \"heading_path\": [\"고객 미수령금의 종류\", \"정산금 (개산지급금 정산금)\"]}\n{\"chunk_id\": \"UN-003_chunk_004\", \"parent_doc_id\": \"UN-003\", \"document_id\": \"UN-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"통합신청 소개와 신청방법 안내\", \"section_title\": \"가지급금\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ua/aplygudn/NramtItgrAplyItrdMthdGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 고객 미수령금의 종류\\n\\n#### 가지급금\\n\\n보험사고 발생 금융기관 예금자의 장기간 금융거래중단에 따른 경제적 불편을 최소화하기 위해 예금보험금 지급 이전에 예금보험금 지급한도 내에서 예금보험위원회가 정하는 금액(원금 기준)을 예금자의 신청에 의해 미리 지급하는 금전을 말합니다.\", \"content_hash\": \"4bf80815e649720cf794b4d72eb05e593e364dcefedeab08cc087d1d5e2007c7\", \"heading_path\": [\"고객 미수령금의 종류\", \"가지급금\"]}\n{\"chunk_id\": \"UN-003_chunk_005\", \"parent_doc_id\": \"UN-003\", \"document_id\": \"UN-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"통합신청 소개와 신청방법 안내\", \"section_title\": \"파산배당금\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ua/aplygudn/NramtItgrAplyItrdMthdGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 고객 미수령금의 종류\\n\\n#### 파산배당금\\n\\n금융회사가 파산하는 경우 남은 자산을 현금화하여 채권자들에게 그 채권액 비율대로 배당하는 금액을 말합니다.\", \"content_hash\": \"13192b12c6001f65a7a895ff9ba00cb834ae9e2bdd3ea3744be3feb166758b79\", \"heading_path\": [\"고객 미수령금의 종류\", \"파산배당금\"]}\n{\"chunk_id\": \"UN-003_chunk_006\", \"parent_doc_id\": \"UN-003\", \"document_id\": \"UN-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"통합신청 소개와 신청방법 안내\", \"section_title\": \"(온라인) 금융안심포털에서 미수령금통합신청\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ua/aplygudn/NramtItgrAplyItrdMthdGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [{\"url\": \"https://fins.kdic.or.kr/ua/itgraply/selectItgrInqDsctn.do\", \"anchor_text\": \"미수령금 통합신청\", \"link_role\": \"action\", \"action_type\": \"apply\", \"source_tag\": \"a\", \"action_id\": \"85fef33f081f2508\", \"resource_group_id\": \"\", \"interaction_type\": \"navigate\", \"target_layer_id\": \"\", \"target_document_id\": \"\"}], \"related_documents\": [], \"content\": \"### 신청 방법 안내\\n\\n#### (온라인) 금융안심포털에서 미수령금통합신청\\n\\n여러분이 현재 받으실 미수령금이 있는지 금융안심포털에서 통합 확인 및 통합신청이 가능합니다. 금융안심포털은 모바일에서도 가능합니다.\\n\\n미수령금 통합신청\", \"content_hash\": \"2c9dae66871027059a4e91dc00f848cc9978fe63693f379216b9b2d19d752f39\", \"heading_path\": [\"신청 방법 안내\", \"(온라인) 금융안심포털에서 미수령금통합신청\"]}\n{\"chunk_id\": \"UN-003_chunk_007\", \"parent_doc_id\": \"UN-003\", \"document_id\": \"UN-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"통합신청 소개와 신청방법 안내\", \"section_title\": \"(오프라인) 지급대행점 직접 방문\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ua/aplygudn/NramtItgrAplyItrdMthdGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [{\"url\": \"https://www.kdic.or.kr/sp/dpstrprot/DpsmIbamtAplyPossDcmnt/selectScrn.do\", \"anchor_text\": \"구비서류 바로가기\", \"link_role\": \"content\", \"source_tag\": \"a\"}, {\"url\": \"https://www.kdic.or.kr/sp/dpstrprot/selectProtSystBamtGiveInq.do\", \"anchor_text\": \"지급대행점 조회하기\", \"link_role\": \"action\", \"action_type\": \"lookup\", \"source_tag\": \"a\", \"action_id\": \"bed24eea86eab52b\", \"resource_group_id\": \"\", \"interaction_type\": \"navigate\", \"target_layer_id\": \"\", \"target_document_id\": \"\"}], \"related_documents\": [], \"content\": \"### 신청 방법 안내\\n\\n#### (오프라인) 지급대행점 직접 방문\\n\\n예금보험공사는 미수령금 종류별 · 부실금융회사별로 독립되어 있던 지급대행점 운영 체계를 개선하여 미수령금 종류별 · 부실금융회사별 구분없이 '16.10월부터 전국 지급대행점 어디에서든 미수령금을 통합신청할 수 있도록 하였습니다.\\n\\n지급대행점 조회하기 구비서류 바로가기\", \"content_hash\": \"8d6ae05ccce30b2346e71450a7aed95c9d955d3fb09c2179c7b04da33b74dd18\", \"heading_path\": [\"신청 방법 안내\", \"(오프라인) 지급대행점 직접 방문\"]}\n{\"chunk_id\": \"UN-004_chunk_000\", \"parent_doc_id\": \"UN-004\", \"document_id\": \"UN-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"상속인 금융거래조회\", \"section_title\": \"상속인 금융거래 조회서비스란?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystHrpeHistInq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 상속인 금융거래 조회서비스란?\\n\\n공사는 상속인이 피상속인(사망자, 실종자, 금치산자 또는 피성년후견인, 피산정후견인)의 금융재산 및 채무를 여러 금융회사를 일일이 방문하여야 하는 시간적·경제적 어려움을 덜어주기 위하여, 피상속인의 미수령금 (예금보험금·파산배당금·개산지급금 정산금) 및 예금보험공사가 파산관재인으로 선임된 파산금융회사(파산재단)·㈜케이알앤씨의 채무를 확인할 수 있는 서비스를 제공하고 있습니다.\\n\\n- 예금보험금이란?\\n- 파산배당금이란?\\n- 개산지급금 정산금이란?\\n\\n- 예금보험에 가입한 금융회사가 예금의 지급정지, 영업 인·허가의 취소 등 보험사고로 인하여 고객의 예금을 지급할 수 없을 때 공사가 해당 금융회사를 대신하여 지급하는 보험금을 말합니다.\\n\\n- 금융회사가 파산하는 경우 남은 자산을 현금화하여 채권자들에게 그 채권액 비율대로 배당하는 금액을 말합니다.\\n\\n- 파산배당금 등으로 회수한 금액에서 소요비용을 공제한 금액이 수령한 개산지급금을 초과하는 때에 그 초과금액을 예금자에게 추가로 지급하는데, 이를 개산지급금 정산금이라고 합니다.\", \"content_hash\": \"67be435f78919d4fb662df4a620e876c5342c0bfad7197e0e09f381acf0ea818\", \"heading_path\": [\"상속인 금융거래 조회서비스란?\"]}\n{\"chunk_id\": \"UN-004_chunk_001\", \"parent_doc_id\": \"UN-004\", \"document_id\": \"UN-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"상속인 금융거래조회\", \"section_title\": \"접수처\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystHrpeHistInq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 접수처\\n\\n금융감독원, 전 은행(수출입은행, 외은지점제외), 농·수협단위조합, 우체국, 삼성생명 고객프라자, 한화생명 고객센터, KB생명 고객프라자, 교보생명 고객프라자, 삼성화재 고객프라자, 유안타증권 * 안심상속 원스톱서비스는 사망신고 접수를 담당하는 시청이나 구청, 읍·면·동 주민센터 민원실에서도 접수 가능(단,사망일이 속한 달의 말일로부터 6개월 이내에만 신청이 가능) 자세한 사항은 금융감독원 홈페이지를 참고하시기 바랍니다.\", \"content_hash\": \"c7c2ac4f0e0ba3b95827ad6e7bdf0ec310bd605c6e4864f6b1a0b69d17a7576e\", \"heading_path\": [\"접수처\"]}\n{\"chunk_id\": \"UN-004_chunk_002\", \"parent_doc_id\": \"UN-004\", \"document_id\": \"UN-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"상속인 금융거래조회\", \"section_title\": \"상속인 미수령금 조회결과 안내\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystHrpeHistInq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 상속인 미수령금 조회결과 안내\\n\\n본 조회 서비스에서는 사망예금자(피상속인)의 거래 금융회사명, 미수령금 잔액(구간별), 해당 파산재단 연락처 정보를 제공하고 있습니다. 예금보험금은 예금자의 사망일자가 보험금 지급결정일 전인 경우 예금상속, 후인 경우 보험금 상속으로 구분되고, 예금 상속인 경우 상속인의 예금과 합산하여 5천만원 한도 여부를 판단합니다. 또한 조회된 미수령금은 상속인 전원의 합의를 거쳐 관련 서류(“고객 미수령금 통합조회/신청” 화면 참고)를 구비한 후 해당 파산재단(예금보험금 및 파산배당금) 또는 지급대행점(개산지급금 정산금)에 상속에 따른 명의변경 신청을 접수하시면 상속 처리 후 수령 받으실 수 있습니다.\", \"content_hash\": \"9d8a3aec8a7d03c4f8f2e9aa1e2ffb02862b856c698a6c4fbe0cf79025283bfc\", \"heading_path\": [\"상속인 미수령금 조회결과 안내\"]}\n{\"chunk_id\": \"UN-004_chunk_003\", \"parent_doc_id\": \"UN-004\", \"document_id\": \"UN-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"상속인 금융거래조회\", \"section_title\": \"상속인 채무정보 조회결과 안내\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"고객 미수령금 신청\", \"target_business_function\": \"고객 미수령금 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystHrpeHistInq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"lookup\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 상속인 채무정보 조회결과 안내\\n\\n조회되는 정보에 대한 상세내역이나 정확한 금액 등은 반드시 해당 파산금융회사(파산재단) 또는 ㈜케이알앤씨 담당자에게 연락하여 확인하시기 바랍니다.\", \"content_hash\": \"7c6102e4855d957b6b1f4480f3adeb6e156ca88e9240d1ccf2926724a805047f\", \"heading_path\": [\"상속인 채무정보 조회결과 안내\"]}\n{\"chunk_id\": \"MT-001_chunk_000\", \"parent_doc_id\": \"MT-001\", \"document_id\": \"MT-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"잘못 보낸 돈 되찾기 서비스 (착오송금 반환지원 제도)\", \"section_title\": \"제도 소개 안내영상\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"video_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/kmrs/kmrsItrd/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제도 소개 안내영상\\n\\n잘못 보낸 돈 되찾기 서비스란 착오송금인이 실수로 잘못 보낸 돈을 최소한의 비용으로 빠르게 되찾을 수 있도록 도와드리는 제도입니다.\", \"content_hash\": \"6dc55754eecbf69175b9f3b664d8bdf2d7abab8654af8afb9f8c38f912964ac6\", \"heading_path\": [\"제도 소개 안내영상\"]}\n{\"chunk_id\": \"MT-002_chunk_000\", \"parent_doc_id\": \"MT-002\", \"document_id\": \"MT-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"착오송금 반환지원 절차\", \"section_title\": \"착오송금반환지원 절차\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"process_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/kmrs/kmrsItrdProc/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 착오송금반환지원 절차\\n\\n( 착오송금인-예금보험공사-착오송금 수취인, 중앙행정기관 금융회사등 - 예금보험공사 - 법원 )\\n\\n1. 착오송금인은 예금보험공사에게 반환지원신청(채권매입)\\n2. 예금보험공사는 중앙행정기관/금융회사 등에 착오송금 수취인 정보 확인\\n3. 예금보험공사는 착오송금 수취인에게 자진반환 권유\\n4. 예금보험공사는 법원에게 착오송금 수취인이 미반환시 지급명령 진행\\n5. 예금보험공사는 착오송금 수취인에게서 회수 시 회수액에서 비용 차감 후 착오송금인에게 잔액 반환\\n\\n1. 금융회사를 통한 사전반환 신청단계에서 착오송금 수취인이 자진반환 불응 시 착오송금인은 예보에 반환지원을 신청하고, 지원대상에 해당될 경우 예보는 착오송금인으로부터 부당이득반환채권을 매입합니다.\\n2. 예금보험공사는 금융회사, 통신사, 행정안전부 등을 통하여 착오송금 수취인의 연락처 및 주소를 확보합니다.\\n3. 예금보험공사는 확보된 연락처, 주소 정보를 토대로 착오송금 수취인에게 자진반환을 권유하여 회수합니다.\\n4. 만약 착오송금 수취인이 자진반환에 응하지 않을 경우 법원의 지급명령을 통해 회수를 진행합니다.\\n5. 회수 완료 시 회수액에서 회수에 소요된 비용을 차감한 후 잔액을 착오송금인에게 반환합니다.\", \"content_hash\": \"1735e96d0820da7eb38e1d7df0a2dc3266a7682aa2ed7c0b68cfc2fdb35d2e4b\", \"heading_path\": [\"착오송금반환지원 절차\"]}\n{\"chunk_id\": \"MT-003_chunk_000\", \"parent_doc_id\": \"MT-003\", \"document_id\": \"MT-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"착오송금 반환지원 신청방법\", \"section_title\": \"신청방법\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/kmrs/kmrsItrdAplyMthd/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\"], \"detected_phone_numbers\": [\"1588-0037\"], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청방법\\n\\n온라인 신청 사이트 : fins.kdic.or.kr (상단 아이콘 클릭 시 사이트 연결) 접속방법 : PC (모바일은 추후 지원 예정) 준비물 : 공동인증서, 이체(송금)확인증* * 본인 신청이 아닌 경우, 구비서류 확인 방문 신청 주소 : 서울시 중구 청계천로 30 1층 (상단 아이콘 클릭시 지도 연결) 연락처 : 1588-0037 준비물 : 신분증, 이체(송금)확인증* * 본인 신청이 아닌 경우, 구비서류 확인\", \"content_hash\": \"7c1a8b1dfe304369270e6fc31f37a10e34df753697a6d232646efdcf468189df\", \"heading_path\": [\"신청방법\"]}\n{\"chunk_id\": \"MT-004_chunk_000\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"착오송금 반환지원 대상 금액은 얼마까지인가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 착오송금 반환지원 대상 금액은 얼마까지인가요?\\n\\n공사의 착오송금 반환지원 대상 금액은 착오송금 건당 5만원 이상~1억원 이하입니다. 다만, 송금일로부터 1년 이내에 공사로 신청하신 건에 한해 지원 가능합니다.\", \"content_hash\": \"e8f8ff1d12125884c0260d05cd60ae3f8be975368a7a3809c85fbf35485addcb\", \"heading_path\": [\"착오송금 반환지원 대상 금액은 얼마까지인가요?\"]}\n{\"chunk_id\": \"MT-004_chunk_001\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"그 외에도 착오송금 반환지원 대상이 아닌 경우에는 어떤 것이 해당되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 그 외에도 착오송금 반환지원 대상이 아닌 경우에는 어떤 것이 해당되나요?\\n\\n① 부당이득반환채권과 관련된 소송 또는 채권보전 절차 등을 진행·완료한 경우 ② 착오송금 수취인이 휴업·폐업한 법인이거나 착오송금 수취인에 대한 회생 또는 파산절차가 진행되는 경우 ③ 착오송금 수취인 계좌가 가압류·압류된 경우 등은 관련 규정에 따라 반환지원 대상에서 제외됩니다.\", \"content_hash\": \"0286724464ee9b589b6b5203423d449c392a8f688511e150469416b53831b1f2\", \"heading_path\": [\"그 외에도 착오송금 반환지원 대상이 아닌 경우에는 어떤 것이 해당되나요?\"]}\n{\"chunk_id\": \"MT-004_chunk_002\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"공동인증서가 보이지 않을 경우 어떻게 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 공동인증서가 보이지 않을 경우 어떻게 해야 하나요?\\n\\n금융결제원(yeskey.or.kr)의 MY인증(발급 및 관리)에서 인증서의 파일형식을 바꾸시기 바랍니다. 1. 금융결제원 사이트 접속 yeskey.or.kr 2. My 인증(발급·관리) → My 인증(발급·관리) → 공동인증서 → 인증서 관리 → 복사 및 삭제 3. ‘인증서 내보내기’ 먼저 진행한 후, ‘인증서 가져오기’ 실행 4. 이후 홈페이지에서 공동인증서로 로그인\", \"content_hash\": \"3e13d1c17b31e21e6b9ad403e64ae2c24c99e37e279b8ee0987ed33fcf69ecb5\", \"heading_path\": [\"공동인증서가 보이지 않을 경우 어떻게 해야 하나요?\"]}\n{\"chunk_id\": \"MT-004_chunk_003\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"매입계약 체결 이후 계약이 해제되는 경우도 있나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 매입계약 체결 이후 계약이 해제되는 경우도 있나요?\\n\\n매입계약 체결 이후 ① 거짓이나 부정한 방법으로 지원 신청한 사실이 확인되는 경우 ② 착오송금이 아님이 객관적인 자료로 확인되는 경우 ③ 관련 소송이 진행 중이거나 완료된 경우 ④ 양도통지 및 지급명령이 착오송금 수취인에게 도달하지 않는 경우 ⑤ 착오송금인이 직접 회수하는 경우 등에 해당되면 매입계약 해제가 가능합니다.\", \"content_hash\": \"f528d551db128978f0948530219d3f56f7045c7c8cd4d38452de212256efa070\", \"heading_path\": [\"매입계약 체결 이후 계약이 해제되는 경우도 있나요?\"]}\n{\"chunk_id\": \"MT-004_chunk_004\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"온라인으로만 착오송금 반환지원 신청이 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 온라인으로만 착오송금 반환지원 신청이 가능한가요?\\n\\n아닙니다. 착오송금 반환지원 신청은 홈페이지를 통한 온라인 신청 외에 공사 1층 고객도우미실을 통한 방문 신청도 가능합니다.\", \"content_hash\": \"c774d7efb66b5f73214bc93d9eb518f899da64e0d3662b8b6c451695d1127f18\", \"heading_path\": [\"온라인으로만 착오송금 반환지원 신청이 가능한가요?\"]}\n{\"chunk_id\": \"MT-004_chunk_005\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"착오송금 반환지원 신청 접수부터 실제 반환까지 예상되는 소요 기간은 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 착오송금 반환지원 신청 접수부터 실제 반환까지 예상되는 소요 기간은 어떻게 되나요?\\n\\n자진반환 및 지급명령을 통해 회수 가능한 경우 신청 접수일로부터 2개월 내외로 착오송금액 반환이 가능할 것으로 예상됩니다.\", \"content_hash\": \"9334a76bf5544660e8533ee6c7b6914bf6a5c756a5eb686e85b7a87affd9a614\", \"heading_path\": [\"착오송금 반환지원 신청 접수부터 실제 반환까지 예상되는 소요 기간은 어떻게 되나요?\"]}\n{\"chunk_id\": \"MT-004_chunk_006\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"보이스피싱 피해도 착오송금 반환지원 신청이 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 보이스피싱 피해도 착오송금 반환지원 신청이 가능한가요?\\n\\n보이스피싱의 경우「전기통신금융사기 피해 방지 및 피해금 환급에 대한 특별법」에 따라 해결이 가능하므로, 착오송금 반환지원 대상이 아닙니다. ㅇ 즉, 보이스피싱 발생시 은행에 피해사실을 신고하면 수취인계좌에 대한 신속한 지급정지를 통해 피해를 구제받으실 수 있습니다.\", \"content_hash\": \"699816128f42a2e5e29baced4b2b33b591dd5948b094941116b38905ec8a5359\", \"heading_path\": [\"보이스피싱 피해도 착오송금 반환지원 신청이 가능한가요?\"]}\n{\"chunk_id\": \"MT-004_chunk_007\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"Toss나 카카오페이와 같이 간편송금을 통해 발생한 착오송금도 지원대상이 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. Toss나 카카오페이와 같이 간편송금을 통해 발생한 착오송금도 지원대상이 되나요?\\n\\nToss 등 선불전자지급수단을 활용하는 간편송금업자도 착오송금 반환지원 적용이 가능하나, 현행 법상 수취인의 실지명의 확보가 불가능한 경우에 해당하는 간편송금은 반환지원 대상에서 제외됩니다. ① 송금인이 수취인의 ‘계좌번호’를 이용하여 Toss 등 간편송금을 이용한 경우, 착오송금 반환지원 대상에 해당됩니다. ② 송금인이 수취인의 ‘계좌번호’가 아닌 다른 방식(예 : 연락처 송금)을 통해 송금한 경우, 현행 법상 수취인의 실지명의 확보가 불가능하여 반환지원 대상에 포함되지 않습니다.\", \"content_hash\": \"9b87f6b0e0fa595ae96bad2e9f64922016ad928e1e41927ba2ec150b3c546c5f\", \"heading_path\": [\"Toss나 카카오페이와 같이 간편송금을 통해 발생한 착오송금도 지원대상이 되나요?\"]}\n{\"chunk_id\": \"MT-004_chunk_008\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"외국은행 또는 국내은행의 해외지점으로 보낸 착오송금도 반환지원 신청할 수 있나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 외국은행 또는 국내은행의 해외지점으로 보낸 착오송금도 반환지원 신청할 수 있나요?\\n\\n착오송금 수취인 계좌가 외국은행(국내 지점이 없는 경우)이나 국내은행의 해외지점에서 개설된 경우에는 반환지원 대상에서 제외됩니다.\", \"content_hash\": \"2e82dc64c80a5d057a72848808f6796e91416206a14053ec82b4adac0bb6d0be\", \"heading_path\": [\"외국은행 또는 국내은행의 해외지점으로 보낸 착오송금도 반환지원 신청할 수 있나요?\"]}\n{\"chunk_id\": \"MT-004_chunk_009\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 9, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"반환지원 적용 대상이 되는 송금·수취기관은 어디인가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 반환지원 적용 대상이 되는 송금·수취기관은 어디인가요?\\n\\n은행(외은지점, 농협은행, 수협은행, 산업은행, 중소기업은행 포함), 금융투자회사(증권금융 포함), 종합금융회사, 농·수협 조합, 저축은행, 신협, 새마을금고 및 그 중앙회, 산림조합 및 그 중앙회의 신용사업부문, 우체국 등 송금기능이 있는 금융회사(보험회사 제외)가 해당됩니다. ㅇ 또한 토스, 카카오페이 등「전자금융거래법」제28조제2항제3호(선불전자지급수단 발행·관리업)에 따라 금융위에 등록한 전자금융업자도 적용 대상에 포함됩니다. (다만, 송금방법에 따라 적용여부가 달라질 수 있습니다. ⇒ 질문6 참조)\", \"content_hash\": \"5becbf0d83e98b2e3966091b3572b5434094bc7df891a955b813538a27bc01ed\", \"heading_path\": [\"반환지원 적용 대상이 되는 송금·수취기관은 어디인가요?\"]}\n{\"chunk_id\": \"MT-004_chunk_010\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 10, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"금융회사를 통한 반환절차를 거치지 않고 착오송금 즉시 예보에 반환지원 신청이 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 금융회사를 통한 반환절차를 거치지 않고 착오송금 즉시 예보에 반환지원 신청이 가능한가요?\\n\\n금융회사를 통한 사전 반환절차를 거치지 않은 경우 공사의 착오송금 반환지원 신청이 불가능합니다. ㅇ 송금인은 착오송금 발생시 우선적으로 송금금융회사를 통해 반환청구를 요청할 수 있으며, 이 때 수취인과 연락이 된다면 별도의 회수관련 비용 차감 없이 착오송금액을 반환받으실 수 있습니다.\", \"content_hash\": \"45c328cf9fa8471c8999612daef507fe94c0e1fb7d32f6a6701e07e4c56b8b34\", \"heading_path\": [\"금융회사를 통한 반환절차를 거치지 않고 착오송금 즉시 예보에 반환지원 신청이 가능한가요?\"]}\n{\"chunk_id\": \"MT-004_chunk_011\", \"parent_doc_id\": \"MT-004\", \"document_id\": \"MT-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 11, \"title\": \"착오송금 반환지원 FAQ\", \"section_title\": \"착오송금 발생 이후 언제까지 신청을 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqMsdrGvbkAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 착오송금 발생 이후 언제까지 신청을 해야 하나요?\\n\\n착오송금일로부터 1년 이내(착오송금일은 불산입) 신청하는 경우, 반환지원이 가능합니다.\", \"content_hash\": \"77066bf8b507b828b9b9f8d88f8406648103fe8e2542193f3a7ff802188a9aa5\", \"heading_path\": [\"착오송금 발생 이후 언제까지 신청을 해야 하나요?\"]}\n{\"chunk_id\": \"MT-005_chunk_000\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"1. 착오송금 반환지원 신청 접수부터 실제 반환까지 예상되는 소요 기간은 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 1. 착오송금 반환지원 신청 접수부터 실제 반환까지 예상되는 소요 기간은 어떻게 되나요?\\n\\n자진반환 및 지급명령을 통해 회수 가능한 경우 신청 접수일로부터 2개월 내외로 착오송금액 반환이 가능할 것으로 예상됩니다.\", \"content_hash\": \"c97ef39b7b9616c0a4c27f153de2fc186f8e7d56d895f6da87ca2fff307268f1\", \"heading_path\": [\"1. 착오송금 반환지원 신청 접수부터 실제 반환까지 예상되는 소요 기간은 어떻게 되나요?\"]}\n{\"chunk_id\": \"MT-005_chunk_001\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"2. 그 외에도 착오송금 반환지원 대상이 아닌 경우에는 어떤 것이 해당되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 2. 그 외에도 착오송금 반환지원 대상이 아닌 경우에는 어떤 것이 해당되나요?\\n\\n① 부당이득반환채권과 관련된 소송 또는 채권보전 절차 등을 진행·완료한 경우 ② 착오송금 수취인이 휴업·폐업한 법인이거나 착오송금 수취인에 대한 회생 또는 파산절차가 진행되는 경우 ③ 착오송금 수취인 계좌가 가압류·압류된 경우 등은 관련 규정에 따라 반환지원 대상에서 제외됩니다.\", \"content_hash\": \"c8c49cb3a49deb4bdb4e5b01c90a3cae113cc1725f255fe47c8d14f8a2312d22\", \"heading_path\": [\"2. 그 외에도 착오송금 반환지원 대상이 아닌 경우에는 어떤 것이 해당되나요?\"]}\n{\"chunk_id\": \"MT-005_chunk_002\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"3. 착오송금 반환지원 대상 금액은 얼마까지인가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 3. 착오송금 반환지원 대상 금액은 얼마까지인가요?\\n\\n공사의 착오송금 반환지원 대상 금액은 착오송금 건당 5만원 이상~1억원 이하입니다. 다만, 송금일로부터 1년 이내에 공사로 신청하신 건에 한해 지원 가능합니다.\", \"content_hash\": \"12974895829a896c35bd61b8ddbbf6d2cc524884be9453ebee09cce3d71fd7b6\", \"heading_path\": [\"3. 착오송금 반환지원 대상 금액은 얼마까지인가요?\"]}\n{\"chunk_id\": \"MT-005_chunk_003\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"4. 반환지원 적용 대상이 되는 송금·수취기관은 어디인가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 4. 반환지원 적용 대상이 되는 송금·수취기관은 어디인가요?\\n\\n은행(외은지점, 농협은행, 수협은행, 산업은행, 중소기업은행 포함), 금융투자회사(증권금융 포함), 종합금융회사, 농·수협 조합, 저축은행, 신협, 새마을금고 및 그 중앙회, 산림조합 및 그 중앙회의 신용사업부문, 우체국 등 송금기능이 있는 금융회사(보험회사 제외)가 해당됩니다. ㅇ 또한 토스, 카카오페이 등「전자금융거래법」제28조제2항제3호(선불전자지급수단 발행·관리업)에 따라 금융위에 등록한 전자금융업자도 적용 대상에 포함됩니다. (다만, 송금방법에 따라 적용여부가 달라질 수 있습니다. ⇒ 질문6 참조)\", \"content_hash\": \"f52fdc3f2222e6786dd26fc2943c5b6fd14a256ad39bf5114e67878590439b41\", \"heading_path\": [\"4. 반환지원 적용 대상이 되는 송금·수취기관은 어디인가요?\"]}\n{\"chunk_id\": \"MT-005_chunk_004\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"5. 온라인으로만 착오송금 반환지원 신청이 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 5. 온라인으로만 착오송금 반환지원 신청이 가능한가요?\\n\\n아닙니다. 착오송금 반환지원 신청은 홈페이지를 통한 온라인 신청 외에 공사 1층 고객도우미실을 통한 방문 신청도 가능합니다.\", \"content_hash\": \"3c6641bdbdbc2b2a4213639f40a4b64f649058d7ae8cf7b9a0a43210273c67d8\", \"heading_path\": [\"5. 온라인으로만 착오송금 반환지원 신청이 가능한가요?\"]}\n{\"chunk_id\": \"MT-005_chunk_005\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"6. 상속인금융거래조회기간은 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 6. 상속인금융거래조회기간은 어떻게 되나요?\\n\\n조회결과는 접수일로부터 3개월간 조회가 가능하며, 3개월이 지나면 조회결과는 삭제됩니다.\", \"content_hash\": \"03209e37f3503bf8d7cdf688a6a717a6fbf413d9af3c4bddc639502df76d487b\", \"heading_path\": [\"6. 상속인금융거래조회기간은 어떻게 되나요?\"]}\n{\"chunk_id\": \"MT-005_chunk_006\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"7. 보이스피싱 피해도 착오송금 반환지원 신청이 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 7. 보이스피싱 피해도 착오송금 반환지원 신청이 가능한가요?\\n\\n보이스피싱의 경우「전기통신금융사기 피해 방지 및 피해금 환급에 대한 특별법」에 따라 해결이 가능하므로, 착오송금 반환지원 대상이 아닙니다. ㅇ 즉, 보이스피싱 발생시 은행에 피해사실을 신고하면 수취인계좌에 대한 신속한 지급정지를 통해 피해를 구제받으실 수 있습니다.\", \"content_hash\": \"a27887b6a414ab6284085324ab82386cfec6449b8379ea422f7ae04308d7f91c\", \"heading_path\": [\"7. 보이스피싱 피해도 착오송금 반환지원 신청이 가능한가요?\"]}\n{\"chunk_id\": \"MT-005_chunk_007\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"8. 착오송금 발생 이후 언제까지 신청을 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 8. 착오송금 발생 이후 언제까지 신청을 해야 하나요?\\n\\n착오송금일로부터 1년 이내(착오송금일은 불산입) 신청하는 경우, 반환지원이 가능합니다.\", \"content_hash\": \"eb445737c4c514ed3adaea1032c9ad132c39bf97d94f394f8c5a4fa46b755e34\", \"heading_path\": [\"8. 착오송금 발생 이후 언제까지 신청을 해야 하나요?\"]}\n{\"chunk_id\": \"MT-005_chunk_008\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"9. 금융회사를 통한 반환절차를 거치지 않고 착오송금 즉시 예보에 반환지원 신청이 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 9. 금융회사를 통한 반환절차를 거치지 않고 착오송금 즉시 예보에 반환지원 신청이 가능한가요?\\n\\n금융회사를 통한 사전 반환절차를 거치지 않은 경우 공사의 착오송금 반환지원 신청이 불가능합니다. ㅇ 송금인은 착오송금 발생시 우선적으로 송금금융회사를 통해 반환청구를 요청할 수 있으며, 이 때 수취인과 연락이 된다면 별도의 회수관련 비용 차감 없이 착오송금액을 반환받으실 수 있습니다.\", \"content_hash\": \"8e476e3acfbb6bf8c895d84354426d8fa94b29d5579353adcbe0897f8f31a302\", \"heading_path\": [\"9. 금융회사를 통한 반환절차를 거치지 않고 착오송금 즉시 예보에 반환지원 신청이 가능한가요?\"]}\n{\"chunk_id\": \"MT-005_chunk_009\", \"parent_doc_id\": \"MT-005\", \"document_id\": \"MT-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 9, \"title\": \"착오송금 반환지원 주요 FAQ\", \"section_title\": \"10. Toss나 카카오페이와 같이 간편송금을 통해 발생한 착오송금도 지원대상이 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqTop10.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 10. Toss나 카카오페이와 같이 간편송금을 통해 발생한 착오송금도 지원대상이 되나요?\\n\\nToss 등 선불전자지급수단을 활용하는 간편송금업자도 착오송금 반환지원 적용이 가능하나, 현행 법상 수취인의 실지명의 확보가 불가능한 경우에 해당하는 간편송금은 반환지원 대상에서 제외됩니다. ① 송금인이 수취인의 ‘계좌번호’를 이용하여 Toss 등 간편송금을 이용한 경우, 착오송금 반환지원 대상에 해당됩니다. ② 송금인이 수취인의 ‘계좌번호’가 아닌 다른 방식(예 : 연락처 송금)을 통해 송금한 경우, 현행 법상 수취인의 실지명의 확보가 불가능하여 반환지원 대상에 포함되지 않습니다.\", \"content_hash\": \"ca4ddde0a303b79a6a1b0a290b4406e57e4d4445922d6682b507f0f718be49b1\", \"heading_path\": [\"10. Toss나 카카오페이와 같이 간편송금을 통해 발생한 착오송금도 지원대상이 되나요?\"]}\n{\"chunk_id\": \"MT-006_chunk_000\", \"parent_doc_id\": \"MT-006\", \"document_id\": \"MT-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"착오송금 수취인 유의사항\", \"section_title\": \"착오송금 수취인 유의사항\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/addrse/AddrseAttnMttr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"refund\"], \"detected_phone_numbers\": [\"02-758-0270\"], \"related_links\": [{\"url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsVstRcptGudn/selectScrn.do\", \"anchor_text\": \"방문접수 안내\", \"link_role\": \"content\", \"source_tag\": \"a\"}, {\"url\": \"https://fins.kdic.or.kr/ir/aplygudn/MsdrAddrsePossDcmntGudn/selectScrn.do\", \"anchor_text\": \"구비서류 안내\", \"link_role\": \"content\", \"source_tag\": \"a\"}], \"related_documents\": [], \"content\": \"### 착오송금 수취인 유의사항\\n\\n- 착오송금 자진반환의 경우, 송달받으신 양도통지문에 기재된 반환금액과 반환계좌를 확인하여 자진반환 기한(양도통지문 송달일로부터 2주) 내에 반환해주시기 바랍니다.\\n- 부당이득반환채원 양도사실을 통지받은 날(양도통지서 송달시점)로부터 2주 내에 이의제기 없이 착오송금을 반환하지 않거나 일부만 반환하는 경우 법원을 통한 지급명령 절차가 진행될 수 있습니다.\\n- 이의제기는 온라인 [착오송금 수취인 - 이의제기] 메뉴 또한 직접 방문하여 할 수 있습니다. 방문접수 안내\\n- 자진반환 기한 내 착오송금 반환시 이체수수료가 발생할 경우 반환 당일에 관련 증빙서류(이체확인증 등)를 구비하여 선탁하는 방식(온라인 [착오송금 수취인 - 이의제기] 메뉴 또는 양식을 팩스(02-758-0270), 이메일(kmrs@kdic.or.kr), 직접 방문 중 택일)을 통해 신청하여 환급 받으실 수 있습니다. 구비서류 안내\\n- 지급명령 결정에 따라 반환하고자 하는 경우, 지급명령 결정문에 기재된 청구금액 등과 반환계좌를 확인하여 기한내에 반환해주시기 바랍니다.\\n- 지급명령이 확정된 후에도 착오송금액을 반환하지 않는 경우 강제집행 등 채권 회수를 위한 조치가 진행될 수 있으며, 지급명령 신청 전이라도 필요한 경우에는 가압류 등의 조치를 취할 수 있습니다. 이 경우 착오송금 수취인이 추가로 부담해야하는 강제집행 비용 및 지연이자가 발생됩니다.\", \"content_hash\": \"db616798e08154c48ea7b9c2957998e 하여 회수합니다.\\n4. 만약 착오송금 수취인이 자진반환에 응하지 않을 경우 법원의 지급명령을 통해 회수를 진행합니다.\\n5. 회수 완료 시 회수액에서 비용공제 후 잔액을 착오송금인에게 반환합니다.\", \"content_hash\": \"b5004de17ed662335810333c3ba8f5cc2c3a6272d6749e4f8562d585c067b553\", \"heading_path\": [\"착오송금 반환지원의 절차\"]}\n{\"chunk_id\": \"MT-010_chunk_000\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"관련 법령 및 규정\", \"section_title\": \"예금자보호법\", \"chunk_type\": \"resource_group\", \"resource_group_id\": \"MT-010_resource_001\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"legal_resource_index\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"legal_reference\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금자보호법\\n- [시행 2024. 9. 10.]\\n- [법률 제20431호, 2024. 9. 10., 일부개정]\\n- [제정ㆍ개정문]\", \"content_hash\": \"7bb8753a3cf8a5f75d365d8dca513951f0b20e8d9c88c8b720c249adc01c018e\", \"heading_path\": [\"예금자보호법\"]}\n{\"chunk_id\": \"MT-010_chunk_001\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"관련 법령 및 규정\", \"section_title\": \"예금자보호법 시행령\", \"chunk_type\": \"resource_group\", \"resource_group_id\": \"MT-010_resource_002\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"legal_resource_index\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"legal_reference\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금자보호법 시행령\\n- [시
