= 회수금액 - 제비용 ※ 회수기여도는 정보의 구체성 및 정확도 등에 따라 결정됩니다.\", \"content_hash\": \"f871b58fd721f71b8a1baf25aeda2c9dd517616a419087ca67fb47070ec9ceea\", \"heading_path\": [\"은닉재산 신고\", \"포상금\"]}\n{\"chunk_id\": \"HP-001_chunk_005\", \"parent_doc_id\": \"HP-001\", \"document_id\": \"HP-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"금융부실관련자 은닉재산 신고 신고센터\", \"section_title\": \"신고방법\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndCncmDclrGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"progress\", \"report\"], \"detected_phone_numbers\": [\"02-758-0102\", \"02-758-0550\"], \"related_links\": [{\"url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtCncmDclrInqGudn/selectScrn.do\", \"anchor_text\": \"신고 및 조회 바로가기\", \"link_role\": \"action\", \"action_type\": \"report\", \"source_tag\": \"a\", \"action_id\": \"00d89f5346bbab15\", \"resource_group_id\": \"\", \"interaction_type\": \"navigate\", \"target_layer_id\": \"\", \"target_document_id\": \"\"}], \"related_documents\": [], \"content\": \"### 은닉재산 신고\\n\\n#### 신고방법\\n\\n- 상담전화(이메일) : 02-758-0102~04 ( cpreport@kdic.or.kr ) (필요시 공사 직원이 신고자 방문)\\n- 인터넷 : www.kdic.or.kr 접속 → 예금보험공사 → 공적자금관리 → 부실책임조사 → 금융부실관련자 은닉재산 신고 → 신고 및 조회 바로가기\\n- 우편/방문 : 서울특별시 중구 청계천로 30 예금보험공사 13층 은닉재산 신고센터, 우)04521\\n- 팩스 : 02-758-0550\", \"content_hash\": \"4ad33c812448fb05f1ee0baa520e0eef1ac8befc079140ef6ec781fcf70361d0\", \"heading_path\": [\"은닉재산 신고\", \"신고방법\"]}\n{\"chunk_id\": \"HP-001_chunk_006\", \"parent_doc_id\": \"HP-001\", \"document_id\": \"HP-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"금융부실관련자 은닉재산 신고 신고센터\", \"section_title\": \"부실관련자가 특정인에게 받을 돈이 있는 경우\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndCncmDclrGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"progress\", \"report\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 은닉재산 신고\\n\\n#### 신고사례\\n\\n##### 부실관련자가 특정인에게 받을 돈이 있는 경우\\n\\n1. 부실금융회사(S 저축은행)은 부실채무자 A법인에 대해서 21억원의 대출금채권을 갖고 있었고, 부실채무자 A법인의 드러난 재산은 없는 상태로, 채권회수가 곤란한 상황이었다.\\n2. 그러나 부실채무자 A법인은 B요양병원을 직접 운영하고 있었으며, 이를 통하여 국민건강보험공단에 대한 요양보험료 채권을 갖고 있으면서도 대출금을 상환하지 않고 있었다.\\n3. 이러한 사실은 신고자의 제보로 드러났으며, 부실금융회사(S 저축은행)은 국민건강보험공단에 대한 부실채무자A법인의 채권을 압류하여 총 17억원의 채권을 회수할 수 있었다.`\", \"content_hash\": \"906273f26b93afbdb919cf528eb568f1f4e97b38182d3da97c6ffa27076f2151\", \"heading_path\": [\"은닉재산 신고\", \"신고사례\", \"부실관련자가 특정인에게 받을 돈이 있는 경우\"]}\n{\"chunk_id\": \"HP-001_chunk_007\", \"parent_doc_id\": \"HP-001\", \"document_id\": \"HP-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"금융부실관련자 은닉재산 신고 신고센터\", \"section_title\": \"부실관련자가 차명으로 받을 돈이 있는 경우\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndCncmDclrGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"progress\", \"report\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 은닉재산 신고\\n\\n#### 신고사례\\n\\n##### 부실관련자가 차명으로 받을 돈이 있는 경우\\n\\n1. 부실금융회사(S 저축은행)에 대해 채무를 부담하고 있는 부실채무자 A법인은 C건설회사에 대해서 채권이 있었는데, A법인의 대표이사 B는 이 채권을 은닉하기 위해 자신의 장모에게 허위로 채권을 양도하였다.\\n2. 신고인이 이러한 재산은닉 정황을 예금보험공사에 설치된 은닉재산 신고센터에 신고함에 따라\\n3. 부실금융기관(S저축은행)은 대표이사 B의 장모를 상대로 사해행위 취소소송을 제기하여 170억원의 채권을 회수하였고, 은닉재산 신고센터는 신고인에게 5억원의 포상금을 지급하였다.\", \"content_hash\": \"4c7c3f803446832eb8a1bb08be4c75c3c0ec19775f8c86169f6855c4bb3da331\", \"heading_path\": [\"은닉재산 신고\", \"신고사례\", \"부실관련자가 차명으로 받을 돈이 있는 경우\"]}\n{\"chunk_id\": \"HP-001_chunk_008\", \"parent_doc_id\": \"HP-001\", \"document_id\": \"HP-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"금융부실관련자 은닉재산 신고 신고센터\", \"section_title\": \"부실관련자가 차명으로 받을 돈이 있는 경우\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndCncmDclrGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"progress\", \"report\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 은닉재산 신고\\n\\n#### 신고사례\\n\\n##### 부실관련자가 차명으로 받을 돈이 있는 경우\\n\\n1. 신고인은 부실채무자 B가 C회사 발행 비상장주식을 보유하고 있다는 사실을 예금보험공사에 설치된 은닉재산신고센터에 신고하였으며,\\n2. 은닉재산 신고센터는 신고에 따른 사전조사를 실시한 후, 부실채무자 B의 채권자인 S저축은행 파산재단에 신고내용을 통보하였다.\\n3. 이에 따라 S저축은행 파산재단은 B가 보유한 C회사 주식을 공매하여 7.5억원을 회수하였으며, 은닉재산 신고센터는 신고인에 대하여 약 1.2억원의 포상금을 지급하였다.\", \"content_hash\": \"348e07330df56edfb9b04b18ce2c09dc88fd08d1005409dc7c3bb0bcfe982864\", \"heading_path\": [\"은닉재산 신고\", \"신고사례\", \"부실관련자가 차명으로 받을 돈이 있는 경우\"]}\n{\"chunk_id\": \"HP-001_chunk_009\", \"parent_doc_id\": \"HP-001\", \"document_id\": \"HP-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 9, \"title\": \"금융부실관련자 은닉재산 신고 신고센터\", \"section_title\": \"신고사례\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndCncmDclrGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"progress\", \"report\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 은닉재산 신고\\n\\n#### 신고사례\\n\\n도움말(각주설명)\\n\\n1. 금융부실관련자 : 영업정지 또는 파산된 금융회사의 부실에 책임이 있는 전ㆍ현직 임직원, 대주주 및 채무자\\n2. 은닉재산 : 부실관련자의 재산으로서 국내 또는 해외에 은닉한 동산ㆍ부동산 등 일체의 재산\", \"content_hash\": \"77477d285af32113b897f14f8c8befe995e37c5f49cea67157d2e9d0b6b08018\", \"heading_path\": [\"은닉재산 신고\", \"신고사례\"]}\n{\"chunk_id\": \"HP-002_chunk_000\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"기타 자세한 사항을 알고싶으면 어떻게 하면 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [\"02-758-0102\", \"1588-0037\"], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 기타 자세한 사항을 알고싶으면 어떻게 하면 되나요?\\n\\n기타 자세한 사항은 예금보험공사 홈페이지(www.kdic.or.kr)내의 『금융부실관련자 은닉재산 신고센터』창이나 상담전화(1588-0037, 02-758-0102∼4)를 이용하시기 바랍니다.\", \"content_hash\": \"f05859dbdcda9b88f56dac28ed108dd849c5d459c4b180b86ffcc7c8ed288224\", \"heading_path\": [\"기타 자세한 사항을 알고싶으면 어떻게 하면 되나요?\"]}\n{\"chunk_id\": \"HP-002_chunk_001\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"은닉재산신고 포상제도는 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 은닉재산신고 포상제도는 어떻게 되나요?\\n\\n□ 포상금 지급 기준 회수기여금액 | 포상금 5억원 이하 | 회수기여금액의 20% 5억원 초과 ～ 20억원 이하 | 100백만원＋5억원 초과 회수기여금액의 15% 20억원 초과 ～100억원 이하 | 325백만원＋20억원 초과 회수기여금액의 10% 100억원 초과 | 1125백만원＋100억원 초과 회수기여금액의 5% □ 포상금 지급 절차 신고된 은닉재산 조사 · 회수 > 회수금액에서 회수비용 공제 > 신고자의 회수기여도 평가 > 포상금 지급신청 금액 산정 > 법원의 지급결정 등 > 포상금 지급 - 포상금은 부실관련자의 은닉재산 신고를 통해 실질적으로 채권을 회수한 채권금융회사에서 지급합니다. □ 포상제외 - 공사 또는 채권기관이 이미 인지하고 있는 재산을 신고한 경우 (다만, 신고가 없었더라면 부실관련자의 은닉재산 회수가 곤란한 경우에는 포상금 지급) - 등기부 또는 지적공부상 부실관련자 본인의 명의로 등기 또는 등록되어 있는 국내 소재 부동산을 신고한 경우 (다만, 신고 이전에 실시한 재산조사에서 발견되지 않은 경우에는 포상금 지급) - 공사 또는 채권기관의 전 · 현직 임 · 직원이 자기 직무와 관련하여 신고한 경우 및 이에 준하는 경우 - 포상금 지급 전까지 신고자가 현행 법령을 위반하여 신고한 것으로 확인된 경우 - 신고자가 익명으로 신고하는 등으로 신고자 확인이나 신고자와 연락이 불가능한 경우\", \"content_hash\": \"8c533194e8ebbe4cf5da4392375b7ba20505e2797008a4d12eb8d619d8f67953\", \"heading_path\": [\"은닉재산신고 포상제도는 어떻게 되나요?\"]}\n{\"chunk_id\": \"HP-002_chunk_002\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"신고대상자가 부실관련자인지 여부를 어떻게 알수있나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 신고대상자가 부실관련자인지 여부를 어떻게 알수있나요?\\n\\n신고대상자(법인 포함)가 부실관련자인지 여부는 신고센터와의 상담 등 소정의 절차를 거쳐 확인하시면 됩니다. - 다만, 신고목적외의 용도로 활용하기 위한 부실관련자 여부 확인은 불가합니다.\", \"content_hash\": \"ec799b58fa552f14470666afbe6adb09e86d654e4856905859f8c9ec5b393df4\", \"heading_path\": [\"신고대상자가 부실관련자인지 여부를 어떻게 알수있나요?\"]}\n{\"chunk_id\": \"HP-002_chunk_003\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"익명이나 가명으로 신고하는 것도 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 익명이나 가명으로 신고하는 것도 가능한가요?\\n\\n은닉재산의 신고시 허위 또는 무고성 신고 등의 남발을 방지하기 위하여 신고자 본인의 실명 신고를 원칙으로 하고 있습니다. - 다만, 신고자 본인의 부득이한 사정으로 익명이나 가명에 의한 신고를 원하는 경우에는 신고는 가능하나 규정상 포상금은 지급되지 않습니다.\", \"content_hash\": \"f60a5bf0028b448053214f9679ce5bf22169cffd0f783793edae981e718c31af\", \"heading_path\": [\"익명이나 가명으로 신고하는 것도 가능한가요?\"]}\n{\"chunk_id\": \"HP-002_chunk_004\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"신고자의 신상정보와 신고내용은 비밀이 보장되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 신고자의 신상정보와 신고내용은 비밀이 보장되나요?\\n\\n신고자의 신상정보와 신고내용은 신고자 본인의사에 반하여 공개되지 아니하며 철저하게 비밀이 보장됩니다. - 한편, 신고재산에 대한 조사 및 회수업무 수행과 관련하여 신고정보 등을 알게 된 자는 그 신고정보 등을 타인에게 제공 또는 누설하거나 그 목적외의 용도로 이용할 수 없도록 엄격히 규정되어 있음을 알려드립니다.\", \"content_hash\": \"80236b14ad0ee47ac138414d63be1e99b3d3b6159f01ceb7a78e89d064728b95\", \"heading_path\": [\"신고자의 신상정보와 신고내용은 비밀이 보장되나요?\"]}\n{\"chunk_id\": \"HP-002_chunk_005\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"재외국민이나 외국인도 신고할 수 있나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 재외국민이나 외국인도 신고할 수 있나요?\\n\\n신고자에 대한 제한이 없으므로 재외국민이나 외국인도 신고할 수 있습니다. - 따라서, 신고재산이 회수된 경우, 포상금도 내국인과 동일한 지급기준에 의하여 지급됩니다.\", \"content_hash\": \"ea14f7bea379d1c69529c93d185105f6f7b32a7a38f84ed66ee19e9c973771ca\", \"heading_path\": [\"재외국민이나 외국인도 신고할 수 있나요?\"]}\n{\"chunk_id\": \"HP-002_chunk_006\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"은닉재산 신고시 신고정보의 취득경위까지도 신고센터에 알려주어야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 은닉재산 신고시 신고정보의 취득경위까지도 신고센터에 알려주어야 하나요?\\n\\n신고시 취득경위까지 반드시 알려주어야 할 의무는 없습니다. - 다만, 신고재산의 조사 및 회수업무에 도움이 된다고 판단되면 신고센터가 취득 경위를 물을 수는 있습니다.\", \"content_hash\": \"455a38adca44e5957eb1339f99e72c25d059e9511b3ea08a996dd6e684c0242c\", \"heading_path\": [\"은닉재산 신고시 신고정보의 취득경위까지도 신고센터에 알려주어야 하나요?\"]}\n{\"chunk_id\": \"HP-002_chunk_007\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"이미 접수한 정보와 동일한 정보를 제3자가 신고하는 경우에 신고 정보의 처리절차는 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 이미 접수한 정보와 동일한 정보를 제3자가 신고하는 경우에 신고 정보의 처리절차는 어떻게 되나요?\\n\\n이미 접수된 정보와 내용이 동일한 경우에는 제3자에게 이미 동일한 정보가 신고되어 있음을 통지하고 신고를 반려하게 됩니다. - 다만, 보다 구체적인 추가정보가 신고되어 회수가치가 증대 되었다고 판단되는 경우에는 그 회수기여도를 평가 · 산정하여 법원의 결정 등에 따라 포상금을 지급합니다.\", \"content_hash\": \"2c3b3e36aeeaf0ae960d7bc258474f36d5171f311995681186f47fd439369963\", \"heading_path\": [\"이미 접수한 정보와 동일한 정보를 제3자가 신고하는 경우에 신고 정보의 처리절차는 어떻게 되나요?\"]}\n{\"chunk_id\": \"HP-002_chunk_008\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"은닉재산은 일정금액(재산가치) 이상이 되어야 신고가 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 은닉재산은 일정금액(재산가치) 이상이 되어야 신고가 가능한가요?\\n\\n은닉재산은 금액에 관계없이 신고가 가능합니다.\", \"content_hash\": \"56ed5135ea122fe1ca82a11dc1704b3332d2c39190bb70b49967cc43a5110a80\", \"heading_path\": [\"은닉재산은 일정금액(재산가치) 이상이 되어야 신고가 가능한가요?\"]}\n{\"chunk_id\": \"HP-002_chunk_009\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 9, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"은닉재산 신고정보의 처리 절차는 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 은닉재산 신고정보의 처리 절차는 어떻게 되나요?\\n\\n신고센터에 접수된 신고정보는 신고대상자가 부실관련자인지 여부를 확인한 후 신고재산에 대한 예금보험공사 및 채권기관의 조사 및 회수절차를 거쳐 포상금지급대상에 해당하는 경우 법원의 결정 등 정해진 절차에 따라 신고자에게 최고 30억원의 포상금을 지급합니다. 01. 신고접수 - 인터넷, 우편,FAX,방문,출장에 의한 신고 실명확인을 위해 전화신고는 받지 않음(상담은 가능) 인터넷은 예금보험공사 홈페이지(http://www.kdic.or.kr)의 금융부실관련자 은닉재산 신고센터 창을 이용 02. 조사 및 회수 - 신고재산에 대한 채권기관등의 정밀조사 후 법적절차 등을 통한 채권회수 03. 포상금 지급 - 신고재산의 조사 및 회수절차가 완료 된 때에 신고자의 회수기여도(신고정보의 구체성, 정확정, 신고자의 추가정보 제공 및 협조정도 등)에 따라 차등하여 법원의 결정 등에 따라 지급됨 (최고 30억원)\", \"content_hash\": \"2198066e46983c05c5baffd39e0f2ad5b68d3c8bcbf196fc431d6fb817deb188\", \"heading_path\": [\"은닉재산 신고정보의 처리 절차는 어떻게 되나요?\"]}\n{\"chunk_id\": \"HP-002_chunk_010\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 10, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"은닉재산이란 구체적으로 무엇을 말하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 은닉재산이란 구체적으로 무엇을 말하나요?\\n\\n은닉재산이란 금융부실관련자의 재산으로서 국내 또는 해외에 은닉한 동산 · 부동산 등 일체의 재산을 말합니다. - 다만, 공부상 부실관련자 본인 명의로 되어 있는 국내 소재 부동산은 은닉재산으로 보지 않습니다.\", \"content_hash\": \"ddfc7556efb9406d32e080006334094e1e33d4c3903a0d45a337bf41bc1e972e\", \"heading_path\": [\"은닉재산이란 구체적으로 무엇을 말하나요?\"]}\n{\"chunk_id\": \"HP-002_chunk_011\", \"parent_doc_id\": \"HP-002\", \"document_id\": \"HP-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 11, \"title\": \"은닉재산 신고 FAQ\", \"section_title\": \"부실관련자란 누구를 말하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqCncmPrptDclr.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 부실관련자란 누구를 말하나요?\\n\\n부실관련자란 금융회사 부실을 초래하여 공적자금 및 예금보험기금 투입을 유발한 금융회사 전 · 현직 임직원 및 금융회사에 대하여 채무를 이행하지 아니한 채무자(개인 · 법인) 등을 말합니다.\", \"content_hash\": \"ea61d726e6b662b53e8052deaf632db7b6c8b1676f2c818a011fef2d27df1366\", \"heading_path\": [\"부실관련자란 누구를 말하나요?\"]}\n{\"chunk_id\": \"HP-003_chunk_000\", \"parent_doc_id\": \"HP-003\", \"document_id\": \"HP-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"신고센터 소개\", \"section_title\": \"불법행위 신고\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"인접제도(불법행위신고)\", \"page_type\": \"adjacent_service\", \"rag_index_mode\": \"separate_domain\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndIvsfalUnrlIlglDclrGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 불법행위 신고\\n\\n일반국민이 금융회사 부실관련자 등의 횡령·배임 등 불법행위와 관련된 정보를 쉽고 편리하게 공사에 신고할 수 있도록 하기 위하여 공사 내 전담 신고센터를 설치하여 접수된 신고내용에 대해 공사가 필요시 부실책임조사를 실시하고 구체적인 범죄혐의를 포착할 경우 검찰에 수사의뢰를 하는 등의 역할을 수행\", \"content_hash\": \"c2bcab4d4ae7982f5b436a7c751cb2efca31e1fd7063b9e9d2637d881471d941\", \"heading_path\": [\"불법행위 신고\"]}\n{\"chunk_id\": \"HP-003_chunk_001\", \"parent_doc_id\": \"HP-003\", \"document_id\": \"HP-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"신고센터 소개\", \"section_title\": \"신고방식\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"인접제도(불법행위신고)\", \"page_type\": \"adjacent_service\", \"rag_index_mode\": \"separate_domain\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndIvsfalUnrlIlglDclrGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\"], \"detected_phone_numbers\": [\"02-758-0797\", \"02-758-0798\"], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신고방식\\n\\n- 상담전화 02-758-0797(필요시 공사 직원이 신고자 방문)\\n- 우편/방문 서울특별시 중구 청계천로 30 예금보험공사 14층 금융부실책임조사본부 조사국 신고서 다운로드(한글양식) 신고서 다운로드(워드양식)\\n- 팩스 02-758-0798\\n- 이메일 invest@kdic.or.kr\", \"content_hash\": \"52d8a1f589579d03d1ac62943670ff57323052118b0420b4259f78e82defbdde\", \"heading_path\": [\"신고방식\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_000\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 0, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제1조(목적)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"제 정 2021. 06. 09\\n\\n개 정 2022. 12. 19\\n\\n개 정 2024. 12. 23\\n\\n### 제1장 총 칙\\n\\n#### 제1조(목적)\\n\\n이 규정은 예금보험공사(이하 “공사”라 한다)가 착오송금 반환지원과 관련하여「예금자보호법」(이하 “법”이라 한다) 및 「예금자보호법 시행령」(이하 “영”이라 한다)에 따라 예금보험위원회(이하 “위원회”라 한다)에 위임된 사항과 그 시행에 관하여 필요한 사항을 정함을 목적으로 한다.\", \"content_hash\": \"49bc585a01a4983877a75d933826d293b3a1d1fe0521b3724272249b8dc43f4f\", \"heading_path\": [\"제1장 총 칙\", \"제1조(목적)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_001\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 1, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제2조(적용 범위)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1장 총 칙\\n\\n#### 제2조(적용 범위)\\n\\n착오송금 반환지원에 관한 사항은 관련 법령이나 위원회가 따로 정하는 경우를 제외하고는 이 규정이 정하는 바에 따른다.\", \"content_hash\": \"d691d7bcc202e504ac367ffc0639529dd1a635c169d32dee94dd7f9a03170da0\", \"heading_path\": [\"제1장 총 칙\", \"제2조(적용 범위)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_002\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 2, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제3조(정의)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1장 총 칙\\n\\n#### 제3조(정의)\\n\\n이 규정에서 사용하는 용어의 뜻은 다음과 같다.\\n\\n1. “착오송금인”이란 법 제2조제9호에 따른 착오송금을 한 자를 말한다.\\n2. “착오송금 수취인”이란 착오송금인으로부터 착오송금을 받은 자를 말한다.\\n3. “부당이득반환채권”이란 착오송금인이 착오송금 수취인에게 착오송금한 자금(송금액을 잘못 기재하거나 입력한 착오송금의 경우 전체 송금액에서 원래 송금하고자 한 금액을 차감한 자금을 말한다)을 청구할 수 있는 권리를 말한다.\\n4. “착오송금반환지원정보시스템”이란 법 제18조제1항제6의2호 및 제7호에 따른 착오송금 반환지원 업무와 그 부대업무를 안전하고 효율적으로 수행하기 위하여 공사에 설치하여 운영하는 전산‧정보통신에 기반한 정보시스템(이하 “반환지원정보시스템”이라 한다)을 말한다.\", \"content_hash\": \"b1f0e06355eda2760d7dfd09adce0fff9e6bb890d7418770c64e26f9c4291990\", \"heading_path\": [\"제1장 총 칙\", \"제3조(정의)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_003\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 3, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제4조(자금이체 금융회사등)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1장 총 칙\\n\\n#### 제4조(자금이체 금융회사등)\\n\\n영 제3조의3제11호의 “「전자금융거래법」 제28조제2항 각 호 외의 부분 본문에 따라 등록한 전자금융업자(같은 항 제1호 및 제3호의 업무를 하는 자로 한정한다) 중 법 제8조에 따른 예금보험위원회(이하 “위원회”라 한다)가 정하는 전자금융업자”란 「전자금융거래법」 제28조제2항제3호의 업무를 하는 자 중 선불전자지급수단을 활용하여 자금이체서비스를 제공하는 간편송금업자를 말한다.\", \"content_hash\": \"afc775732acd1f5258b8105ea00c0f289a96c0ca21dade10cf5e403c44006286\", \"heading_path\": [\"제1장 총 칙\", \"제4조(자금이체 금융회사등)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_004\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 4, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제5조(착오송금 반환지원 운영원칙)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1장 총 칙\\n\\n#### 제5조(착오송금 반환지원 운영원칙)\\n\\n공사는 착오송금 반환지원을 수행함에 있어 다음 각 호의 사항을 준수하여야 한다.\\n\\n1. 공사는 착오송금 반환지원을 수행함에 있어 신속성 및 신뢰도 제고를 위하여 노력하여야 한다.\\n2. 공사는 법 제26조의4에 따른 착오송금반환지원계정(이하 “지원계정”이라 한다)의 건전성 제고를 위하여 노력하여야 한다.\\n3. 공사는 법령에서 허용하는 경우를 제외하고는 착오송금 반환지원 관련 개인별 신청에 관한 내용을 내‧외부에 유출하거나 일반인이 이용하도록 제공하여서는 아니 된다.\\n4. 공사는 법 제39조의3에 따른 중앙행정기관, 자금이체 금융회사등, 자금이체 금융회사등이 가입한 중앙회․연합회․협회(이하 “관계기관등”이라 한다) 및 「전기통신사업법」제2조제8호에 따른 전기통신사업자(이하 “통신사업자”라 한다)의 자료제출 등에 대한 업무 부담이 최소화되도록 노력하여야 한다.\\n5. 공사는 착오송금 반환지원에 필요한 범위에서 적합하게 개인정보를 처리하여야 하며, 그 목적 외의 용도로 활용하여서는 아니 된다.\\n6. 공사는 법 제18조제1항제6의2호 및 제7호에 따른 착오송금 반환지원 업무의 효율적인 수행 및 사용자 편의 제고 등을 위하여 반환지원정보시스템을 운영하고, 이를 지속적으로 관리 및 개선하도록 노력하여야 한다.\", \"content_hash\": \"d26d6e59e692494d6f2f7f1ff4187583ad13d45cce30a2777b039349f7656d7c\", \"heading_path\": [\"제1장 총 칙\", \"제5조(착오송금 반환지원 운영원칙)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_005\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 5, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제6조(지원계정의 조성)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2장 지원계정의 운영\\n\\n#### 제6조(지원계정의 조성)\\n\\n법 제26조의4제2항제4호에 따른 “그 밖에 위원회에서 정하는 수입금”은 착오송금인으로부터 받는 일체의 금전 등을 말한다.\", \"content_hash\": \"8011528bbf03a6b4e255447a86d0d21a42ec3cee121a9a5d51492fd544fa9447\", \"heading_path\": [\"제2장 지원계정의 운영\", \"제6조(지원계정의 조성)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_006\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 6, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제7조(지원계정의 사용)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2장 지원계정의 운영\\n\\n#### 제7조(지원계정의 사용)\\n\\n1. 법 제26조의4제3항제3호에 따른 “그 밖에 지원계정의 설치 목적 달성에 필요한 사항으로서 위원회에서 정하는 사항”은 다음 각 호를 말한다.\\n2. 공사는 불가피한 사유가 없는 한 매 회계연도말까지 제1항제6호에 따른 지원계정 전담인력 관련 차년도 인건비에 대해 위원회의 승인을 얻어야 한다.\", \"content_hash\": \"212509c0bba91dd376d9b6383236ca80e73243a559d338109a4b525469134660\", \"heading_path\": [\"제2장 지원계정의 운영\", \"제7조(지원계정의 사용)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_007\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 7, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제7조(지원계정의 사용)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2장 지원계정의 운영\\n\\n#### 제7조(지원계정의 사용)\\n\\n1. 우편, 문자메시지 등 안내‧통지비용\\n2. 착오송금인 및 착오송금 수취인 관련 정보 확인에 소요되는 비용\\n3. 인지대, 송달료 등 법적절차 비용\\n4. 착오송금 수취인의 착오송금액 반환 관련 이체수수료, 채권추심 위탁 수수료 등 각종 수수료\\n5. 법 제26조에 따른 차입금과 관련한 부대비용\\n6. 지원계정 전담인력 관련 인건비의 공사회계로의 전출\\n7. 그 밖에 지원계정의 설치 목적 달성에 필요한 지원계정의 손실 충당금 등\", \"content_hash\": \"2d8fe7cf57d2104e836569c25336edbf3d50b65dd3d7f03d50798cc6702916df\", \"heading_path\": [\"제2장 지원계정의 운영\", \"제7조(지원계정의 사용)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_008\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 8, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제8조(운영경비의 배분)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2장 지원계정의 운영\\n\\n#### 제8조(운영경비의 배분)\\n\\n제7조제1항제6호에 따른 지원계정 전담인력 관련 인건비는 「운영경비배분규정」에도 불구하고 당해연도 운영경비 기금별 배분에 있어 예금보험기금에 우선 배분하여 지출하고, 매 회계연도말 공사회계로 전출한다.\", \"content_hash\": \"bc12d1d0bbcb0b62a39ea76139167ec73566cd01249675aa690955354c219ef0\", \"heading_path\": [\"제2장 지원계정의 운영\", \"제8조(운영경비의 배분)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_009\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 9, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제9조(여유자금의 운용)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2장 지원계정의 운영\\n\\n#### 제9조(여유자금의 운용)\\n\\n지원계정에 여유자금이 있는 경우 「여유자금운용규정」을 준용한다.\", \"content_hash\": \"1e24177bae65bbfb44a5e6a8332d540468a971830bbdf94031db9890d244362a\", \"heading_path\": [\"제2장 지원계정의 운영\", \"제9조(여유자금의 운용)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_010\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 10, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제10조(반환지원대상)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제3장 반환지원대상 및 매입금액\\n\\n#### 제10조(반환지원대상)\\n\\n1. 공사는 착오송금인 또는 착오송금인이 지정한 대리인(이하 “착오송금인등”이라 한다)으로부터 부당이득반환채권 반환지원신청(이하 “반환지원신청”이라 한다)이 있는 경우 다음 각 호의 요건을 모두 만족하는 부당이득반환채권을 매입할 수 있다. \u003c개정 2023 .12. 26>\\n2. 공사는 매입계약 체결 후 제18조제5호의 사유로 매입계약이 해제된 착오송금인에 대해서는 해당 착오송금일로부터 1년 이내에 발생한 다른 부당이득반환채권을 매입할 수 없다. \u003c개정 2023. 12. 26>\", \"content_hash\": \"8c15f714e248c5929bf5b73c7317c0c2d68730cabfe5e6e86d0aac527a5071f3\", \"heading_path\": [\"제3장 반환지원대상 및 매입금액\", \"제10조(반환지원대상)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_011\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 11, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제10조(반환지원대상)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제3장 반환지원대상 및 매입금액\\n\\n#### 제10조(반환지원대상)\\n\\n1. 착오송금인이 다음 각 목의 어느 하나에 해당하지 않을 것\\n2. 착오송금은 다음 각 목에 모두 해당할 것\\n3. 착오송금 수취인 또는 착오송금 수취 계좌가 다음 각 목의 어느 하나에 해당하지 않을 것\", \"content_hash\": \"97499513f264800ece02a1b1024b997f1023050069a39e535336838a0f706cee\", \"heading_path\": [\"제3장 반환지원대상 및 매입금액\", \"제10조(반환지원대상)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_012\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 12, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제10조(반환지원대상)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제3장 반환지원대상 및 매입금액\\n\\n#### 제10조(반환지원대상)\\n\\n1. 가. 정부 또는 지방자치단체\\n2. 나. 「한국은행법」에 따라 설립된 한국은행, 「금융위원회 설치 등에 관한 법률」에 따라 설립된 금융감독원 또는 공사\\n3. 다. 자금이체 금융회사등\\n4. 라. 착오송금한 계좌가 개설된 자금이체 금융회사등에 대해 착오송금 반환신청을 하지 않은 자. 다만 착오송금 계좌 또는 착오송금 수취 계좌가 개설된 자금이체 금융회사가 영업정지된 경우는 그러하지 아니하다. \u003c개정 2023. 12. 26>\\n5. 마. 착오송금한 이후 사망한 자\\n6. 바. 부당이득반환채권과 관련된 소송 또는 채권보전을 위한 절차 등을 진행 중이거나 완료한 자\\n7. 사. 공사가 과거 부당이득반환채권 회수관련 비용의 청구를 하였음에도 불구하고 납부하지 않은 자 또는 제27조에 따라 결손처분을 한 부당이득반환채권의 채무자. 다만, 회수관련 비용을 납부하거나 또는 결손처분한 채권에 대한 손해를 공사에 배상한 경우는 제외한다.\\n8. 아. 공사에 거짓이나 부정한 방법으로 반환지원신청하여 매입계약이 해제된 날로부터 5년이 경과되지 않은 자\\n9. 자. 공사와 매입계약을 체결한 후 해제된 부당이득반환채권으로 다시 반환지원신청을 한 자\", \"content_hash\": \"92ffa64d34222a8cace8e6599e9e0c7dd0dce984306beb16950e7f37d6654664\", \"heading_path\": [\"제3장 반환지원대상 및 매입금액\", \"제10조(반환지원대상)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_013\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 13, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제10조(반환지원대상)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제3장 반환지원대상 및 매입금액\\n\\n#### 제10조(반환지원대상)\\n\\n1. 가. 착오송금인의 계좌가 자금이체 금융회사등에서 개설되었을 것\\n2. 나. 부당이득반환채권액이 착오송금 건당 5만원 이상 1억원 이하일 것. 이 경우 부당이득반환채권액은 1건의 부당이득반환채권 전부를 기준으로 하며, 부당이득반환채권 일부의 반환지원신청은 제한한다. \u003c개정 2022. 12. 19, 2023. 12. 26, 2024. 12. 23>\\n3. 다. 반환지원신청일은 착오송금일로부터 1년 이내일 것. 이 경우 착오송금일은 불산입한다.\", \"content_hash\": \"c5d0af94100495a7599c1ff955794d85ed86a00ef9065c54c25369f6849d052c\", \"heading_path\": [\"제3장 반환지원대상 및 매입금액\", \"제10조(반환지원대상)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_014\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 14, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제10조(반환지원대상)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제3장 반환지원대상 및 매입금액\\n\\n#### 제10조(반환지원대상)\\n\\n1. 가. 착오송금 수취인의 실지명의를 확인 할 수 없는 경우\\n2. 나. 착오송금 수취인이 사망 또는 국내에 주소가 없는 경우\\n3. 다. 착오송금 수취인이 휴업 또는 폐업한 법인이거나, 착오송금 수취인에 대한 「채무자 회생 및 파산에 관한 법률」에 따른 회생 또는 파산절차가 진행되는 경우\\n4. 라. 착오송금 수취 계좌가 자금이체 금융회사등에서 개설되지 않은 경우\\n5. 마. 착오송금 수취 계좌가 자금이체 금융회사등의 해외지점에서 개설된 경우\\n6. 바. 착오송금 수취 계좌가 「전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법」제2조제2호에 따른 전기통신금융사기나 그 밖의 범죄에 이용되었거나 이용된 것으로 의심할 만한 사정이 있는 경우\\n7. 사. 착오송금 수취 계좌가 가압류, 압류된 경우 또는 그 밖의 방법에 따라 강제집행, 체납처분 등이 있는 경우\", \"content_hash\": \"ca5a4f6baa7dee5d119cc413de7552a8465648b631993d264cebffc513af7910\", \"heading_path\": [\"제3장 반환지원대상 및 매입금액\", \"제10조(반환지원대상)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_015\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 15, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제11조(매입금액)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제3장 반환지원대상 및 매입금액\\n\\n#### 제11조(매입금액)\\n\\n1. 법 제39조의2에 따라 착오송금인에게 지급하는 금액(이하 “매입금액”이라 한다)은 매입 후 부당이득반환채권과 관련하여 착오송금 수취인으로부터 회수한 금액에서 부당이득반환채권 회수관련 비용(이하 “회수관련 비용”이라 한다) 등을 차감한 금액으로 한다.\\n2. 제1항에 따른 회수관련 비용은 제7조제1항의 각 호 중 착오송금인의 부당이득반환채권 회수에 소요된 비용 등의 합계액을 말한다.\", \"content_hash\": \"fba7b4da7e4f8dfc76ca1bc41a9fc97e6b67988e7aad55c4fb2515cdb780d7ef\", \"heading_path\": [\"제3장 반환지원대상 및 매입금액\", \"제11조(매입금액)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_016\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 16, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제12조(반환지원신청 및 철회)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1절 반환지원신청 및 반환지원심사\\n\\n#### 제12조(반환지원신청 및 철회)\\n\\n1. 착오송금인등은 반환지원신청을 위하여 필요한 정보와 증빙자료를 반환지원정보시스템을 통하여 입력하거나 공사가 지정한 장소에 방문하여 제출하여야 한다.\\n2. 공사는 제1항에 따른 반환지원신청을 받는 경우 「전자서명법」 제2조제6호에 따른 인증서(서명자의 실지명의를 확인할 수 있는 것으로 한정한다) 또는 신분증 등을 통해 본인확인 절차를 거쳐야 한다.\\n3. 공사는 반환지원신청한 착오송금인등에게 반환지원대상, 매입금액, 매입계약 해제 요건 등의 사항을 설명한다. 다만, 공사의 반환지원정보시스템을 통해 착오송금인등이 확인 또는 입력한 경우에는 설명을 한 것으로 본다.\\n4. 착오송금인등은 제1항에 따라 반환지원신청을 한 경우 제16조에 따른 매입계약이 체결되기 전까지 철회할 수 있다.\\n5. 반환지원신청시 필요한 서류 및 그 밖에 필요한 사항은 시행세칙으로 정한다.\", \"content_hash\": \"ca5b272464c8974c84b8f1d51484e103be999757cd6b0ab2a3ba4a49d8e7f27d\", \"heading_path\": [\"제1절 반환지원신청 및 반환지원심사\", \"제12조(반환지원신청 및 철회)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_017\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 17, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제13조(반환지원신청 보완요구)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1절 반환지원신청 및 반환지원심사\\n\\n#### 제13조(반환지원신청 보완요구)\\n\\n1. 공사는 착오송금인등이 제12조에 따른 반환지원신청에 필요한 서류등의 전부 또는 일부를 제출하지 않거나 기재사항을 누락한 경우 착오송금인등에게 10영업일 이내의 기간을 정하여 보완하도록 요구할 수 있다. 이 경우 최초로 반환지원신청한 날을 반환지원신청일로 본다.\\n2. 공사는 착오송금인등이 제1항에 따른 보완을 하지 않는 경우 반환지원신청을 반려할 수 있다.\", \"content_hash\": \"10c8fc073ed034eeb0b673b7112b9ea1d8eb0d6ed09e09f878769c6ce88afdad\", \"heading_path\": [\"제1절 반환지원신청 및 반환지원심사\", \"제13조(반환지원신청 보완요구)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_018\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 18, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제14조(자료제출 요구)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1절 반환지원신청 및 반환지원심사\\n\\n#### 제14조(자료제출 요구)\\n\\n공사는 착오송금인등의 반환지원신청이 있는 경우 신청 내용 및 착오송금 수취인 확인 등을 위하여 관계기관등의 장 및 통신사업자에게 법 제39조의3에 따른 자료제출을 요구할 수 있다.\", \"content_hash\": \"f74561ff8e72e37e6f43100cf9a2827fd76b7ec82af9ea36b8476ac17f15c62e\", \"heading_path\": [\"제1절 반환지원신청 및 반환지원심사\", \"제14조(자료제출 요구)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_019\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 19, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제15조(반환지원심사)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1절 반환지원신청 및 반환지원심사\\n\\n#### 제15조(반환지원심사)\\n\\n1. 공사는 제12조에 따른 반환지원신청에 필요한 서류, 제14조에 따라 제출받은 자료 등을 통해 착오송금인등의 반환지원신청이 반환지원대상에 해당하는지 여부를 심사(이하 “반환지원심사”라 한다)한다. 이 경우 공사는 착오송금인등에게 반환지원심사에 필요한 추가자료를 요구할 수 있다.\\n2. 공사는 착오송금인등이 제1항 후문에 따른 추가자료를 제출하지 않거나, 반환지원심사 결과 착오송금인등이 반환지원신청한 부당이득반환채권이 반환지원대상에 해당하지 않는 경우 반환지원신청을 반려할 수 있다.\", \"content_hash\": \"cfddac2d278e28869ce606f773415c49782f29b07e08a35d16c2338fa84ea50d\", \"heading_path\": [\"제1절 반환지원신청 및 반환지원심사\", \"제15조(반환지원심사)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_020\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 20, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제16조(매입계약 체결)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2절 매입계약 체결 및 양도통지등\\n\\n#### 제16조(매입계약 체결)\\n\\n공사는 착오송금인등의 반환지원신청이 반환지원심사에 따라 반환지원대상에 해당한다고 결정하고 이를 착오송금인등에게 통지한 때에 매입계약이 체결된 것으로 본다.\", \"content_hash\": \"7fb2aa57d499a48bea12e89f99e0fc00e6725ddb98935625854ed7b503c1fcb6\", \"heading_path\": [\"제2절 매입계약 체결 및 양도통지등\", \"제16조(매입계약 체결)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_021\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 21, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제17조(양도통지 및 이의제기)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2절 매입계약 체결 및 양도통지등\\n\\n#### 제17조(양도통지 및 이의제기)\\n\\n1. 공사는 제16조에 따라 매입계약이 체결된 경우 착오송금인으로부터 양도통지 권한을 위임받아 착오송금 수취인에게 부당이득반환채권의 양도사실을 통지한다.\\n2. 제1항의 양도통지가 도달한 이후 착오송금 수취인이 관련 자료 등의 제출을 통해 이의를 제기하는 경우 매입계약 해제 요건에 해당하는지 여부를 확인하여 매입계약을 해제 할 수 있다.\", \"content_hash\": \"59aea51e6012df684a584005cba34dc279ccfb1058b2e38bbc93aa7b6584fbd2\", \"heading_path\": [\"제2절 매입계약 체결 및 양도통지등\", \"제17조(양도통지 및 이의제기)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_022\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 22, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제18조(매입계약 해제 요건)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제5장 매입계약의 해제\\n\\n#### 제18조(매입계약 해제 요건)\\n\\n영 제24조의6제1항제4호에 따른 “그 밖에 제1호부터 제3호까지의 경우에 준하는 것으로서 부당이득반환채권 매입계약의 해제가 필요하다고 위원회가 정하는 사유에 해당하는 경우”는 다음 각 호를 말한다.\\n\\n1. 매입계약 체결 이후에 제10조에 따른 반환지원대상이 아닌 부당이득반환채권임이 확인되거나 이에 해당하게 되는 경우\\n2. 제17조제1항에 따른 서류가 공사의 책임없는 사유로 착오송금 수취인에게 도달되지 않는 경우\\n3. 제23조에 따라 착오송금인의 직접회수 후 회수관련 비용을 공사에 납부하는 경우\\n4. 제24조에 따른 지급명령이 착오송금 수취인에게 교부송달되지 않거나, 착오송금 수취인이 지급명령에 이의신청 하는 경우\\n5. 착오송금인등이 착오송금 반환지원 관련 법령 또는 부당이득반환채권 매입관련 계약서의 내용을 따르지 않는 경우\\n6. 착오송금 수취인의 변제능력, 변제의사, 착오송금 회수에 소요되는 기간과 비용 등을 고려할 때, 법적 절차를 포함한 추가적인 절차 진행의 실익이 없다고 판단되는 경우 \u003c신설 2024. 12. 23>\", \"content_hash\": \"02edd45d0c62572e308008705ebc46ccb548399d127548433962e59222c2db9b\", \"heading_path\": [\"제5장 매입계약의 해제\", \"제18조(매입계약 해제 요건)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_023\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 23, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제19조 (착오송금인등의 매입계약 해제)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제5장 매입계약의 해제\\n\\n#### 제19조 (착오송금인등의 매입계약 해제)\\n\\n착오송금인등은 공사에 회수관련 비용을 납부한 후 매입계약의 해제를 통지할 수 있으며, 이에 따른 매입계약 해제의 절차는 제20조를 준용한다.\", \"content_hash\": \"b0fbc21dc7d352e1a340bae738fa100afce4dbe65d0d6f8708ce00d16cfccf05\", \"heading_path\": [\"제5장 매입계약의 해제\", \"제19조 (착오송금인등의 매입계약 해제)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_024\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 24, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제20조(매입계약 해제 절차)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제5장 매입계약의 해제\\n\\n#### 제20조(매입계약 해제 절차)\\n\\n1. 공사는 착오송금인등의 반환지원신청이 매입계약 해제 요건에 해당되어 해제하는 경우 착오송금인등에게 매입계약 해제 사실 및 그 사유를 통지한다. 다만, 공사는 다음 각 호의 어느 하나에 해당하는 경우 착오송금인등으로부터 회수관련 비용을 납부받은 후 매입계약 해제 절차를 진행한다.\\n2. 공사는 매입계약이 해제된 경우 착오송금 수취인에게 착오송금인에 대한 부당이득반환채권 양도 사실을 통지한다.\\n3. 공사는 착오송금인등이 제1항에 따른 회수관련 비용을 상환하지 않는 경우 손해배상을 청구할 수 있다. 다만 회수관련 비용 상환청구액이 소송에 소요되는 기간과 비용 등을 고려하여 소송실익이 없다고 판단되는 경우에는 손해배상 청구소송을 제기하지 않을 수 있다.\\n4. 공사는 영 제24조의6제2항 각 호의 방법에 따라 매입계약을 해제하는 경우 이를 기록하고 해제 통지와 관련된 자료를 10년 동안 보존한다.\", \"content_hash\": \"b713b2fc045fd4988408d1bba174ee6fd2bfb52e7b725423e6ca71a2552e8091\", \"heading_path\": [\"제5장 매입계약의 해제\", \"제20조(매입계약 해제 절차)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_025\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 25, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제20조(매입계약 해제 절차)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제5장 매입계약의 해제\\n\\n#### 제20조(매입계약 해제 절차)\\n\\n1. 영 제24조의6제1항제1호부터 제3호까지의 어느 하나에 해당하는 경우\\n2. 제19조에 따라 착오송금인등이 매입계약을 해제하는 경우\\n3. 제23조에 따라 착오송금인이 직접 회수하는 경우\\n4. 착오송금 수취인이 제24조에 따른 지급명령에 이의신청하는 경우\\n5. 착오송금인등이 착오송금 반환지원 관련 법령 또는 부당이득반환채권 매입관련 계약서의 내용을 따르지 않는 경우\\n6. 그 밖에 착오송금인이 해제에 관련하여 귀책사유가 있는 경우\", \"content_hash\": \"299e0ae72e1f0cd42284d8b25dd51b30b7c920fb6e9f596f1b1917d9dd0b414a\", \"heading_path\": [\"제5장 매입계약의 해제\", \"제20조(매입계약 해제 절차)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_026\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 26, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제21조(지급명령 신청 전 반환안내)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1절 반환안내 및 매입금액의 지급 등\\n\\n#### 제21조(지급명령 신청 전 반환안내)\\n\\n1. 공사는 부당이득반환채권의 양도사실을 통지받은 착오송금 수취인에게 제17조제1항에 따른 양도통지 도달일로부터 2주의 기간동안 반환하도록 안내한다. \u003c개정 2024. 12. 23>\\n2. 제1항에 따른 반환 안내는 휴대전화 문자메시지, 유선통화, 일반 우편 등의 방법으로 할 수 있다.\", \"content_hash\": \"70be5fd5b2d5fc547b1a5e93d158abbd0e1db1826dca3f5092978788b6e7d734\", \"heading_path\": [\"제1절 반환안내 및 매입금액의 지급 등\", \"제21조(지급명령 신청 전 반환안내)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_027\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 27, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제22조(매입금액의 지급)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1절 반환안내 및 매입금액의 지급 등\\n\\n#### 제22조(매입금액의 지급)\\n\\n1. 공사는 착오송금 수취인으로부터 부당이득반환채권을 전액 반환받은 때에는 부득이한 사유가 없는 한 3영업일 이내에 제11조에 따른 매입금액을 착오송금인에게 지급한다.\\n2. 공사는 착오송금 수취인으로부터 부당이득반환채권의 일부를 반환받은 경우 착오송금 수취인에게 잔액에 대한 반환의사를 확인하고, 반환의사가 있는 경우 1주일의 기간 동안 반환하도록 안내한다.\\n3. 공사는 제2항에 따라 일부만 반환한 착오송금 수취인이 잔액에 대한 반환의사가 없는 경우 제24조에 따른 지급명령 신청 절차에 따라 처리한다.\", \"content_hash\": \"1d02c91fc93e54b6e128e7424d0715d23b8a5733d15e7a07ed645fb931b8e6ff\", \"heading_path\": [\"제1절 반환안내 및 매입금액의 지급 등\", \"제22조(매입금액의 지급)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_028\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 28, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제23조(착오송금인의 직접회수)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제1절 반환안내 및 매입금액의 지급 등\\n\\n#### 제23조(착오송금인의 직접회수)\\n\\n1. 공사가 착오송금인등과 부당이득반환채권 매입계약을 체결한 이후 착오송금인이 착오송금 수취인으로부터 부당이득의 전부 또는 일부를 반환받고 매입계약 해제를 원하는 경우 공사는 착오송금인으로부터 회수관련 비용을 납부받고 매입계약을 해제한다.\\n2. 공사는 착오송금 수취인으로부터 일부를 반환받은 착오송금인이 그 금액의 전부를 공사에 반환하는 경우 반환지원 절차를 계속하여 진행할 수 있다.\", \"content_hash\": \"3f01ec650c729b780de435b9522570f834e59ead4813ccbb6a5aa8170fdf1f7c\", \"heading_path\": [\"제1절 반환안내 및 매입금액의 지급 등\", \"제23조(착오송금인의 직접회수)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_029\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 29, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제24조(지급명령)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2절 지급명령 및 채권회수\\n\\n#### 제24조(지급명령)\\n\\n1. 공사는 다음 각 호의 어느 하나에 해당하는 경우 지급명령을 신청한다.\\n2. 공사는 착오송금 수취인에게 지급명령신청이 교부송달되지 않거나, 착오송금 수취인이 지급명령에 이의신청한 경우 매입계약을 해제한다.\\n3. 공사는 제2항에 따라 매입계약이 해제되는 경우 매입계약 해제의 절차는 제20조를 준용한다.\", \"content_hash\": \"44100fe5fe252bd8d7be95fa9bfc72979540239582584bf5317af42d5a4621c9\", \"heading_path\": [\"제2절 지급명령 및 채권회수\", \"제24조(지급명령)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_030\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 30, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제24조(지급명령)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2절 지급명령 및 채권회수\\n\\n#### 제24조(지급명령)\\n\\n1. 착오송금 수취인이 제21조에 따른 반환안내 기간이 경과하였음에도 반환하지 않거나, 반환안내 기간이 경과 전이라도 반환 거부 의사를 명확히 한 경우\\n2. 착오송금 수취인이 제22조제3항에 따른 공사의 미반환 금액 반환의사 확인에 대하여 미반환 의사를 명확히 한 경우\", \"content_hash\": \"c54820a52587d373111b07204ab6f6dea0ae6ea43cd13c1b2890bc7b86b52fb6\", \"heading_path\": [\"제2절 지급명령 및 채권회수\", \"제24조(지급명령)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_031\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 31, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제25조(강제집행 등)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2절 지급명령 및 채권회수\\n\\n#### 제25조(강제집행 등)\\n\\n1. 공사는 채무를 이행하지 아니하는 착오송금 수취인에 대하여 채권보전절차, 강제집행 등 채권 회수를 위하여 필요한 조치를 취할 수 있다.\\n2. 제1항에 따른 채권회수를 위한 조치는 착오송금 수취인의 변제능력, 변제의사, 회수에 소요되는 기간과 비용 등을 고려하여 실익이 없다고 판단되는 경우에는 하지 않을 수 있다.\", \"content_hash\": \"d42606e2d5b764b54f4d6e4a3c5e42f30466f17e9a3a9026417853ffbc367c5f\", \"heading_path\": [\"제2절 지급명령 및 채권회수\", \"제25조(강제집행 등)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_032\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 32, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제26조(채권추심 업무 위임)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2절 지급명령 및 채권회수\\n\\n#### 제26조(채권추심 업무 위임)\\n\\n공사는 지급명령이 확정된 부당이득반환채권의 회수를 위하여 필요한 경우에는 부당이득반환채권액 및 회수실익 등을 고려하여 「신용정보의 이용 및 보호에 관한 법률」에 따른 채권추심회사에 채권추심을 위임할 수 있다.\", \"content_hash\": \"02eb9c2cb18a30b9b629fcaf235dd74bf1dd2a1f0e711b55597b2833e357a97d\", \"heading_path\": [\"제2절 지급명령 및 채권회수\", \"제26조(채권추심 업무 위임)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_033\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 33, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제27조(장기 미회수채권의 처리)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제2절 지급명령 및 채권회수\\n\\n#### 제27조(장기 미회수채권의 처리)\\n\\n공사는 제24조에 따라 집행권원을 확보한 날로부터 상당한 기간이 경과하였음에도 회수되지 않거나 회수되지 않을 가능성이 현저히 높다고 판단하는 채권의 경우 결손처분 등 기타의 조치를 취할 수 있다.\", \"content_hash\": \"cf60542c49b4dba2f39c9265d1b6ae8ff77664587e970faa49ef1bedf47910be\", \"heading_path\": [\"제2절 지급명령 및 채권회수\", \"제27조(장기 미회수채권의 처리)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_034\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 34, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제28조(착오송금반환지원심의위원회)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제7장 보 칙\\n\\n#### 제28조(착오송금반환지원심의위원회)\\n\\n1. 착오송금 반환지원의 공정성, 투명성 및 전문성을 제고하기 위하여 심의기구인 착오송금반환지원심의위원회를 설치하여 운영할 수 있다.\\n2. 착오송금반환지원심의위원회의 구성 및 역할 등에 관하여 필요한 세부사항은 시행세칙으로 정한다.\", \"content_hash\": \"9d7c01ab8aa3da94bbc17544c575589e6d4ed0800d432e89ee781047f457191a\", \"heading_path\": [\"제7장 보 칙\", \"제28조(착오송금반환지원심의위원회)\"]}\n{\"chunk_id\": \"MT-010_rule_layer01_chunk_035\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_rule_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 35, \"title\": \"착오송금 반환지원 등에 관한 규정\", \"section_title\": \"제29조(위임사항)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_003\", \"source_fragment\": \"#rule_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 제7장 보 칙\\n\\n#### 제29조(위임사항)\\n\\n이 규정에서 위임한 사항과 그 시행에 관하여 필요한 사항은 시행세칙으로 정한다.\", \"content_hash\": \"cd76c8c8dff5e87fa9bb6bda6703a31ac8055721866e97e7bdbdcb7d6
