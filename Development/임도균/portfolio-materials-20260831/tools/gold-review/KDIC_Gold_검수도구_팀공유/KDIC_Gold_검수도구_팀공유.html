dic.or.kr/ir/addrse/selectTracFeeRmbrAplyList.do\", \"anchor_text\": \"이체수수료 환급신청\", \"link_role\": \"action\", \"action_type\": \"refund\", \"source_tag\": \"a\", \"action_id\": \"5fbe323cc5f54102\", \"resource_group_id\": \"\", \"interaction_type\": \"navigate\", \"target_layer_id\": \"\", \"target_document_id\": \"\"}], \"related_documents\": [], \"content\": \"착오송금인 돈을 잘못 보냈어요.\\n\\n- 신청자격 확인\\n- 바로 신청\\n\\n착오송금수취인 모르는 돈을 받았어요.\\n\\n- 이의제기\\n- 채무잔액 확인\\n- 이체수수료 환급신청\\n- 반환 확인\\n\\n※ 착오송금반환지원을 처음 하시는 분은 신청자격 확인을 먼저 진행해주십시오.\", \"content_hash\": \"89c0d4d98cabbd18807652639f3d8c76330ec3c700e5e82c43fc971e784ec8e2\", \"heading_path\": []}\n{\"chunk_id\": \"MT-012_chunk_000\", \"parent_doc_id\": \"MT-012\", \"document_id\": \"MT-012\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"방문접수안내\", \"section_title\": \"방문접수 절차\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsVstRcptGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"download\"], \"detected_phone_numbers\": [], \"related_links\": [{\"url\": \"https://fins.kdic.or.kr/ir/msdrpr/selectAplyQlfcIdntyRslt.do\", \"anchor_text\": \"신청대상여부 확인하기\", \"link_role\": \"action\", \"action_type\": \"apply\", \"source_tag\": \"button\", \"action_id\": \"6ec11899c44f66f0\", \"resource_group_id\": \"\", \"interaction_type\": \"navigate\", \"target_layer_id\": \"\", \"target_document_id\": \"\"}], \"related_documents\": [], \"content\": \"### 방문접수 절차\\n\\n방문접수는 평일 09:00 ~ 17:00까지 운영됩니다. 점심시간 12:00 ~ 13:00\\n\\n- STEP 01 센터방문 구비서류와 신분증 지참하여 가까운 센터로 방문해 주세요. 구비서류 안내\\n- STEP2 신청서 제출 신청서 작성 후 구비서류와 함께 제출해 주세요. HWP PDF\\n- STEP3 신청서 접수 착오송금반환지원을 신청하시면 접수증을 발급 받으실수 있습니다.\\n- STEP4 반환지원대상 심사 및 채권매입 심사 담당자가 신청 내용을 확인하고 반환지원 대상 여부를 심사합니다. 심사결과(제도 이용 대상, 비대상)는 SMS로 안내해드립니다. 신청대상여부 확인하기\\n- STEP5 반환지원 절차진행 제도 이용 대상인 경우 반환지원 절차가 진행됩니다.\", \"content_hash\": \"9ea55c7a5e22e5b4e43e1367d5eb0bc9aeb71c37271568d4b9488db6f5bdc896\", \"heading_path\": [\"방문접수 절차\"]}\n{\"chunk_id\": \"MT-012_chunk_001\", \"parent_doc_id\": \"MT-012\", \"document_id\": \"MT-012\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"방문접수안내\", \"section_title\": \"센터 안내\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsVstRcptGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"apply\", \"download\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 센터 안내\\n\\n예금보험공사 본사(지하1층 고객센터) 서울시 중구 청계천로 30 (지번주소: 서울특별시 중구 다동 33)\\n\\n지하철 이용 시\\n\\n- 1호선 : 종각역 5번출구 영풍문고 길건너 도보 5분 거리\\n- 2호선 : 을지로입구역 2번출구 청계천 방향 도보 5분 거리\\n- 5호선 : 광화문역 5번출구 동아일보방면 도보 7분 거리\\n\\n버스이용시\\n\\n- 광화문(역)에서 하차\\n\\n- 간선버스 : 101, 160, 260, 270, 273, 370, 470, 471, 704, 710, 720\\n- 광역버스 : 9709\\n- 경기버스 : (일반)99, 1002, / (급행)8600, 8611 / (직행)9710\", \"content_hash\": \"d614e2fe78d68a75fc139e1dac821e29ada1bbdab6c52aaf9d5c26600f8f5622\", \"heading_path\": [\"센터 안내\"]}\n{\"chunk_id\": \"MT-013_chunk_000\", \"parent_doc_id\": \"MT-013\", \"document_id\": \"MT-013\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"착오송금인 유의사항\", \"section_title\": \"착오송금반환지원 신청 대상\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/msdrpr/MsdrprAttnMttr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 착오송금반환지원 신청 대상\\n\\n- 건당 5만원 이상 1억원 이하 착오송금이 지원대상.\\n- 착오송금일로부터 1년 이내에 착오송금반환지원 신청 가능\\n- 자금이체 금융회사등* 을 통해 반환신청을 하였으나 반환이 안된 경우 제도 이용 가능\\n\\n*은행(외은지점, 농협은행, 수협은행, 산업은행, 중소기업은행 포함), 투자매매·중개업자, 저축은행, 신협, 새마을금고, 농협·수협·산림조합, 우체국, 간편송금업자 등\\n\\n※ 착오송금 수취인이 공사에 반환한 착오송금액에서 회수 관련 비용* 을 차감한 금액을 착오송금인에게 지급\\n\\n*회수 관련 비용률 예시 - 착오송금액 10만원 ⇒ 8~18% / 100만원 ⇒ 4~13% / 1,000만원 ⇒ 3.5~8% - 단, 비용은 해제사유, 회수단계 등에 따라 개인별로 상이합니다.\", \"content_hash\": \"ceddd5d3b52dcaa1a4a860b3da1db5c1c5fd72c9e00f49e8b8c092461746a473\", \"heading_path\": [\"착오송금반환지원 신청 대상\"]}\n{\"chunk_id\": \"MT-013_chunk_001\", \"parent_doc_id\": \"MT-013\", \"document_id\": \"MT-013\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"착오송금인 유의사항\", \"section_title\": \"반환지원 제외 대상\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/msdrpr/MsdrprAttnMttr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 반환지원 제외 대상\\n\\n다음의 경우 중 하나에 해당하는 경우 착오송금 반환지원 제도를 이용할 수 없습니다.\", \"content_hash\": \"07280d3dfb2c56fc1d692a2f146d92fc5b903ccc417a45c78284c6b165795c83\", \"heading_path\": [\"반환지원 제외 대상\"]}\n{\"chunk_id\": \"MT-013_chunk_002\", \"parent_doc_id\": \"MT-013\", \"document_id\": \"MT-013\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"착오송금인 유의사항\", \"section_title\": \"반환지원 제외 대상\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/msdrpr/MsdrprAttnMttr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 반환지원 제외 대상\\n\\n| 구분 | 내용 |\\n| --- | --- |\\n| 착오송금인 | 정부 또는 지방자치 단체 한국은행, 금융감독원, 예금보험공사 자금이체 금융회사등* (주석3) 자금이체 금융회사등* (주석3) 에 착오송금 반환신청을 하지 않은 자 착오송금 이후 사망한 자 부당이득반환채권과 관련된 소송 또는 채권보전을 위한 절차 등을 진행 중이거나 완료한 자 등 법적절차 진행중이거나 완료한 자 공사가 과거 부당이득반환채권 회수관련 비용의 청구를 하였음에도 불구하고 납부하지 않은 자 (회수관련 비용을 납부한 경우는 제외) 결손처분을 한 부당이득반환채권의 채무자(결손처분한 채권에 대한 손해를 공사에 배상한 경우는 제외) 공사에 거짓이나 부정한 방법으로 반환지원 신청하여 매입계약이 해제된 날로부터 5년이 경과되지 않은 자 공사와 매입계약을 체결한 후 해제된 부당이득반환채권으로 다시 반환지원신청을 한 자 매입계약 체결 후 관련 법령 또는 부당이득반환채권 매입관련 계약서를 따르지 않아 매입계약이 해제된경우 해당 착오송금일로부터 1년 이내 발생한 착오송금 |\\n| 착오송금 수취인 | 실지명의를 확인할 수 없는 경우 사망 또는 국내에 주소가 없는 경우 휴업 또는 폐업한 법인인 경우 「채무자 회생 및 파산에 관한 법률」에 따른 회생 또는 파산절차가 진행되는 경우 |\\n| 착오송금 수취계좌 | 자금이체 금융회사등에서 개설되지 않은 경우 자금이체 금융회사등의 해외지점에서 개설된 경우 「전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법 」제2조 제2호에 따른 전기통신금융사기나 그 밖의 범죄에 이용 되었거나 이용된 것으로 의심할 만한 사정이 있는 경우 가압류, 압류된경우 또는 강제집행, 체납처분 등이 있는 경우 |\", \"content_hash\": \"6454ec3fa5d69a1aaddb59dcc52eea3de1f682c9e107f62c37d3b93299241a3c\", \"heading_path\": [\"반환지원 제외 대상\"]}\n{\"chunk_id\": \"MT-013_chunk_003\", \"parent_doc_id\": \"MT-013\", \"document_id\": \"MT-013\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"착오송금인 유의사항\", \"section_title\": \"반환지원 제외 대상\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/msdrpr/MsdrprAttnMttr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \" _id\": \"MT-015\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"착오송금 반환지원 신청대상\", \"section_title\": \"신청 가능한 착오송금 금액 한도가 있나요?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/kmrs/kmrsItrdAplyTrgt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청 가능한 착오송금 금액 한도가 있나요?\\n\\n신청 가능 한도는 착오송금 건당 5만원 이상 ~ 1억원 이하 입니다.\", \"content_hash\": \"db8fc999c0a81f0d1440ab67913f7729acd2fcb68f3de3883f40257ebf96161d\", \"heading_path\": [\"신청 가능한 착오송금 금액 한도가 있나요?\"]}\n{\"chunk_id\": \"MT-015_chunk_001\", \"parent_doc_id\": \"MT-015\", \"document_id\": \"MT-015\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"착오송금 반환지원 신청대상\", \"section_title\": \"언제까지 신청하면 되나요?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/kmrs/kmrsItrdAplyTrgt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 언제까지 신청하면 되나요?\\n\\n잘못 이체한 날로부터 1년 이내까지 신청 가능합니다\", \"content_hash\": \"b354a852a73b7fff11cf425db5a50233a4f3f185c6939fa43e4d70998281d9e3\", \"heading_path\": [\"언제까지 신청하면 되나요?\"]}\n{\"chunk_id\": \"MT-015_chunk_002\", \"parent_doc_id\": \"MT-015\", \"document_id\": \"MT-015\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"착오송금 반환지원 신청대상\", \"section_title\": \"예금보험공사에 신청하기 전에 해야 할 일이 있나요?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/kmrs/kmrsItrdAplyTrgt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험공사에 신청하기 전에 해야 할 일이 있나요?\\n\\n이체 시 이용한 금융회사, 간편송금업체 등을 통해 먼저 반환을 요청해야 합니다.\\n\\n금융회사, 간편송금업체 등을 통해서도 돌려받지 못한 경우 신청 가능합니다.\", \"content_hash\": \"400537ad9b03a2865b2ac09fa8ca9406699b60199b607339837886efd9d449e1\", \"heading_path\": [\"예금보험공사에 신청하기 전에 해야 할 일이 있나요?\"]}\n{\"chunk_id\": \"MT-015_chunk_003\", \"parent_doc_id\": \"MT-015\", \"document_id\": \"MT-015\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"착오송금 반환지원 신청대상\", \"section_title\": \"예금보험공사에서 지원하지 않는 경우도 있나요?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/kmrs/kmrsItrdAplyTrgt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 예금보험공사에서 지원하지 않는 경우도 있나요?\\n\\n지원하지 않는 대표적인 사례는 다음과 같습니다\\n\\n- 잘못 보낸 계좌가 사기, 보이스피싱 등 범죄 이용(의심) 계좌인 경우\\n- 잘못 보낸 계좌가 압류 등 법적제한계좌 또는 지급정지계좌인 경우\\n- 잘못 보낸 계좌의 예금주가 사망했거나 출국하여 국내 주소 없는 경우\\n- 잘못 보낸 계좌의 예금주(법인)가 휴·폐업한 경우 등\", \"content_hash\": \"e499b17130c68cae0b322ffec93166bf849d5eea654d38cde807ed17caafe6be\", \"heading_path\": [\"예금보험공사에서 지원하지 않는 경우도 있나요?\"]}\n{\"chunk_id\": \"DA-001_chunk_000\", \"parent_doc_id\": \"DA-001\", \"document_id\": \"DA-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"채무조정제도\", \"section_title\": \"채무조정 개요\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtLbltAjmtSyst/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"consult\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 채무조정 개요\\n\\n예금보험공사는 예금보호대상 금융회사(은행, 보험회사, 투자매매업자·투자중개업자, 종합금융회사, 상호저축은행 등)가 파산한 경우 채무자의 연체대출금에 대한 채무조정을 지원( 동 제도는 2001년부터 운영)하고 있습니다.\", \"content_hash\": \"8a2bb3c5fb1640be8dab8559dbaf4573dbd643cf5336d42276f9bf9658843e0a\", \"heading_path\": [\"채무조정 개요\"]}\n{\"chunk_id\": \"DA-001_chunk_001\", \"parent_doc_id\": \"DA-001\", \"document_id\": \"DA-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"채무조정제도\", \"section_title\": \"신청자격 및 구비서류\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtLbltAjmtSyst/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"consult\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격 및 구비서류\\n\\n파산된 저축은행 등의 주채무자 또는 보증채무자로서 재산상태나 소득수준 등을 감안하여 채무변제를 기대할 수 없다고 판단되는 채무자\", \"content_hash\": \"a8760b62439793656757d8d7d08084c3903bb30578fdc0ce6388085fdfc62c73\", \"heading_path\": [\"신청자격 및 구비서류\"]}\n{\"chunk_id\": \"DA-001_chunk_002\", \"parent_doc_id\": \"DA-001\", \"document_id\": \"DA-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"채무조정제도\", \"section_title\": \"신청자격 및 구비서류\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtLbltAjmtSyst/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"consult\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격 및 구비서류\\n\\n| 구분 | 구비서류 |\\n| --- | --- |\\n| 본인 신청시 | 채무조정 신청서 및 동의서, 상환약정서 - 접수처 양식 주민등록 등ㆍ초본 및 신분증(주민등록증, 운전면허증) 소득증명서류(급여명세서, 근로소득원천징수영수증 등) 재산증명서류(부동산등기부등본, 자동차등록증 등) |\\n| 대리인 신청시 추가서류 | 가족관계 확인서류(주민등록등본 또는 가족관계증명서) 위임장, 신청인 인감증명서, 대리인 신분증 |\", \"content_hash\": \"59f6d6b9b3e2de023d8b2dbff201e1ad14b19547d78d0cccc2948afc92f9848c\", \"heading_path\": [\"신청자격 및 구비서류\"]}\n{\"chunk_id\": \"DA-001_chunk_003\", \"parent_doc_id\": \"DA-001\", \"document_id\": \"DA-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"채무조정제도\", \"section_title\": \"신청자격 및 구비서류\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtLbltAjmtSyst/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"consult\"], \"detected_phone_numbers\": [\"02-758-1000\", \"1588-0037\", \"1899-0057\"], \"related_links\": [{\"url\": \"https://fins.kdic.or.kr/lb/lbltinfo/selectLbltInfoInq.do\", \"anchor_text\": \"채무정보조회 및 상담신청\", \"link_role\": \"action\", \"action_type\": \"consult\", \"source_tag\": \"a\", \"action_id\": \"bdc5086aa9f8ea8e\", \"resource_group_id\": \"\", \"interaction_type\": \"navigate\", \"target_layer_id\": \"\", \"target_document_id\": \"\"}], \"related_documents\": [], \"content\": \"### 신청자격 및 구비서류\\n\\n- 신청할 수 없는 경우\\n\\n- 총 회수가능액이 총 채무액 이상인 경우\\n- 재산을 도피 또는 은닉하거나 기타 책임재산의 감소행위를 초래하여 그 손실액이 상환되지 아니한 경우\\n- 부실책임조사결과 부실책임자로서 손해배상채무가 소멸하지 않는 경우\\n- 채무에 대하여 이해관계자간에 분쟁이 있는 경우\\n\\n- 원칙 변제의사가 있는 채무자의 재산 및 직업, 연령, 연체기간, 상환능력 등 제반여건을 종합적으로 고려하여 최선의 방법이라고 판단하는 경우에 채무조정을 실시할 수 있습니다. 이 경우 채무조정을 통한 최소 상환금액은 채무자의 재산(부동산, 금융자산, 급여 등)으로부터의 회수가능액 이상이어야 합니다.\\n\\n- 지원내용 재산상태 및 소득수준 등을 고려하여 개인별 차등 적용하고 있으며, 기초수급자 등 사회소외계층에 대해서는 완화된 채무조정기준 적용을 통해 지원하고 있습니다. 지원내용 연체된 원금 및 이자의 감면은 원금의 최대 70% 및 이자 전액 범위내 감면 가능하며, 보증인의 경우 추가 감면율 적용이 가능합니다. 특히 채무자가 기초수급자, 차상위계층 등 사회소외계층의 경우에는 원금의 80~90% 및 이자 전액 범위내에서 감면이 가능합니다. 또한 고금리 대출의 경우에는 이자율조정 제도를 통해 이자율을 낮출 수 있습니다. 또한 원금 1,000만원 미만 연체채무자에 대해서는 “신속채무조정제도(Fast-Track)”을 적용하고 있습니다. 이를 이용하시면 채무조정 신청시 제출서류 간소화, 심사기간 단축 등을 통해 간편하고 신속하게 채무조정을 받으실 수 있습니다. 단기 상환능력이 부족한 채무자에 대해서는 분할상환 제도를 통해 최대 10년의 기간 동안 나누어 상환하실 수 있도록 지원해 드리고 있으며, 사회소외계층의 경우 분할상환 이자를 면제해 드리고 있습니다. 채무조정으로 분할상환 약정하신 후 질병, 사고, 실직 등의 사유가 발생한 경우 최장 3년까지 상환을 유예할 수 있습니다. 그리고 상환을 유예한 기간 동안에는 이자를 면제하여 드립니다.\\n- 채무조정 절차 채무조정 절차 신청인\\n\\n파산재단 채무자의 경우 고객상담센터 1588-0037 및 02-758-1000, 케이알앤씨 채무자의 경우 1899-0057에 전화문의를 통하여 전문상담직원으로부터 채무조정제도에 대하여 자세한 안내를 받으실 수 있습니다.\\n\\n대국민포털 내에서도 채무정보를 조회하신 후 온라인으로 상담이 가능합니다.\\n\\n고객상담센터 1588-0037\\n\\n채무정보조회 및 상담신청\", \"content_hash\": \"2d87068e925b93355184aedf8db6e05def17e5aab74c18526eb0d47ba3f4179e\", \"heading_path\": [\"신청자격 및 구비서류\"]}\n{\"chunk_id\": \"DA-002_chunk_000\", \"parent_doc_id\": \"DA-002\", \"document_id\": \"DA-002\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"채무정보 조회 ＆ 상담신청\", \"section_title\": \"채무 정보 조회\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"interactive_service\", \"rag_index_mode\": \"public_only\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtLbltInfoInqDscsnAply/selectScrn.do\", \"official_download_url\": null, \"avai  \"DA-003_chunk_001\", \"parent_doc_id\": \"DA-003\", \"document_id\": \"DA-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"채무조정\", \"section_title\": \"신청자격\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/di/relsite/PbcrKrncLblarb/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격\\n\\n케이알앤씨의 주채무자 또는 보증채무자로서 재산상태나 소득수준 등을 감안하여 채무변제를 기대할 수 없다고 판단되는 채무자\", \"content_hash\": \"93ec7e69a4be5320a41b10d1125f08758c58ee71af56414ab030e9b9242e4633\", \"heading_path\": [\"신청자격\"]}\n{\"chunk_id\": \"DA-003_chunk_002\", \"parent_doc_id\": \"DA-003\", \"document_id\": \"DA-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"채무조정\", \"section_title\": \"신청할 수 없는 경우\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/di/relsite/PbcrKrncLblarb/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청할 수 없는 경우\\n\\n- 총 회수가능액이 총 채무액 이상인 경우\\n- 재산을 도피 또는 은닉하거나 기타 책임재산의 감소행위를 초래하여 그 손실액이 상환되지 아니한 경우\\n- 부실책임조사결과 부실책임자로서 손해배상채무가 소멸하지 않는 경우\\n- 채무에 대하여 이해관계자간에 분쟁이 있는 경우\", \"content_hash\": \"948db249cd3a4e074f31a0c7d0c2765c08bbb3926b6966a9723f6fafa6c581c7\", \"heading_path\": [\"신청할 수 없는 경우\"]}\n{\"chunk_id\": \"DA-003_chunk_003\", \"parent_doc_id\": \"DA-003\", \"document_id\": \"DA-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"채무조정\", \"section_title\": \"구비서류\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/di/relsite/PbcrKrncLblarb/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 구비서류\\n\\n| 구분 | 구비서류 |\\n| --- | --- |\\n| 본인 신청시 | 채무조정신청서 - 접수처 양식 |\\n| 본인 신청시 | 해제조건부 채무면제 각서 - 접수처 양식 |\\n| 본인 신청시 | 주민등록 등ㆍ초본 및 신분증(주민등록증, 운전면허증) |\\n| 본인 신청시 | 소득증명서류(급여명세서, 근로소득원천징수영수증 등) |\\n| 본인 신청시 | 재산증명서류(부동산등기부등본, 자동차등록증 등) |\\n| 대리인 신청시 추가서류 | 가족관계 확인서류(주민등록등본 또는 가족관계증명서) |\\n| 대리인 신청시 추가서류 | 위임장, 신청인 인감증명서, 대리인 신분증 |\", \"content_hash\": \"582adcdbcde0268e95afc66a42f9bdba0dc79793f5d255e59b42122abc25c28b\", \"heading_path\": [\"구비서류\"]}\n{\"chunk_id\": \"DA-003_chunk_004\", \"parent_doc_id\": \"DA-003\", \"document_id\": \"DA-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"채무조정\", \"section_title\": \"원칙\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/di/relsite/PbcrKrncLblarb/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 원칙\\n\\n변제의사가 있는 채무자의 재산 및 직업, 연령, 연체기간, 상환능력 등 제반여건을 종합적으로 고려하여 최선의 방법이라고 판단하는 경우에 채무조정을 실시할 수 있습니다. 이 경우 채무조정을 통한 최소 상환금액은 채무자로부터의 회수가능액(부동산, 금융자산, 급여 등) 이상이어야 합니다.\", \"content_hash\": \"0214dd4b3283e8d4bb35461fac4fd555989d77b8edea223d23e9ca3df89b7629\", \"heading_path\": [\"원칙\"]}\n{\"chunk_id\": \"DA-003_chunk_005\", \"parent_doc_id\": \"DA-003\", \"document_id\": \"DA-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"채무조정\", \"section_title\": \"지원내용\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/di/relsite/PbcrKrncLblarb/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 지원내용\\n\\n재산상태 및 소득수준 등을 고려하여 개인별 차등 적용하고 있으며, 기초수급자 등 사회소외계층에 대해서는 완화된 채무조정기준 적용을 통해 지원하고 있습니다.\\n\\n연체금액 감면 - 연체된 원금 및 이자를 감면해 드립니다. + 이자율 조정 - 고금리 대출이자율을 낮은 이자율로 조정하여 드립니다. + 분할상환 - 일정 기간 동안 나누어 상환하실 수 있게 해드립니다.\\n\\n연체된 원금 및 이자의 감면은 원금의 최대 70% 및 이자 전액 범위내 감면 가능하며, 보증인의 경우 추가 감면율 적용이 가능합니다. 특히 채무자가 기초수급자, 차상위계층 등 사회소외계층의 경우에는 원금의 80~90% 및 이자 전액 범위내에서 감면이 가능합니다. 또한 고금리 대출의 경우에는 이자율조정 제도를 통해 예금은행의 가계대출 가중평균금리 수준까지 이자율을 낮출 수 있습니다. 단기 상환능력이 부족한 채무자에 대해서는 분할상환 제도를 통해 최대 10년의 기간 동안 나누어 상환하실 수 있도록 지원해 드리고 있으며, 사회소외계층의 경우 분할상환 이자를 면제해 드리고 있습니다.\", \"content_hash\": \"51bd7bd92382183754f13a49d986d1ecabe2e22b1db8e6fd768f52300f241980\", \"heading_path\": [\"지원내용\"]}\n{\"chunk_id\": \"DA-003_chunk_006\", \"parent_doc_id\": \"DA-003\", \"document_id\": \"DA-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"채무조정\", \"section_title\": \"타 기관 채무조정과의 비교\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/di/relsite/PbcrKrncLblarb/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 지원내용\\n\\n#### 타 기관 채무조정과의 비교\\n\\n| 열1 | 파산재단 | 국민행복기금 | 신용회복위원회(개인워크아웃) |\\n| --- | --- | --- | --- |\\n| 대상자 | 개인/법인 | 개인 | 개인 |\\n| 대상채무 | 신용/담보대출 | 신용대출 연체 6개월 이상 원금 1억원이하 | 신용/담보대출 연체 3개월 이상 채무원금 - 무담보채무 5억원이하 - 담보채무 10억원 이하 |\\n| 감면수준 | 소득 및 재산상태 등을 고려하여 차등 적용 | 소득 및 재산상태 등을 고려하여 차등 적용 | 소득 및 재산상태 등을 고려하여 차등 적용 |\", \"content_hash\": \"5eda556b2ea7244beda8043d282b369c3df55b24777b590cabb94cfb58f2cb05\", \"heading_path\": [\"지원내용\", \"타 기관 채무조정과의 비교\"]}\n{\"chunk_id\": \"DA-003_chunk_007\", \"parent_doc_id\": \"DA-003\", \"document_id\": \"DA-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"채무조정\", \"section_title\": \"채무조정 절차\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/di/relsite/PbcrKrncLblarb/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 지원내용\\n\\n#### 채무조정 절차\\n\\n신청인 > 케이알앤씨 채무조정 상담 및 접수 > 심사(재산상태,소득수준 등) > 채무조정 결정 및 통지 > 상환약정 체결(접수처 방문) > 상환약정 체결(접수처 방문)\", \"content_hash\": \"ade6c6c65f3bdbc72c9bb1eaf70bcb0666c4c04e3ea1666fb92ed3f1dd28eeca\", \"heading_path\": [\"지원내용\", \"채무조정 절차\"]}\n{\"chunk_id\": \"DA-003_chunk_008\", \"parent_doc_id\": \"DA-003\", \"document_id\": \"DA-003\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"채무조정\", \"section_title\": \"채무 상담\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/di/relsite/PbcrKrncLblarb/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [\"1899-0057\"], \"related_links\": [], \"related_documents\": [], \"content\": \"### 지원내용\\n\\n#### 채무 상담\\n\\n케이알앤씨 채무자의 경우 1899-0057(고객상담센터)에 전화문의를 통하여 전문상담직원으로부터 채무조정제도에 대하여 자세한 안내를 받으실 수 있습니다.\\n\\n고객상담센터 1899-0057\", \"content_hash\": \"454a8ee9731f4f034aff3f6de249ef8eb51de0d6fcee0e77da4bdc13ace9165d\", \"heading_path\": [\"지원내용\", \"채무 상담\"]}\n{\"chunk_id\": \"DA-004_chunk_000\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"신용회복 지원\", \"section_title\": \"\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"개인신용회복지원제도란 개인 및 개인사업자 중 협약 등에서 구성하는 일정요건을 갖춘 채무자를 대상으로 신용불량에 따른 파산을 방지하고 그 경제적 회생기회를 도모하기 위하여 상환기간의 연장, 분할상환, 이자율 조정,변제기 유예, 채무감면 등의 채무조정 수단을 통해 신용회복을 지원하는 금융회사 공통의 업무를 말합니다.\", \"content_hash\": \"1532088723e6b5be15d737b3bfcace60bade737169fd8df1a789a2d7404c66e6\", \"heading_path\": []}\n{\"chunk_id\": \"DA-004_chunk_001\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"신용회복 지원\", \"section_title\": \"신용회복지원 제도\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [{\"url\": \"https://www.ccrs.or.kr\", \"anchor_text\": \"https://www.ccrs.or.kr\", \"link_role\": \"content\", \"source_tag\": \"a\"}], \"related_documents\": [], \"content\": \"### 신용회복지원 제도\\n\\n파산금융회사는 영업을 정지하였으므로 법적으로 금융회사에 속하지 않으나, 공적자금 극대화를 도모하고 건전한 금융질서 정착을 위하여 2005년 8월 신용회복지원 협약에 가입하여 파산재단 채무자의 신용회복을 지원하고 있습니다.\\n\\n신청을 원하시는 분들은 아래의 신청자격, 절차 등을 참고하시어 신용회복위원회(개별 금융회사에 신청하는 것이 아닙니다.)에 구비서류를 지참하여 신청하여 주시기 바랍니다. 보다 자세한 사항은 신용회복위원회 홈페이지 https://www.ccrs.or.kr 을 참조하세요.\", \"content_hash\": \"5e6bc18292b0859a131d9ce38fba7a9185cdda6d01dc0822b184a3c3ba9bfda7\", \"heading_path\": [\"신용회복지원 제도\"]}\n{\"chunk_id\": \"DA-004_chunk_002\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"신용회복 지원\", \"section_title\": \"채무감면\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신용회복지원 내용\\n\\n#### 채무감면\\n\\n무담보 상각채권의 경우 이자는 전액, 원금은 최대 70%까지 감면 가능, 신용회복위원회가 별도로 정하고 있는 취약계층의 경우 원금 최대 90%까지 감면 가능\", \"content_hash\": \"a57d6d946b69dd536f3bcc597c7d85fc518e5ad1073dcb142a7760f7a395712a\", \"heading_path\": [\"신용회복지원 내용\", \"채무감면\"]}\n{\"chunk_id\": \"DA-004_chunk_003\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"신용회복 지원\", \"section_title\": \"상환기간\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신용회복지원 내용\\n\\n#### 상환기간\\n\\n무담보 채무의 경우 최장 8년(차상위 계층 이하 소득자의 경우 최장10년)간 분할상환 가능\", \"content_hash\": \"a7258a4dcae590ddd370af1ee2891698edc257b5fc9d5d40a734c83182b0a864\", \"heading_path\": [\"신용회복지원 내용\", \"상환기간\"]}\n{\"chunk_id\": \"DA-004_chunk_004\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"신용회복 지원\", \"section_title\": \"변제유예\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신용회복지원 내용\\n\\n#### 변제유예\\n\\n최장 2년 이내에서 채무상환을 유예\", \"content_hash\": \"bad860bc3dc1001b4c3ee703c45bab55a762a2e56249599092438cdb1fdfc56b\", \"heading_path\": [\"신용회복지원 내용\", \"변제유예\"]}\n{\"chunk_id\": \"DA-004_chunk_005\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"신용회복 지원\", \"section_title\": \"신용회복지원 내용\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신용회복지원 내용\\n\\n채무감면 범위, 상환기간 등의 채무조정 내용은 대출금의 종류, 총채무액, 변제가능성, 담보, 채무자의 환경 및 신용 등을 고려하여 모두 다르게 적용됩니다.\", \"content_hash\": \"3dd600f676b20c478d1ccf9ae4d9b3e9653e31fe36d0c04d215ed289208f187f\", \"heading_path\": [\"신용회복지원 내용\"]}\n{\"chunk_id\": \"DA-004_chunk_006\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"신용회복 지원\", \"section_title\": \"신용회복지원 절차\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신용회복지원 절차\\n\\n신용회복지원 절차는 다음과 같습니다. 신청인이 채권금융회사 빚 독촉 및 회수 중지를 신용회복위원회에 신청을 하면 상환기간 연장, 분할상환, 이자율 조정, 변제기유예, 채무감면 등 심사채무과정을 거치게 됩니다. 심사채무과정이 심사위원회에서 적격으로 판정되면 채권금융회사 동의 절차에 들어가고 부적격으로 판정되면 기각되어 다시 심사채무과정을 거치게 됩니다. 채권금융회사가 부동의하게 되면 기각되며, 동의시 채무조정협의서(연체기록정보 해체)를 체결하게 됩니다.\", \"content_hash\": \"105f2bc636784bfba1e1a280cfd73d0444fee98e7f20747f8c0cf8ffd5667fa6\", \"heading_path\": [\"신용회복지원 절차\"]}\n{\"chunk_id\": \"DA-004_chunk_007\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"신용회복 지원\", \"section_title\": \"신용회복지원을 신청하기 위해서는 다음의 세가지 요건을 모두 갖추어야 합니다.\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격\\n\\n#### 신용회복지원을 신청하기 위해서는 다음의 세가지 요건을 모두 갖추어야 합니다.\\n\\n1. 약정한 기일 내에 채무를 변제하지 아니한 자로서 신용정보집중기관(전국은행연합회)에 연체 등의 신용거래정보가 등록된 자\\n2. 최저생계비 이상의 수입이 있는 자 또는 채무상환이 가능하다고 심의위원회가 인정하는 자\\n3. 협약가입 금융회사에 채무가 있고 총채무액이 15억원 이하(무담보채무의 경우 5억원, 담보부채무의 경우 10억원 이하)인 자\", \"content_hash\": \"4bb1e9b9e03334f082d14c5a109c7eb8870b71e61b06c570054c7bbfdfb0c4d6\", \"heading_path\": [\"신청자격\", \"신용회복지원을 신청하기 위해서는 다음의 세가지 요건을 모두 갖추어야 합니다.\"]}\n{\"chunk_id\": \"DA-004_chunk_008\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"신용회복 지원\", \"section_title\": \"신청자격\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [{\"url\": \"https://www.ccrs.or.kr\", \"anchor_text\": \"https://www.ccrs.or.kr\", \"link_role\": \"content\", \"source_tag\": \"a\"}], \"related_documents\": [], \"content\": \"### 신청자격\\n\\n보다 자세한 사항은 신용회복위원회 홈페이지 https://www.ccrs.or.kr 을 참조하세요.\", \"content_hash\": \"03fff93eb8686b0f72892a3629a1b3c629f51ec1f83de1f4f043a80a217a8e39\", \"heading_path\": [\"신청자격\"]}\n{\"chunk_id\": \"DA-004_chunk_009\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 9, \"title\": \"신용회복 지원\", \"section_title\": \"신청시 구비서류 요약\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [{\"url\": \"https://www.ccrs.or.kr\", \"anchor_text\": \"https://www.ccrs.or.kr\", \"link_role\": \"content\", \"source_tag\": \"a\"}], \"related_documents\": [], \"content\": \"### 신청시 구비서류 요약\\n\\n| 구분 | 내용 | 비고 |\\n| --- | --- | --- |\\n| 신청인 | 채무자 또는 대리인 | 대리인의 경우 채무자의 인감증명서와 위임장 (동의서)등 권리 위임에 따른 서류를 첨부하여 입증을 하여야함 |\\n| 구비서류 | 신용회복지원승인신청서 채무자신고서 주민등록증 사본 주민등록증 재산증명서류 (소유부동산 등기부 등본, 자동차등록증 사본) 소득증명서류 (급여명세서 또는 소득증명원 등) 사업자등록증 사본(사업자의 경우) 급여가압류 채권자,추심권자 및 적립금액 확인서 | 신청일 현재 2개월 이내에 발급된 것에 한함 (부동산 등기부등본 포함) |\\n| 신청 및 접수 | 신청인이 사무국에 직접 방문하거나 우편 등으로 접수 | 채무자는 신용회복위원회 홈페이지 ( https://www.ccrs.or.kr )를 통하여 진행상황을 조회할 수 있음 |\\n| 신청비용 | 5만원 | 신용회복위원회 사무국에서 지정한 ‘위원회 명의의 관리계좌에 납부 |\", \"content_hash\": \"5a96cd172f4217980eb8d6355051994850efe9754199feaa1dfd5438b29db61a\", \"heading_path\": [\"신청시 구비서류 요약\"]}\n{\"chunk_id\": \"DA-004_chunk_010\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 10, \"title\": \"신용회복 지원\", \"section_title\": \"신청시 구비서류 요약\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [{\"url\": \"https://www.ccrs.or.kr\", \"anchor_text\": \"https://www.ccrs.or.kr\", \"link_role\": \"content\", \"source_tag\": \"a\"}], \"related_documents\": [], \"content\": \"### 신청시 구비서류 요약\\n\\n급여 (가)압류된 채무자는 소속직장에서 다음의 서류를 발급받아 제출하여야 합니다. 급여 (가)압류결정문 또는 판결문 사본, 급여 (가)압류채권자·추심권자 및 적립금액 확인서\\n\\n서식은 신용회복지원위원회 홈페이지( https://www.ccrs.or.kr )를 다운로드 받아 사용하시기 바랍니다.\", \"content_hash\": \"672023831e924d954bef57668c1f45babe84b606f25cd7d8395e9b442c2e7639\", \"heading_path\": [\"신청시 구비서류 요약\"]}\n{\"chunk_id\": \"DA-004_chunk_011\", \"parent_doc_id\": \"DA-004\", \"document_id\": \"DA-004\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 11, \"title\": \"신용회복 지원\", \"section_title\": \"주의사항\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtCredRcvrySprt/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 주의사항\\n\\n신용회복지원위원회의 심의결과에 따라 신용회복지원이 확정되면 채무자의 신용불량정보는 해제되며 신용회복지원 내용이 별도로 관리됩니다. 그러나 변제금을 3개월 이상 계속하여 불이행하는 경우에는 신용회복지원을 취소하고 원래의 채무조건으로 환원하게 되며, 신용회복지원신청시 제출한 자료나 진술 등이 허위로 판명된 경우 및 재산의 도피, 은닉 기타 책임재산의 감소행위 등의 도덕적 해이 사실이 확인되는 경우에는 신용회복지원이 취소되고 금융질서 문란자 등으로 등재되게 되는 등 불이익을 받게 됩니다.\\n\\n신용회복의 지원은 채무자, 채권금융회사, 신용회복지원위원회 간의 신뢰를 바탕으로 시행되는 제도이므로 신용회복지원 결정시 채무자께서는 신용회복지원의 내용대로 변제 계획을 성실히 이해하여야 함은 물론 모든 진술 및 제출자료는 사실 관계에 근거한 진실된 것이어야만 합니다.\", \"content_hash\": \"8579573806c16094ada5342fe3ade7cc7ac32854add1b9f4a9678b4c9836c089\", \"heading_path\": [\"주의사항\"]}\n{\"chunk_id\": \"DA-005_chunk_000\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"파산면책\", \"section_title\": \"개인파산과 면책이란\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 개인파산과 면책이란\\n\\n개인인 채무자가 자신의 재산으로 모든 채무를 변제할 수 없는 상태에 빠진 경우에 그 채무의 정리를 위하여 채무자 또는 채권자가 파산신청을 하는 경우 이를 개인파산이라고 합니다.\\n\\n면책이란 성실하거나 불운한 채무자에게 파산절차를 통하여 변제되지 아니한 나머지 채무에 대한 변제책임을 파산법원의 재판으로 면제시킴으로써 채무자의 경제적 재출발을 도모하는 것으로 개인채무자에게만 인정되는 제도입니다.\\n\\n즉, 개인파산과 면책제도는 파산선고 당시에 채무자의 재산으로 파산재단을 형성하여 채권자들에게 배당하는 파산절차와 파산자 중에서 면책불허가 사유가없는 경우 면책을 결정하는 면책절차로 이루어집니다.\\n\\n개인파산을 신청하는 채무자가 면책을 받기 위해서는 파산신청과 별개로 면책을 신청하여야 하며, 대부분의 경우 아래에서 보는 것처럼 동시에 신청할 수 있습니다.\", \"content_hash\": \"e49ad018118cb33f98fbe3190c048678aa94591b82d6d1ffbd57bbe981874bda\", \"heading_path\": [\"개인파산과 면책이란\"]}\n{\"chunk_id\": \"DA-005_chunk_001\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"파산면책\", \"section_title\": \"파산선고의 불이익과 소멸\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 파산선고의 불이익과 소멸\\n\\n채무자에게 파산이 선고되면, 공무원, 부동산중개업자, 사립학교 교원 등이 될 수 없는 등 법률상 여러 제약이 있고, 회사에 근무하는 경우 회사의 사규나 취업규칙에 의해 당연퇴직이 되는 경우도 있으므로 확인이 필요합니다.\\n\\n이러한 불이익은 면책결정이 확정되면 소멸하지만, 면책결정을 받지 못하는 경우 또는 스스로 면책신청을 취하하는 경우 별도의 복권 절차를 거치지 않는 이상 소멸되지 않습니다.\", \"content_hash\": \"b05c1fe24004e4966052e29f7c9c676959c9170a0d0048406d64343e9f2b6e74\", \"heading_path\": [\"파산선고의 불이익과 소멸\"]}\n{\"chunk_id\": \"DA-005_chunk_002\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"파산면책\", \"section_title\": \"개인파산 및 면책절차 흐름도\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 개인파산 및 면책절차 흐름도\\n\\n1. 파산·면책 신청\\n2. 서면심사 보정명령, 채무자심문\\n3. 면책결정·면책불허가결정\\n\\n1. 이송 각하·기각\\n\\n1. 예납명령\\n2. 파산선고 파산관재인 선임\\n3. 파산관재인 재산관리·조사\\n4. 채권자집회 의견청취기일(면책심문기일)\\n\\n1. 기각\\n\\n1. 파산선고 파산절차폐지(동시폐지)\\n2. 의견청취기일(면책심문기일)\\n\\n1. 파산절차폐지(이시페지)\\n\\n1. 파산채권조사 파산재단 환가·배당\\n2. 파산절차종결\\n\\n상세한 절차안내는 대한민국 전자소송포털 홈페이지 > 사건유형별 절차안내 > 개인파산/회생 > 개인파산 및 면책을 참조하시기 바랍니다.\", \"content_hash\": \"c8345af6353424ea0ac17f502f11bdc1a8299fc031c886531828f68e42447973\", \"heading_path\": [\"개인파산 및 면책절차 흐름도\"]}\n{\"chunk_id\": \"DA-005_chunk_003\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"파산면책\", \"section_title\": \"신청서 및 첨부서류 작성방법\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 개인파산 및 면책절차 흐름도\\n\\n#### 신청서 및 첨부서류 작성방법\\n\\n서울회생법원 홈페이지 > 정보 > 민원서식 양식 모음\", \"content_hash\": \"8d950a9bcfce9131f712e1242f74fbd6be0f4c086932dd6e60232e0331debeb7\", \"heading_path\": [\"개인파산 및 면책절차 흐름도\", \"신청서 및 첨부서류 작성방법\"]}\n{\"chunk_id\": \"DA-005_chunk_004\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"파산면책\", \"section_title\": \"개인파산 및 면책절차 흐름도\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 개인파산 및 면책절차 흐름도\\n\\n전자소송이용 시 : 전자소송포털 홈페이지 > 사건유형별 절차안내 > 공통안내 > 양식 및 작성안내 > 양식모음 > 개인파산\", \"content_hash\": \"994d141f897b82481c49d7c438a663459d2fe10f15c48248d4f9146e8b7b84e4\", \"heading_path\": [\"개인파산 및 면책절차 흐름도\"]}\n{\"chunk_id\": \"DA-005_chunk_005\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"파산면책\", \"section_title\": \"파산이 선고되면 바로 면책되는 것인가요?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 파산이 선고되면 바로 면책되는 것인가요?\\n\\n파산자가 파산절차를 모두 마치더라도 당연 면책되는 것은 아니고, 사안에 따라 면책이 불허가 되거나 기각될 수 있습니다. 파산절차는 재산을 환가하여 배당하는 포괄적인 집행절차일 뿐, 면책허가 여부를 심사하는 면책절차와는 다릅니다.\\n\\n대부분의 개인파산사건에서는 파산이 선고됨과 동시에 파산관재인이 선임되어 채권자들의 의견을 참조하여 채무자의 재산을 관리·조사하고 동시에 채무자에게 면책불허가 사유가 있는지 심사하게 됩니다.\\n\\n그 과정에서 채무자 회생 및 파산에 관한 법률에서 정한 면책불허가 사유가 밝혀진 경우 면책신청이 불허가되기도 하고, 이러한 절차에 성실히 응하지 않고면책심문기일이나 의견청취기일에 불출석하거나 파산관재인의 연락을 받지 않는 경우 면책이 기각될 수도 있습니다.\", \"content_hash\": \"d15049835a00605d402ee510c35932806f9d10d57e43165c78a9269f593f0324\", \"heading_path\": [\"파산이 선고되면 바로 면책되는 것인가요?\"]}\n{\"chunk_id\": \"DA-005_chunk_006\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"파산면책\", \"section_title\": \"면책불허가 사유는 어떤 것이 있나요?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 면책불허가 사유는 어떤 것이 있나요?\\n\\n채무자회생 및 파산에 관한 법률에 자세히 규정되어 있고, 그 중 주로 발생되는 면책불허가 사유는 아래와 같습니다. (면책이 허가되지 아니한 경우에는 파산의 원인이 된 채무를 모두 변제하여야 할 뿐만 아니라 파산을 선고받은 채무자로서 법률에 정하여진 여러 가지 제약을 받게 되므로 파산 및 면책 신청을 하기전에 미리 면책불허가 사유가 있는지 신중히 검토하시기 바랍니다)\\n\\n(1) 채무자가 자기 재산을 숨기거나, 다른 사람 명의로 바꾸거나 헐값에 팔아버린 행위\\n\\n(2) 채무자가 채무를 허위로 증가시키는 행위\\n\\n(3) 채무자가 과다한 낭비 또는 도박 등을 하여 현저히 재산을 감소시키거나 과대한 채무를 부담하는 행위\\n\\n(4) 채무자가 신용거래로 구입한 상품을 현저히 불리한 조건으로 처분하는 행위\\n\\n(5) 채무자가 파산원인인 사실이 있음을 알면서 어느 채권자에게 특별한 이익을 줄 목적으로 채무자의 의무에 속하지 않거나 그 방법 또는 시기가 채무자의 의무에 속하지 않는데도 일부 채권자에게만 변제하거나 담보를 제공하는 행위(아직 변제기가 도래하지 않은 일부 채권자에게만 변제하거나 원래 대물변제 약정이없는데도 일부 채권자에게 대물변제하는 행위를 포함)\\n\\n(6) 채무자가 허위의 채권자목록 그 밖의 신청서류를 제출하거나 법원에 대하여 그 재산 상태에 관하여 허위의 진술을 하는 행위\\n\\n(7) 채무자가 파산선고를 받기 전 1년 이내에 파산의 원인인 사실이 있음에도 불구하고 그 사실이 없는 것으로 믿게 하기 위하여 그 사실을 속이거나 감추고 신용거래로 재산을 취득한 사실이 있는 때\\n\\n(8) 과거 일정 기간(개인파산 면책 확정일부터 7년, 개인회생 면책 확정일부터 5년) 내에 면책을 받은 일이 있는 때\", \"content_hash\": \"04e9f6a75d8b0eb4e5d8f973736e3a2c5c3f3def82a4012964f4cb0ba40c786e\", \"heading_path\": [\"면책불허가 사유는 어떤 것이 있나요?\"]}\n{\"chunk_id\": \"DA-005_chunk_007\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"파산면책\", \"section_title\": \"현재 소득이 있는 채무자의 고려사항\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 현재 소득이 있는 채무자의 고려사항\\n\\n개인회생절차는 최저생계비 이상의 일정한 소득이 있는 경우 생계비를 제외한 나머지 금액을 일정기간 변제하고 나머지 채무를 면책받을 수 있는 제도입니다.\\n\\n채무자가 소득이 있어 채무를 일정부분 변제할 수 있음에도, 개인회생절차를 이용하지 않고 개인파산 및 면책신청을 하게 되는 경우 파산신청의 남용으로 보아 개인파산 및 면책신청이 모두 기각될 수 있고, 허위로 소득이 없다고 속이고 신청하는 경우에도 면책이 불허가될 수 있습니다.\", \"content_hash\": \"c2c23531a0aaceedfd5532f2e709526fee0e56891978ba2afd633296024ca2de\", \"heading_path\": [\"현재 소득이 있는 채무자의 고려사항\"]}\n{\"chunk_id\": \"DA-005_chunk_008\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"파산면책\", \"section_title\": \"파산·면책신청에 도움을 주는 기관\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 파산·면책신청에 도움을 주는 기관\\n\\n“성실하지만 불운한 채무자”를 과도한 채무부담에서 벗어나서 새로운 출발을 할 수 있게 도와주는 여러 기관들이 있습니다.\\n\\n상세한 안내는 서울회생법원 홈페이지 > 도산제도 안내 > 개인파산/개인회생 재판지원제도를 참조하시기 바랍니다.\", \"content_hash\": \"09fe258459742e7729ec51aa00f6703b65e17fed3de3413a402c447ca3484c0a\", \"heading_path\": [\"파산·면책신청에 도움을 주는 기관\"]}\n{\"chunk_id\": \"DA-005_chunk_009\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 9, \"title\": \"파산면책\", \"section_title\": \"서울금융복지상담센터\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [\"1644-0120\"], \"related_links\": [], \"related_documents\": [], \"content\": \"### 파산·면책신청에 도움을 주는 기관\\n\\n#### 서울금융복지상담센터\\n\\n1644-0120, sfwc.welfare.seoul.kr, 서울시청, 중랑, 성동, 송파, 영등포, 금천, 양천, 마포, 중앙 등 서울 시내 10개의 센터 운영 중\", \"content_hash\": \"7884fdef53e3db2dd72881686f9218430d5a334a5354104d17d93d6cd39ab921\", \"heading_path\": [\"파산·면책신청에 도움을 주는 기관\", \"서울금융복지상담센터\"]}\n{\"chunk_id\": \"DA-005_chunk_010\", \"parent_doc_id\": \"DA-005\", \"document_id\": \"DA-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 10, \"title\": \"파산면책\", \"section_title\": \"대한법률구조공단\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnBr/selectScrn.do\", \"official_download_url\": null, \"available_actio : [\"02-6200-6229\"], \"related_links\": [{\"url\": \"https://www.seoulbar.or.kr/site/lawyer/LawyerGaeInPaSanList.do\", \"anchor_text\": \"(링크)\", \"link_role\": \"content\", \"source_tag\": \"a\"}], \"related_documents\": [], \"content\": \"### 파산·면책신청에 도움을 주는 기관\\n\\n#### 서울지방변호사회 개인파산회생지원변호사단\\n\\n02-6200-6229 (링크)\", \"content_hash\": \"167e54b11c4811ae14f61948c345c1cf07d1c987b0180a8a672532ad5251341f\", \"heading_path\": [\"파산·면책신청에 도움을 주는 기관\", \"서울지방변호사회 개인파산회생지원변호사단\"]}\n{\"chunk_id\": \"DA-006_chunk_000\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"개인회생\", \"section_title\": \"개인회생제도란\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 개인회생제도란\\n\\n지급불능 상태에 있는 사람이 일정한 소득을 얻고 있을 경우에 3~5년간 일정한 금액을 갚으면 채무를 면제받는 제도입니다.\", \"content_hash\": \"259b5d85cd21714cced982746b8e0460435435f91298280b8ff49716cf3b8e7d\", \"heading_path\": [\"개인회생제도란\"]}\n{\"chunk_id\": \"DA-006_chunk_001\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"개인회생\", \"section_title\": \"급여소득자 또는 영업소득자\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격\\n\\n#### 급여소득자 또는 영업소득자\\n\\n매달 월급이나 연금, 사업소득 등 정기적이고, 확실한 수입을 계속하여 얻을 가능성이 있는 사람이어야 합니다.\", \"content_hash\": \"883864113b2da870e0ea1393462079f793929ea2a13010986bd4f7a07fa0f483\", \"heading_path\": [\"신청자격\", \"급여소득자 또는 영업소득자\"]}\n{\"chunk_id\": \"DA-006_chunk_002\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"개인회생\", \"section_title\": \"채무총액\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격\\n\\n#### 채무총액\\n\\n무담보 채무의 경우 10억 원, 담보부 채무의 경우 15억 원을 넘지 않아야 합니다. 채무가 위 돈을 넘을 경우 일반회생을 신청하실 수 있습니다.\", \"content_hash\": \"0fbc6b86fd7ab8b48701d4ec845b6655c25dc1fb1ba112dd087402b24a6ef71d\", \"heading_path\": [\"신청자격\", \"채무총액\"]}\n{\"chunk_id\": \"DA-006_chunk_003\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"개인회생\", \"section_title\": \"변제기간\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격\\n\\n#### 변제기간\\n\\n5년을 초과할 수 없습니다.\", \"content_hash\": \"6e1ef3e4480bdbec127024ba28fd6970ab6f330b765b9cab5cf31dc8dff7d4ed\", \"heading_path\": [\"신청자격\", \"변제기간\"]}\n{\"chunk_id\": \"DA-006_chunk_004\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"개인회생\", \"section_title\": \"지급불능\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격\\n\\n#### 지급불능\\n\\n소유하고 있는 재산(부동산, 동산, 예금, 임대차보증금반환채권 등)보다 채무가 많아야 합니다.\", \"content_hash\": \"261ff982cc0e6c7da30f5a4ae1e65a58e627ca535a333364cf234609743b714c\", \"heading_path\": [\"신청자격\", \"지급불능\"]}\n{\"chunk_id\": \"DA-006_chunk_005\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"개인회생\", \"section_title\": \"종래 면책결정\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격\\n\\n#### 종래 면책결정\\n\\n종래 면책결정(파산절차에 의한 면책을 포함함)을 받은 적이 있다면 5년을 경과하여야 합니다.\", \"content_hash\": \"7d51c61db81d29a0b8c7223021bc3c8f402731e2689cae7cb0117a6d6c929fd8\", \"heading_path\": [\"신청자격\", \"종래 면책결정\"]}\n{\"chunk_id\": \"DA-006_chunk_006\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"개인회생\", \"section_title\": \"신청자격\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청자격\\n\\n개인회생절차, 일반회생절차 등을 통하여 충분히 회생을 도모할 수 있다고 인정되는 경우에 개인파산신청을 하게 되면 절차남용으로 각하될 수 있습니다.\", \"content_hash\": \"d952019d28470ccdb6944f90d736787cfd3fe0d08875969c99e2dabef9a65278\", \"heading_path\": [\"신청자격\"]}\n{\"chunk_id\": \"DA-006_chunk_007\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"개인회생\", \"section_title\": \"개인회생과 개인파산\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 개인회생과 개인파산\\n\\n| 개인회생 | 개인파산 |\\n| --- | --- |\\n| 소유하고 있는 재산을 처분하여 빚을 갚는 것보다 돈을 벌어서 3~5년간 채권자들에게 갚는 돈이 더 많아야 함(청산가치 보장의 원칙) | 청산가치 보장이 필요 없음 |\\n| 소유하고 있는 재산을 처분할 필요가 없음 | 재산을 처분하여 빚을 갚음 |\\n| 청산가치가 보장되는 것 이상의 일정한 수입이 있어야 함 | 일정한 수입이 없어도 됨 |\\n| 낭비, 도박으로 빚이 늘어난 것이어도 가능 | 낭비, 도박으로 지급불능상태에 이르렀다면 면책이 불허가 될 수 있음 |\\n| 채무한도에 제한 있음(담보 15억, 무담보 10억) | 채무한도 제한 없음 |\", \"content_hash\": \"7819ef5f13d6d4640cf3802b9b5e055471c820525899f2424e568ee55c857e9d\", \"heading_path\": [\"개인회생과 개인파산\"]}\n{\"chunk_id\": \"DA-006_chunk_008\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"개인회생\", \"section_title\": \"개인회생과 일반회생\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 개인회생과 일반회생\\n\\n| 개인회생 | 일반회생 |\\n| --- | --- |\\n| 채무한도에 제한 있음(담보 15억, 무담보 10억) | 채무한도 제한 없음 |\\n| 채권자 결의 필요 없음 | 인가요건으로 채권자의 동의 필요 |\\n| 인가 후 변제를 완료하면 면책여부를 결정 | 인가로 권리변경의 효력 발생(다만, 통상의 경우에는 감축된 채무를 모두 변제할 때에야 채무면제의 효과를 발생하도록 함) |\\n| 담보권 실행을 위한 경매(임의경매)는 인가되더라도 계속 진행 | 담보권도 권리변경가능 |\", \"content_hash\": \"dbb7fec2c706b73151d846fab8faec3a85a42c9f191f5dc139c1497efe234e52\", \"heading_path\": [\"개인회생과 일반회생\"]}\n{\"chunk_id\": \"DA-006_chunk_009\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 9, \"title\": \"개인회생\", \"section_title\": \"개인회생과 워크아웃\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 개인회생과 워크아웃\\n\\n| 개인회생 | 워크아웃 |\\n| --- | --- |\\n| 조세, 보증채무, 사채 등 모든 채무 조정이 가능 | 신용회복지원협약에 가입한 금융기관에 대한 채무만 조정 가능 |\\n| 법률상 최저변제율만 지키면 원금도 탕감 가능 | 원칙적으로 원금은 전액 변제 |\\n| 변제기간 최장 5년 | 무담보채무 최장 8년, 담보부채무 최장 20년 이내 분할 상환 |\", \"content_hash\": \"9c70c0339b265b9f42e4496b2970536bf871b9d3f8a39948fd02aae95362955d\", \"heading_path\": [\"개인회생과 워크아웃\"]}\n{\"chunk_id\": \"DA-006_chunk_010\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 10, \"title\": \"개인회생\", \"section_title\": \"개인회생 절차안내\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 개인회생 절차안내\\n\\n1. 신청-변제계획안 제출(신청일 부터 14일 이내)\\n2. 개인회생위원 선임\\n3. 보전처분 중지명령·포괄적 금지명령\\n4. 개시결정(신청일 부터 1월이내)\\n5. 채권이의기간(개시결정일부터 2월이내)\\n6. 채권자집회(개시결정일부터 3월이내)\\n7. 변제계획인가-(신용불량 등록해제)\\n8. 변제계획의 수행(개인회생위원 감독)\\n9. 면책(5년이내 재신청 금지)\\n\\n1. 기각사유 기각\\n\\n1. 채권자이의 채권조사확정재판\\n\\n1. 불인가 폐지\\n\\n1. 미수행 폐지(연체정보 재등록)\\n\\n1. 부정방법 면책의 취소\\n\\n상세한 절차안내는 전자소송포털 홈페이지 >사건유형별 절차안내 > 개인파산/회생> 개인회생을 참조하시기 바랍니다.\", \"content_hash\": \"83853817603eba168501a20158e1a4ebf6117f9a418e4713ef635ba09271fedd\", \"heading_path\": [\"개인회생 절차안내\"]}\n{\"chunk_id\": \"DA-006_chunk_011\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 11, \"title\": \"개인회생\", \"section_title\": \"전자소송이용 시\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 서울회생법원 홈페이지 > 민원 > 민원서식 양식 모음\\n\\n#### 전자소송이용 시\\n\\n전자소송포털 홈페이지 > 사건유형별 절차안내 > 공통안내 > 양식 및 작성안내 > 양식모음 > 개인회생\", \"content_hash\": \"e9ef75e3864d594e05a78e11884558e1b07b54a0af4c0e5d0a9175dec4ba388e\", \"heading_path\": [\"서울회생법원 홈페이지 > 민원 > 민원서식 양식 모음\", \"전자소송이용 시\"]}\n{\"chunk_id\": \"DA-006_chunk_012\", \"parent_doc_id\": \"DA-006\", \"document_id\": \"DA-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 12, \"title\": \"개인회생\", \"section_title\": \"신청비용?\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"adjacent_policy\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/rb/lbltajmt/LbltAjmtSprtPsnRg/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청비용?\\n\\n신청서에는 3만 원의 정부수입인지를 붙여야 합니다. 송달료는 기본 10회분 송달료와 이에 추가하여 채권자 수 곱하기 8회분의 송달료를 납부해야 합니다.\", \"content_hash\": \"d868e998ad71c5cd75e4e5891d570567ca237c60c1a237c0bfeac985d069cd29\", \"heading_path\": [\"신청비용?\"]}\n{\"chunk_id\": \"DA-007_chunk_000\", \"parent_doc_id\": \"DA-007\", \"document_id\": \"DA-007\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"부채증명원/금융거래정보신청\", \"section_title\": \"\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"interactive_service\", \"rag_index_mode\": \"public_only\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndDebtDlngAplyGudn/selectScrn.do\ /selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\", \"issue\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청방법\\n\\n부채증명원/금융거래정본, 인터넷 신청을 원칙으로 하되, 직접 내방( 공사 고객도우미실, 인근파산재단 )하여 신청하실 수도 있습니다.\", \"content_hash\": \"e8814b7f60d4f78e2b5de90d607737d998d53d47b0f14885731ecaaeba95cceb\", \"heading_path\": [\"신청방법\"]}\n{\"chunk_id\": \"DA-007_chunk_003\", \"parent_doc_id\": \"DA-007\", \"document_id\": \"DA-007\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"부채증명원/금융거래정보신청\", \"section_title\": \"신청 시 구비서류\", \"chunk_type\": \"definition\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"interactive_service\", \"rag_index_mode\": \"public_only\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndDebtDlngAplyGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\", \"issue\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청방법\\n\\n#### 신청 시 구비서류\\n\\n| 인터넷 신청시 | 인터넷 신청시 2 | 공인인증서, 휴대폰 | 공인인증서, 휴대폰 2 |\\n| --- | --- | --- | --- |\\n| 방문 신청 시 | 본인 방문 | 부채증명원 발급신청서 | 부채증명원 발급신청서 FILE 다운로드 |\\n| 방문 신청 시 | 본인 방문 | 금융거래정보 발급신청서 | 금융거래정보 발급신청서 FILE 다운로드 |\\n| 방문 신청 시 | 본인 방문 | 본인 신분증 |  |\\n| 방문 신청 시 | 대리인 방문 | 부채증명원 발급신청서 | 부채증명원 발급신청서 FILE 다운로드 |\\n| 방문 신청 시 | 대리인 방문 | 금융거래정보 발급신청서 | 금융거래정보 발급신청서 FILE 다운로드 |\\n| 방문 신청 시 | 대리인 방문 | 위임장 | 위임장 FILE 다운로드 |\\n| 방문 신청 시 | 대리인 방문 | 위임자 인감증명서 |  |\\n| 방문 신청 시 | 대리인 방문 | 대리인 신분증 |  |\", \"content_hash\": \"45bb65f60971e75358297b6e4305d60f87e94b152e785503906e1319ca511b94\", \"heading_path\": [\"신청방법\", \"신청 시 구비서류\"]}\n{\"chunk_id\": \"DA-007_chunk_004\", \"parent_doc_id\": \"DA-007\", \"document_id\": \"DA-007\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"부채증명원/금융거래정보신청\", \"section_title\": \"교부방법\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"interactive_service\", \"rag_index_mode\": \"public_only\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndDebtDlngAplyGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\", \"issue\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 교부방법\\n\\n- 인터넷 및 내방(우리 공사 접수분 제외)하여 신청하신 경력증명서/확인서는 발급신청서에 기재된 수령희망주소지로 등기 및 FAX로 발송되며, 신청일로부터 5일 이내에 수령하실 수 있습니다.\\n- 신청하신 내용의 정상 접수여부, 파산금융회사 이송 등 처리과정을 E-Mail 또는 SMS로 안내해드리고 있으므로 참고하시기 바랍니다.\", \"content_hash\": \"51c7dad9de594fdb064b4922b67fb67c852785f057207091821bab9c74e71f39\", \"heading_path\": [\"교부방법\"]}\n{\"chunk_id\": \"DA-007_chunk_005\", \"parent_doc_id\": \"DA-007\", \"document_id\": \"DA-007\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"부채증명원/금융거래정보신청\", \"section_title\": \"신청 시 유의사항\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"interactive_service\", \"rag_index_mode\": \"public_only\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndDebtDlngAplyGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"download\", \"issue\"], \"detected_phone_numbers\": [\"1588-0037\"], \"related_links\": [], \"related_documents\": [], \"content\": \"### 신청 시 유의사항\\n\\n- 경력증명서/확인서 신청접수, 파산금융회사 이송 등의 처리과정이 E-Mail 또는 SMS로 통보되므로 연락처를 정확하게 기재하셔야 합니다.\\n- 발급된 경력증명서/확인서는 수령 희망지로 등기우편 발송되므로 수령희망지 주소를 빠짐없이 정확하게 기재 하셔야 합니다.\\n- 기타 경력증명서/확인서 발급과 관련하여 궁금하신 사항은 우리 공사 고객도우미실(☎ 1588-0037)로 문의하시기 바랍니다.\", \"content_hash\": \"7c7f4b07b171993e0f5c91e1cc3928b548ca00e2cea86f16cb2f5889c2f2869c\", \"heading_path\": [\"신청 시 유의사항\"]}\n{\"chunk_id\": \"DA-008_chunk_000\", \"parent_doc_id\": \"DA-008\", \"document_id\": \"DA-008\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"채무정보조회 FAQ\", \"section_title\": \"모바일 환경에서도 채무정보 조회가 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqLbltInfoInq.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 모바일 환경에서도 채무정보 조회가 가능한가요?\\n\\n네, 가능합니다. 모바일 환경에서는 ‘휴대폰인증’ 절차를 이용해주시기 바랍니다.\", \"content_hash\": \"e412408a45b863e5021bc4bea01cf6b9d55fc7d45e0e917e79af65ee84fdb79d\", \"heading_path\": [\"모바일 환경에서도 채무정보 조회가 가능한가요?\"]}\n{\"chunk_id\": \"DA-008_chunk_001\", \"parent_doc_id\": \"DA-008\", \"document_id\": \"DA-008\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"채무정보조회 FAQ\", \"section_title\": \"서비스 운영시간이 아니라고 나옵니다.\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqLbltInfoInq.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 서비스 운영시간이 아니라고 나옵니다.\\n\\n먼저 서비스 운영시간을 확인바랍니다. 운영시간 중에 그런 메세지가 나온다면 아래와 같이 조치 바랍니다. 기존에 바로가기 링크를 이용하신 경우 또는 서비스 운영시간 이전 부터 싸이트에 접속해 계신 경우에 그렇게 나올수 있습니다. 이럴 경우 보고계신 인터넷 창을 모두 닫고 다시 접속 바랍니다. 그래도 안되는 경우는 인터넷 옵션에서 임시인터넷 파일을 삭제해주시고 임시인터넷 파일 설정에서 페이지를 열때마다로 체크해주시기 바랍니다.\", \"content_hash\": \"0dd34c1df78db6307d7067ac9be3d37fae58a4339672d40d55b6bda09eaf2f12\", \"heading_path\": [\"서비스 운영시간이 아니라고 나옵니다.\"]}\n{\"chunk_id\": \"DA-008_chunk_002\", \"parent_doc_id\": \"DA-008\", \"document_id\": \"DA-008\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"채무정보조회 FAQ\", \"section_title\": \"공동인증서의 유효기간이 아직 남아 있는데도 불구하고 자꾸 폐기되었다고 나옵니다.\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqLbltInfoInq.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 공동인증서의 유효기간이 아직 남아 있는데도 불구하고 자꾸 폐기되었다고 나옵니다.\\n\\n공동인증서의 유효 기간이 남아있는 상태라고 하더라도 공동인증서가 자주 폐기 상태로 확인된다면, 이 부분은 가장 최근에 발급받은 공동인증서를 사용하셔야하기 때문입니다. 예를 들어 최근에 A컴퓨터에서 공동인증서를 발급 받으시고 이동식 매체(디스크, usb 등)에 저장하지 않은 상태에서 B컴퓨터에서 공동인증서를 재발급 받게 되면 댁에 있는 공동인증서를 사용 하실 때에 \\\"폐기된 인증서\\\"라는 오류 메세지가 확인 됩니다.\", \"content_hash\": \"24656a516f46dd3ce7859aa594b3cb81c291428e297713f600c7418aad56727f\", \"heading_path\": [\"공동인증서의 유효기간이 아직 남아 있는데도 불구하고 자꾸 폐기되었다고 나옵니다.\"]}\n{\"chunk_id\": \"DA-008_chunk_003\", \"parent_doc_id\": \"DA-008\", \"document_id\": \"DA-008\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"채무정보조회 FAQ\", \"section_title\": \"PC를 포맷하거나 PC가 바뀌어서 인증서가 없어진 경우\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqLbltInfoInq.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. PC를 포맷하거나 PC가 바뀌어서 인증서가 없어진 경우\\n\\n공동인증서를 이동식 디스크에 복사하지 않으셨다면 공동인증서 발급/재발급을 진행하여 사용하시면 됩니다.\", \"content_hash\": \"b5cbc25a3076a4a3d1019868d79d868da1ef7dc41bde06b2a26e94070d52c493\", \"heading_path\": [\"PC를 포맷하거나 PC가 바뀌어서 인증서가 없어진 경우\"]}\n{\"chunk_id\": \"DA-008_chunk_004\", \"parent_doc_id\": \"DA-008\", \"document_id\": \"DA-008\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"채무정보조회 FAQ\", \"section_title\": \"인증서 암호가 올바르지 않다고 합니다.(또는 잊으신 경우)\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqLbltInfoInq.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 인증서 암호가 올바르지 않다고 합니다.(또는 잊으신 경우)\\n\\n공동인증서 암호는 발급 당시에 암호화 상태로 저장되기에 확인이 불가 합니다. 이 경우에는 기존에 발급받으신 곳에서 공동인증서의 발급/재발급 절차에 따라 발급(폐기하실 필요 없음)하여 사용하시기 바랍니다.\", \"content_hash\": \"bdf0283bf0f2ec2678d7146c1b20d74b7efdf56651a9efb27a9b577b717b5a7f\", \"heading_path\": [\"인증서 암호가 올바르지 않다고 합니다.(또는 잊으신 경우)\"]}\n{\"chunk_id\": \"DA-008_chunk_005\", \"parent_doc_id\": \"DA-008\", \"document_id\": \"DA-008\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"채무정보조회 FAQ\", \"section_title\": \"로그인 인증서 선택창에서 공동인증서가 안보입니다.\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqLbltInfoInq.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 로그인 인증서 선택창에서 공동인증서가 안보입니다.\\n\\n금융결제원 또는 금융기관에서 발급받은 공동인증서가 맞는지 확인바랍니다.\", \"content_hash\": \"6980b9597be21cf63361fa49d507261cb881b7c1bba96e24de9a3859f0908408\", \"heading_path\": [\"로그인 인증서 선택창에서 공동인증서가 안보입니다.\"]}\n{\"chunk_id\": \"DA-008_chunk_006\", \"parent_doc_id\": \"DA-008\", \"document_id\": \"DA-008\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"채무정보조회 FAQ\", \"section_title\": \"공동인증서가 없습니다. 어디서 받을 수 있나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"채무조정 안내\", \"target_business_function\": \"채무조정 안내\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqLbltInfoInq.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 공동인증서가 없습니다. 어디서 받을 수 있나요?\\n\\n\\\"공동인증서\\\"는 가까운 은행/우체국/증권사 등 거래하는 금융기관에서 인터넷 뱅킹을 신청하면 무료로 발급가능합니다.\", \"content_hash\": \"82b3dc31ad5240c7c9c702395590c0b7bb29c92cb30107eeb82cff1b279fcd4a\", \"heading_path\": [\"공동인증서가 없습니다. 어디서 받을 수 있나요?\"]}\n{\"chunk_id\": \"HP-001_chunk_000\", \"parent_doc_id\": \"HP-001\", \"document_id\": \"HP-001\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"금융부실관련자 은닉재산 신고 신고센터\", \"section_title\": \"은닉재산 신고\", \"chunk_type\": \"section\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"은닉재산 신고\", \"target_business_function\": \"은닉재산 신고\", \"page_type\": \"static_page\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/sprtfund/SprtFndCncmDclrGudn/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [\"progress\", \"report\"], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### 은닉재산 신고\\n\\n일반 국민이 금융부실관련자 1 의 은닉재산 2 정보를 쉽고 편리하게 신고하도록 하기 위하여 공사 내 은닉재산 신고센터를 설치하여 법원 결정 등에 따라 최대 30억원의 포상금을 지급하고 있음\\n\\n2025년 12월말 현재 단위 : 억원\", \"content_hash\": \"45cf1e0e0d78da89b2
