)}.metric-k-range input[type=number]{padding:8px}.preset-selector{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.preset-selector label{display:grid;gap:5px}.preset-selector label span{font-size:9px;font-weight:700;color:var(--muted)}

<body>
  <noscript>관리자 콘솔을 사용하려면 JavaScript를 허용해 주세요.</noscript>
  <div id="app"><div class="boot-screen"><div class="boot-logo">K</div><h1>KDIC RAG 관리자</h1><p>최종 챗봇 런타임에 연결하고 있습니다.</p></div></div>
  <script>
(function(){
'use strict';
const root=document.getElementById('app');
const standardMetricKs={hit:3,recall:5,mrr:10,map:10,complete:5,ndcg:5,precision:5,f1:5};
const state={view:'dashboard',dark:localStorage.getItem('kdic-admin-theme')==='dark',summary:null,config:null,capabilities:null,indices:[],jobs:[],monitoring:null,monitorHours:24,index:'',query:'',hits:[],hitTotal:0,document:null,busy:false,chatJob:null,chatResult:null,chatBasis:null,chatQuestion:'예금보험금 신청과 착오송금 반환지원 신청은 어떻게 다른가요?',chatComparison:null,chatCompareBusy:false,sessionId:`admin-${crypto.randomUUID?.()||Date.now()}`,datasets:[],datasetId:'',evalJobs:[],evalJob:null,evalResult:null,evalPolicy:{evaluation_depth:20,baseline_metric_ks:{...standardMetricKs},candidate_metric_ks:{...standardMetricKs},curve_ks:[]},draft:null,keyStatus:null,keyTest:null,pipelineGraph:null,pipelineNode:null,guardrails:null,guardrailTest:null,prompts:null,promptComparison:null,promptQuestion:'가족이 대신 예금보험금을 신청할 때 필요한 서류와 신청 방법을 알려주세요.',promptBusy:false};
state.evalReportBusy=false;
state.chatCandidateSource='draft';
state.chatCustomConfig=null;
state.chatLastCandidate=null;
state.pipelineScroll={left:0,top:0};
state.sidebarScroll=0;
state.pageScroll=0;
state.renderedView=state.view;
const navItems=[['dashboard','▦','대시보드','운영 상태'],['monitoring','◒','운영 모니터링','질의·토큰·지연시간'],['pipeline','⌘','파이프라인','흐름·안전 설정'],['guardrails','◈','가드레일','금칙어·PII 관리'],['prompts','✎','프롬프트','현재안·개선안 비교'],['runtime','◇','파라미터','개선안 설정'],['evaluation','◫','검색 비교 평가','데이터셋 일괄 평가'],['data','▤','청크 관리','조회·추가·제거'],['keys','◆','API 키','검증·교체'],['apply','✓','반영 센터','승인·롤백'],['chat','◉','챗봇 테스트','최종 답변 비교'],['jobs','↻','작업 이력','챗봇 Job']];
const navGroups=[
  {id:'dashboard',icon:'▦',label:'대시보드',cap:'운영 상태'},
  {id:'monitoring',icon:'◒',label:'운영 모니터링',cap:'질의·토큰·지연시간'},
  {id:'enhancement',icon:'✦',label:'챗봇 고도화',cap:'검색·답변 설정과 검증',items:['pipeline','prompts','runtime','evaluation','chat']},
  {id:'data',icon:'▤',label:'청크 관리',cap:'조회·추가·제거'},
  {id:'security',icon:'◈',label:'보안·연동 관리',cap:'가드레일·API 키',items:['guardrails','keys']},
  {id:'apply',icon:'✓',label:'반영 센터',cap:'승인·롤백'},
  {id:'jobs',icon:'↻',label:'작업 이력',cap:'챗봇 Job'}
];
const navExpansion=(()=>{try{return JSON.parse(localStorage.getItem('kdic-admin-nav-groups')||'{}')||{};}catch(_){return {};}})();
Object.assign(state,{parameterPresets:[],selectedPresetId:'',pipelineParameterValues:null,parameterPresetName:''});
const metricNames={hit:'Hit',recall:'Recall',mrr:'MRR',map:'MAP',complete:'Complete',ndcg:'nDCG',precision:'Precision',f1:'F1'};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const attr=v=>esc(v).replace(/`/g,'&#96;');
const num=v=>Number(String(v??0).replace(/,/g,''))||0;
const fmtDate=v=>v?new Date(Number(v)*1000).toLocaleString('ko-KR'):'—';
const pct=v=>v==null?'—':`${(Number(v)*100).toFixed(1)}%`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(path,options={}){const headers={...(options.headers||{})};if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const res=await fetch(path,{credentials:'include',...options,headers});const type=res.headers.get('content-type')||'';const out=type.includes('json')?await res.json():await res.text();if(!res.ok){const error=new Error(typeof out==='object'?(out.detail||JSON.stringify(out)):out);error.status=res.status;throw error;}return out;}
function toast(message,error=false){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className=`toast${error?' error':''}`;el.innerHTML=`<b>${error?'!':'✓'}</b>${esc(message)}`;document.body.appendChild(el);setTimeout(()=>el.remove(),4200);}
function statusBadge(status){const k=String(status||'UNKNOWN').toUpperCase();const map={DONE:['SUCCEEDED','완료'],RUNNING:['RUNNING','처리 중'],ERROR:['FAILED','오류'],FAILED:['FAILED','오류'],ACTIVE:['ACTIVE','정상'],STAGED_WRITE:['RUNNING','초안-승인'],QUEUED:['QUEUED','대기']};const [c,l]=map[k]||['INACTIVE',k];return `<span class="status status-${c.toLowerCase()}"><i></i>${l}</span>`;}
const heading=(e,t,d,a='')=>`<div class="page-heading"><div><span>${e}</span><h1>${t}</h1><p>${d}</p></div>${a}</div>`;
const metric=(l,v,d,t='blue')=>`<article class="metric metric-${t}"><div class="metric-top"><span>${l}</span><b>↗</b></div><strong>${esc(v)}</strong><small>${esc(d)}</small></article>`;
function pairs(rows){return rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v??'—')}</dd></div>`).join('');}
function normalizeEvalPolicy(policy={}){const legacy=policy.metric_ks||{};return {evaluation_depth:policy.evaluation_depth||20,baseline_metric_ks:{...standardMetricKs,...legacy,...(policy.baseline_metric_ks||{})},candidate_metric_ks:{...standardMetricKs,...legacy,...(policy.candidate_metric_ks||{})},curve_ks:policy.curve_ks||[1,3,5,10,20]};}
function metricKFields(prefix,values,title,subtitle){const topK=prefix==='candidate'?(state.draft?.candidate_config?.final_top_k??state.draft?.active_config?.final_top_k):(state.draft?.active_config?.final_top_k);const description=topK==null?subtitle:`${prefix==='candidate'?'개선안':'현재 운영'} Top-K ${topK} 기준`;return `<section class="metric-k-card ${prefix==='candidate'?'candidate':''}"><div><strong>${title}</strong><small>${description}</small></div><div class="metric-k-grid">${Object.keys(metricNames).map(name=>`<label><span>${metricNames[name]} K</span><input id="metric-${prefix}-${name}" type="number" min="1" max="200" value="${attr(values[name])}"></label>`).join('')}</div></section>`;}
function evalPolicyFields(policy=state.evalPolicy,active={},candidate={}){const p=normalizeEvalPolicy(policy);return `<div class="eval-policy"><div class="policy-head"><div><span class="section-kicker">EVALUATION DEPTH</span><h3>현재안·개선안별 독립 평가 기준</h3><p>같은 질문의 검색 순위는 공통 깊이까지 저장하되, 각 안의 지표 K는 별도로 계산합니다.</p></div><button class="secondary-btn" data-action="reset-independent-eval-policy">표준 지표 복원</button></div><div class="eval-depth-row"><label><span>공통 평가 검색 깊이</span><input id="eval-depth" type="number" min="1" max="200" value="${attr(p.evaluation_depth)}"><small>양쪽의 모든 지표 K와 구간 차트 K 이상</small></label><label><span>공통 구간 차트 K</span><input id="curve-ks" value="${attr(p.curve_ks.join(', '))}" placeholder="1, 3, 5, 10, 20"><small>동일 K 구간에서 Recall 곡선을 공정하게 비교</small></label></div><div class="metric-k-layout">${metricKFields('baseline',p.baseline_metric_ks,'현재안 지표 K',`현재 운영 Top-K ${active.final_top_k??'—'} 기준`)}${metricKFields('candidate',p.candidate_metric_ks,'개선안 지표 K',`개선안 Top-K ${candidate.final_top_k??'—'} 기준`)}</div><div class="evaluation-caution">서로 다른 K의 점수 차이는 검색 방식뿐 아니라 평가 범위 차이도 포함합니다. 결과표에 각 K를 함께 표시합니다.</div></div>`;}
function readEvalPolicy(){const read=prefix=>{const values={};Object.keys(metricNames).forEach(name=>values[name]=num(document.getElementById(`metric-${prefix}-${name}`)?.value));return values;};const curve_ks=String(document.getElementById('curve-ks')?.value||'').split(',').map(num).filter(Boolean);return {evaluation_depth:num(document.getElementById('eval-depth')?.value),baseline_metric_ks:read('baseline'),candidate_metric_ks:read('candidate'),curve_ks:[...new Set(curve_ks)].sort((a,b)=>a-b)};}
function validateEvalPolicy(candidate,policy){const allK=[...Object.values(policy.baseline_metric_ks),...Object.values(policy.candidate_metric_ks),...policy.curve_ks],required=Math.max(...allK);if(!policy.evaluation_depth||policy.evaluation_depth<required)throw new Error(`공통 평가 검색 깊이는 최소 ${required}이어야 합니다.`);const active=state.draft?.active_config||{};const limit=Math.min(num(active.candidate_depth)||200,num(candidate.candidate_depth)||200);if(policy.evaluation_depth>limit)throw new Error(`평가 검색 깊이는 현재안·개선안 후보 깊이의 최솟값 ${limit} 이하여야 합니다.`);return policy;}
function metricDefinitions(result){const source=result.metric_definitions||Object.keys(metricNames).map(name=>({name,label:metricNames[name],k:standardMetricKs[name],key:`${name}_at_${standardMetricKs[name]}`}));return source.map(d=>({...d,baseline_k:d.baseline_k??d.k,candidate_k:d.candidate_k??d.k,baseline_key:d.baseline_key||d.key,candidate_key:d.candidate_key||d.key}));}
function metricBarChart(result){const defs=metricDefinitions(result),b=result.baseline,c=result.candidate;return `<div class="chart-card"><div class="chart-title"><div><span class="section-kicker">METRIC COMPARISON</span><h3>현재안·개선안 지표 비교</h3></div><div class="chart-legend"><span><i class="legend-a"></i>현재안</span><span><i class="legend-b"></i>개선안</span></div></div><div class="bar-chart">${defs.map(d=>{const av=Number(b[d.baseline_key]||0),bv=Number(c[d.candidate_key]||0);return `<div class="bar-row"><b>${d.label}<small>@${d.baseline_k} / @${d.candidate_k}</small></b><div class="bar-pair"><span class="bar-a" style="--bar:${Math.max(0,av)*100}%"><i></i><em>${pct(av)}</em></span><span class="bar-b" style="--bar:${Math.max(0,bv)*100}%"><i></i><em>${pct(bv)}</em></span></div></div>`;}).join('')}</div></div>`;}
function curveChart(result){const curveA=result.baseline.curve||{},curveB=result.candidate.curve||{},ks=(result.evaluation_policy?.curve_ks||Object.keys(curveA).map(Number)).map(Number);if(!ks.length)return'';const width=720,height=250,left=52,right=22,top=24,bottom=42,x=i=>left+(width-left-right)*(ks.length===1?.5:i/(ks.length-1)),y=v=>top+(height-top-bottom)*(1-Math.max(0,Math.min(1,Number(v)||0))),path=(curve,key)=>ks.map((k,i)=>`${i?'L':'M'} ${x(i).toFixed(1)} ${y(curve[String(k)]?.[key]).toFixed(1)}`).join(' '),dots=(curve,key,cls)=>ks.map((k,i)=>`<circle class="${cls}" cx="${x(i)}" cy="${y(curve[String(k)]?.[key])}" r="4"><title>${key} @${k}: ${pct(curve[String(k)]?.[key])}</title></circle>`).join('');return `<div class="chart-card"><div class="chart-title"><div><span class="section-kicker">K CURVE</span><h3>Recall@K 증가 곡선</h3></div><div class="chart-legend"><span><i class="legend-a"></i>현재안</span><span><i class="legend-b"></i>개선안</span></div></div><svg class="curve-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="K 구간별 Recall 비교"><g class="chart-grid">${[0,.25,.5,.75,1].map(v=>`<line x1="${left}" y1="${y(v)}" x2="${width-right}" y2="${y(v)}"></line><text x="${left-10}" y="${y(v)+4}">${Math.round(v*100)}%</text>`).join('')}</g><path class="curve-a" d="${path(curveA,'recall')}"></path><path class="curve-b" d="${path(curveB,'recall')}"></path>${dots(curveA,'recall','dot-a')}${dots(curveB,'recall','dot-b')}${ks.map((k,i)=>`<text class="x-label" x="${x(i)}" y="${height-14}">@${k}</text>`).join('')}</svg></div>`;}

async function bootstrap(){try{const [summary,config,capabilities,indices,jobs,monitoring,datasets,evalJobs,draft,keyStatus,pipelineGraph,guardrails,prompts]=await Promise.all([api('/api/admin-ui/summary'),api('/api/admin-ui/runtime-config'),api('/api/admin-ui/capabilities'),api('/api/admin-ui/indices'),api('/api/admin-ui/jobs?limit=100'),api('/api/admin-ui/monitoring?hours=24&limit=200'),api('/api/admin-ui/evaluations/datasets'),api('/api/admin-ui/evaluations/jobs'),api('/api/admin-ui/draft'),api('/api/admin-ui/api-keys/status'),api('/api/admin-ui/pipeline/graph'),api('/api/admin-ui/guardrails'),api('/api/admin-ui/prompts')]);Object.assign(state,{summary,config,capabilities,indices:indices.items||[],jobs:jobs.items||[],monitoring,datasets:datasets.items||[],evalJobs:evalJobs.items||[],draft,keyStatus,pipelineGraph,guardrails,prompts});state.index=pickIndex(state.indices);state.datasetId=state.datasets.at(-1)?.dataset_id||'';render();if(state.index)await searchIndex(false);}catch(error){if(error.status===401)return renderLogin();root.innerHTML=`<section class="panel connection-error"><div class="boot-logo">!</div><h1>AWS 관리자 API에 연결하지 못했습니다.</h1><p>${esc(error.message)}</p><ul><li>KDIC FastAPI 서비스 상태를 확인하세요.</li><li>Elasticsearch·PostgreSQL 내부 연결을 확인하세요.</li></ul></section>`;}}

async function login(){const input=document.getElementById('admin-token');const admin_token=input?.value||'';if(!admin_token)return renderLogin('관리자 토큰을 입력해 주세요.');try{await api('/api/admin-ui/login',{method:'POST',body:JSON.stringify({admin_token})});if(input)input.value='';await bootstrap();}catch(error){renderLogin(error.message);}}

function pipelineSettingsPanel(){const node=state.pipelineNode;if(!node)return `<aside class="panel pipeline-setting-panel"><span class="section-kicker">PIPELINE BLOCK</span><h2>블록을 선택하세요</h2><p>모든 블록의 표시명을 바꿀 수 있습니다. ✓ 블록에서는 검증된 운영 파라미터도 초안으로 관리할 수 있습니다.</p><div class="pipeline-locked-note">회색 블록은 표시명만 변경할 수 있고 실제 코드는 로컬 개발 환경에서 관리합니다.</div></aside>`;const common=`<span class="section-kicker">${node.configurable?'PARAMETER DRAFT':'DISPLAY CUSTOM'}</span><h2>${esc(node.label)}</h2><p>${esc(node.description)}</p>${pipelineLabelEditor(node)}`;if(node.setting_view==='runtime'){const candidate=state.draft?.candidate_config||state.draft?.active_config||{};return `<aside class="panel pipeline-setting-panel">${common}<div class="setting-fields">${(node.settings||[]).map(key=>pipelineSettingField(key,candidate[key])).join('')}</div><div class="pipeline-setting-actions"><button class="primary-btn" data-action="save-pipeline-settings">이 블록의 파라미터 초안 저장</button><button class="secondary-btn" data-view="evaluation">데이터셋 검색 비교 →</button><button class="secondary-btn" data-view="chat">최종 답변 비교 →</button></div></aside>`;}const target=node.setting_view;if(target==='prompts'||target==='guardrails')return `<aside class="panel pipeline-setting-panel">${common}<div class="pipeline-locked-note">${target==='prompts'?'이 단계의 동작은 버전 관리되는 답변 프롬프트에서 수정합니다.':'이 단계의 동작은 가드레일 규칙에서 수정합니다.'}</div><div class="pipeline-setting-actions"><button class="primary-btn" data-view="${attr(target)}">${target==='prompts'?'프롬프트 초안 열기':'가드레일 열기'} →</button><button class="secondary-btn" data-view="chat">최종 답변 비교 →</button></div></aside>`;return `<aside class="panel pipeline-setting-panel">${common}<div class="pipeline-locked-note">이 블록은 표시명만 변경할 수 있습니다. 동작 변경은 로컬에서 코드 검증 후 배포해야 합니다.</div></aside>`;}
function pipelineView(){const graph=state.pipelineGraph;if(!graph)return `${heading('PIPELINE STUDIO','동적 파이프라인','현재 챗봇 런타임 구조를 불러오고 있습니다.')}<section class="panel empty-list">파이프라인 정보를 불러오는 중입니다.</section>`;const byId=Object.fromEntries((graph.nodes||[]).map(node=>[node.id,node]));const lanes=pipelineLanes.map(([id,label,ids])=>`<section class="pipeline-lane lane-${id}"><header><span>${label}</span><small>${ids.filter(nodeId=>byId[nodeId]).length}단계</small></header><div>${ids.map(nodeId=>byId[nodeId]?pipelineNodeCard(byId[nodeId]):'').join('')}</div></section>`).join('');return `${heading('PIPELINE STUDIO','운영 파이프라인 설정','코드는 로컬에서 관리하고, 운영 서버에서는 안전하게 허용된 설정과 모든 블록의 표시명만 변경합니다.','<button class="secondary-btn" data-action="refresh-pipeline">↻ 런타임 다시 읽기</button>')}<section class="pipeline-flow-steps"><button data-view="pipeline"><b>1. 블록 선택</b><small>표시명·안전 설정</small></button><button data-view="runtime"><b>2. 개선안 저장</b><small>현재안은 유지</small></button><button data-view="evaluation"><b>3. 검색 비교</b><small>평가데이터셋·차트</small></button><button data-view="chat"><b>4. 최종 답변 비교</b><small>현재안·개선안</small></button><button data-view="apply"><b>5. 반영·롤백</b><small>통합 변경 이력</small></button></section><div class="pipeline-runtime-strip"><span><b>런타임</b>${esc(graph.pipeline_name)}</span><span><b>설정 가능 블록</b>${(graph.nodes||[]).filter(n=>n.configurable).length}개</span><span><b>구조 해시</b><code>${esc(graph.fingerprint)}</code></span><span class="readonly-tag">서버 코드 편집 차단</span></div><section class="pipeline-workspace"><div class="panel pipeline-map-wrap"><div class="pipeline-map" id="pipeline-map"><svg class="pipeline-edges" id="pipeline-edges" aria-hidden="true"></svg>${lanes}</div><div class="pipeline-map-legend"><span><i class="legend-analysis"></i>질의 분석</span><span><i class="legend-retrieval"></i>검색·근거</span><span><i class="legend-answer"></i>답변</span><span>✓ 파라미터 설정 · 회색은 표시명만 변경</span></div></div>${pipelineSettingsPanel()}</section>`;}
function drawPipelineEdges(){if(state.view!=='pipeline'||!state.pipelineGraph)return;const map=document.getElementById('pipeline-map'),svg=document.getElementById('pipeline-edges');if(!map||!svg)return;const box=map.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);svg.innerHTML=`<defs><marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker></defs>`;(state.pipelineGraph.edges||[]).forEach(edge=>{const from=map.querySelector(`[data-node-id="${CSS.escape(edge.source)}"]`),to=map.querySelector(`[data-node-id="${CSS.escape(edge.target)}"]`);if(!from||!to)return;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),x1=a.right-box.left,y1=a.top+a.height/2-box.top,x2=b.left-box.left,y2=b.top+b.height/2-box.top,dx=Math.max(26,(x2-x1)*.45);const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);path.setAttribute('marker-end','url(#pipeline-arrow)');const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=edge.label||'';path.appendChild(title);svg.appendChild(path);});}
async function refreshPipeline(notify=true){try{state.pipelineGraph=await api('/api/admin-ui/pipeline/graph');if(state.pipelineNode)state.pipelineNode=(state.pipelineGraph.nodes||[]).find(node=>node.id===state.pipelineNode.id&&node.configurable)||null;render();if(notify)toast('현재 챗봇 파이프라인 설정 구조를 다시 읽었습니다.');}catch(e){toast(e.message,true);}}
function selectPipelineNode(id){const node=(state.pipelineGraph?.nodes||[]).find(item=>item.id===id);if(!node)return;state.pipelineNode=node;render();}
async function savePipelineLabel(){const node=state.pipelineNode,label=document.getElementById('pipeline-label')?.value?.trim();if(!node||!label)return toast('표시명을 입력해 주세요.',true);try{const out=await api('/api/admin-ui/pipeline/labels',{method:'PUT',body:JSON.stringify({labels:{[node.id]:label}})});state.pipelineGraph=out.graph;state.pipelineNode=(out.graph.nodes||[]).find(item=>item.id===node.id);render();toast('파이프라인 표시명을 저장했습니다.');}catch(e){toast(e.message,true);}}
async function resetPipelineLabel(){const node=state.pipelineNode;if(!node)return;try{const out=await api(`/api/admin-ui/pipeline/labels/${encodeURIComponent(node.id)}`,{method:'DELETE'});state.pipelineGraph=out.graph;state.pipelineNode=(out.graph.nodes||[]).find(item=>item.id===node.id);render();toast('기본 표시명으로 복구했습니다.');}catch(e){toast(e.message,true);}}
async function savePipelineSettings(){const node=state.pipelineNode;if(!node||node.setting_view!=='runtime')return;const values={};document.querySelectorAll('[data-pipeline-setting]').forEach(input=>{values[input.dataset.pipelineSetting]=input.type==='checkbox'?input.checked:Number(input.value);});try{state.draft=await api('/api/admin-ui/draft/config',{method:'PUT',body:JSON.stringify({values})});render();toast(`${node.label} 파라미터를 초안으로 저장했습니다.`);}catch(e){toast(e.message,true);}}

function guardrailRuleRow(rule,index){return `<article class="guardrail-rule-row" data-index="${index}"><div class="guardrail-rule-head"><label class="switch"><input class="gr-enabled" type="checkbox" ${rule.enabled?'checked':''}><span></span></label><div><input class="gr-name" value="${attr(rule.name)}" aria-label="규칙 이름"><small>${esc(rule.rule_id)}</small></div><span class="guardrail-action action-${attr(rule.action)}">${rule.action==='block'?'차단':'마스킹'}</span><button class="icon-danger" data-action="delete-guardrail" data-index="${index}">삭제</button></div><div class="guardrail-rule-fields"><label><span>적용 위치</span><select class="gr-scope"><option value="input" ${rule.scope==='input'?'selected':''}>질문 입력</option><option value="output" ${rule.scope==='output'?'selected':''}>답변 출력</option><option value="both" ${rule.scope==='both'?'selected':''}>입력 + 출력</option></select></label><label><span>처리 방식</span><select class="gr-action"><option value="mask" ${rule.action==='mask'?'selected':''}>마스킹</option><option value="block" ${rule.action==='block'?'selected':''}>차단</option></select></label><label><span>일치 방식</span><select class="gr-match"><option value="literal" ${rule.match_type==='literal'?'selected':''}>단어 그대로</option><option value="regex" ${rule.match_type==='regex'?'selected':''}>정규식</option></select></label><label class="pattern-field"><span>탐지 패턴</span><input class="gr-pattern" value="${attr(rule.pattern)}"></label><label><span>대체 문구</span><input class="gr-replacement" value="${attr(rule.replacement)}" placeholder="[마스킹]"></label><label class="description-field"><span>설명</span><input class="gr-description" value="${attr(rule.description)}"></label><input class="gr-id" type="hidden" value="${attr(rule.rule_id)}"></div></article>`;}
function guardrailsView(){const data=state.guardrails||{active_rules:[],draft_rules:[],history:[]},active=data.active_rules||[],draft=data.draft_rules||[],changed=JSON.stringify(active)!==JSON.stringify(draft),test=state.guardrailTest;return `${heading('SAFETY POLICY','가드레일 관리','금칙어와 개인정보 마스킹 규칙을 먼저 시험한 뒤 실제 챗봇 입력·출력에 반영합니다.','<button class="secondary-btn" data-action="refresh-guardrails">↻ 다시 읽기</button>')}<div class="risk-banner"><b>!</b><span><strong>원문 개인정보는 평가·로그에 저장되기 전에 처리됩니다.</strong>차단 규칙은 질문 자체를 전송하지 않고, 마스킹 규칙은 지정 문구로 바꾼 뒤 검색과 답변을 실행합니다.</span></div><section class="guardrail-summary">${metric('운영 규칙',active.filter(r=>r.enabled).length,`${active.length}개 중 활성`)}${metric('마스킹',active.filter(r=>r.enabled&&r.action==='mask').length,'PII·민감정보','purple')}${metric('차단',active.filter(r=>r.enabled&&r.action==='block').length,'모델 호출 전 차단','red')}${metric('운영 버전',data.active_version||'—',changed?'초안 변경 있음':'초안과 동일','cyan')}</section><section class="guardrail-layout"><div><article class="panel guardrail-editor"><div class="panel-head"><div><span class="section-kicker">DRAFT RULES</span><h2>규칙 초안</h2></div><div class="button-row"><button class="secondary-btn" data-action="add-finance-guardrails">금융권 권장 8개 추가</button><button class="secondary-btn" data-action="add-guardrail">+ 규칙 추가</button><button class="secondary-btn" data-action="clear-guardrail-draft" ${!changed?'disabled':''}>초안 되돌리기</button><button class="primary-btn" data-action="save-guardrail-draft">초안 저장</button></div></div><div class="guardrail-finance-note"><b>권장 규칙</b><span>계좌·카드·신분증은 마스킹, OTP·비밀번호·CVC는 질문 입력 단계에서 차단합니다. 추가 후 반드시 오른쪽 시험 기능으로 확인하세요.</span></div><div class="guardrail-rules">${draft.map(guardrailRuleRow).join('')||'<div class="empty-list">등록된 규칙이 없습니다.</div>'}</div></article></div><aside><article class="panel guardrail-test"><span class="section-kicker">SAFE TEST</span><h2>규칙 미리 시험하기</h2><p>저장된 초안 기준으로만 실행되며 챗봇에는 영향을 주지 않습니다.</p><textarea id="guardrail-test-text" placeholder="테스트할 문장을 입력하세요">${esc(test?.original||'제 전화번호는 010-1234-5678입니다.')}</textarea><div class="button-row"><select id="guardrail-test-scope"><option value="input">질문 입력</option><option value="output">답변 출력</option></select><button class="secondary-btn" data-action="test-guardrails">탐지 결과 보기</button></div>${test?`<div class="guardrail-test-result ${test.blocked?'blocked':''}"><strong>${test.blocked?'전송 차단':'통과·마스킹 완료'}</strong><p>${esc(test.text)}</p><div>${(test.hits||[]).map(hit=>`<span>${esc(hit.name)} · ${hit.action}</span>`).join('')||'<span>탐지 규칙 없음</span>'}</div></div>`:''}</article><article class="panel guardrail-apply"><span class="section-kicker">APPLY</span><h2>운영 반영</h2><p>초안 저장 후 확인 문구를 입력하면 다음 질문부터 적용됩니다.</p><input id="guardrail-confirm" placeholder="가드레일 반영"><button class="danger-btn" data-action="apply-guardrails" ${!changed?'disabled':''}>가드레일 반영</button></article><article class="panel guardrail-history"><div class="panel-head"><h2>이전 버전</h2></div>${(data.history||[]).slice().reverse().map(row=>`<div><span><b>${esc(row.version)}</b><small>${new Date(Number(row.archived_at)*1000).toLocaleString('ko-KR')}</small></span><button class="secondary-btn" data-action="rollback-guardrails" data-id="${attr(row.version)}">복구</button></div>`).join('')||'<div class="empty-list">이전 버전이 없습니다.</div>'}</article></aside></section>`;}

function promptsView(){const data=state.prompts||{slots:[]},slots=data.slots||[],changed=slots.filter(row=>row.changed),result=state.promptComparison;return `${heading('ANSWER POLICY','프롬프트 개선안','현재 답변 경로에서 실제 사용하는 3개 시스템 프롬프트만 수정합니다. 반영과 롤백은 반영센터에서 통합 관리합니다.','<button class="secondary-btn" data-action="refresh-prompts">↻ 다시 읽기</button>')}<div class="risk-banner"><b>!</b><span><strong>프롬프트를 저장해도 실제 챗봇은 바뀌지 않습니다.</strong>검색평가와 최종 답변 비교를 마친 뒤 반영센터에서 한 번에 승인합니다.</span></div><section class="prompt-summary">${metric('관리 프롬프트',slots.length,'운영 답변 경로만')}${metric('변경된 개선안',changed.length,changed.length?'최종 검증 필요':'현재안과 동일','purple')}${metric('운영 버전',data.active_version||'—','통합 반영센터 관리','cyan')}</section><section class="prompt-layout"><article class="panel prompt-editor"><div class="panel-head"><div><span class="section-kicker">VERSIONED DRAFT</span><h2>답변 프롬프트 개선안</h2></div></div><div class="prompt-slots">${slots.map(promptSlotEditor).join('')||'<div class="empty-list">관리 프롬프트를 불러오지 못했습니다.</div>'}</div><div class="prompt-actions"><button class="secondary-btn" data-action="clear-prompt-draft" ${!data.has_changes?'disabled':''}>현재안으로 되돌리기</button><button class="primary-btn" data-action="save-prompt-draft">개선안 저장</button></div></article><div class="prompt-right"><article class="panel prompt-compare"><span class="section-kicker">PROMPT-ONLY CHECK</span><h2>프롬프트만 빠르게 비교</h2><p>검색 파라미터는 그대로 두고 프롬프트 변경 영향만 확인합니다. 모든 개선안을 합친 최종 비교는 챗봇 테스트에서 실행합니다.</p><div class="prompt-question"><textarea id="prompt-question" placeholder="비교 질문을 입력하세요">${esc(state.promptQuestion)}</textarea><button class="primary-btn" data-action="compare-prompts" ${state.promptBusy?'disabled':''}>${state.promptBusy?'두 답변 생성 중…':'개선안 저장 후 비교'}</button></div>${result?`<div class="prompt-ab">${promptAnswerCard('현재안 프롬프트',result.baseline)}${promptAnswerCard('개선안 프롬프트',result.candidate,true)}</div>`:'<div class="empty-list">질문을 실행하면 두 답변이 나란히 표시됩니다.</div>'}</article><article class="panel prompt-history"><span class="section-kicker">CENTRAL APPROVAL</span><h2>반영은 한 곳에서</h2><div class="prompt-center-note">프롬프트·검색 파라미터·청크 개선안을 함께 검토하고 하나의 버전으로 반영합니다. 해당 버전은 서버 재시작 후에도 반영센터에서 복구할 수 있습니다.</div><div class="prompt-actions"><button class="secondary-btn" data-view="chat">최종 답변 비교</button><button class="primary-btn" data-view="apply">반영센터로 이동 →</button></div></article></div></section>`;}
function readPromptValues(){return Object.fromEntries([...document.querySelectorAll('.prompt-value')].map(node=>[node.dataset.slot,node.value]));}

function configFields(c,prefix='cfg'){return `<div class="form-grid config-fields"><label><span>Dense 가중치</span><input id="${prefix}-dense" type="number" min="0" max="1" step="0.05" value="${attr(c.dense_weight)}"></label><label><span>BM25 가중치</span><input id="${prefix}-bm25" type="number" min="0" max="1" step="0.05" value="${attr(c.bm25_weight)}"></label><label><span>후보 깊이</span><input id="${prefix}-depth" type="number" min="5" max="200" value="${attr(c.candidate_depth)}"></label><label><span>최종 Top-K</span><input id="${prefix}-topk" type="number" min="1" max="20" value="${attr(c.final_top_k)}"></label><label><span>최소 관련성 점수</span><input id="${prefix}-threshold" type="number" min="0" max="1" step="0.05" value="${attr(c.min_relevance_score??0)}"><small>Reranker 점수를 0~1로 변환한 통과 기준</small></label><label><span>RRF K</span><input id="${prefix}-rrf" type="number" min="1" max="200" value="${attr(c.query_fusion_rrf_k)}"></label><label><span>Parent 문맥(자)</span><input id="${prefix}-parentchars" type="number" min="500" max="30000" value="${attr(c.parent_context_max_chars)}"></label><label><span>Parent-Child</span><select id="${prefix}-parent"><option value="true" ${c.parent_child?'selected':''}>사용</option><option value="false" ${!c.parent_child?'selected':''}>미사용</option></select></label></div>`;}
function readConfig(prefix){return {dense_weight:num(document.getElementById(`${prefix}-dense`)?.value),bm25_weight:num(document.getElementById(`${prefix}-bm25`)?.value),candidate_depth:num(document.getElementById(`${prefix}-depth`)?.value),final_top_k:num(document.getElementById(`${prefix}-topk`)?.value),min_relevance_score:num(document.getElementById(`${prefix}-threshold`)?.value),query_fusion_rrf_k:num(document.getElementById(`${prefix}-rrf`)?.value),parent_context_max_chars:num(document.getElementById(`${prefix}-parentchars`)?.value),parent_child:document.getElementById(`${prefix}-parent`)?.value==='true'};}
const retrievalRankKeys=['dense_weight','bm25_weight','candidate_depth','min_relevance_score'];
function evalChangeSummary(candidate=readConfig('eval')){const active=state.draft?.active_config||{},rank=retrievalRankKeys.filter(key=>String(active[key])!==String(candidate[key])).map(key=>`${({dense_weight:'Dense 가중치',bm25_weight:'BM25 가중치',candidate_depth:'후보 깊이',min_relevance_score:'최소 관련성 점수'})[key]} ${active[key]} → ${candidate[key]}`),context=[['final_top_k','최종 Top-K'],['query_fusion_rrf_k','RRF K'],['parent_context_max_chars','Parent 문맥'],['parent_child','Parent-Child']].filter(([key])=>String(active[key])!==String(candidate[key])).map(([key,label])=>`${label} ${active[key]===true?'사용':active[key]===false?'미사용':active[key]} → ${candidate[key]===true?'사용':candidate[key]===false?'미사용':candidate[key]}`);return {rank,context};}
function refreshEvalChangeHint(){const el=root.querySelector('#eval-change-hint');if(!el)return;const diff=evalChangeSummary();el.dataset.tone=diff.rank.length?'info':'warning';el.innerHTML=diff.rank.length?`<b>검색 순위에 적용될 변경 ${diff.rank.length}건</b><span>${esc(diff.rank.join(' · '))}</span>${diff.context.length?`<small>별도 단계 설정: ${esc(diff.context.join(' · '))}</small>`:''}`:`<b>현재안과 개선안의 검색 순위 설정이 같습니다.</b><span>Dense/BM25 가중치, 후보 깊이, 최소 관련성 점수 중 하나를 변경해야 검색 순위 차이를 비교할 수 있습니다.</span>${diff.context.length?`<small>변경한 ${esc(diff.context.join(' · '))}은 답변 컨텍스트 또는 다중 질의 단계의 값이라, 이 단일 질의 검색 순위 평가에는 직접 반영되지 않습니다.</small>`:''}`;}
function decorateEvaluationView(){if(state.view!=='evaluation')return;const field=root.querySelector('#eval-dense');if(!field)return;const setup=field.closest('.eval-setup'),policy=setup?.querySelector('.eval-policy');if(policy&&!root.querySelector('#eval-change-hint'))policy.insertAdjacentHTML('beforebegin','<div id="eval-change-hint" class="panel" style="margin:14px 0 0;padding:13px;font-size:10px;line-height:1.65;display:grid;gap:4px"></div>');const copy=root.querySelector('button[data-action="copy-draft"]');if(copy){copy.textContent='저장된 개선안으로 되돌리기';copy.title='평가 화면에서 수정한 값을 버리고 저장된 개선안을 다시 불러옵니다.';}refreshEvalChangeHint();}
function runtimeView(){const active=state.draft?.active_config||{},candidate=state.draft?.candidate_config||active;return `${heading('SEARCH PARAMETERS','파라미터 개선안','현재 운영값은 그대로 두고 개선 설정을 저장합니다. 평가 화면에서 현재안과 개선안을 비교할 수 있습니다.')}<section class="config-compare"><article class="panel config-card"><div class="config-title"><span>현</span><div><h2>현재안</h2><p>최종 챗봇이 지금 사용하는 운영값</p></div>${statusBadge('ACTIVE')}</div><dl>${pairs([['Dense / BM25',`${active.dense_weight} / ${active.bm25_weight}`],['후보 깊이',active.candidate_depth],['최종 Top-K',active.final_top_k],['최소 관련성 점수',Number(active.min_relevance_score||0).toFixed(2)],['RRF K',active.query_fusion_rrf_k],['Parent-Child',active.parent_child?'사용':'미사용'],['Parent 문맥',`${active.parent_context_max_chars}자`]])}</dl></article><article class="panel config-card candidate"><div class="config-title"><span>개</span><div><h2>개선안</h2><p>저장만으로는 운영에 반영되지 않음</p></div><span class="env-tag">DRAFT</span></div>${configFields(candidate,'draft')}<div class="approve-bar"><button class="primary-btn" data-action="save-config">개선안 저장</button></div></article></section><div class="readonly-banner"><div><strong>Chunk Size·임베딩 모델 변경은 여기서 즉시 반영하지 않습니다.</strong><span>전체 재청킹·재임베딩이 필요한 적재 시점 파라미터이기 때문입니다.</span></div><code>search-time only</code></div>`;}

function evaluationView(){const options=state.datasets.map(d=>`<option value="${attr(d.dataset_id)}" ${state.datasetId===d.dataset_id?'selected':''}>${esc(d.filename)} (${d.usable_count}/${d.row_count})</option>`).join('');const active=state.draft?.active_config||{},candidate=state.draft?.candidate_config||active;let result='';if(state.evalJob&&state.evalJob.status!=='done'){result=`<section class="panel evaluation-progress"><div><span>${esc(state.evalJob.status==='error'?state.evalJob.error:'검색 평가 실행 중')}</span><strong>${state.evalJob.progress||0}%</strong></div><i><em style="width:${state.evalJob.progress||0}%"></em></i><p>${state.evalJob.processed||0}개 질문 처리</p></section>`;}if(state.evalResult){const b=state.evalResult.baseline,c=state.evalResult.candidate;result=`<section class="panel result-compare"><div class="panel-head"><div><span class="section-kicker">A/B RESULT</span><h2>${esc(state.evalResult.evaluation_scope)}</h2></div><span class="test-badge">${b.question_count}문항</span></div><div class="eval-metric-table"><div class="eval-row eval-head"><span>지표</span><span>A 운영</span><span>B 후보</span><span>변화</span></div>${Object.keys(metricLabels).map(k=>{const latency=k==='latency_avg_ms',delta=state.evalResult.delta[k];return `<div class="eval-row"><b>${metricLabels[k]}</b><span>${latency?`${b[k].toFixed(0)}ms`:pct(b[k])}</span><span>${latency?`${c[k].toFixed(0)}ms`:pct(c[k])}</span><strong class="${delta>0?(latency?'rank-down':'rank-up'):delta<0?(latency?'rank-up':'rank-down'):'rank-same'}">${delta==null?'—':latency?`${delta>0?'+':''}${delta.toFixed(0)}ms`:`${delta>0?'+':''}${(delta*100).toFixed(1)}%p`}</strong></div>`;}).join('')}</div><details class="raw-toggle"><summary>질문별 결과 ${state.evalResult.details.length}건 보기</summary><div class="question-results">${state.evalResult.details.map(r=>`<article><b>${esc(r.question_id)} · ${esc(r.question)}</b><small>Gold: ${esc(r.gold_chunk_ids.join(', '))}</small><span>A: ${esc(r.baseline_retrieved.slice(0,5).join(', '))}</span><span>B: ${esc(r.candidate_retrieved.slice(0,5).join(', '))}</span></article>`).join('')}</div></details></section>`;}return `${heading('BATCH RETRIEVAL EVAL','평가데이터셋 검색 A/B','Gold 청크가 있는 XLSX/CSV를 업로드해 현재 운영값과 후보값을 같은 질문으로 비교합니다.')}<section class="panel eval-setup"><div class="panel-head"><div><span class="section-kicker">DATASET</span><h2>1. 평가데이터셋 업로드</h2></div></div><div class="upload-row"><input id="dataset-file" type="file" accept=".xlsx,.csv"><button class="secondary-btn" data-action="upload-dataset">파일 검증·등록</button><select id="dataset-select"><option value="">등록된 파일 선택</option>${options}</select></div>${state.datasetId?datasetNotice():''}</section><section class="panel eval-setup"><div class="panel-head"><div><span class="section-kicker">CANDIDATE B</span><h2>2. 비교 설정</h2></div><button class="secondary-btn" data-action="copy-draft">저장된 초안 사용</button></div>${configFields(candidate,'eval')}<div class="form-actions"><p>지표: <b>Hit@3 · Recall@5 · MRR@10 · MAP@10 · Complete@5 · nDCG@5 · Precision@5 · F1@5 · 지연시간</b></p><button class="primary-btn" data-action="run-eval" ${!state.datasetId?'disabled':''}>A/B 일괄 평가 실행</button></div></section>${result}`;}
function llmCaseList(title,rows,tone){const items=(rows||[]).slice(0,3);return `<div class="llm-case-list"><h4>${esc(title)}</h4>${items.length?items.map(row=>`<article><b>${esc(row.question_id||'—')}</b><span title="${attr(row.question)}">${esc(row.question)}</span><em class="${tone}">${row.score_delta>0?'+':''}${(Number(row.score_delta||0)*100).toFixed(1)}%p</em></article>`).join(''):'<div class="empty-list">해당 사례가 없습니다.</div>'}</div>`;}
function llmReportPanel(result){const report=result?.llm_report,summary=report?.summary,counts=summary?.counts||{},rates=summary?.rates||{};return `<section class="llm-report-panel"><div class="panel-head"><div><span class="section-kicker">LLM QUALITY REPORT</span><h3>전체 테스트셋 품질 변화 리포트</h3><p>개선·악화 비율은 서버가 전체 문항으로 계산하고, HCX는 결과 해석과 권장 설정만 작성합니다.</p></div><button class="primary-btn" data-action="generate-eval-report" ${state.evalReportBusy||!state.evalJob?.job_id?'disabled':''}>${state.evalReportBusy?'LLM 분석 중…':report?'리포트 다시 생성':'LLM 리포트 생성'}</button></div>${report?`<div class="llm-report-summary"><div class="llm-report-stat"><small>전체 평가 질문</small><strong>${summary.question_count||0}</strong></div><div class="llm-report-stat good"><small>개선</small><strong>${pct(rates.improved)}</strong></div><div class="llm-report-stat bad"><small>악화</small><strong>${pct(rates.degraded)}</strong></div><div class="llm-report-stat"><small>동일</small><strong>${pct(rates.unchanged)}</strong></div></div><div class="llm-report-body">${esc(report.report_markdown||'')}</div><div class="llm-case-grid">${llmCaseList('대표 개선 사례',summary.representative_improvements,'rank-up')}${llmCaseList('대표 악화 사례',summary.representative_degradations,'rank-down')}</div><div class="llm-report-meta"><span>산정 기준: ${esc(summary.classification_rule||'')}</span><span>모델 ${esc(report.model)}</span><span>${Number(report.latency_ms||0).toFixed(0)}ms</span><span>총 ${Number(report.usage?.total_tokens||0).toLocaleString()} 토큰</span><span>${fmtDate(report.generated_at)}</span></div>`:`<div class="llm-report-empty">검색 비교가 끝난 뒤 버튼을 누르면 HCX API를 1회 호출합니다. 검색 결과 전체를 다시 생성하지 않으며, 현재 완료된 평가 결과를 요약합니다.</div>`}</section>`;}

function evaluationViewV2(){
  const options=state.datasets.map(d=>`<option value="${attr(d.dataset_id)}" ${state.datasetId===d.dataset_id?'selected':''}>${esc(d.filename)} (${d.usable_count}/${d.row_count})</option>`).join('');
  const candidate=state.draft?.candidate_config||state.draft?.active_config||{};
  let progress='';
  if(state.evalJob&&state.evalJob.status==='running')progress=`<section class="panel evaluation-progress"><div><span>검색 평가 실행 중</span><strong>${state.evalJob.progress||0}%</strong></div><i><em style="width:${state.evalJob.progress||0}%"></em></i><p>${state.evalJob.processed||0}개 질문 처리 · 답변 생성 없이 검색 계층만 평가</p></section>`;
  let result='';
  if(state.evalResult){const r=state.evalResult,b=r.baseline,c=r.candidate,defs=metricDefinitions(r);result=`<section class="panel result-compare"><div class="panel-head"><div><span class="section-kicker">COMPARISON RESULT</span><h2>${esc(r.evaluation_scope)}</h2><p>공통 검색 깊이 ${r.evaluation_policy?.evaluation_depth||'—'} · 현재안과 개선안의 지표 K를 독립 계산</p></div><span class="test-badge">${b.question_count}문항</span></div><div class="chart-grid-layout">${metricBarChart(r)}${curveChart(r)}</div><div class="eval-metric-table"><div class="eval-row eval-head"><span>지표</span><span>현재안</span><span>개선안</span><span>변화</span></div>${defs.map(d=>{const delta=r.delta[d.name],av=b[d.baseline_key],bv=c[d.candidate_key];return `<div class="eval-row"><b>${d.label}<small>현재 @${d.baseline_k} · 개선 @${d.candidate_k}</small></b><span>${pct(av)} <small>@${d.baseline_k}</small></span><span>${pct(bv)} <small>@${d.candidate_k}</small></span><strong class="${delta>0?'rank-up':delta<0?'rank-down':'rank-same'}">${delta==null?'—':`${delta>0?'+':''}${(delta*100).toFixed(1)}%p`}</strong></div>`;}).join('')}<div class="eval-row"><b>평균 지연시간</b><span>${Number(b.latency_avg_ms||0).toFixed(0)}ms</span><span>${Number(c.latency_avg_ms||0).toFixed(0)}ms</span><strong class="${r.delta.latency_avg_ms<0?'rank-up':r.delta.latency_avg_ms>0?'rank-down':'rank-same'}">${r.delta.latency_avg_ms>0?'+':''}${Number(r.delta.latency_avg_ms||0).toFixed(0)}ms</strong></div></div>${llmReportPanel(r)}<details class="raw-toggle"><summary>질문별 결과 ${r.details.length}건 보기</summary><div class="question-results">${r.details.map(row=>`<article><b>${esc(row.question_id)} · ${esc(row.question)}</b><small>Gold ${esc(row.gold_chunk_ids.join(', '))}${row.multi_chunk_required?' · 다중 청크':''}</small><span>현재안: ${esc(row.baseline_retrieved.join(', '))}</span><span>개선안: ${esc(row.candidate_retrieved.join(', '))}</span></article>`).join('')}</div></details></section>`;}
  const history=state.evalJobs.map(job=>`<div class="history-row"><span><b>${esc(job.dataset_filename||job.dataset_id)}</b><small>${fmtDate(job.created_at)} · ${esc(job.job_id)}</small></span>${statusBadge(job.status)}<code>${job.evaluation_policy?.evaluation_depth?`Depth ${job.evaluation_policy.evaluation_depth}`:'—'}</code><div class="row-actions">${job.status==='done'?`<button class="secondary-btn" data-action="open-eval-job" data-id="${attr(job.job_id)}">결과 보기</button>`:''}<button class="icon-danger" data-action="delete-eval-job" data-id="${attr(job.job_id)}" ${job.status==='running'?'disabled':''}>지우기</button></div></div>`).join('')||'<div class="empty-list">저장된 평가 실행 이력이 없습니다.</div>';
  return `${heading('BATCH RETRIEVAL EVAL','평가데이터셋 검색 비교','답변용 Top-K와 평가 검색 깊이를 분리하고, 현재안과 개선안의 고정 지표·K 구간 성능을 함께 비교합니다.')}<section class="panel eval-setup"><div class="panel-head"><div><span class="section-kicker">DATASET</span><h2>1. 평가데이터셋 관리</h2></div><div class="row-actions"><button class="icon-danger" data-action="delete-dataset" ${!state.datasetId?'disabled':''}>선택 파일 지우기</button><button class="icon-danger" data-action="clear-datasets" ${!state.datasets.length?'disabled':''}>전체 비우기</button></div></div><div class="upload-row"><input id="dataset-file" type="file" accept=".xlsx,.csv"><button class="secondary-btn" data-action="upload-dataset">파일 검증·등록</button><select id="dataset-select"><option value="">등록된 파일 선택</option>${options}</select></div>${state.datasetId?datasetNotice():''}</section><section class="panel eval-setup"><div class="panel-head"><div><span class="section-kicker">IMPROVEMENT</span><h2>2. 개선안과 평가 기준</h2></div><button class="secondary-btn" data-action="copy-draft">저장된 개선안 사용</button></div>${configFields(candidate,'eval')}${evalPolicyFields()}<div class="form-actions"><p><b>최종 Top-K</b>는 답변 근거 수, <b>평가 검색 깊이</b>는 순위 평가 범위입니다.</p><button class="primary-btn" data-action="run-eval" ${!state.datasetId?'disabled':''}>현재안·개선안 평가 실행</button></div></section>${progress}${result}<section class="panel jobs-panel"><div class="panel-head"><div><span class="section-kicker">EVALUATION HISTORY</span><h2>평가 실행 이력</h2></div><button class="icon-danger" data-action="clear-eval-jobs" ${!state.evalJobs.some(j=>j.status!=='running')?'disabled':''}>완료 이력 비우기</button></div>${history}</section>`;
}
function datasetNotice(){const d=state.datasets.find(x=>x.dataset_id===state.datasetId);if(!d)return'';return `<div class="dataset-notice"><b>${esc(d.filename)}</b><span>전체 ${d.row_count} · 평가 가능 ${d.usable_count}</span>${d.warnings?.length?`<details><summary>검수 경고 ${d.warnings.length}건</summary><p>${d.warnings.map(esc).join('<br>')}</p></details>`:'<em>Gold 연결 정상</em>'}</div>`;}

function dataViewBase(){const options=state.indices.map(r=>`<option value="${attr(r.index)}" ${state.index===r.index?'selected':''}>${esc(r.index)}</option>`).join('');const hits=state.hits.map(h=>{const s=h._source||{};return `<button class="api-hit" data-action="select-hit" data-id="${attr(h._id)}"><span class="doc-id">${esc(s.chunk_id||h._id)}</span><span><b>${esc(s.section_title||s.title||s.chunk_id||h._id)}</b><small>${esc(s.business_function||s.parent_doc_id||h._index)}</small></span><em>${Number(h._score||0).toFixed(3)}</em></button>`;}).join('')||'<div class="empty-list">검색 결과가 없습니다.</div>';const detail=state.document?`<div class="panel-head"><div><span class="section-kicker">CHUNK DETAIL</span><h2>${esc(state.document._id)}</h2></div><button class="danger-btn" data-action="stage-remove" data-id="${attr(state.document._id)}">제거 초안</button></div><pre class="json-view">${esc(JSON.stringify(state.document.chunk_metadata||state.document._source,null,2))}</pre>`:'<div class="empty-list">왼쪽에서 청크를 선택해 주세요.</div>';return `${heading('CHUNK OPERATIONS','청크 조회·추가·제거','추가와 제거는 초안으로만 저장되며 반영 전까지 챗봇 검색 결과는 바뀌지 않습니다.')}<section class="panel add-chunk"><div class="panel-head"><div><span class="section-kicker">ADD DRAFT</span><h2>신규 청크 JSON</h2></div><button class="secondary-btn" data-action="stage-add">추가 초안 저장</button></div><textarea id="chunk-json" placeholder='{"chunk_id":"NEW-001_chunk_000","document_id":"NEW-001","parent_doc_id":"NEW-001","title":"제목","section_title":"부제목","business_function":"업무","content":"본문"}'></textarea></section><section class="panel"><div class="api-searchbar"><select id="index-select">${options}</select><input id="index-query" value="${attr(state.query)}" placeholder="청크 ID·본문 검색"><button class="primary-btn" data-action="search-index">검색</button></div></section><section class="api-result-layout"><article class="panel api-hit-list"><div class="list-summary"><b>${state.hitTotal}건 중 ${state.hits.length}건</b><span>${esc(state.index)}</span></div><div class="api-hit-scroll">${hits}</div></article><article class="panel api-doc-view" style="padding:20px">${detail}</article></section>`;}
function dataView(){const drop=`<label class="chunk-dropzone" for="chunk-file"><input id="chunk-file" type="file" accept=".json,.jsonl,application/json,application/x-ndjson"><b>JSON·JSONL 파일을 여기에 끌어놓으세요</b><span>클릭해서 선택할 수도 있습니다 · 단일 객체, 배열, { chunks: [...] } 지원</span><em class="chunk-file-name">선택된 파일 없음</em></label>`;const manual=`<section class="panel" style="margin:0 0 12px;padding:16px;background:var(--bg)"><div class="panel-head" style="margin-bottom:12px"><div><span class="section-kicker">DIRECT ENTRY</span><h2 style="font-size:13px">직접 입력으로 청크 추가</h2><p style="margin-top:4px">필수 항목은 청크 ID와 본문입니다. 파일이나 JSON을 만들지 않아도 됩니다.</p></div></div><div class="form-grid"><label><span>청크 ID *</span><input id="manual-chunk-id" placeholder="예: HP-001_chunk_000"></label><label><span>문서 ID</span><input id="manual-document-id" placeholder="예: HP-001"></label><label><span>상위 문서 ID</span><input id="manual-parent-id" placeholder="비우면 문서 ID 사용"></label><label><span>업무 분류</span><input id="manual-business-function" placeholder="예: 은닉재산 신고"></label><label class="wide"><span>제목</span><input id="manual-title" placeholder="문서 또는 청크 제목"></label><label class="wide"><span>부제목</span><input id="manual-section-title" placeholder="세부 항목 제목"></label><label class="wide"><span>본문 *</span><textarea id="manual-chunk-content" placeholder="검색과 답변 근거로 사용할 본문을 입력하세요."></textarea></label></div><div class="form-actions"><p>저장 후에도 <b>초안</b> 상태이며, 반영센터 승인 전까지 챗봇에는 적용되지 않습니다.</p><button class="primary-btn" data-action="stage-manual-add">직접 입력 청크를 초안에 저장</button></div></section><p style="margin:14px 0 7px;font-size:10px;font-weight:800;color:var(--muted)">또는 JSON 직접 붙여넣기</p>`;const jsonSave=`</textarea><div class="form-actions"><p>입력한 JSON·JSONL을 검증한 뒤 <b>추가 초안</b>으로 저장합니다.</p><button class="primary-btn" data-action="stage-add">붙여넣은 JSON을 추가 초안으로 저장</button></div></section><section class="panel"><div class="api-searchbar">`;return dataViewBase().replace('<textarea id="chunk-json"',`${drop}${manual}<textarea id="chunk-json"`).replace('</textarea></section><section class="panel"><div class="api-searchbar">',jsonSave);}

function keysView(){const k=state.keyStatus||{};const tested=state.keyTest?`<div class="key-test-result"><b>연결 검증 완료</b><span>지문 ${esc(state.keyTest.fingerprint)}</span><span>임베딩 ${Math.round(state.keyTest.embedding_latency_ms)}ms</span><span>답변 ${Math.round(state.keyTest.chat_latency_ms)}ms</span></div>`:'';return `${heading('SERVER SECRET','HCX API 키 관리','키는 HTTPS로 AWS 서버에 전달되며 화면·API 응답·로그에서 다시 조회할 수 없습니다.')}<section class="metric-grid">${metric('설정 상태',k.configured?'등록됨':'미등록',k.source||'—')}${metric('키 지문',k.fingerprint||'—','SHA-256 앞 12자리','purple')}${metric('마지막 교체',k.last_rotated_at?new Date(k.last_rotated_at*1000).toLocaleString('ko-KR'):'교체 이력 없음','AWS 서버','cyan')}${metric('저장 범위','AWS 영구 설정','런타임·systemd 재시작 유지','red')}</section><div class="risk-banner"><b>!</b><span><strong>기존 키는 확인하거나 복사할 수 없습니다.</strong>새 키는 연결 검증 후 현재 챗봇과 AWS 환경파일에 함께 반영됩니다.</span></div><section class="panel key-manager"><div class="panel-head"><div><span class="section-kicker">ROTATE SECRET</span><h2>새 HCX API 키</h2></div><span class="index-health">AWS 서버 전용</span></div><label><span>API 키</span><div class="secret-input"><input id="new-api-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="Bearer 없이 키 값만 입력"><button class="secondary-btn" data-action="toggle-key">보기</button></div></label><label><span>교체 확인 문구</span><input id="key-confirm" placeholder="API 키 교체"></label><div class="approve-bar"><button class="secondary-btn" data-action="test-key">연결 테스트</button><button class="danger-btn" data-action="rotate-key">검증 후 교체</button></div>${tested}<p class="muted-note">연결 테스트는 BGE-M3 임베딩과 HCX 답변 모델에 각각 짧은 요청을 1회 실행합니다.</p></section>`;}

function applyView(){const d=state.draft||{},changes=Object.entries(d.candidate_config||{}).filter(([k,v])=>d.active_config?.[k]!==v);const history=d.history||[];return `${heading('CHANGE CONTROL','운영 반영 센터','초안 내용을 마지막으로 확인한 뒤 같은 챗봇 런타임에 반영합니다.')}<div class="risk-banner"><b>!</b><span><strong>반영 중에는 실행 중인 챗봇 작업이 없어야 합니다.</strong>청크 제거는 운영 인덱스에서 제외되지만 이전 상태가 메모리 스냅샷에 남아 롤백할 수 있습니다.</span></div><section class="change-review"><article class="panel config-card"><h2>파라미터 변경 ${changes.length}건</h2><dl>${changes.length?pairs(changes.map(([k,v])=>[k,`${d.active_config[k]} → ${v}`])):'<div><dt>변경 없음</dt><dd>—</dd></div>'}</dl></article><article class="panel config-card"><h2>청크 추가 ${d.add?.length||0}건</h2><div class="chip-list">${(d.add||[]).map(c=>`<span>${esc(c.chunk_id)}</span>`).join('')||'없음'}</div></article><article class="panel config-card"><h2>청크 제거 ${(d.remove||[]).length}건</h2><div class="chip-list danger">${(d.remove||[]).map(c=>`<span>${esc(c)}</span>`).join('')||'없음'}</div></article></section><section class="panel apply-panel"><div><span class="section-kicker">FINAL APPROVAL</span><h2>운영 반영</h2><p>확인 문구 <b>운영 반영</b>을 입력하면 ES 인덱스와 챗봇 메모리가 함께 갱신됩니다.</p></div><input id="apply-confirm" placeholder="운영 반영"><button class="danger-btn" data-action="apply-changes" ${!d.has_changes?'disabled':''}>실제 반영하기</button><button class="secondary-btn" data-action="clear-draft" ${!d.has_changes?'disabled':''}>초안 비우기</button></section><section class="panel jobs-panel"><div class="panel-head"><div><span class="section-kicker">ROLLBACK</span><h2>반영 이력</h2></div></div>${history.length?history.map(h=>`<div class="history-row"><span><b>${esc(h.version_id)}</b><small>${new Date(h.created_at*1000).toLocaleString('ko-KR')}</small></span><code>+${h.summary.added.length} / -${h.summary.removed.length}</code><button class="secondary-btn" data-action="rollback" data-id="${attr(h.version_id)}">이 버전 반영 전으로 복구</button></div>`).join(''):'<div class="empty-list">아직 반영 이력이 없습니다.</div>'}</section>`;}

function applyViewV2(){const d=state.draft||{},changes=Object.entries(d.candidate_config||{}).filter(([k,v])=>d.active_config?.[k]!==v),prompts=d.prompt_changes||[],history=d.history||[];const added=(d.add||[]).map(c=>`<span class="editable-chip">${esc(c.chunk_id)}<button data-action="undo-add" data-id="${attr(c.chunk_id)}" aria-label="추가 초안 취소">×</button></span>`).join('')||'<span class="empty-inline">없음</span>';const removed=(d.remove||[]).map(id=>`<span class="editable-chip danger">${esc(id)}<button data-action="undo-remove" data-id="${attr(id)}" aria-label="제거 초안 취소">↶</button></span>`).join('')||'<span class="empty-inline">없음</span>';return `${heading('CHANGE CONTROL','통합 반영 센터','검색 파라미터·프롬프트·청크 초안을 하나의 운영 버전으로 승인하고 언제든 이전 상태로 복구합니다.')}<div class="risk-banner"><b>!</b><span><strong>반영 이력은 AWS 런타임에 영구 저장됩니다.</strong>서버를 재시작해도 초기 운영 상태와 이전 버전의 검색 설정·프롬프트·청크를 복구할 수 있습니다.</span></div><section class="change-review"><article class="panel config-card"><div class="panel-head"><h2>파라미터 ${changes.length}건</h2><button class="icon-danger" data-action="clear-config-draft" ${!changes.length?'disabled':''}>비우기</button></div><dl>${changes.length?pairs(changes.map(([k,v])=>[k,`${d.active_config[k]} → ${v}`])):'<div><dt>변경 없음</dt><dd>—</dd></div>'}</dl></article><article class="panel config-card"><div class="panel-head"><h2>프롬프트 ${prompts.length}건</h2></div><div class="chip-list">${prompts.map(x=>`<span>${esc(x)}</span>`).join('')||'<span class="empty-inline">없음</span>'}</div></article><article class="panel config-card"><div class="panel-head"><h2>청크 추가 ${d.add?.length||0}건</h2></div><div class="chip-list">${added}</div></article><article class="panel config-card"><div class="panel-head"><h2>청크 제거 ${(d.remove||[]).length}건</h2></div><div class="chip-list danger">${removed}</div></article></section><section class="panel apply-panel"><div><span class="section-kicker">FINAL APPROVAL</span><h2>통합 운영 반영</h2><p>확인 문구 <b>운영 반영</b>을 입력하면 검증한 초안이 하나의 버전으로 저장되고 다음 질문부터 적용됩니다.</p></div><input id="apply-confirm" placeholder="운영 반영"><button class="danger-btn" data-action="apply-changes" ${!d.has_changes?'disabled':''}>통합 반영하기</button><button class="secondary-btn" data-action="clear-draft" ${!d.has_changes?'disabled':''}>모든 초안 비우기</button></section><section class="panel jobs-panel"><div class="panel-head"><div><span class="section-kicker">PERSISTENT ROLLBACK</span><h2>통합 반영 이력</h2></div><button class="icon-danger" data-action="clear-history" ${!history.length?'disabled':''}>이력 전체 비우기</button></div>${history.length?history.map(h=>{const s=h.summary||{},pc=(s.prompts||[]).length,cc=Object.keys(s.config||{}).length;return `<div class="history-row"><span><b>${esc(s.label||'이전 운영 상태')} · ${esc(h.version_id)}</b><small>${fmtDate(h.created_at)}</small></span><code>파라미터 ${cc} · 프롬프트 ${pc} · 청크 +${(s.added||[]).length}/-${(s.removed||[]).length}</code><div class="row-actions"><button class="secondary-btn" data-action="rollback" data-id="${attr(h.version_id)}">이 상태로 복구</button><button class="icon-danger" data-action="delete-history" data-id="${attr(h.version_id)}">지우기</button></div></div>`;}).join(''):'<div class="empty-list">첫 운영 반영 시 초기 상태가 자동으로 저장됩니다.</div>'}</section>`;}

function chatCompareCard(label,row,candidate=false){if(!row)return '';return `<article class="panel chat-ab-card ${candidate?'candidate':''}"><div class="panel-head"><div><span class="section-kicker">${candidate?'IMPROVEMENT':'CURRENT'}</span><h2>${esc(label)}</h2></div><span class="env-tag">${Number(row.wall_seconds||0).toFixed(1)}초</span></div>${chatOutput(row,false)}</article>`;}
const chatParameterLabels={dense_weight:'Dense 가중치',bm25_weight:'BM25 가중치',candidate_depth:'후보 깊이',final_top_k:'최종 Top-K',min_relevance_score:'최소 관련성 점수',query_fusion_rrf_k:'RRF K',parent_context_max_chars:'Parent 문맥',parent_child:'Parent-Child'};
function chatDisplayValue(value){return value===true?'사용':value===false?'미사용':String(value);}
function chatConfigEntries(active,candidate){return Object.entries(candidate||{}).filter(([key,value])=>active?.[key]!==value);}
function chatConfigRows(active,candidate,prompts=[]){return chatConfigEntries(active,candidate).map(([key,value])=>'<div><small>'+esc(chatParameterLabels[key]||key)+'</small><b>'+esc(chatDisplayValue(active?.[key]))+' → '+esc(chatDisplayValue(value))+'</b></div>').join('')+(prompts||[]).map(slot=>'<div><small>프롬프트</small><b>'+esc(slot)+' 변경</b></div>').join('');}
function chatChangeDetails(title,active,candidate,prompts=[],open=false){const rows=chatConfigRows(active,candidate,prompts),count=chatConfigEntries(active,candidate).length+(prompts||[]).length;return '<details class="chat-candidate-details"'+(open?' open':'')+'><summary><span>'+esc(title)+'</span><span>'+count+'개 변경</span></summary>'+(rows?'<div class="chat-change-grid">'+rows+'</div>':'<div class="chat-change-empty">현재안과 달라진 파라미터·프롬프트가 없습니다.</div>')+'</details>';}
function chatCandidateConfig(){const draft=state.draft?.candidate_config||state.draft?.active_config||{},evaluated=state.evalResult?.candidate_config;if(state.chatCandidateSource==='custom')return state.chatCustomConfig||{...draft};if(state.chatCandidateSource==='evaluation'&&evaluated)return evaluated;return draft;}
function chatView(){
  const result=state.chatComparison,d=state.draft||{},active=d.active_config||{},promptChanges=d.prompt_changes||[],hasEvaluation=Boolean(state.evalResult?.candidate_config);
  const source=state.chatCandidateSource==='evaluation'&&hasEvaluation?'evaluation':state.chatCandidateSource==='custom'?'custom':'draft';
  const candidate=chatCandidateConfig(),storedCandidate=d.candidate_config||active,storedCount=chatConfigEntries(active,storedCandidate).length;
  const sourceLabel=source==='evaluation'?'최근 검색평가 개선안':source==='custom'?'직접 입력 개선안':'저장된 개선안';
  const options=['<option value="draft"'+(source==='draft'?' selected':'')+'>저장된 개선안</option>',hasEvaluation?'<option value="evaluation"'+(source==='evaluation'?' selected':'')+'>최근 검색평가 개선안</option>':'','<option value="custom"'+(source==='custom'?' selected':'')+'>직접 입력 개선안</option>'].join('');
  const configArea=source==='custom'?'<div style="margin-top:12px">'+configFields(candidate,'chat')+'<div class="button-row chat-draft-actions"><button class="secondary-btn" data-action="save-chat-candidate">현재 입력값을 저장된 개선안으로 저장</button></div></div>':'<div class="ab-change-strip" style="margin-top:10px">'+(chatConfigEntries(active,candidate).length?chatConfigEntries(active,candidate).map(([key])=>'<span>파라미터 · '+esc(chatParameterLabels[key]||key)+'</span>').join(''):'<span>현재안과 같은 파라미터</span>')+promptChanges.map(slot=>'<span>프롬프트 · '+esc(slot)+'</span>').join('')+'</div>';
  const savedDraft='<div class="chat-saved-draft"><div><b>저장된 개선안</b><span>파라미터 화면에서 저장한 초안 · '+storedCount+'개 변경</span></div><button class="secondary-btn" data-action="load-chat-draft">저장된 개선안 사용</button></div>';
  const sourceDescription=source==='evaluation'?' · 최근 검색평가에서 실행한 후보 파라미터를 그대로 사용합니다.':source==='custom'?' · 직접 입력값은 비교 후에도 유지됩니다. 저장하면 다른 화면에서도 재사용할 수 있습니다.':'';
  const buttonLabel=state.chatCompareBusy?'현재안·개선안 생성 중…':'선택한 개선안으로 최종 답변 비교';
  const executedCandidate=result?.candidate_config||state.chatLastCandidate?.config;
  const executedDetails=result&&executedCandidate?chatChangeDetails('이번 답변 비교에 실제 적용된 개선안',active,executedCandidate,result.changed_prompts||promptChanges,true):'';
  const resultArea=result?executedDetails+'<section class="chat-ab-layout">'+chatCompareCard('현재안 챗봇',result.baseline)+chatCompareCard('개선안 챗봇 · '+(result.candidate_source||sourceLabel),result.candidate,true)+'</section><div class="prompt-actions"><button class="primary-btn" data-view="apply">검토 완료 · 반영센터로 이동 →</button></div>':'<section class="panel empty-list">개선안을 선택하고 질문을 실행하면 현재안과 개선안 답변을 나란히 표시합니다.</section>';
  return heading('END-TO-END COMPARISON','최종 챗봇 답변 비교','선택한 개선안과 현재 운영안을 같은 질문으로 실행해 최종 답변을 나란히 확인합니다.')+'<div class="risk-banner"><b>!</b><span><strong>비교 실행 중에는 운영 챗봇 요청이 잠시 대기합니다.</strong>개선 설정이 일반 사용자 답변에 섞이지 않도록 두 실행을 안전하게 격리하기 때문입니다.</span></div><section class="panel chat-compare-compose"><div class="panel-head" style="margin-bottom:10px"><div><span class="section-kicker">IMPROVEMENT SELECTION</span><h2 style="font-size:14px">개선안 선택</h2></div><select id="chat-candidate-source" style="min-width:230px">'+options+'</select></div><p style="margin:0;color:var(--muted);font-size:10px">선택됨: <b>'+esc(sourceLabel)+'</b>'+sourceDescription+'</p>'+savedDraft+configArea+chatChangeDetails('선택한 개선안 변경값 보기',active,candidate,promptChanges)+'<textarea id="chat-question" style="margin-top:14px">'+esc(state.chatQuestion)+'</textarea><div class="button-row"><button class="secondary-btn" data-view="evaluation">검색평가 확인</button><button class="primary-btn" data-action="run-chat-compare" '+(state.chatCompareBusy?'disabled':'')+'>'+buttonLabel+'</button></div></section>'+resultArea;
}
function chatOutput(r,showBasis=true){return `<div class="answer-meta"><span>${esc(r.route)}</span><span>${esc(r.answer_system||'')}</span>${(r.businesses||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="chat-answer">${esc(r.answer||'')}</div>${(r.sources||[]).map(s=>`<div class="source-card"><b>${esc(s.title||'공식 출처')}</b><a href="${attr(s.url||'#')}" target="_blank">${esc(s.url||'')}</a></div>`).join('')}${showBasis?'<button class="secondary-btn" data-action="load-basis">답변 근거 보기</button>':''}${showBasis&&state.chatBasis?`<pre class="json-view">${esc(JSON.stringify(state.chatBasis,null,2))}</pre>`:''}`;}
function durationText(ms){const value=Number(ms)||0;return value>=1000?`${(value/1000).toFixed(1)}초`:`${Math.round(value)}ms`;}
function distributionRows(rows){const max=Math.max(1,...(rows||[]).map(row=>row.count));return (rows||[]).map(row=>`<div class="distribution-row"><b title="${attr(row.name)}">${esc(row.name)}</b><i style="--width:${Math.max(3,row.count/max*100)}%"></i><em>${row.count}</em></div>`).join('')||'<div class="empty-list">집계할 데이터가 없습니다.</div>';}
function cacheBadge(hit){return `<span class="cache-badge ${hit?'hit':''}">${hit?'CACHE HIT':'CACHE MISS'}</span>`;}
function monitoringView(){const data=state.monitoring||{},s=data.summary||{},series=data.timeseries||[],maxQuestions=Math.max(1,...series.map(row=>row.questions));const chart=series.map((row,index)=>{const date=new Date(row.timestamp*1000),label=state.monitorHours<=48?`${String(date.getHours()).padStart(2,'0')}시`:`${date.getMonth()+1}/${date.getDate()}`,show=index===0||index===series.length-1||index%Math.max(1,Math.floor(series.length/6))===0;return `<div class="activity-column" style="--height:${Math.max(2,row.questions/maxQuestions*100)}%"><span>${row.questions||''}</span><i title="${label} · ${row.questions}건 · 실제 ${Number(row.tokens||0).toLocaleString()} 토큰"></i>${show?`<em>${label}</em>`:''}</div>`;}).join('');const recent=(data.recent||[]).map(row=>`<div class="monitor-row"><span>${fmtDate(row.created_at)}</span><span class="question-cell" title="${attr(row.question)}">${esc(row.question)}</span><span>${esc(row.route)}</span><span>${esc((row.businesses||[]).join(', ')||'미분류')}</span>${cacheBadge(row.cache_hit)}<span>${Number(row.total_tokens||0).toLocaleString()}</span><span>${durationText(row.latency_ms)}</span>${statusBadge(row.status)}</div>`).join('')||'<div class="empty-list">최근 질의가 없습니다.</div>';return `${heading('OPERATIONS MONITORING','운영 모니터링','이번 요청에서 실제 사용한 토큰과 체감 응답시간을 집계합니다. 캐시 적중 건은 LLM 호출 없이 조회 시간만 반영합니다.',`<div class="monitor-toolbar"><select id="monitor-hours"><option value="24" ${state.monitorHours===24?'selected':''}>최근 24시간</option><option value="168" ${state.monitorHours===168?'selected':''}>최근 7일</option><option value="720" ${state.monitorHours===720?'selected':''}>최근 30일</option></select><button class="primary-btn" data-action="refresh-monitoring">↻ 다시 집계</button></div>`)}<section class="monitor-grid">${metric('질의 수',Number(s.questions||0).toLocaleString(),`완료 ${s.completed||0} · 실패 ${s.failed||0}`)}${metric('캐시 적중률',pct(s.cache_hit_rate),`HIT ${s.cache_hits||0} · MISS ${s.cache_misses||0}`,'cyan')}${metric('실제 사용 토큰',Number(s.total_tokens||0).toLocaleString(),`캐시로 ${Number(s.cache_saved_tokens||0).toLocaleString()} 토큰 절감`,'purple')}${metric('평균 체감 응답시간',durationText(s.avg_latency_ms),`캐시로 ${durationText(s.cache_saved_latency_ms)} 절감`,'red')}</section><section class="monitor-chart-grid"><article class="panel monitor-card"><span class="section-kicker">QUERY VOLUME</span><h2>시간대별 질의량</h2><p>막대에 마우스를 올리면 요청 수와 실제 사용 토큰을 확인할 수 있습니다.</p><div class="activity-chart">${chart}</div></article><article class="panel monitor-card"><span class="section-kicker">TOKEN & CACHE</span><h2>실제 사용량·캐시 절감</h2><p>캐시 HIT는 이번 요청의 LLM 토큰을 0으로 처리합니다. 원본 생성 비용은 절감 참고값으로만 남깁니다.</p><dl>${pairs([['입력 토큰',Number(s.prompt_tokens||0).toLocaleString()],['출력 토큰',Number(s.completion_tokens||0).toLocaleString()],['캐시 절감 토큰',Number(s.cache_saved_tokens||0).toLocaleString()],['P95 체감 응답시간',durationText(s.p95_latency_ms)]])}</dl></article></section><section class="monitor-subgrid"><article class="panel monitor-card"><span class="section-kicker">ROUTE</span><h2>응답 경로 분포</h2><div class="distribution-list">${distributionRows(data.routes)}</div></article><article class="panel monitor-card"><span class="section-kicker">BUSINESS</span><h2>업무별 질의 분포</h2><div class="distribution-list">${distributionRows(data.businesses)}</div></article></section><section class="panel monitor-card"><div class="panel-head"><div><span class="section-kicker">RECENT QUERIES</span><h2>최근 질의 기록</h2></div><span class="test-badge">최대 30건</span></div><div class="monitor-table"><div class="monitor-row header"><span>시각</span><span>질문</span><span>경로</span><span>업무</span><span>캐시</span><span>이번 토큰</span><span>이번 응답시간</span><span>상태</span></div>${recent}</div><div class="monitor-note">${esc(data.retention_notice||'')} 캐시 HIT는 원본 생성 시간·토큰을 현재 요청 비용으로 중복 집계하지 않습니다.</div></section>`;}
async function refreshMonitoring(){state.monitorHours=num(document.getElementById('monitor-hours')?.value)||state.monitorHours;try{state.monitoring=await api(`/api/admin-ui/monitoring?hours=${state.monitorHours}&limit=500`);render();toast('운영 지표를 다시 집계했습니다.');}catch(e){toast(e.message,true);}}
function jobsView(){return `${heading('JOB AUDIT','챗봇 작업 이력','각 요청의 실제 토큰·체감 응답시간과 캐시 사용 여부를 확인합니다. 캐시 HIT는 이번 요청의 LLM 사용량이 0입니다.')}<section class="panel jobs-panel">${jobsTable(state.jobs)}</section>`;}
function jobsTable(rows){return rows.length?`<div class="job-table detailed"><div class="job-row job-header"><span>Job</span><span>질문</span><span>세션</span><span>상태</span><span>단계</span><span>캐시</span><span>이번 토큰</span><span>이번 응답시간</span><span>진행률</span><span>시작</span></div>${rows.map(j=>{const t=j.telemetry||{};const cache=t.cache_hit?`<span class="cache-cell">${cacheBadge(true)}<small>절감 ${durationText(t.saved_latency_ms)} · ${Number(t.saved_tokens||0).toLocaleString()} 토큰</small></span>`:`<span class="cache-cell">${cacheBadge(false)}<small>실제 LLM 호출</small></span>`;return `<div class="job-row"><b>${esc(String(j.job_id).slice(0,12))}</b><span title="${attr(j.question||'')}">${esc(String(j.question||'').slice(0,28))}</span><span>${esc(String(j.session_id||'').slice(0,10))}</span>${statusBadge(j.status)}<span>${esc(j.stage)}</span>${cache}<span class="request-metric"><b>${Number(t.total_tokens||0).toLocaleString()}</b><small>이번 요청</small></span><span class="request-metric"><b>${durationText(t.request_latency_ms)}</b><small>이번 요청</small></span><span>${j.progress||0}%</span><span>${fmtDate(j.created_at)}</span></div>`;}).join('')}</div><div class="monitor-note">캐시 HIT는 절감 시간·토큰을 행 안에 바로 표시합니다. 이번 토큰과 응답시간은 캐시 조회 요청의 실제 사용량입니다.</div>`:'<div class="empty-list">작업 이력이 없습니다.</div>';}

function render(){const sameView=state.renderedView===state.view,oldMap=root.querySelector('.pipeline-map-wrap'),oldNav=root.querySelector('.sidebar nav');if(oldMap)state.pipelineScroll={left:oldMap.scrollLeft,top:oldMap.scrollTop};if(oldNav)state.sidebarScroll=oldNav.scrollTop;if(sameView)state.pageScroll=window.scrollY;else state.pageScroll=0;const views={dashboard,monitoring:monitoringView,pipeline:pipelineView,guardrails:guardrailsView,prompts:promptsView,runtime:runtimeView,evaluation:evaluationViewV2,data:dataView,keys:keysView,apply:applyViewV2,chat:chatView,jobs:jobsView};root.innerHTML=shell(views[state.view]());state.renderedView=state.view;requestAnimationFrame(()=>{const nav=root.querySelector('.sidebar nav');if(nav)nav.scrollTop=state.sidebarScroll||0;window.scrollTo({top:state.pageScroll||0,left:0,behavior:'auto'});if(state.view==='pipeline'){const map=root.querySelector('.pipeline-map-wrap');if(map){map.scrollLeft=state.pipelineScroll.left||0;map.scrollTop=state.pipelineScroll.top||0;}drawPipelineEdges();}});}
async function refreshAll(silent=false){state.busy=true;render();try{const [summary,config,indices,jobs,monitoring,datasets,evalJobs,draft,keyStatus,prompts,pipelineGraph]=await Promise.all([api('/api/admin-ui/summary'),api('/api/admin-ui/runtime-config'),api('/api/admin-ui/indices'),api('/api/admin-ui/jobs?limit=100'),api(`/api/admin-ui/monitoring?hours=${state.monitorHours}&limit=200`),api('/api/admin-ui/evaluations/datasets'),api('/api/admin-ui/evaluations/jobs'),api('/api/admin-ui/draft'),api('/api/admin-ui/api-keys/status'),api('/api/admin-ui/prompts'),api('/api/admin-ui/pipeline/graph')]);Object.assign(state,{summary,config,indices:indices.items||[],jobs:jobs.items||[],monitoring,datasets:datasets.items||[],evalJobs:evalJobs.items||[],draft,keyStatus,prompts,pipelineGraph});if(!silent)toast('실제 런타임 상태를 새로고침했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}

async function fileBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file);});}
async function uploadDataset(){const file=document.getElementById('dataset-file')?.files?.[0];if(!file)return toast('평가데이터셋 파일을 선택해 주세요.',true);state.busy=true;render();try{const out=await api('/api/admin-ui/evaluations/upload',{method:'POST',body:JSON.stringify({filename:file.name,content_base64:await fileBase64(file)})});state.datasetId=out.dataset_id;await refreshAll(true);toast(`평가 가능 ${out.usable_count}/${out.row_count}문항을 등록했습니다.`);}catch(e){state.busy=false;render();toast(e.message,true);}}

async function runEval(){if(!state.datasetId)return toast('데이터셋을 먼저 선택해 주세요.',true);try{const candidate=readConfig('eval'),policy=validateEvalPolicy(candidate,readEvalPolicy()),diff=evalChangeSummary(candidate),metricKChanged=Object.keys(policy.baseline_metric_ks).some(key=>policy.baseline_metric_ks[key]!==policy.candidate_metric_ks[key]);if(!diff.rank.length&&!metricKChanged)return toast('검색 순위에 적용되는 개선값과 지표 K가 현재안과 같습니다. Dense/BM25 가중치·후보 깊이·최소 관련성 점수 또는 개선안 지표 K를 변경해 주세요.',true);state.evalPolicy=policy;state.evalResult=null;state.evalJob=await api('/api/admin-ui/evaluations/run',{method:'POST',body:JSON.stringify({dataset_id:state.datasetId,candidate,...policy})});render();for(let i=0;i<7200;i++){await sleep(1000);state.evalJob=await api(`/api/admin-ui/evaluations/jobs/${encodeURIComponent(state.evalJob.job_id)}`);if(state.evalJob.status==='done'){state.evalResult=state.evalJob.result;await refreshEvalJobs();render();toast('현재안·개선안 검색평가와 구간 차트 계산이 완료되었습니다.');return;}if(state.evalJob.status==='error'){await refreshEvalJobs();render();return toast(state.evalJob.error,true);}render();}}catch(e){toast(e.message,true);}}

function parseChunkText(text,filename=''){const raw=String(text||'').trim();if(!raw)throw new Error('청크 JSON이 비어 있습니다.');let value;if(filename.toLowerCase().endsWith('.jsonl')){value=raw.split(/\r?\n/).filter(line=>line.trim()).map((line,index)=>{try{return JSON.parse(line);}catch{throw new Error(`JSONL ${index+1}번째 줄을 읽을 수 없습니다.`);}});}else{try{value=JSON.parse(raw);}catch{value=raw.split(/\r?\n/).filter(line=>line.trim()).map((line,index)=>{try{return JSON.parse(line);}catch{throw new Error(`JSON 또는 JSONL 형식이 아닙니다. ${index+1}번째 줄을 확인해 주세요.`);}});}}const chunks=Array.isArray(value)?value:Array.isArray(value?.chunks)?value.chunks:[value];if(!chunks.length)throw new Error('추가할 청크가 없습니다.');if(chunks.length>500)throw new Error('한 번에 최대 500개 청크까지 추가할 수 있습니다.');chunks.forEach((chunk,index)=>{if(!chunk||typeof chunk!=='object'||Array.isArray(chunk))throw new Error(`${index+1}번째 청크가 JSON 객체가 아닙니다.`);});return chunks;}
async function loadChunkFile(file){if(!file)return;try{const text=await file.text(),chunks=parseChunkText(text,file.name),area=document.getElementById('chunk-json'),name=document.querySelector('.chunk-file-name');if(area)area.value=JSON.stringify(chunks.length===1?chunks[0]:chunks,null,2);if(name)name.textContent=`${file.name} · ${chunks.length}개 청크 준비`;toast(`${chunks.length}개 청크를 불러왔습니다. 내용을 확인한 뒤 초안으로 저장하세요.`);}catch(e){toast(e.message,true);}}
function manualChunk(){const value=id=>String(document.getElementById(id)?.value||'').trim();const chunk_id=value('manual-chunk-id'),content=value('manual-chunk-content');if(!chunk_id||!content)throw new Error('직접 입력에서는 청크 ID와 본문이 필요합니다.');const document_id=value('manual-document-id'),parent_doc_id=value('manual-parent-id')||document_id||chunk_id;return {chunk_id,document_id:document_id||parent_doc_id,parent_doc_id,title:value('manual-title'),section_title:value('manual-section-title'),business_function:value('manual-business-function'),content};}

async function rollback(id){if(!confirm(`${id} 이력이 저장한 ‘반영 전 상태’로 복구할까요?`))return;state.busy=true;render();try{await api(`/api/admin-ui/rollback/${encodeURIComponent(id)}`,{method:'POST',body:'{}'});toast('이력이 저장한 반영 전 상태로 복구했습니다.');await refreshAll(true);}catch(e){state.busy=false;render();toast(e.message,true);}}
async function resetDefaults(){const confirmation=prompt('현재 청크·파라미터·프롬프트를 최초 운영 기본값으로 되돌립니다.\n계속하려면 “운영 기본값 초기화”를 입력하세요.');if(confirmation===null)return;if(!confirm('현재 상태는 새 복구 이력으로 보관됩니다. 운영 기본값으로 초기화할까요?'))return;state.busy=true;render();try{const out=await api('/api/admin-ui/reset-defaults',{method:'POST',body:JSON.stringify({confirmation})});toast(`운영 기본값으로 초기화했습니다. ${out.chunk_count}개 청크 상태입니다.`);await refreshAll(true);}catch(e){state.busy=false;render();toast(e.message,true);}}
function decorateApplyView(){if(state.view!=='apply'||root.querySelector('.default-reset-panel'))return;const historyPanel=root.querySelector('.jobs-panel');if(!historyPanel)return;historyPanel.insertAdjacentHTML('beforebegin',`<section class="panel default-reset-panel" style="padding:18px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:16px"><div><span class="section-kicker">OPERATING BASELINE</span><h2 style="margin:5px 0;font-size:14px">운영 기본값 초기화</h2><p style="margin:0;color:var(--muted);font-size:10px;line-height:1.6">최초 운영 기준의 청크·검색 파라미터·프롬프트로 되돌립니다. 현재 상태는 새 복구 이력으로 남습니다. <b>이력 전체 비우기</b>는 현재 운영값을 바꾸지 않고, 되돌릴 수 있는 이력만 삭제합니다.</p></div><button class="danger-btn" data-action="reset-defaults">운영 기본값 초기화</button></section>`);root.querySelectorAll('button[data-action="rollback"]').forEach(button=>{button.textContent='이 이력의 반영 전 상태로 복구';});const clear=root.querySelector('button[data-action="clear-history"]');if(clear)clear.title='현재 운영값은 유지하고, 되돌릴 수 있는 이력만 삭제합니다.';}

async function testKey(){const value=document.getElementById('new-api-key')?.value||'';if(!value)return toast('새 API 키를 입력해 주세요.',true);state.busy=true;render();try{state.keyTest=await api('/api/admin-ui/api-keys/test',{method:'POST',body:JSON.stringify({api_key:value})});toast('임베딩·답변 모델 연결을 확인했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function rotateKey(){const key=document.getElementById('new-api-key')?.value||'',confirmation=document.getElementById('key-confirm')?.value||'';if(!key)return toast('새 API 키를 입력해 주세요.',true);if(!confirm('현재 AWS 챗봇과 다음 systemd 재시작에서 사용할 HCX API 키를 교체할까요?'))return;state.busy=true;render();try{const out=await api('/api/admin-ui/api-keys/rotate',{method:'POST',body:JSON.stringify({api_key:key,confirmation})});state.keyStatus=out;state.keyTest=out.test;toast('AWS HCX API 키와 모든 HCX 클라이언트를 교체했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function saveChatCandidate(){const candidate=readConfig('chat');try{state.draft=await api('/api/admin-ui/draft/config',{method:'PUT',body:JSON.stringify({values:candidate})});state.chatCustomConfig={...candidate};state.chatCandidateSource='draft';state.chatComparison=null;toast('현재 입력값을 저장된 개선안으로 저장했습니다. 반영센터에서 확인할 수 있습니다.');render();}catch(e){toast(e.message,true);}}
function loadChatDraft(){state.chatCandidateSource='draft';state.chatCustomConfig=null;state.chatComparison=null;render();toast('저장된 개선안을 불러왔습니다.');}
async function runChatCompare(){const q=state.chatQuestion.trim();if(!q)return toast('질문을 입력해 주세요.',true);const useEvaluation=state.chatCandidateSource==='evaluation'&&Boolean(state.evalResult?.candidate_config),source=state.chatCandidateSource==='custom'?'직접 입력 개선안':useEvaluation?'최근 검색평가 개선안':'저장된 개선안',candidate=state.chatCandidateSource==='custom'?readConfig('chat'):chatCandidateConfig(),active=state.draft?.active_config||{},hasParameterChange=Object.keys(active).some(key=>active[key]!==candidate[key]),hasPromptChange=(state.draft?.prompt_changes||[]).length>0;if(!hasParameterChange&&!hasPromptChange)return toast('선택한 개선안에 현재안과 다른 파라미터·프롬프트가 없습니다. 다른 개선안을 선택하거나 직접 값을 변경해 주세요.',true);if(state.chatCandidateSource==='custom')state.chatCustomConfig={...candidate};state.chatLastCandidate={config:{...candidate},source};const temporarilySelectCandidate=state.chatCandidateSource!=='draft',savedCandidate={...(state.draft?.candidate_config||active)},savedHasParameterChange=Object.keys(active).some(key=>active[key]!==savedCandidate[key]);state.chatCompareBusy=true;state.chatComparison=null;render();try{if(temporarilySelectCandidate)state.draft=await api('/api/admin-ui/draft/config',{method:'PUT',body:JSON.stringify({values:candidate})});state.chatComparison=await api('/api/admin-ui/chat/compare',{method:'POST',body:JSON.stringify({question:q,candidate_config:candidate,candidate_source:source})});state.chatLastCandidate={config:{...(state.chatComparison.candidate_config||candidate)},source:state.chatComparison.candidate_source||source};toast('현재안과 선택한 개선안의 최종 답변 비교를 완료했습니다.');}catch(e){toast(e.message,true);}finally{if(temporarilySelectCandidate){try{state.draft=savedHasParameterChange?await api('/api/admin-ui/draft/config',{method:'PUT',body:JSON.stringify({values:savedCandidate})}):await api('/api/admin-ui/draft/config',{method:'DELETE'});}catch(e){toast('비교 전 개선안 복원에 실패했습니다. 파라미터 화면에서 확인해 주세요.',true);}}state.chatCompareBusy=false;render();}}
