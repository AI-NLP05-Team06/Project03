t>p,.guardrail-apply>p{margin:0 0 12px;color:var(--muted);font-size:9px;line-height:1.6}.guardrail-test textarea{width:100%;min-height:100px;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font:10px/1.6 inherit;resize:vertical}.guardrail-test .button-row{margin-top:9px}.guardrail-test .button-row select{flex:1}.guardrail-test-result{margin-top:12px;padding:12px;border-radius:9px;background:#e8f8f1;color:#13865c}.guardrail-test-result.blocked{background:#fff0f1;color:#c53e4a}.guardrail-test-result strong{font-size:10px}.guardrail-test-result p{padding:8px;margin:7px 0;background:var(--panel);border-radius:7px;color:var(--ink);font-size:9px;white-space:pre-wrap}.guardrail-test-result div{display:flex;flex-wrap:wrap;gap:5px}.guardrail-test-result span{font-size:7px;padding:4px 6px;border:1px solid currentColor;border-radius:99px}.guardrail-apply{display:grid;gap:8px}.guardrail-history>.panel-head{margin-bottom:7px}.guardrail-history>div:not(.panel-head):not(.empty-list){display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.guardrail-history b,.guardrail-history small{display:block;font-size:8px}.guardrail-history small{margin-top:3px;color:var(--muted)}.guardrail-history .empty-list{min-height:90px}

<body>
  <noscript>관리자 콘솔을 사용하려면 JavaScript를 허용해 주세요.</noscript>
  <div id="app"><div class="boot-screen"><div class="boot-logo">K</div><h1>KDIC RAG 관리자</h1><p>최종 챗봇 런타임에 연결하고 있습니다.</p></div></div>
  <script>
(function(){
'use strict';
const root=document.getElementById('app');
const state={view:'dashboard',dark:localStorage.getItem('kdic-admin-theme')==='dark',summary:null,config:null,capabilities:null,indices:[],jobs:[],index:'',query:'',hits:[],hitTotal:0,document:null,busy:false,chatJob:null,chatResult:null,chatBasis:null,chatQuestion:'예금보험금 신청과 착오송금 반환지원 신청은 어떻게 다른가요?',sessionId:`admin-${crypto.randomUUID?.()||Date.now()}`,datasets:[],datasetId:'',evalJobs:[],evalJob:null,evalResult:null,evalPolicy:{evaluation_depth:20,metric_ks:{hit:3,recall:5,mrr:10,map:10,complete:5,ndcg:5,precision:5,f1:5},curve_ks:[1,3,5,10,20]},draft:null,keyStatus:null,keyTest:null,pipelineGraph:null,pipelineNode:null,pipelineSource:null,guardrails:null,guardrailTest:null};
const navItems=[['dashboard','▦','대시보드','운영 상태'],['pipeline','⌘','파이프라인','흐름·코드 조회'],['guardrails','◈','가드레일','금칙어·PII 관리'],['runtime','◇','파라미터','A/B 후보 설정'],['evaluation','◫','검색 A/B 평가','데이터셋 일괄 평가'],['data','▤','청크 관리','조회·추가·제거'],['keys','◆','API 키','검증·교체'],['apply','✓','반영 센터','승인·롤백'],['chat','◉','챗봇 테스트','실제 전체 파이프라인'],['jobs','↻','작업 이력','챗봇 Job']];
const metricNames={hit:'Hit',recall:'Recall',mrr:'MRR',map:'MAP',complete:'Complete',ndcg:'nDCG',precision:'Precision',f1:'F1'};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const attr=v=>esc(v).replace(/`/g,'&#96;');
const num=v=>Number(String(v??0).replace(/,/g,''))||0;
const fmtDate=v=>v?new Date(Number(v)*1000).toLocaleString('ko-KR'):'—';
const pct=v=>v==null?'—':`${(Number(v)*100).toFixed(1)}%`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(path,options={}){const headers={...(options.headers||{})};if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const res=await fetch(path,{credentials:'include',...options,headers});const type=res.headers.get('content-type')||'';const out=type.includes('json')?await res.json():await res.text();if(!res.ok){const error=new Error(typeof out==='object'?(out.detail||JSON.stringify(out)):out);error.status=res.status;throw error;}return out;}
function toast(message,error=false){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className=`toast${error?' error':''}`;el.innerHTML=`<b>${error?'!':'✓'}</b>${esc(message)}`;document.body.appendChild(el);setTimeout(()=>el.remove(),4200);}
function statusBadge(status){const k=String(status||'UNKNOWN').toUpperCase();const map={DONE:['SUCCEEDED','완료'],RUNNING:['RUNNING','처리 중'],ERROR:['FAILED','오류'],FAILED:['FAILED','오류'],ACTIVE:['ACTIVE','정상'],STAGED_WRITE:['RUNNING','초안-승인'],QUEUED:['QUEUED','대기']};const [c,l]=map[k]||['INACTIVE',k];return `<span class="status status-${c.toLowerCase()}"><i></i>${l}</span>`;}
const heading=(e,t,d,a='')=>`<div class="page-heading"><div><span>${e}</span><h1>${t}</h1><p>${d}</p></div>${a}</div>`;
const metric=(l,v,d,t='blue')=>`<article class="metric metric-${t}"><div class="metric-top"><span>${l}</span><b>↗</b></div><strong>${esc(v)}</strong><small>${esc(d)}</small></article>`;
function pairs(rows){return rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v??'—')}</dd></div>`).join('');}
function evalPolicyFields(policy=state.evalPolicy){const m=policy.metric_ks||{};return `<div class="eval-policy"><div class="policy-head"><div><span class="section-kicker">EVALUATION DEPTH</span><h3>답변 Top-K와 분리된 평가 기준</h3><p>답변에는 최종 Top-K만 전달하고, 검색 평가는 아래 깊이까지 순위를 저장합니다.</p></div><button class="secondary-btn" data-action="reset-eval-policy">표준 지표 복원</button></div><div class="form-grid policy-grid"><label><span>평가 검색 깊이</span><input id="eval-depth" type="number" min="1" max="200" value="${attr(policy.evaluation_depth||20)}"><small>모든 지표 K 이상</small></label>${Object.keys(metricNames).map(name=>`<label><span>${metricNames[name]} K</span><input id="metric-${name}" type="number" min="1" max="200" value="${attr(m[name])}"></label>`).join('')}<label class="curve-input"><span>구간 차트 K</span><input id="curve-ks" value="${attr((policy.curve_ks||[]).join(', '))}" placeholder="1, 3, 5, 10, 20"><small>쉼표로 구분</small></label></div></div>`;}
function readEvalPolicy(){const metric_ks={};Object.keys(metricNames).forEach(name=>metric_ks[name]=num(document.getElementById(`metric-${name}`)?.value));const curve_ks=String(document.getElementById('curve-ks')?.value||'').split(',').map(num).filter(Boolean);return {evaluation_depth:num(document.getElementById('eval-depth')?.value),metric_ks,curve_ks:[...new Set(curve_ks)].sort((a,b)=>a-b)};}
function validateEvalPolicy(candidate,policy){const allK=[...Object.values(policy.metric_ks),...policy.curve_ks],required=Math.max(...allK);if(!policy.evaluation_depth||policy.evaluation_depth<required)throw new Error(`평가 검색 깊이는 최소 ${required}이어야 합니다.`);const active=state.draft?.active_config||{};const limit=Math.min(num(active.candidate_depth)||200,num(candidate.candidate_depth)||200);if(policy.evaluation_depth>limit)throw new Error(`평가 검색 깊이는 A/B 후보 깊이의 최솟값 ${limit} 이하여야 합니다.`);return policy;}
function metricDefinitions(result){return result.metric_definitions||[{name:'hit',label:'Hit',k:3,key:'hit_at_3'},{name:'recall',label:'Recall',k:5,key:'recall_at_5'},{name:'mrr',label:'MRR',k:10,key:'mrr_at_10'},{name:'map',label:'MAP',k:10,key:'map_at_10'},{name:'complete',label:'Complete',k:5,key:'complete_at_5'},{name:'ndcg',label:'nDCG',k:5,key:'ndcg_at_5'},{name:'precision',label:'Precision',k:5,key:'precision_at_5'},{name:'f1',label:'F1',k:5,key:'f1_at_5'}];}
function metricBarChart(result){const defs=metricDefinitions(result),b=result.baseline,c=result.candidate;return `<div class="chart-card"><div class="chart-title"><div><span class="section-kicker">METRIC COMPARISON</span><h3>A/B 지표 비교</h3></div><div class="chart-legend"><span><i class="legend-a"></i>A 운영</span><span><i class="legend-b"></i>B 후보</span></div></div><div class="bar-chart">${defs.map(d=>{const av=Number(b[d.key]||0),bv=Number(c[d.key]||0);return `<div class="bar-row"><b>${d.label}@${d.k}</b><div class="bar-pair"><span class="bar-a" style="--bar:${Math.max(0,av)*100}%"><i></i><em>${pct(av)}</em></span><span class="bar-b" style="--bar:${Math.max(0,bv)*100}%"><i></i><em>${pct(bv)}</em></span></div></div>`;}).join('')}</div></div>`;}
function curveChart(result){const curveA=result.baseline.curve||{},curveB=result.candidate.curve||{},ks=(result.evaluation_policy?.curve_ks||Object.keys(curveA).map(Number)).map(Number);if(!ks.length)return'';const width=720,height=250,left=52,right=22,top=24,bottom=42,x=i=>left+(width-left-right)*(ks.length===1?.5:i/(ks.length-1)),y=v=>top+(height-top-bottom)*(1-Math.max(0,Math.min(1,Number(v)||0))),path=(curve,key)=>ks.map((k,i)=>`${i?'L':'M'} ${x(i).toFixed(1)} ${y(curve[String(k)]?.[key]).toFixed(1)}`).join(' '),dots=(curve,key,cls)=>ks.map((k,i)=>`<circle class="${cls}" cx="${x(i)}" cy="${y(curve[String(k)]?.[key])}" r="4"><title>${key} @${k}: ${pct(curve[String(k)]?.[key])}</title></circle>`).join('');return `<div class="chart-card"><div class="chart-title"><div><span class="section-kicker">K CURVE</span><h3>Recall@K 증가 곡선</h3></div><div class="chart-legend"><span><i class="legend-a"></i>A 운영</span><span><i class="legend-b"></i>B 후보</span></div></div><svg class="curve-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="K 구간별 Recall 비교"><g class="chart-grid">${[0,.25,.5,.75,1].map(v=>`<line x1="${left}" y1="${y(v)}" x2="${width-right}" y2="${y(v)}"></line><text x="${left-10}" y="${y(v)+4}">${Math.round(v*100)}%</text>`).join('')}</g><path class="curve-a" d="${path(curveA,'recall')}"></path><path class="curve-b" d="${path(curveB,'recall')}"></path>${dots(curveA,'recall','dot-a')}${dots(curveB,'recall','dot-b')}${ks.map((k,i)=>`<text class="x-label" x="${x(i)}" y="${height-14}">@${k}</text>`).join('')}</svg></div>`;}

async function bootstrap(){try{const [summary,config,capabilities,indices,jobs,datasets,evalJobs,draft,keyStatus,pipelineGraph,guardrails]=await Promise.all([api('/api/admin-ui/summary'),api('/api/admin-ui/runtime-config'),api('/api/admin-ui/capabilities'),api('/api/admin-ui/indices'),api('/api/admin-ui/jobs?limit=100'),api('/api/admin-ui/evaluations/datasets'),api('/api/admin-ui/evaluations/jobs'),api('/api/admin-ui/draft'),api('/api/admin-ui/api-keys/status'),api('/api/admin-ui/pipeline/graph'),api('/api/admin-ui/guardrails')]);Object.assign(state,{summary,config,capabilities,indices:indices.items||[],jobs:jobs.items||[],datasets:datasets.items||[],evalJobs:evalJobs.items||[],draft,keyStatus,pipelineGraph,guardrails});state.index=pickIndex(state.indices);state.datasetId=state.datasets.at(-1)?.dataset_id||'';render();if(state.index)await searchIndex(false);}catch(error){if(error.status===401)return renderLogin();root.innerHTML=`<section class="panel connection-error"><div class="boot-logo">!</div><h1>AWS 관리자 API에 연결하지 못했습니다.</h1><p>${esc(error.message)}</p><ul><li>KDIC FastAPI 서비스 상태를 확인하세요.</li><li>Elasticsearch·PostgreSQL 내부 연결을 확인하세요.</li></ul></section>`;}}
function renderLogin(message=''){root.innerHTML=`<main class="admin-login"><section class="panel login-card"><div class="brand-mark">K</div><span class="section-kicker">KDIC AWS ADMIN</span><h1>관리자 접속</h1><p>AWS 서버의 관리자 토큰으로 인증하면 8시간 보안 세션이 설정됩니다.</p>${message?`<div class="login-error">${esc(message)}</div>`:''}<label><span>관리자 토큰</span><input id="admin-token" type="password" autocomplete="current-password" placeholder="KDIC_ADMIN_TOKEN"></label><button class="primary-btn" data-action="login">보안 세션으로 접속</button><small>토큰은 브라우저 저장소에 보관하지 않습니다.</small></section></main>`;document.getElementById('admin-token')?.focus();}
async function login(){const input=document.getElementById('admin-token');const admin_token=input?.value||'';if(!admin_token)return renderLogin('관리자 토큰을 입력해 주세요.');try{await api('/api/admin-ui/login',{method:'POST',body:JSON.stringify({admin_token})});if(input)input.value='';await bootstrap();}catch(error){renderLogin(error.message);}}
function pickIndex(rows){return String((rows.find(r=>String(r.index).includes('kdic'))||rows[0]||{}).index||'');}
function shell(content){const nav=navItems.map(([id,icon,label,cap])=>`<button class="nav-item ${state.view===id?'active':''}" data-view="${id}"><span class="nav-icon">${icon}</span><span><b>${label}</b><small>${cap}</small></span></button>`).join('');const label=navItems.find(x=>x[0]===state.view)?.[2]||'';const es=state.summary?.elasticsearch||{};const draftCount=(state.draft?.add?.length||0)+(state.draft?.remove?.length||0)+Object.keys(state.draft?.candidate_config||{}).filter(k=>state.draft?.active_config?.[k]!==state.draft?.candidate_config?.[k]).length;return `<div class="admin-app ${state.dark?'dark':''}"><aside class="sidebar"><div class="brand"><div class="brand-mark">K</div><div><strong>KDIC RAG</strong><span>LIVE ADMIN</span></div></div><nav><p class="nav-label">OPERATIONS</p>${nav}</nav><div class="sidebar-config"><p>운영 변경 정책</p><strong>Draft → Evaluate → Apply</strong><span>초안 ${draftCount}건</span><span>즉시 롤백 지원</span>${statusBadge('STAGED_WRITE')}</div><div class="profile"><div class="avatar">관</div><div><strong>관리자 세션</strong><span>HttpOnly Cookie</span></div><button data-action="logout">↪</button></div></aside><main class="main"><header class="topbar"><div><span class="crumb">KDIC Final Admin /</span><strong>${label}</strong></div><div class="system-pills"><span><i class="green-dot live-dot"></i> 챗봇 연결</span><span><i class="green-dot"></i> ES ${es.connected?'연결':'미연결'}</span><button data-action="refresh">↻</button><button data-action="theme">${state.dark?'☀':'☾'}</button></div></header><div class="content ${state.busy?'refreshing':''}">${content}</div><footer><span>관리 모드 <b>STAGED_WRITE</b></span><span>HCX 키 브라우저 미노출</span><span>승인 시 같은 런타임에 반영</span></footer></main></div>`;}

function dashboard(){const es=state.summary?.elasticsearch||{},docs=state.indices.reduce((s,r)=>s+num(r['docs.count']),0),draft=state.draft||{};return `${heading('LIVE OVERVIEW','챗봇 운영 관리자','검색 평가와 변경 승인을 같은 최종 챗봇 런타임에서 관리합니다.','<button class="primary-btn" data-action="refresh">↻ 상태 새로고침</button>')}<div class="risk-banner"><b>i</b><span><strong>운영 데이터는 단계적으로 변경됩니다.</strong>초안은 챗봇에 영향을 주지 않으며, A/B 확인 뒤 ‘운영 반영’을 승인해야 다음 질문부터 적용됩니다.</span></div><section class="metric-grid">${metric('활성 청크',docs.toLocaleString(),`${state.indices.length}개 인덱스`)}${metric('평가데이터셋',state.datasets.length,'현재 런타임 업로드','purple')}${metric('대기 변경',(draft.add?.length||0)+(draft.remove?.length||0),`추가 ${draft.add?.length||0} · 제거 ${draft.remove?.length||0}`,'cyan')}${metric('Elasticsearch',es.connected?String(es.status||'connected'):'연결 실패',es.version?`v${es.version}`:'설정 확인','red')}</section><section class="dashboard-grid"><article class="panel quality-panel"><div class="panel-head"><div><span class="section-kicker">CHANGE FLOW</span><h2>안전한 운영 반영 흐름</h2></div><button data-view="apply">반영 센터 →</button></div><div class="quality-row"><div><span>1단계</span><strong>초안</strong><small>파라미터·청크</small></div><div><span>2단계</span><strong>A/B</strong><small>Gold 검색평가</small></div><div><span>3단계</span><strong>승인</strong><small>운영 반영</small></div><div><span>4단계</span><strong>Rollback</strong><small>이전 상태 복구</small></div></div></article><article class="panel config-panel"><div class="panel-head"><div><span class="section-kicker">SAME RUNTIME</span><h2>챗봇 연동 상태</h2></div>${statusBadge(es.connected?'ACTIVE':'FAILED')}</div><dl>${pairs([['검색 인덱스',state.index||'—'],['답변 API',state.summary?.pipeline?.configured?'연결':'미연결'],['변경 방식','초안 승인'],['적용 시점','다음 질문부터']])}</dl></article></section>`;}

const pipelineLanes=[
  ['input','질문·대화',['question','controller']],
  ['analysis','질의 분석',['context','analysis','route']],
  ['retrieval','검색·근거',['direct','hybrid','reranker','parent_child','evidence']],
  ['answer','답변 생성',['answer_c','answer_dc']],
  ['output','검증·출력',['validation','response']],
];
function pipelineNodeCard(node){const selected=state.pipelineNode?.id===node.id,source=node.source||{};return `<button class="pipeline-node ${selected?'selected':''} ${node.enabled?'':'disabled'}" data-action="select-pipeline-node" data-id="${attr(node.id)}" data-node-id="${attr(node.id)}"><span class="node-stage">${esc(node.stage)}</span><strong>${esc(node.label)}</strong><small>${esc(node.description)}</small><span class="node-meta">${node.code_available?`<b>코드</b> ${esc(source.file||'')} · L${source.line_start}`:'설명 노드'}${node.enabled?'':' · 비활성'}</span></button>`;}
function pipelineSourcePanel(){const node=state.pipelineNode,source=state.pipelineSource;if(!node)return `<aside class="panel pipeline-inspector empty-inspector"><div class="inspector-empty-icon">⌘</div><h2>노드를 선택하세요</h2><p>플로우차트의 노드를 누르면 현재 AWS 챗봇이 실제로 불러온 함수와 코드를 확인할 수 있습니다.</p></aside>`;if(!source)return `<aside class="panel pipeline-inspector"><div class="inspector-head"><div><span class="section-kicker">NODE DETAILS</span><h2>${esc(node.label)}</h2></div><span class="readonly-tag">읽기 전용</span></div><p class="inspector-description">${esc(node.description)}</p><div class="virtual-node-note">이 노드는 사용자 입력·분기·출력처럼 여러 함수가 만나는 개념 단계입니다. 직접 연결된 단일 함수 코드는 없습니다.</div></aside>`;const lines=String(source.source||'').replace(/\r/g,'').split('\n');return `<aside class="panel pipeline-inspector"><div class="inspector-head"><div><span class="section-kicker">LIVE SOURCE</span><h2>${esc(node.label)}</h2></div><span class="readonly-tag">읽기 전용</span></div><p class="inspector-description">${esc(node.description)}</p><dl class="source-meta">${pairs([['파일',source.file],['함수',source.symbol],['모듈',source.module],['줄',`${source.line_start}–${source.line_end}`],['코드 해시',source.source_hash]])}</dl><div class="signature-box"><span>함수 입력</span><code>${esc(source.symbol)}${esc(source.signature)}</code></div><div class="source-code" role="region" aria-label="${attr(node.label)} 소스 코드">${lines.map((line,index)=>`<div><span>${source.line_start+index}</span><code>${esc(line)||' '}</code></div>`).join('')}</div></aside>`;}
function pipelineView(){const graph=state.pipelineGraph;if(!graph)return `${heading('PIPELINE STUDIO','동적 파이프라인','현재 챗봇 런타임 구조를 불러오고 있습니다.')}<section class="panel empty-list">파이프라인 정보를 불러오는 중입니다.</section>`;const byId=Object.fromEntries((graph.nodes||[]).map(node=>[node.id,node]));const lanes=pipelineLanes.map(([id,label,ids])=>`<section class="pipeline-lane lane-${id}"><header><span>${label}</span><small>${ids.filter(nodeId=>byId[nodeId]).length}단계</small></header><div>${ids.map(nodeId=>byId[nodeId]?pipelineNodeCard(byId[nodeId]):'').join('')}</div></section>`).join('');return `${heading('PIPELINE STUDIO','동적 플로우차트 + 코드 조회','현재 AWS 챗봇에 로드된 함수만 추적합니다. 노드를 누르면 해당 단계의 실제 코드를 읽기 전용으로 확인할 수 있습니다.','<button class="secondary-btn" data-action="refresh-pipeline">↻ 런타임 다시 읽기</button>')}<div class="pipeline-runtime-strip"><span><b>런타임</b>${esc(graph.pipeline_name)}</span><span><b>인식 방식</b>${graph.mode==='RUNTIME_REGISTRY'?'파이프라인 Registry':'실행 함수 자동 탐색'}</span><span><b>구조 해시</b><code>${esc(graph.fingerprint)}</code></span><span class="readonly-tag">코드 변경 없음</span></div><section class="pipeline-workspace"><div class="panel pipeline-map-wrap"><div class="pipeline-map" id="pipeline-map"><svg class="pipeline-edges" id="pipeline-edges" aria-hidden="true"></svg>${lanes}</div><div class="pipeline-map-legend"><span><i class="legend-analysis"></i>질의 분석</span><span><i class="legend-retrieval"></i>검색·근거</span><span><i class="legend-answer"></i>답변</span><span>점선 노드: 현재 설정에서 비활성</span></div></div>${pipelineSourcePanel()}</section>`;}
function drawPipelineEdges(){if(state.view!=='pipeline'||!state.pipelineGraph)return;const map=document.getElementById('pipeline-map'),svg=document.getElementById('pipeline-edges');if(!map||!svg)return;const box=map.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);svg.innerHTML=`<defs><marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker></defs>`;(state.pipelineGraph.edges||[]).forEach(edge=>{const from=map.querySelector(`[data-node-id="${CSS.escape(edge.source)}"]`),to=map.querySelector(`[data-node-id="${CSS.escape(edge.target)}"]`);if(!from||!to)return;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),x1=a.right-box.left,y1=a.top+a.height/2-box.top,x2=b.left-box.left,y2=b.top+b.height/2-box.top,dx=Math.max(26,(x2-x1)*.45);const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);path.setAttribute('marker-end','url(#pipeline-arrow)');const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=edge.label||'';path.appendChild(title);svg.appendChild(path);});}

function guardrailsView(){const data=state.guardrails||{active_rules:[],draft_rules:[],history:[]},active=data.active_rules||[],draft=data.draft_rules||[],changed=JSON.stringify(active)!==JSON.stringify(draft),test=state.guardrailTest;return `${heading('SAFETY POLICY','가드레일 관리','금칙어와 개인정보 마스킹 규칙을 먼저 시험한 뒤 실제 챗봇 입력·출력에 반영합니다.','<button class="secondary-btn" data-action="refresh-guardrails">↻ 다시 읽기</button>')}<div class="risk-banner"><b>!</b><span><strong>원문 개인정보는 평가·로그에 저장되기 전에 처리됩니다.</strong>차단 규칙은 질문 자체를 전송하지 않고, 마스킹 규칙은 지정 문구로 바꾼 뒤 검색과 답변을 실행합니다.</span></div><section class="guardrail-summary">${metric('운영 규칙',active.filter(r=>r.enabled).length,`${active.length}개 중 활성`)}${metric('마스킹',active.filter(r=>r.enabled&&r.action==='mask').length,'PII·민감정보','purple')}${metric('차단',active.filter(r=>r.enabled&&r.action==='block').length,'모델 호출 전 차단','red')}${metric('운영 버전',data.active_version||'—',changed?'초안 변경 있음':'초안과 동일','cyan')}</section><section class="guardrail-layout"><div><article class="panel guardrail-editor"><div class="panel-head"><div><span class="section-kicker">DRAFT RULES</span><h2>규칙 초안</h2></div><div class="button-row"><button class="secondary-btn" data-action="add-guardrail">+ 규칙 추가</button><button class="secondary-btn" data-action="clear-guardrail-draft" ${!changed?'disabled':''}>초안 되돌리기</button><button class="primary-btn" data-action="save-guardrail-draft">초안 저장</button></div></div><div class="guardrail-rules">${draft.map(guardrailRuleRow).join('')||'<div class="empty-list">등록된 규칙이 없습니다.</div>'}</div></article></div><aside><article class="panel guardrail-test"><span class="section-kicker">SAFE TEST</span><h2>규칙 미리 시험하기</h2><p>저장된 초안 기준으로만 실행되며 챗봇에는 영향을 주지 않습니다.</p><textarea id="guardrail-test-text" placeholder="테스트할 문장을 입력하세요">${esc(test?.original||'제 전화번호는 010-1234-5678입니다.')}</textarea><div class="button-row"><select id="guardrail-test-scope"><option value="input">질문 입력</option><option value="output">답변 출력</option></select><button class="secondary-btn" data-action="test-guardrails">탐지 결과 보기</button></div>${test?`<div class="guardrail-test-result ${test.blocked?'blocked':''}"><strong>${test.blocked?'전송 차단':'통과·마스킹 완료'}</strong><p>${esc(test.text)}</p><div>${(test.hits||[]).map(hit=>`<span>${esc(hit.name)} · ${hit.action}</span>`).join('')||'<span>탐지 규칙 없음</span>'}</div></div>`:''}</article><article class="panel guardrail-apply"><span class="section-kicker">APPLY</span><h2>운영 반영</h2><p>초안 저장 후 확인 문구를 입력하면 다음 질문부터 적용됩니다.</p><input id="guardrail-confirm" placeholder="가드레일 반영"><button class="danger-btn" data-action="apply-guardrails" ${!changed?'disabled':''}>가드레일 반영</button></article><article class="panel guardrail-history"><div class="panel-head"><h2>이전 버전</h2></div>${(data.history||[]).slice().reverse().map(row=>`<div><span><b>${esc(row.version)}</b><small>${new Date(Number(row.archived_at)*1000).toLocaleString('ko-KR')}</small></span><button class="secondary-btn" data-action="rollback-guardrails" data-id="${attr(row.version)}">복구</button></div>`).join('')||'<div class="empty-list">이전 버전이 없습니다.</div>'}</article></aside></section>`;}

><div class="panel-head"><div><span class="section-kicker">ROLLBACK</span><h2>반영 이력</h2></div><button class="icon-danger" data-action="clear-history" ${!history.length?'disabled':''}>이력 전체 비우기</button></div>${history.length?history.map(h=>`<div class="history-row"><span><b>${esc(h.version_id)}</b><small>${fmtDate(h.created_at)}</small></span><code>+${h.summary.added.length} / -${h.summary.removed.length}</code><div class="row-actions"><button class="secondary-btn" data-action="rollback" data-id="${attr(h.version_id)}">반영 전으로 복구</button><button class="icon-danger" data-action="delete-history" data-id="${attr(h.version_id)}">지우기</button></div></div>`).join(''):'<div class="empty-list">아직 반영 이력이 없습니다.</div>'}</section>`;}

function chatView(){const job=state.chatJob,result=state.chatResult,progress=job?`<div class="chat-progress"><span><b>${esc(job.stage||'처리 중')}</b><strong>${job.progress||0}%</strong></span><i><em style="width:${job.progress||0}%"></em></i></div>`:'';return `${heading('END-TO-END TEST','실제 챗봇 통합 테스트','반영 전후 실제 질의분석·검색·답변 파이프라인을 확인합니다.')}<section class="chat-test"><article class="panel chat-compose"><textarea id="chat-question">${esc(state.chatQuestion)}</textarea><button class="primary-btn" data-action="run-chat">최종 챗봇 실행</button>${progress}</article><article class="panel chat-result">${result?chatOutput(result):'<div class="empty-list">질문을 실행하면 결과가 표시됩니다.</div>'}</article></section>`;}
function chatOutput(r){return `<div class="answer-meta"><span>${esc(r.route)}</span>${(r.businesses||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="chat-answer">${esc(r.answer||'')}</div>${(r.sources||[]).map(s=>`<div class="source-card"><b>${esc(s.title||'공식 출처')}</b><a href="${attr(s.url||'#')}" target="_blank">${esc(s.url||'')}</a></div>`).join('')}<button class="secondary-btn" data-action="load-basis">답변 근거 보기</button>${state.chatBasis?`<pre class="json-view">${esc(JSON.stringify(state.chatBasis,null,2))}</pre>`:''}`;}
function jobsView(){return `${heading('JOB AUDIT','챗봇 작업 이력','현재 런타임의 실제 Job 상태입니다.')}<section class="panel jobs-panel">${jobsTable(state.jobs)}</section>`;}
function jobsTable(rows){return rows.length?`<div class="job-table detailed"><div class="job-row job-header"><span>Job</span><span>질문</span><span>세션</span><span>상태</span><span>단계</span><span>진행률</span><span>시작</span></div>${rows.map(j=>`<div class="job-row"><b>${esc(String(j.job_id).slice(0,12))}</b><span>${esc(String(j.question||'').slice(0,28))}</span><span>${esc(String(j.session_id||'').slice(0,10))}</span>${statusBadge(j.status)}<span>${esc(j.stage)}</span><span>${j.progress||0}%</span><span>${fmtDate(j.created_at)}</span></div>`).join('')}</div>`:'<div class="empty-list">작업 이력이 없습니다.</div>';}

function render(){const views={dashboard,pipeline:pipelineView,guardrails:guardrailsView,runtime:runtimeView,evaluation:evaluationViewV2,data:dataView,keys:keysView,apply:applyViewV2,chat:chatView,jobs:jobsView};root.innerHTML=shell(views[state.view]());if(state.view==='pipeline')requestAnimationFrame(drawPipelineEdges);}
async function refreshAll(silent=false){state.busy=true;render();try{const [summary,config,indices,jobs,datasets,evalJobs,draft,keyStatus]=await Promise.all([api('/api/admin-ui/summary'),api('/api/admin-ui/runtime-config'),api('/api/admin-ui/indices'),api('/api/admin-ui/jobs?limit=100'),api('/api/admin-ui/evaluations/datasets'),api('/api/admin-ui/evaluations/jobs'),api('/api/admin-ui/draft'),api('/api/admin-ui/api-keys/status')]);Object.assign(state,{summary,config,indices:indices.items||[],jobs:jobs.items||[],datasets:datasets.items||[],evalJobs:evalJobs.items||[],draft,keyStatus});if(!silent)toast('실제 런타임 상태를 새로고침했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function searchIndex(notify=true){if(!state.index)return;state.busy=true;render();try{const out=await api('/api/admin-ui/search',{method:'POST',body:JSON.stringify({index:state.index,query:state.query,size:40,offset:0})});state.hits=out.items||[];state.hitTotal=out.total||0;state.document=null;if(notify)toast(`${state.hitTotal}건을 찾았습니다.`);}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function loadDocument(id){try{state.document=await api(`/api/admin-ui/documents/${encodeURIComponent(state.index)}/${encodeURIComponent(id)}`);render();}catch(e){toast(e.message,true);}}
async function fileBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file);});}
async function uploadDataset(){const file=document.getElementById('dataset-file')?.files?.[0];if(!file)return toast('평가데이터셋 파일을 선택해 주세요.',true);state.busy=true;render();try{const out=await api('/api/admin-ui/evaluations/upload',{method:'POST',body:JSON.stringify({filename:file.name,content_base64:await fileBase64(file)})});state.datasetId=out.dataset_id;await refreshAll(true);toast(`평가 가능 ${out.usable_count}/${out.row_count}문항을 등록했습니다.`);}catch(e){state.busy=false;render();toast(e.message,true);}}
async function saveConfig(){try{state.draft=await api('/api/admin-ui/draft/config',{method:'PUT',body:JSON.stringify({values:readConfig('draft')})});render();toast('후보 파라미터를 초안으로 저장했습니다.');}catch(e){toast(e.message,true);}}
async function runEval(){if(!state.datasetId)return toast('데이터셋을 먼저 선택해 주세요.',true);try{const candidate=readConfig('eval'),policy=validateEvalPolicy(candidate,readEvalPolicy());state.evalPolicy=policy;state.evalResult=null;state.evalJob=await api('/api/admin-ui/evaluations/run',{method:'POST',body:JSON.stringify({dataset_id:state.datasetId,candidate,...policy})});render();for(let i=0;i<7200;i++){await sleep(1000);state.evalJob=await api(`/api/admin-ui/evaluations/jobs/${encodeURIComponent(state.evalJob.job_id)}`);if(state.evalJob.status==='done'){state.evalResult=state.evalJob.result;await refreshEvalJobs();render();toast('A/B 검색평가와 구간 차트 계산이 완료되었습니다.');return;}if(state.evalJob.status==='error'){await refreshEvalJobs();render();return toast(state.evalJob.error,true);}render();}}catch(e){toast(e.message,true);}}
async function refreshEvalJobs(){const out=await api('/api/admin-ui/evaluations/jobs');state.evalJobs=out.items||[];}
async function openEvalJob(id){try{const job=await api(`/api/admin-ui/evaluations/jobs/${encodeURIComponent(id)}`);if(job.status!=='done'||!job.result)return toast('완료된 평가 결과가 없습니다.',true);state.evalJob=job;state.evalResult=job.result;state.evalPolicy=job.result.evaluation_policy||state.evalPolicy;render();}catch(e){toast(e.message,true);}}
async function deleteDataset(id=state.datasetId){if(!id||!confirm('선택한 평가데이터셋과 연결된 완료 평가 이력을 지울까요?'))return;try{await api(`/api/admin-ui/evaluations/datasets/${encodeURIComponent(id)}`,{method:'DELETE'});if(state.datasetId===id){state.datasetId='';state.evalResult=null;state.evalJob=null;}await refreshAll(true);toast('평가데이터셋을 지웠습니다.');}catch(e){toast(e.message,true);}}
async function clearDatasets(){if(!confirm('등록된 평가데이터셋과 완료 평가 이력을 모두 비울까요?'))return;try{await api('/api/admin-ui/evaluations/datasets',{method:'DELETE'});state.datasetId='';state.evalResult=null;state.evalJob=null;await refreshAll(true);toast('평가데이터셋과 평가 이력을 모두 비웠습니다.');}catch(e){toast(e.message,true);}}
async function deleteEvalJob(id){if(!confirm('이 평가 실행 결과를 지울까요?'))return;try{await api(`/api/admin-ui/evaluations/jobs/${encodeURIComponent(id)}`,{method:'DELETE'});if(state.evalJob?.job_id===id){state.evalJob=null;state.evalResult=null;}await refreshEvalJobs();render();toast('평가 실행 이력을 지웠습니다.');}catch(e){toast(e.message,true);}}
async function clearEvalJobs(){if(!confirm('완료·오류 상태의 평가 실행 이력을 모두 비울까요?'))return;try{await api('/api/admin-ui/evaluations/jobs',{method:'DELETE'});if(state.evalJob?.status!=='running'){state.evalJob=null;state.evalResult=null;}await refreshEvalJobs();render();toast('완료된 평가 실행 이력을 비웠습니다.');}catch(e){toast(e.message,true);}}
async function stageAdd(){try{const chunk=JSON.parse(document.getElementById('chunk-json')?.value||'');state.draft=await api('/api/admin-ui/draft/chunks',{method:'POST',body:JSON.stringify({chunk})});render();toast('신규 청크를 초안에 추가했습니다.');}catch(e){toast(e.message,true);}}
async function stageRemove(id){if(!confirm(`${id} 청크를 제거 초안에 추가할까요?`))return;try{state.draft=await api(`/api/admin-ui/draft/chunks/${encodeURIComponent(id)}`,{method:'DELETE'});render();toast('제거 초안에 추가했습니다.');}catch(e){toast(e.message,true);}}
async function applyChanges(){const confirmation=document.getElementById('apply-confirm')?.value||'';if(!confirm('승인하면 다음 챗봇 질문부터 변경된 검색 설정과 청크를 사용합니다. 계속할까요?'))return;state.busy=true;render();try{const out=await api('/api/admin-ui/apply',{method:'POST',body:JSON.stringify({confirmation})});toast(`${out.version_id} 반영 완료. 다음 질문부터 적용됩니다.`);await refreshAll(true);state.view='chat';render();}catch(e){state.busy=false;render();toast(e.message,true);}}
async function clearDraft(){if(!confirm('저장된 파라미터·청크 초안을 모두 비울까요?'))return;state.draft=await api('/api/admin-ui/draft',{method:'DELETE'});render();toast('초안을 비웠습니다.');}
async function clearConfigDraft(){if(!confirm('파라미터 초안만 비울까요?'))return;state.draft=await api('/api/admin-ui/draft/config',{method:'DELETE'});render();toast('파라미터 초안을 비웠습니다.');}
async function undoDraft(kind,id){const endpoint=kind==='add'?'additions':'removals';try{state.draft=await api(`/api/admin-ui/draft/${endpoint}/${encodeURIComponent(id)}`,{method:'DELETE'});render();toast(kind==='add'?'청크 추가 초안을 취소했습니다.':'청크 제거 초안을 취소했습니다.');}catch(e){toast(e.message,true);}}
async function deleteHistory(id){if(!confirm('이 반영 이력을 지우면 해당 상태로 롤백할 수 없습니다. 지울까요?'))return;try{await api(`/api/admin-ui/history/${encodeURIComponent(id)}`,{method:'DELETE'});await refreshAll(true);toast('반영 이력을 지웠습니다.');}catch(e){toast(e.message,true);}}
async function clearHistory(){if(!confirm('모든 반영 이력과 롤백 스냅샷을 지울까요? 현재 운영 상태는 유지됩니다.'))return;try{await api('/api/admin-ui/history',{method:'DELETE'});await refreshAll(true);toast('반영 이력을 모두 비웠습니다.');}catch(e){toast(e.message,true);}}
async function rollback(id){if(!confirm(`${id} 반영 전 상태로 복구할까요?`))return;state.busy=true;render();try{await api(`/api/admin-ui/rollback/${encodeURIComponent(id)}`,{method:'POST',body:'{}'});toast('이전 운영 상태로 복구했습니다.');await refreshAll(true);}catch(e){state.busy=false;render();toast(e.message,true);}}
async function testKey(){const value=document.getElementById('new-api-key')?.value||'';if(!value)return toast('새 API 키를 입력해 주세요.',true);state.busy=true;render();try{state.keyTest=await api('/api/admin-ui/api-keys/test',{method:'POST',body:JSON.stringify({api_key:value})});toast('임베딩·답변 모델 연결을 확인했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function rotateKey(){const key=document.getElementById('new-api-key')?.value||'',confirmation=document.getElementById('key-confirm')?.value||'';if(!key)return toast('새 API 키를 입력해 주세요.',true);if(!confirm('현재 AWS 챗봇과 다음 systemd 재시작에서 사용할 HCX API 키를 교체할까요?'))return;state.busy=true;render();try{const out=await api('/api/admin-ui/api-keys/rotate',{method:'POST',body:JSON.stringify({api_key:key,confirmation})});state.keyStatus=out;state.keyTest=out.test;toast('AWS HCX API 키와 모든 HCX 클라이언트를 교체했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function runChat(){const q=state.chatQuestion.trim();if(!q)return toast('질문을 입력해 주세요.',true);try{state.chatResult=null;state.chatBasis=null;state.chatJob={status:'queued',progress:2,stage:'질문 전달'};render();const created=await api('/api/v1/chat',{method:'POST',body:JSON.stringify({session_id:state.sessionId,question:q})});for(let i=0;i<600;i++){const j=await api(`/api/v1/jobs/${created.job_id}`);state.chatJob=j;if(j.status==='done'){state.chatResult=j.result;render();toast('최종 챗봇 답변이 완료되었습니다.');return;}if(j.status==='error')throw new Error(j.error||'챗봇 오류');render();await sleep(700);}}catch(e){toast(e.message,true);}}

root.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.view){state.view=t.dataset.view;render();return;}const a=t.dataset.action;if(a==='login'){login();return;}if(a==='theme'){state.dark=!state.dark;localStorage.setItem('kdic-admin-theme',state.dark?'dark':'light');render();}if(a==='refresh')refreshAll();if(a==='refresh-pipeline')refreshPipeline();if(a==='select-pipeline-node')selectPipelineNode(t.dataset.id);if(a==='refresh-guardrails')refreshGuardrails();if(a==='add-guardrail')addGuardrail();if(a==='delete-guardrail')deleteGuardrail(t.dataset.index);if(a==='save-guardrail-draft')saveGuardrailDraft();if(a==='clear-guardrail-draft')clearGuardrailDraft();if(a==='test-guardrails')testGuardrails();if(a==='apply-guardrails')applyGuardrails();if(a==='rollback-guardrails')rollbackGuardrails(t.dataset.id);if(a==='search-index')searchIndex();if(a==='select-hit')loadDocument(t.dataset.id);if(a==='upload-dataset')uploadDataset();if(a==='delete-dataset')deleteDataset();if(a==='clear-datasets')clearDatasets();if(a==='save-config')saveConfig();if(a==='run-eval')runEval();if(a==='open-eval-job')openEvalJob(t.dataset.id);if(a==='delete-eval-job')deleteEvalJob(t.dataset.id);if(a==='clear-eval-jobs')clearEvalJobs();if(a==='reset-eval-policy'){state.evalPolicy={evaluation_depth:20,metric_ks:{hit:3,recall:5,mrr:10,map:10,complete:5,ndcg:5,precision:5,f1:5},curve_ks:[1,3,5,10,20]};render();}if(a==='copy-draft')render();if(a==='stage-add')stageAdd();if(a==='stage-remove')stageRemove(t.dataset.id);if(a==='undo-add')undoDraft('add',t.dataset.id);if(a==='undo-remove')undoDraft('remove',t.dataset.id);if(a==='test-key')testKey();if(a==='rotate-key')rotateKey();if(a==='toggle-key'){const input=document.getElementById('new-api-key');if(input){input.type=input.type==='password'?'text':'password';t.textContent=input.type==='password'?'보기':'숨기기';}}if(a==='apply-changes')applyChanges();if(a==='clear-config-draft')clearConfigDraft();if(a==='clear-draft')clearDraft();if(a==='rollback')rollback(t.dataset.id);if(a==='delete-history')deleteHistory(t.dataset.id);if(a==='clear-history')clearHistory();if(a==='run-chat')runChat();if(a==='load-basis'&&state.chatJob?.job_id)api('/api/basis',{method:'POST',body:JSON.stringify({job_id:state.chatJob.job_id})}).then(x=>{state.chatBasis=x;render();}).catch(x=>toast(x.message,true));if(a==='logout')api('/api/admin-ui/logout',{method:'POST',body:'{}'}).then(()=>location.reload());});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='admin-token'){e.preventDefault();login();}});
root.addEventListener('input',e=>{if(e.target.id==='index-query')state.query=e.target.value;if(e.target.id==='chat-question')state.chatQuestion=e.target.value;});
root.addEventListener('change',e=>{if(e.target.id==='index-select'){state.index=e.target.value;state.query='';searchIndex(false);}if(e.target.id==='dataset-select'){state.datasetId=e.target.value;render();}});
window.addEventListener('resize',()=>{if(state.view==='pipeline')requestAnimationFrame(drawPipelineEdges);});
bootstrap();
})();

</script>
</body>
