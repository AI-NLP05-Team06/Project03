mplate-columns:1fr auto auto;gap:14px;align-items:center;padding:11px;border-top:1px solid var(--line);font-size:9px}.history-row b,.history-row small{display:block}.history-row small{color:var(--muted);margin-top:3px}.history-row code{color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}

<body>
  <noscript>관리자 콘솔을 사용하려면 JavaScript를 허용해 주세요.</noscript>
  <div id="app"><div class="boot-screen"><div class="boot-logo">K</div><h1>KDIC RAG 관리자</h1><p>최종 챗봇 런타임에 연결하고 있습니다.</p></div></div>
  <script>
(function(){
'use strict';
const root=document.getElementById('app');
const state={view:'dashboard',dark:localStorage.getItem('kdic-admin-theme')==='dark',summary:null,config:null,capabilities:null,indices:[],jobs:[],index:'',query:'',hits:[],hitTotal:0,document:null,busy:false,chatJob:null,chatResult:null,chatBasis:null,chatQuestion:'예금보험금 신청과 착오송금 반환지원 신청은 어떻게 다른가요?',sessionId:`admin-${crypto.randomUUID?.()||Date.now()}`,datasets:[],datasetId:'',evalJob:null,evalResult:null,draft:null,keyStatus:null,keyTest:null};
const navItems=[['dashboard','▦','대시보드','운영 상태'],['runtime','◇','파라미터','A/B 후보 설정'],['evaluation','◫','검색 A/B 평가','데이터셋 일괄 평가'],['data','▤','청크 관리','조회·추가·제거'],['keys','◆','API 키','검증·교체'],['apply','✓','반영 센터','승인·롤백'],['chat','◉','챗봇 테스트','실제 전체 파이프라인'],['jobs','↻','작업 이력','챗봇 Job']];
const metricLabels={hit_at_3:'Hit@3',recall_at_5:'Recall@5',mrr_at_10:'MRR@10',map_at_10:'MAP@10',complete_at_5:'Complete@5',ndcg_at_5:'nDCG@5',precision_at_5:'Precision@5',f1_at_5:'F1@5',latency_avg_ms:'평균 지연시간'};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const attr=v=>esc(v).replace(/`/g,'&#96;');
const num=v=>Number(String(v??0).replace(/,/g,''))||0;
const fmtDate=v=>v?new Date(Number(v)*1000).toLocaleString('ko-KR'):'—';
const pct=v=>v==null?'—':`${(Number(v)*100).toFixed(1)}%`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(path,options={}){const headers={...(options.headers||{})};if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const res=await fetch(path,{credentials:'include',...options,headers});const type=res.headers.get('content-type')||'';const out=type.includes('json')?await res.json():await res.text();if(!res.ok)throw new Error(typeof out==='object'?(out.detail||JSON.stringify(out)):out);return out;}
function toast(message,error=false){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className=`toast${error?' error':''}`;el.innerHTML=`<b>${error?'!':'✓'}</b>${esc(message)}`;document.body.appendChild(el);setTimeout(()=>el.remove(),4200);}
function statusBadge(status){const k=String(status||'UNKNOWN').toUpperCase();const map={DONE:['SUCCEEDED','완료'],RUNNING:['RUNNING','처리 중'],ERROR:['FAILED','오류'],FAILED:['FAILED','오류'],ACTIVE:['ACTIVE','정상'],STAGED_WRITE:['RUNNING','초안-승인'],QUEUED:['QUEUED','대기']};const [c,l]=map[k]||['INACTIVE',k];return `<span class="status status-${c.toLowerCase()}"><i></i>${l}</span>`;}
const heading=(e,t,d,a='')=>`<div class="page-heading"><div><span>${e}</span><h1>${t}</h1><p>${d}</p></div>${a}</div>`;
const metric=(l,v,d,t='blue')=>`<article class="metric metric-${t}"><div class="metric-top"><span>${l}</span><b>↗</b></div><strong>${esc(v)}</strong><small>${esc(d)}</small></article>`;
function pairs(rows){return rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v??'—')}</dd></div>`).join('');}

async function bootstrap(){try{const [summary,config,capabilities,indices,jobs,datasets,draft,keyStatus]=await Promise.all([api('/api/admin-ui/summary'),api('/api/admin-ui/runtime-config'),api('/api/admin-ui/capabilities'),api('/api/admin-ui/indices'),api('/api/admin-ui/jobs?limit=100'),api('/api/admin-ui/evaluations/datasets'),api('/api/admin-ui/draft'),api('/api/admin-ui/api-keys/status')]);Object.assign(state,{summary,config,capabilities,indices:indices.items||[],jobs:jobs.items||[],datasets:datasets.items||[],draft,keyStatus});state.index=pickIndex(state.indices);state.datasetId=state.datasets.at(-1)?.dataset_id||'';render();if(state.index)await searchIndex(false);}catch(error){root.innerHTML=`<section class="panel connection-error"><div class="boot-logo">!</div><h1>관리자 API에 연결하지 못했습니다.</h1><p>${esc(error.message)}</p><ul><li>수정된 Colab 노트북의 관리자 버튼으로 접속했는지 확인하세요.</li><li>Cloudflare 주소와 Colab 런타임이 실행 중인지 확인하세요.</li></ul></section>`;}}
function pickIndex(rows){return String((rows.find(r=>String(r.index).includes('kdic'))||rows[0]||{}).index||'');}
function shell(content){const nav=navItems.map(([id,icon,label,cap])=>`<button class="nav-item ${state.view===id?'active':''}" data-view="${id}"><span class="nav-icon">${icon}</span><span><b>${label}</b><small>${cap}</small></span></button>`).join('');const label=navItems.find(x=>x[0]===state.view)?.[2]||'';const es=state.summary?.elasticsearch||{};const draftCount=(state.draft?.add?.length||0)+(state.draft?.remove?.length||0)+Object.keys(state.draft?.candidate_config||{}).filter(k=>state.draft?.active_config?.[k]!==state.draft?.candidate_config?.[k]).length;return `<div class="admin-app ${state.dark?'dark':''}"><aside class="sidebar"><div class="brand"><div class="brand-mark">K</div><div><strong>KDIC RAG</strong><span>LIVE ADMIN</span></div></div><nav><p class="nav-label">OPERATIONS</p>${nav}</nav><div class="sidebar-config"><p>운영 변경 정책</p><strong>Draft → Evaluate → Apply</strong><span>초안 ${draftCount}건</span><span>즉시 롤백 지원</span>${statusBadge('STAGED_WRITE')}</div><div class="profile"><div class="avatar">관</div><div><strong>관리자 세션</strong><span>HttpOnly Cookie</span></div><button data-action="logout">↪</button></div></aside><main class="main"><header class="topbar"><div><span class="crumb">KDIC Final Admin /</span><strong>${label}</strong></div><div class="system-pills"><span><i class="green-dot live-dot"></i> 챗봇 연결</span><span><i class="green-dot"></i> ES ${es.connected?'연결':'미연결'}</span><button data-action="refresh">↻</button><button data-action="theme">${state.dark?'☀':'☾'}</button></div></header><div class="content ${state.busy?'refreshing':''}">${content}</div><footer><span>관리 모드 <b>STAGED_WRITE</b></span><span>HCX 키 브라우저 미노출</span><span>승인 시 같은 런타임에 반영</span></footer></main></div>`;}

function dashboard(){const es=state.summary?.elasticsearch||{},docs=state.indices.reduce((s,r)=>s+num(r['docs.count']),0),draft=state.draft||{};return `${heading('LIVE OVERVIEW','챗봇 운영 관리자','검색 평가와 변경 승인을 같은 최종 챗봇 런타임에서 관리합니다.','<button class="primary-btn" data-action="refresh">↻ 상태 새로고침</button>')}<div class="risk-banner"><b>i</b><span><strong>운영 데이터는 단계적으로 변경됩니다.</strong>초안은 챗봇에 영향을 주지 않으며, A/B 확인 뒤 ‘운영 반영’을 승인해야 다음 질문부터 적용됩니다.</span></div><section class="metric-grid">${metric('활성 청크',docs.toLocaleString(),`${state.indices.length}개 인덱스`)}${metric('평가데이터셋',state.datasets.length,'현재 런타임 업로드','purple')}${metric('대기 변경',(draft.add?.length||0)+(draft.remove?.length||0),`추가 ${draft.add?.length||0} · 제거 ${draft.remove?.length||0}`,'cyan')}${metric('Elasticsearch',es.connected?String(es.status||'connected'):'연결 실패',es.version?`v${es.version}`:'설정 확인','red')}</section><section class="dashboard-grid"><article class="panel quality-panel"><div class="panel-head"><div><span class="section-kicker">CHANGE FLOW</span><h2>안전한 운영 반영 흐름</h2></div><button data-view="apply">반영 센터 →</button></div><div class="quality-row"><div><span>1단계</span><strong>초안</strong><small>파라미터·청크</small></div><div><span>2단계</span><strong>A/B</strong><small>Gold 검색평가</small></div><div><span>3단계</span><strong>승인</strong><small>운영 반영</small></div><div><span>4단계</span><strong>Rollback</strong><small>이전 상태 복구</small></div></div></article><article class="panel config-panel"><div class="panel-head"><div><span class="section-kicker">SAME RUNTIME</span><h2>챗봇 연동 상태</h2></div>${statusBadge(es.connected?'ACTIVE':'FAILED')}</div><dl>${pairs([['검색 인덱스',state.index||'—'],['답변 API',state.summary?.pipeline?.configured?'연결':'미연결'],['변경 방식','초안 승인'],['적용 시점','다음 질문부터']])}</dl></article></section>`;}

function configFields(c,prefix='cfg'){return `<div class="form-grid config-fields"><label><span>Dense 가중치</span><input id="${prefix}-dense" type="number" min="0" max="1" step="0.05" value="${attr(c.dense_weight)}"></label><label><span>BM25 가중치</span><input id="${prefix}-bm25" type="number" min="0" max="1" step="0.05" value="${attr(c.bm25_weight)}"></label><label><span>후보 깊이</span><input id="${prefix}-depth" type="number" min="5" max="200" value="${attr(c.candidate_depth)}"></label><label><span>최종 Top-K</span><input id="${prefix}-topk" type="number" min="1" max="20" value="${attr(c.final_top_k)}"></label><label><span>RRF K</span><input id="${prefix}-rrf" type="number" min="1" max="200" value="${attr(c.query_fusion_rrf_k)}"></label><label><span>Parent 문맥(자)</span><input id="${prefix}-parentchars" type="number" min="500" max="30000" value="${attr(c.parent_context_max_chars)}"></label><label><span>Parent-Child</span><select id="${prefix}-parent"><option value="true" ${c.parent_child?'selected':''}>사용</option><option value="false" ${!c.parent_child?'selected':''}>미사용</option></select></label></div>`;}
function readConfig(prefix){return {dense_weight:num(document.getElementById(`${prefix}-dense`)?.value),bm25_weight:num(document.getElementById(`${prefix}-bm25`)?.value),candidate_depth:num(document.getElementById(`${prefix}-depth`)?.value),final_top_k:num(document.getElementById(`${prefix}-topk`)?.value),query_fusion_rrf_k:num(document.getElementById(`${prefix}-rrf`)?.value),parent_context_max_chars:num(document.getElementById(`${prefix}-parentchars`)?.value),parent_child:document.getElementById(`${prefix}-parent`)?.value==='true'};}
function runtimeView(){const active=state.draft?.active_config||{},candidate=state.draft?.candidate_config||active;return `${heading('SEARCH PARAMETERS','파라미터 초안','현재 운영값은 그대로 두고 후보 설정을 저장합니다. 평가 화면에서 이 후보를 A/B 비교할 수 있습니다.')}<section class="config-compare"><article class="panel config-card"><div class="config-title"><span>A</span><div><h2>현재 운영값</h2><p>최종 챗봇이 지금 사용하는 값</p></div>${statusBadge('ACTIVE')}</div><dl>${pairs([['Dense / BM25',`${active.dense_weight} / ${active.bm25_weight}`],['후보 깊이',active.candidate_depth],['최종 Top-K',active.final_top_k],['RRF K',active.query_fusion_rrf_k],['Parent-Child',active.parent_child?'사용':'미사용'],['Parent 문맥',`${active.parent_context_max_chars}자`]])}</dl></article><article class="panel config-card candidate"><div class="config-title"><span>B</span><div><h2>후보 초안</h2><p>저장만으로는 운영에 반영되지 않음</p></div><span class="env-tag">DRAFT</span></div>${configFields(candidate,'draft')}<div class="approve-bar"><button class="primary-btn" data-action="save-config">후보 초안 저장</button></div></article></section><div class="readonly-banner"><div><strong>Chunk Size·임베딩 모델 변경은 여기서 즉시 반영하지 않습니다.</strong><span>전체 재청킹·재임베딩이 필요한 적재 시점 파라미터이기 때문입니다.</span></div><code>search-time only</code></div>`;}

function evaluationView(){const options=state.datasets.map(d=>`<option value="${attr(d.dataset_id)}" ${state.datasetId===d.dataset_id?'selected':''}>${esc(d.filename)} (${d.usable_count}/${d.row_count})</option>`).join('');const active=state.draft?.active_config||{},candidate=state.draft?.candidate_config||active;let result='';if(state.evalJob&&state.evalJob.status!=='done'){result=`<section class="panel evaluation-progress"><div><span>${esc(state.evalJob.status==='error'?state.evalJob.error:'검색 평가 실행 중')}</span><strong>${state.evalJob.progress||0}%</strong></div><i><em style="width:${state.evalJob.progress||0}%"></em></i><p>${state.evalJob.processed||0}개 질문 처리</p></section>`;}if(state.evalResult){const b=state.evalResult.baseline,c=state.evalResult.candidate;result=`<section class="panel result-compare"><div class="panel-head"><div><span class="section-kicker">A/B RESULT</span><h2>${esc(state.evalResult.evaluation_scope)}</h2></div><span class="test-badge">${b.question_count}문항</span></div><div class="eval-metric-table"><div class="eval-row eval-head"><span>지표</span><span>A 운영</span><span>B 후보</span><span>변화</span></div>${Object.keys(metricLabels).map(k=>{const latency=k==='latency_avg_ms',delta=state.evalResult.delta[k];return `<div class="eval-row"><b>${metricLabels[k]}</b><span>${latency?`${b[k].toFixed(0)}ms`:pct(b[k])}</span><span>${latency?`${c[k].toFixed(0)}ms`:pct(c[k])}</span><strong class="${delta>0?(latency?'rank-down':'rank-up'):delta<0?(latency?'rank-up':'rank-down'):'rank-same'}">${delta==null?'—':latency?`${delta>0?'+':''}${delta.toFixed(0)}ms`:`${delta>0?'+':''}${(delta*100).toFixed(1)}%p`}</strong></div>`;}).join('')}</div><details class="raw-toggle"><summary>질문별 결과 ${state.evalResult.details.length}건 보기</summary><div class="question-results">${state.evalResult.details.map(r=>`<article><b>${esc(r.question_id)} · ${esc(r.question)}</b><small>Gold: ${esc(r.gold_chunk_ids.join(', '))}</small><span>A: ${esc(r.baseline_retrieved.slice(0,5).join(', '))}</span><span>B: ${esc(r.candidate_retrieved.slice(0,5).join(', '))}</span></article>`).join('')}</div></details></section>`;}return `${heading('BATCH RETRIEVAL EVAL','평가데이터셋 검색 A/B','Gold 청크가 있는 XLSX/CSV를 업로드해 현재 운영값과 후보값을 같은 질문으로 비교합니다.')}<section class="panel eval-setup"><div class="panel-head"><div><span class="section-kicker">DATASET</span><h2>1. 평가데이터셋 업로드</h2></div></div><div class="upload-row"><input id="dataset-file" type="file" accept=".xlsx,.csv"><button class="secondary-btn" data-action="upload-dataset">파일 검증·등록</button><select id="dataset-select"><option value="">등록된 파일 선택</option>${options}</select></div>${state.datasetId?datasetNotice():''}</section><section class="panel eval-setup"><div class="panel-head"><div><span class="section-kicker">CANDIDATE B</span><h2>2. 비교 설정</h2></div><button class="secondary-btn" data-action="copy-draft">저장된 초안 사용</button></div>${configFields(candidate,'eval')}<div class="form-actions"><p>지표: <b>Hit@3 · Recall@5 · MRR@10 · MAP@10 · Complete@5 · nDCG@5 · Precision@5 · F1@5 · 지연시간</b></p><button class="primary-btn" data-action="run-eval" ${!state.datasetId?'disabled':''}>A/B 일괄 평가 실행</button></div></section>${result}`;}
function datasetNotice(){const d=state.datasets.find(x=>x.dataset_id===state.datasetId);if(!d)return'';return `<div class="dataset-notice"><b>${esc(d.filename)}</b><span>전체 ${d.row_count} · 평가 가능 ${d.usable_count}</span>${d.warnings?.length?`<details><summary>검수 경고 ${d.warnings.length}건</summary><p>${d.warnings.map(esc).join('<br>')}</p></details>`:'<em>Gold 연결 정상</em>'}</div>`;}

function dataView(){const options=state.indices.map(r=>`<option value="${attr(r.index)}" ${state.index===r.index?'selected':''}>${esc(r.index)}</option>`).join('');const hits=state.hits.map(h=>{const s=h._source||{};return `<button class="api-hit" data-action="select-hit" data-id="${attr(h._id)}"><span class="doc-id">${esc(s.chunk_id||h._id)}</span><span><b>${esc(s.section_title||s.title||s.chunk_id||h._id)}</b><small>${esc(s.business_function||s.parent_doc_id||h._index)}</small></span><em>${Number(h._score||0).toFixed(3)}</em></button>`;}).join('')||'<div class="empty-list">검색 결과가 없습니다.</div>';const detail=state.document?`<div class="panel-head"><div><span class="section-kicker">CHUNK DETAIL</span><h2>${esc(state.document._id)}</h2></div><button class="danger-btn" data-action="stage-remove" data-id="${attr(state.document._id)}">제거 초안</button></div><pre class="json-view">${esc(JSON.stringify(state.document.chunk_metadata||state.document._source,null,2))}</pre>`:'<div class="empty-list">왼쪽에서 청크를 선택해 주세요.</div>';return `${heading('CHUNK OPERATIONS','청크 조회·추가·제거','추가와 제거는 초안으로만 저장되며 반영 전까지 챗봇 검색 결과는 바뀌지 않습니다.')}<section class="panel add-chunk"><div class="panel-head"><div><span class="section-kicker">ADD DRAFT</span><h2>신규 청크 JSON</h2></div><button class="secondary-btn" data-action="stage-add">추가 초안 저장</button></div><textarea id="chunk-json" placeholder='{"chunk_id":"NEW-001_chunk_000","document_id":"NEW-001","parent_doc_id":"NEW-001","title":"제목","section_title":"부제목","business_function":"업무","content":"본문"}'></textarea></section><section class="panel"><div class="api-searchbar"><select id="index-select">${options}</select><input id="index-query" value="${attr(state.query)}" placeholder="청크 ID·본문 검색"><button class="primary-btn" data-action="search-index">검색</button></div></section><section class="api-result-layout"><article class="panel api-hit-list"><div class="list-summary"><b>${state.hitTotal}건 중 ${state.hits.length}건</b><span>${esc(state.index)}</span></div><div class="api-hit-scroll">${hits}</div></article><article class="panel api-doc-view" style="padding:20px">${detail}</article></section>`;}

function keysView(){const k=state.keyStatus||{};const tested=state.keyTest?`<div class="key-test-result"><b>연결 검증 완료</b><span>지문 ${esc(state.keyTest.fingerprint)}</span><span>임베딩 ${Math.round(state.keyTest.embedding_latency_ms)}ms</span><span>답변 ${Math.round(state.keyTest.chat_latency_ms)}ms</span></div>`:'';return `${heading('SERVER SECRET','HCX API 키 관리','키는 HTTPS로 서버에 전달되며 화면·API 응답·로그에서 다시 조회할 수 없습니다.')}<section class="metric-grid">${metric('설정 상태',k.configured?'등록됨':'미등록',k.source||'—')}${metric('키 지문',k.fingerprint||'—','SHA-256 앞 12자리','purple')}${metric('마지막 교체',k.last_rotated_at?new Date(k.last_rotated_at*1000).toLocaleString('ko-KR'):'교체 이력 없음','현재 Colab 런타임','cyan')}${metric('저장 범위','런타임 한정','Colab 종료 시 보안 비밀 HCX 재사용','red')}</section><div class="risk-banner"><b>!</b><span><strong>기존 키는 확인하거나 복사할 수 없습니다.</strong>새 키를 입력해 검증한 뒤 교체할 수 있으며, Colab 런타임 종료 후에도 유지하려면 Colab 보안 비밀 <code>HCX</code>를 갱신해야 합니다.</span></div><section class="panel key-manager"><div class="panel-head"><div><span class="section-kicker">ROTATE SECRET</span><h2>새 HCX API 키</h2></div><span class="index-health">서버 전용</span></div><label><span>API 키</span><div class="secret-input"><input id="new-api-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="Bearer 없이 키 값만 입력"><button class="secondary-btn" data-action="toggle-key">보기</button></div></label><label><span>교체 확인 문구</span><input id="key-confirm" placeholder="API 키 교체"></label><div class="approve-bar"><button class="secondary-btn" data-action="test-key">연결 테스트</button><button class="danger-btn" data-action="rotate-key">검증 후 교체</button></div>${tested}<p class="muted-note">연결 테스트는 BGE-M3 임베딩과 HCX 답변 모델에 각각 짧은 요청을 1회 실행합니다.</p></section>`;}

function applyView(){const d=state.draft||{},changes=Object.entries(d.candidate_config||{}).filter(([k,v])=>d.active_config?.[k]!==v);const history=d.history||[];return `${heading('CHANGE CONTROL','운영 반영 센터','초안 내용을 마지막으로 확인한 뒤 같은 챗봇 런타임에 반영합니다.')}<div class="risk-banner"><b>!</b><span><strong>반영 중에는 실행 중인 챗봇 작업이 없어야 합니다.</strong>청크 제거는 운영 인덱스에서 제외되지만 이전 상태가 메모리 스냅샷에 남아 롤백할 수 있습니다.</span></div><section class="change-review"><article class="panel config-card"><h2>파라미터 변경 ${changes.length}건</h2><dl>${changes.length?pairs(changes.map(([k,v])=>[k,`${d.active_config[k]} → ${v}`])):'<div><dt>변경 없음</dt><dd>—</dd></div>'}</dl></article><article class="panel config-card"><h2>청크 추가 ${d.add?.length||0}건</h2><div class="chip-list">${(d.add||[]).map(c=>`<span>${esc(c.chunk_id)}</span>`).join('')||'없음'}</div></article><article class="panel config-card"><h2>청크 제거 ${(d.remove||[]).length}건</h2><div class="chip-list danger">${(d.remove||[]).map(c=>`<span>${esc(c)}</span>`).join('')||'없음'}</div></article></section><section class="panel apply-panel"><div><span class="section-kicker">FINAL APPROVAL</span><h2>운영 반영</h2><p>확인 문구 <b>운영 반영</b>을 입력하면 ES 인덱스와 챗봇 메모리가 함께 갱신됩니다.</p></div><input id="apply-confirm" placeholder="운영 반영"><button class="danger-btn" data-action="apply-changes" ${!d.has_changes?'disabled':''}>실제 반영하기</button><button class="secondary-btn" data-action="clear-draft" ${!d.has_changes?'disabled':''}>초안 비우기</button></section><section class="panel jobs-panel"><div class="panel-head"><div><span class="section-kicker">ROLLBACK</span><h2>반영 이력</h2></div></div>${history.length?history.map(h=>`<div class="history-row"><span><b>${esc(h.version_id)}</b><small>${new Date(h.created_at*1000).toLocaleString('ko-KR')}</small></span><code>+${h.summary.added.length} / -${h.summary.removed.length}</code><button class="secondary-btn" data-action="rollback" data-id="${attr(h.version_id)}">이 버전 반영 전으로 복구</button></div>`).join(''):'<div class="empty-list">아직 반영 이력이 없습니다.</div>'}</section>`;}

function chatView(){const job=state.chatJob,result=state.chatResult,progress=job?`<div class="chat-progress"><span><b>${esc(job.stage||'처리 중')}</b><strong>${job.progress||0}%</strong></span><i><em style="width:${job.progress||0}%"></em></i></div>`:'';return `${heading('END-TO-END TEST','실제 챗봇 통합 테스트','반영 전후 실제 질의분석·검색·답변 파이프라인을 확인합니다.')}<section class="chat-test"><article class="panel chat-compose"><textarea id="chat-question">${esc(state.chatQuestion)}</textarea><button class="primary-btn" data-action="run-chat">최종 챗봇 실행</button>${progress}</article><article class="panel chat-result">${result?chatOutput(result):'<div class="empty-list">질문을 실행하면 결과가 표시됩니다.</div>'}</article></section>`;}
function chatOutput(r){return `<div class="answer-meta"><span>${esc(r.route)}</span>${(r.businesses||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="chat-answer">${esc(r.answer||'')}</div>${(r.sources||[]).map(s=>`<div class="source-card"><b>${esc(s.title||'공식 출처')}</b><a href="${attr(s.url||'#')}" target="_blank">${esc(s.url||'')}</a></div>`).join('')}<button class="secondary-btn" data-action="load-basis">답변 근거 보기</button>${state.chatBasis?`<pre class="json-view">${esc(JSON.stringify(state.chatBasis,null,2))}</pre>`:''}`;}
function jobsView(){return `${heading('JOB AUDIT','챗봇 작업 이력','현재 런타임의 실제 Job 상태입니다.')}<section class="panel jobs-panel">${jobsTable(state.jobs)}</section>`;}
function jobsTable(rows){return rows.length?`<div class="job-table detailed"><div class="job-row job-header"><span>Job</span><span>질문</span><span>세션</span><span>상태</span><span>단계</span><span>진행률</span><span>시작</span></div>${rows.map(j=>`<div class="job-row"><b>${esc(String(j.job_id).slice(0,12))}</b><span>${esc(String(j.question||'').slice(0,28))}</span><span>${esc(String(j.session_id||'').slice(0,10))}</span>${statusBadge(j.status)}<span>${esc(j.stage)}</span><span>${j.progress||0}%</span><span>${fmtDate(j.created_at)}</span></div>`).join('')}</div>`:'<div class="empty-list">작업 이력이 없습니다.</div>';}

function render(){const views={dashboard,runtime:runtimeView,evaluation:evaluationView,data:dataView,keys:keysView,apply:applyView,chat:chatView,jobs:jobsView};root.innerHTML=shell(views[state.view]());}
async function refreshAll(silent=false){state.busy=true;render();try{const [summary,config,indices,jobs,datasets,draft,keyStatus]=await Promise.all([api('/api/admin-ui/summary'),api('/api/admin-ui/runtime-config'),api('/api/admin-ui/indices'),api('/api/admin-ui/jobs?limit=100'),api('/api/admin-ui/evaluations/datasets'),api('/api/admin-ui/draft'),api('/api/admin-ui/api-keys/status')]);Object.assign(state,{summary,config,indices:indices.items||[],jobs:jobs.items||[],datasets:datasets.items||[],draft,keyStatus});if(!silent)toast('실제 런타임 상태를 새로고침했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function searchIndex(notify=true){if(!state.index)return;state.busy=true;render();try{const out=await api('/api/admin-ui/search',{method:'POST',body:JSON.stringify({index:state.index,query:state.query,size:40,offset:0})});state.hits=out.items||[];state.hitTotal=out.total||0;state.document=null;if(notify)toast(`${state.hitTotal}건을 찾았습니다.`);}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function loadDocument(id){try{state.document=await api(`/api/admin-ui/documents/${encodeURIComponent(state.index)}/${encodeURIComponent(id)}`);render();}catch(e){toast(e.message,true);}}
async function fileBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file);});}
async function uploadDataset(){const file=document.getElementById('dataset-file')?.files?.[0];if(!file)return toast('평가데이터셋 파일을 선택해 주세요.',true);state.busy=true;render();try{const out=await api('/api/admin-ui/evaluations/upload',{method:'POST',body:JSON.stringify({filename:file.name,content_base64:await fileBase64(file)})});state.datasetId=out.dataset_id;await refreshAll(true);toast(`평가 가능 ${out.usable_count}/${out.row_count}문항을 등록했습니다.`);}catch(e){state.busy=false;render();toast(e.message,true);}}
async function saveConfig(){try{state.draft=await api('/api/admin-ui/draft/config',{method:'PUT',body:JSON.stringify({values:readConfig('draft')})});render();toast('후보 파라미터를 초안으로 저장했습니다.');}catch(e){toast(e.message,true);}}
async function runEval(){if(!state.datasetId)return toast('데이터셋을 먼저 선택해 주세요.',true);try{state.evalResult=null;state.evalJob=await api('/api/admin-ui/evaluations/run',{method:'POST',body:JSON.stringify({dataset_id:state.datasetId,candidate:readConfig('eval')})});render();for(let i=0;i<7200;i++){await sleep(1000);state.evalJob=await api(`/api/admin-ui/evaluations/jobs/${encodeURIComponent(state.evalJob.job_id)}`);if(state.evalJob.status==='done'){state.evalResult=state.evalJob.result;render();toast('A/B 검색평가가 완료되었습니다.');return;}if(state.evalJob.status==='error'){render();return toast(state.evalJob.error,true);}render();}}catch(e){toast(e.message,true);}}
async function stageAdd(){try{const chunk=JSON.parse(document.getElementById('chunk-json')?.value||'');state.draft=await api('/api/admin-ui/draft/chunks',{method:'POST',body:JSON.stringify({chunk})});render();toast('신규 청크를 초안에 추가했습니다.');}catch(e){toast(e.message,true);}}
async function stageRemove(id){if(!confirm(`${id} 청크를 제거 초안에 추가할까요?`))return;try{state.draft=await api(`/api/admin-ui/draft/chunks/${encodeURIComponent(id)}`,{method:'DELETE'});render();toast('제거 초안에 추가했습니다.');}catch(e){toast(e.message,true);}}
async function applyChanges(){const confirmation=document.getElementById('apply-confirm')?.value||'';if(!confirm('승인하면 다음 챗봇 질문부터 변경된 검색 설정과 청크를 사용합니다. 계속할까요?'))return;state.busy=true;render();try{const out=await api('/api/admin-ui/apply',{method:'POST',body:JSON.stringify({confirmation})});toast(`${out.version_id} 반영 완료. 다음 질문부터 적용됩니다.`);await refreshAll(true);state.view='chat';render();}catch(e){state.busy=false;render();toast(e.message,true);}}
async function clearDraft(){if(!confirm('저장된 파라미터·청크 초안을 모두 비울까요?'))return;state.draft=await api('/api/admin-ui/draft',{method:'DELETE'});render();toast('초안을 비웠습니다.');}
async function rollback(id){if(!confirm(`${id} 반영 전 상태로 복구할까요?`))return;state.busy=true;render();try{await api(`/api/admin-ui/rollback/${encodeURIComponent(id)}`,{method:'POST',body:'{}'});toast('이전 운영 상태로 복구했습니다.');await refreshAll(true);}catch(e){state.busy=false;render();toast(e.message,true);}}
async function testKey(){const value=document.getElementById('new-api-key')?.value||'';if(!value)return toast('새 API 키를 입력해 주세요.',true);state.busy=true;render();try{state.keyTest=await api('/api/admin-ui/api-keys/test',{method:'POST',body:JSON.stringify({api_key:value})});toast('임베딩·답변 모델 연결을 확인했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function rotateKey(){const key=document.getElementById('new-api-key')?.value||'',confirmation=document.getElementById('key-confirm')?.value||'';if(!key)return toast('새 API 키를 입력해 주세요.',true);if(!confirm('현재 Colab 런타임의 임베딩·답변·질의분석 클라이언트를 새 키로 교체할까요?'))return;state.busy=true;render();try{const out=await api('/api/admin-ui/api-keys/rotate',{method:'POST',body:JSON.stringify({api_key:key,confirmation})});state.keyStatus=out;state.keyTest=out.test;toast('HCX API 키와 모든 HCX 클라이언트를 교체했습니다.');}catch(e){toast(e.message,true);}finally{state.busy=false;render();}}
async function runChat(){const q=state.chatQuestion.trim();if(!q)return toast('질문을 입력해 주세요.',true);try{state.chatResult=null;state.chatBasis=null;state.chatJob={status:'queued',progress:2,stage:'질문 전달'};render();const created=await api('/api/v1/chat',{method:'POST',body:JSON.stringify({session_id:state.sessionId,question:q})});for(let i=0;i<600;i++){const j=await api(`/api/v1/jobs/${created.job_id}`);state.chatJob=j;if(j.status==='done'){state.chatResult=j.result;render();toast('최종 챗봇 답변이 완료되었습니다.');return;}if(j.status==='error')throw new Error(j.error||'챗봇 오류');render();await sleep(700);}}catch(e){toast(e.message,true);}}

root.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.view){state.view=t.dataset.view;render();return;}const a=t.dataset.action;if(a==='theme'){state.dark=!state.dark;localStorage.setItem('kdic-admin-theme',state.dark?'dark':'light');render();}if(a==='refresh')refreshAll();if(a==='search-index')searchIndex();if(a==='select-hit')loadDocument(t.dataset.id);if(a==='upload-dataset')uploadDataset();if(a==='save-config')saveConfig();if(a==='run-eval')runEval();if(a==='copy-draft')render();if(a==='stage-add')stageAdd();if(a==='stage-remove')stageRemove(t.dataset.id);if(a==='test-key')testKey();if(a==='rotate-key')rotateKey();if(a==='toggle-key'){const input=document.getElementById('new-api-key');if(input){input.type=input.type==='password'?'text':'password';t.textContent=input.type==='password'?'보기':'숨기기';}}if(a==='apply-changes')applyChanges();if(a==='clear-draft')clearDraft();if(a==='rollback')rollback(t.dataset.id);if(a==='run-chat')runChat();if(a==='load-basis'&&state.chatJob?.job_id)api('/api/basis',{method:'POST',body:JSON.stringify({job_id:state.chatJob.job_id})}).then(x=>{state.chatBasis=x;render();}).catch(x=>toast(x.message,true));if(a==='logout')api('/api/admin-ui/logout',{method:'POST',body:'{}'}).then(()=>location.reload());});
root.addEventListener('input',e=>{if(e.target.id==='index-query')state.query=e.target.value;if(e.target.id==='chat-question')state.chatQuestion=e.target.value;});
root.addEventListener('change',e=>{if(e.target.id==='index-select'){state.index=e.target.value;state.query='';searchIndex(false);}if(e.target.id==='dataset-select'){state.datasetId=e.target.value;render();}});
bootstrap();
})();

</script>
</body>
</html>
