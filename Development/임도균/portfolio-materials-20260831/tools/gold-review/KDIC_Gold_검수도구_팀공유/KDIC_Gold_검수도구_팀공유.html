b8e64f6fc08b04ea1ae59c46fd299185da83b5c6b2e6b5e17af0f2a42d776\", \"heading_path\": [\"착오송금 반환지원 등에 관한 규정\"], \"recovery_reason\": \"구조 청킹 결과에서 원문 atomic unit 누락 감지\"}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_000\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 0, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제1조(목적)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"착오송금 반환지원 등에 관한 규정 시행세칙\\n\\n제 정 2021. 6. 2\\n\\n### 제1조(목적)\\n\\n이 세칙은 「착오송금 반환지원 등에 관한 규정」(이하 “규정”이라 한다)에서 위임한 사항과 동 규정의 시행에 관하여 필요한 사항을 정함을 목적으로 한다.\", \"content_hash\": \"2f911be419deba254b58d8805eb8b616d6435d7196a56d3e0c104b5b0f1bc65c\", \"heading_path\": [\"제1조(목적)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_001\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 1, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제2조(정의)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제2조(정의)\\n\\n이 세칙에서 사용하는 용어의 정의는 규정이 정하는 바에 따른다.\", \"content_hash\": \"6a430b1e40a618278751dd51e9f123ce98794ebb1cfdbd7baf38b754e3db5ab8\", \"heading_path\": [\"제2조(정의)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_002\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 2, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제3조(반환지원신청 서류 제출)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제3조(반환지원신청 서류 제출)\\n\\n1. 착오송금인은 규정 제12조에 따른 반환지원신청을 하는 경우 다음 각 호의 서류를 반환지원정보시스템을 통하여 「전자서명법」 제2조제6호에 따른 인증서(서명자의 실지명의를 확인할 수 있는 것으로 한정한다)를 통한 본인확인의 방법으로 서명 또는 날인한 전자문서로 입력하거나, 공사의 주된 사무소(서울특별시 중구 청계천로 30) 또는 공사가 홈페이지에 반환지원 접수처로 지정하여 공고한 장소에 방문하여 제출하여야 한다.\\n2. 착오송금인이 대리인을 지정하여 반환지원신청을 하는 경우에는 그 대리인을 통하여 다음 각 호의 서류를 제1항에 따른 방법으로 공사에 제출하여야 한다.\\n3. 착오송금인은 제2항에 따라 지정한 대리인에 대한 위임을 해지하는 경우 별지 제7호 서식의 착오송금 반환지원신청 등 위임 해지통지서를, 대리인을 변경하고자 하는 경우 별지 제6호 서식의 착오송금 반환지원신청 등 위임장 및 별지 제7호 서식의 착오송금 반환지원신청 등 위임 해지통지서를 공사에 제출하여야 한다.\", \"content_hash\": \"e17ce226b818e114c72d62025eacee3d20407d4ffe19f44c36215480c84296ca\", \"heading_path\": [\"제3조(반환지원신청 서류 제출)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_003\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 3, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제3조(반환지원신청 서류 제출)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제3조(반환지원신청 서류 제출)\\n\\n1. 별지 제1호 서식의 착오송금 반환지원 신청서\\n2. 별지 제2호 서식의 금융거래정보제공 요구(동의)서\\n3. 별지 제3호 서식의 채권 양수‧양도계약서\\n4. 별지 제4호 서식의 채권양도 통지서\\n5. 별지 제5호 서식의 채권양도통지 위임장\\n6. 자금이체 금융회사등이 발급한 자금이체 확인서 또는 그 밖에 자금이체 결과를 확인할 수 있는 자료\\n7. 「금융실명거래 및 비밀보장에 관한 법률 시행령」제4조의2에 따른 착오송금인의 실지명의 확인 증표 또는 서류\\n8. 그 밖에 착오송금의 내용을 확인할 수 있는 자료가 있는 경우 그 관련자료\", \"content_hash\": \"ba7b5b707ec819a67ef7b7091b4b66724c8dc5ba7b218f58d6f0cc3aff189abd\", \"heading_path\": [\"제3조(반환지원신청 서류 제출)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_004\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 4, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제3조(반환지원신청 서류 제출)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제3조(반환지원신청 서류 제출)\\n\\n1. 제1항제1호부터 제8호까지의 반환지원신청 관련 서류\\n2. 별지 제6호 서식의 착오송금 반환지원신청 등 위임장\\n3. 착오송금인의 인감증명서 또는 본인서명사실확인서\\n4. 「금융실명거래 및 비밀보장에 관한 법률 시행령」제4조의2에 따른 그 대리인의 실지명의 확인 증표 또는 서류\\n5. 그 밖에 대리인의 확인 등을 위하여 「직제규정」상 착오송금 반환지원제도 담당부서(이하 “담당부서”라 한다)의 부장(이하 “담당부서장”이라 한다)이 필요하다고 인정하는 서류\", \"content_hash\": \"aa200f9e0112027475276b5d1c087cbe948cc2b493eccba24a81154a150599ea\", \"heading_path\": [\"제3조(반환지원신청 서류 제출)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_005\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 5, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제4조(절차의 통지방법)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제4조(절차의 통지방법)\\n\\n1. 규정 제17조에 따른 착오송금 수취인에 대한 부당이득반환채권의 양도통지는 별지 제4호 서식의 채권양도 통지서 및 별지 제5호 서식의 채권양도통지 위임장을 착오송금 수취인에게 도달 여부를 확인할 수 있는 우편으로 발송한다.\\n2. 제1항의 통지를 제외한 착오송금인등 및 착오송금 수취인에 대한 공사의 반환지원 절차의 진행 사항 통지는 「예금자보호법 시행령」제24조의6제2항 각 호 중 어느 하나의 방법으로 할 수 있다.\", \"content_hash\": \"dfef1ec50d6006b5bff14b2a9478c43e5012c3decef96405f6fb4f266a97e8af\", \"heading_path\": [\"제4조(절차의 통지방법)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_006\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 6, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제5조(회수관련 비용)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제5조(회수관련 비용)\\n\\n공사는 규정 제20조에 따라 착오송금인에게 비용을 회수하는 경우 별지 제8호 서식의 착오송금 반환지원제도 이용에 대한 비용청구서에 따라 납부기한을 정하여 통지한다.\", \"content_hash\": \"ee9fe36a9723f49c47813f1341e3f31b04d4f1f5b2e435cbccba8927973e1152\", \"heading_path\": [\"제5조(회수관련 비용)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_007\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 7, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제6조(매입금액의 지급)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제6조(매입금액의 지급)\\n\\n공사는 규정 제22조에 따라 매입금액을 지급하는 경우 \u003c별지 제9호 서식>에 따라 정산하여 착오송금인에게 지급한다.\", \"content_hash\": \"bf8f262bc48a6a56f5ed68461d6ab89001f5e997e558d13cdcf0e0ee819294b5\", \"heading_path\": [\"제6조(매입금액의 지급)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_008\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 8, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제7조(착오송금반환지원심의위원회 구성)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제7조(착오송금반환지원심의위원회 구성)\\n\\n1. 규정 제28조에 따른 착오송금반환지원심의위원회(이하 “심의위원회”라 한다)는 다음 각 호의 위원으로 구성한다.\\n2. 제1항제4호에 따른 위원의 임기는 1년으로 하며, 2회에 한하여 연임할 수 있다.\\n3. 사장은 제1항제4호에 따른 위원이 계속적으로 업무를 수행함이 곤란하다고 인정되는 경우에는 제2항에도 불구하고 당해 위원을 해촉할 수 있다.\", \"content_hash\": \"4adc1d916e1e8873114a472c87a2fea3560b06044f837f775af12c840e596685\", \"heading_path\": [\"제7조(착오송금반환지원심의위원회 구성)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_009\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 9, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제7조(착오송금반환지원심의위원회 구성)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제7조(착오송금반환지원심의위원회 구성)\\n\\n1. 담당부서의 담당이사\\n2. 담당부서장\\n3. 공사 소속 변호사 중 1인(「직제규정 시행세칙」에 따른 법무담당 부서장이 정한다)\\n4. 회계전문가 또는 법률전문가 중에서 사장이 위촉하는 민간위원 2인\", \"content_hash\": \"197b7599b3c572a002fa80081bb757b0bf888457de8a70abfe38f37eb2794f98\", \"heading_path\": [\"제7조(착오송금반환지원심의위원회 구성)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_010\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 10, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제8조(위원장)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제8조(위원장)\\n\\n1. 심의위원회 위원장은 제7조제1항제1호의 위원으로 하며, 심의위원회를 대표하고 업무를 통할한다.\\n2. 위원장이 부득이한 사유로 그 직무를 수행할 수 없을 때에는 제7조제1항제2호의 위원이 직무를 대행한다.\", \"content_hash\": \"dab2e6c417a29679d08147b84d24c2fc672ade3e5edce6273ab54a0e9dc683cb\", \"heading_path\": [\"제8조(위원장)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_011\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 11, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제9조(심의위원회 심의사항)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제9조(심의위원회 심의사항)\\n\\n심의위원회는 다음 각 호의 사항을 심의‧의결한다.\\n\\n1. 규정 제12조에 따른 반환지원신청 중 매입여부에 대한 심의가 필요한 사항\\n2. 규정 제18조에 따른 매입계약 해제 요건과 관련하여 해제여부에 대한 심의가 필요한 사항\\n3. 그 밖에 착오송금 반환지원 제도와 관련하여 심의위원회 위원장이 심의가 필요하다고 인정하는 사항\", \"content_hash\": \"c3b866a9e19594584b236117b0301e2e57327cf820eb3d615453c91a148187d4\", \"heading_path\": [\"제9조(심의위원회 심의사항)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_012\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 12, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제10조(회의 소집 및 운영)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제10조(회의 소집 및 운영)\\n\\n1. 심의위원회의 회의는 제9조에 따른 심의사항을 심의하기 위하여 위원장이 소집하고 진행한다.\\n2. 회의는 제7조제1항에 따른 구성원 과반수의 출석으로 성립하고 출석위원 과반수의 찬성으로 의결한다. 다만, 가부동수인 때에는 위원장이 이를 결정한다.\\n3. 위원장은 필요하다고 인정하는 경우에 서면 회의로 위원회 회의를 갈음할 수 있다.\", \"content_hash\": \"c7ba029fe4fcca6df034cfd2527ff161d8af333fd5bf8fe087d14269eba744a4\", \"heading_path\": [\"제10조(회의 소집 및 운영)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_013\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 13, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제11조(간사)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제11조(간사)\\n\\n1. 심의위원회의 원활한 운영을 위하여 간사를 두며 간사는 담당부서의 팀장 중 담당부서장이 정한다.\\n2. 간사는 심의위원회 개최 준비 및 심의 결과서 작성 등 심의위원회 운영에 필요한 행정 및 사무처리를 담당한다.\", \"content_hash\": \"a6e1a16d8e372fc75902fab01d4f4a0137f7c48979bba6a3f32529680ab4c128\", \"heading_path\": [\"제11조(간사)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_014\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 14, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제12조(수당 및 여비)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/ir/aplygudn/MtrsRelLawoRgul/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [{\"document_id\": \"MT-010_rule_layer01\", \"relation_type\": \"definition_reference\", \"description\": \"시행세칙의 정의 조항이 상위 규정의 정의를 참조함\"}], \"content\": \"### 제12조(수당 및 여비)\\n\\n제7조제1항제4호에 따른 위원이 위원회 회의에 참석(제10조제3항을 포함한다)한 경우에는 예산의 범위 내에서 수당 및 여비 등 일정한 경비를 지급할 수 있다.\", \"content_hash\": \"c38d21af1005964c43d4515418d897dbb5615cd97dc40e8bbd79402c97dee269\", \"heading_path\": [\"제12조(수당 및 여비)\"]}\n{\"chunk_id\": \"MT-010_operation_layer01_chunk_015\", \"parent_doc_id\": \"MT-010\", \"document_id\": \"MT-010_operation_layer01\", \"attachment_id\": null, \"record_type\": \"modal_document\", \"chunk_index\": 15, \"title\": \"착오송금 반환지원 시행세칙\", \"section_title\": \"제13조(비밀준수 의무)\", \"chunk_type\": \"legal_article\", \"resource_group_id\": \"MT-010_resource_004\", \"source_fragment\": \"#operation_layer01\", \"business_function\": \"착오송금 반환 신청\", \"target_business_function\": \"착오송금 반환 신청\", \"page_type\": \"modal_document\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdi
