 \"chunk_index\": 0, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"시스템 이용 에러 조치 방법\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 시스템 이용 에러 조치 방법\\n\\n□ 가지급금 또는 예금보험금 신청 중 화면에서 오류 발생시 아래 방법을 이용해보세요. 1. 윈도우 방화벽 해제 → 제어판 > Windows Defender 방화벽 > [좌측 메뉴 중] Windows Defender 방화벽 설정 및 해제 > 사용 안함(빨간 방패) 선택 후 확인 또는 설정 > 개인 정보 보호 및 보안 > Windows 보안 > 방화벽 및 네트워크 보호 > 도메인 / 개인 / 공용 네트워크 각각 Microsoft Defender 방화벽 체크 해제(버튼이 있는 경우에만) 2. 팝업 차단 해제 (엣지 브라우저) 엣지 창 상단 · > 설정 > [개인정보 및 보안] 혹은 [쿠키 및 사이트 권한] > 사이트 사용 권한 > 팝업 및 리디렉션 클릭 > 차단됨(권장) 옆 버튼 클릭(해제) (크롬) 크롬 창 상단 · > 설정 > [개인 정보 보호 및 보안] > 사이트 설정 > 하단 [콘텐츠] 아래 [팝업 및 리디렉션] > [사이트에서 팝업을 전송하고 리디렉션을 사용할 수 있음] 클릭 ※ 금융안심포털을 휴대전화(모바일)에서 사용할 경우, 구글 플레이스토어(안드로이드) 또는 앱스토어(애플)에서 “금융안심포털” 앱 설치 필요\", \"content_hash\": \"94c49cfb53a68549a0deb547a42705060526d0c0a10682c97a63ad3725f2ff68\", \"heading_path\": [\"시스템 이용 에러 조치 방법\"]}\n{\"chunk_id\": \"DP-005_chunk_001\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"시스템 원격지원 이용 방법\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 시스템 원격지원 이용 방법\\n\\n□ 가지급금 신청 관련하여 시스템 이용시 원격 지원이 필요한 경우 인터넷 브라우저 새창을 열어서 아래 주소 URL로 접속해주시면 원격지원을 받으실 수 있습니다. http://help.kdic.or.kr (먼저 전화연락을 주시고 접속 바랍니다)\", \"content_hash\": \"b520821b017c6bac8ea9fc23f942eaf659d1f90d0e398bbd6122043a78d8b51c\", \"heading_path\": [\"시스템 원격지원 이용 방법\"]}\n{\"chunk_id\": \"DP-005_chunk_002\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"영업정지 저축은행에서 발행한 후순위채권은 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 영업정지 저축은행에서 발행한 후순위채권은 어떻게 되나요?\\n\\n□ 저축은행에서 발행한 채권은 예금보호대상이 아니므로 보호받으실 수 없습니다.\", \"content_hash\": \"0e29ce51836d27e7ebc32ef8f352552a2870020638edd89017f07c9fa2833f9e\", \"heading_path\": [\"영업정지 저축은행에서 발행한 후순위채권은 어떻게 되나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_003\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"가족 명의와 미성년자 명의로 나누어서 예금한 것도 예금보호가 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 가족 명의와 미성년자 명의로 나누어서 예금한 것도 예금보호가 되나요?\\n\\n□ 금융실명법에 따른 실명확인 절차를 거쳐 예금계약을 체결하고 그 실명확인 사실이 예금계약서 등에 명확히 기재되어 있는 가족명의 또는 미성년자 명의 예금의 경우에는 각 예금명의자 별로 원금과 소정의 이자를 합하여 1억원 한도 내에서 보호됩니다.\", \"content_hash\": \"95890aa958537115b6bc8d74f5bb3644eca3aeaa802ef070e0f8a2ad7db67493\", \"heading_path\": [\"가족 명의와 미성년자 명의로 나누어서 예금한 것도 예금보호가 되나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_004\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"계열 저축은행에 분산하여 예금을 하였는데 각각 1억원까지 예금 보호가 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 계열 저축은행에 분산하여 예금을 하였는데 각각 1억원까지 예금 보호가 되나요?\\n\\n□ 계열사라 하여도 법인이 다를 경우 계열 저축은행의 예금은 각각 예금자보호법에 따라 예금자 명의별로(1인당) 원금과 소정의 이자를 합하여 1억원* 한도 내에서 보호됩니다. * 원리금은 이자에 대한 제세금이 차감되기전 금액 ㅇ 다만, 예금자가 해당 저축은행에 채무를 부담하고 있는 경우 예금등 채권의 합계액에서 그 채무를 공제한 금액을 대상으로 합니다.\", \"content_hash\": \"9cd321b349108031921d752ccc2b7a6132e678bef3d09fe6c565bfb7835efb9c\", \"heading_path\": [\"계열 저축은행에 분산하여 예금을 하였는데 각각 1억원까지 예금 보호가 되나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_005\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"현재 정상적으로 영업중인 저축은행에 맡긴 이자포함 1억원이하 예금의 경우, 저축은행이 불안하다고 해서 중도해지 할 필요가 있나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 현재 정상적으로 영업중인 저축은행에 맡긴 이자포함 1억원이하 예금의 경우, 저축은행이 불안하다고 해서 중도해지 할 필요가 있나요?\\n\\n□ 저축은행에 맡긴 예금은 어떠한 경우라도 예금자보호법에 따라 원금과 소정의 이자를 합하여 합계 1억원까지는 보호되므로 크게 염려하실 필요가 없습니다. □ 또한, 부실우려가 없음에도 막연한 불안감으로 정상적으로 영업중인 저축은행에 맡긴 예금을 중도해지할 경우 불필요한 이자손실이 초래되므로 예금자들의 신중한 판단이 필요합니다.\", \"content_hash\": \"96254cbb6029669f2df44480256834eea23448f48501550badce99fbf26450cd\", \"heading_path\": [\"현재 정상적으로 영업중인 저축은행에 맡긴 이자포함 1억원이하 예금의 경우, 저축은행이 불안하다고 해서 중도해지 할 필요가 있나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_006\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금은 언제부터 찾을 수 있나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금은 언제부터 찾을 수 있나요?\\n\\n□ 해당 저축은행이 45일 이내에 유상증자 등으로 자체 경영정상화를 달성하여 영업이 재개되면 영업재개와 동시에 예금 인출이 가능합니다. ㅇ 만일, 자체 경영정상화가 이루어지지 않을 경우에는 예금보험공사는 일정한 자격을 갖춘 인수 희망자에 대한 매각 절차 등을 조속히 추진하여 최소비용원칙에 따른 정리절차 진행을 통해 최대한 이른 시간에 금융거래가 재개되거나 예금보험금이 지급될 예정이며 동 절차는 통상 3∼4개월 소요됩니다.\", \"content_hash\": \"00a2dbd925a1bf44f0c516811017c0c3c1f8649dc3aaf027cdfcc57709174b0a\", \"heading_path\": [\"예금은 언제부터 찾을 수 있나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_007\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"영업정지 후 진행사항을 알 수 있는 방법은 무엇인가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 영업정지 후 진행사항을 알 수 있는 방법은 무엇인가요?\\n\\n□ 예금자께 공지할 사항은 해당 저축은행 홈페이지 및 예금보험공사 홈페이지(www.kdic.or.kr)에 게재합니다. ㅇ 예금보험공사 홈페이지 첫화면 하단의 보도자료 또는 공지사항에 계약이전 절차와 관련한 내용을 공고하고 있고, 계약이전 절차가 완료되거나 예금보험금 지급을 개시하면 공사 홈페이지 팝업창 등을 통해 관련 내용을 안내하고 있습니다. ㅇ 또한 중요한 결정사항에 대하여는 중앙지 및 지역 일간지, 해당 저축은행 홈페이지, 인수 저축은행 홈페이지 등을 통하여 공고하므로 참고하시면 됩니다.\", \"content_hash\": \"598bb5b69bfb358931864a6b85176722dafbcf3101a7830d80240c5dd65075b0\", \"heading_path\": [\"영업정지 후 진행사항을 알 수 있는 방법은 무엇인가요?\"]}\n{\"chunk_id\": \"DP-005_chunk_008\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"계약이전되는 경우, 계약이전에 포함되지 않는 예금과 대출은 어떤 것이 있고 그 기준은 무엇이나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 계약이전되는 경우, 계약이전에 포함되지 않는 예금과 대출은 어떤 것이 있고 그 기준은 무엇이나요?\\n\\n□ 예금의 경우 일반적으로 보호한도 이내 예금(원리금 합계 1억원 이하)이 계약이전되고 있습니다. 다만, 1억원 이내라도 부실관련자 예금 및 계약이전에서 제외된 대출의 관련 예금은 계약이전에서 제외될 수 있습니다. □ 대출은 원칙적으로 불법대출 등 계약이전에 부적절한 대출을 제외한 모든 대출을 이전대상으로 하고 있습니다.\", \"content_hash\": \"48d92d3f5118833ce0344eb0f2b9fcde35aa98969b371b2c9ad3f3088775fc5b\", \"heading_path\": [\"계약이전되는 경우, 계약이전에 포함되지 않는 예금과 대출은 어떤 것이 있고 그 기준은 무엇이나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_009\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 9, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"향후 영업정지된 저축은행의 진행사항은 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 향후 영업정지된 저축은행의 진행사항은 어떻게 되나요?\\n\\n□ 해당 저축은행이 영업정지일로부터 금융위원회가 정한 기간(45일) 이내에 유상증자 등으로 자체 경영정상화를 달성하여 영업이 재개되면 영업재개와 동시에 예금 인출이 가능합니다. ㅇ 그러나 자체 경영정상화가 이루어지지 않을 경우에는 공사는 ·예금자보호법· 제31조 및 제36조의2 규정 등에 따라 일정한 자격을 갖춘 인수 희망자에 대한 자산·부채 계약이전 등 다양한 정리 방안 중 ·예금자보호법· 제38조의4 규정에 따른 최소비용 원칙에 부합하는 정리 방안을 조속히 추진할 예정입니다.\", \"content_hash\": \"e5ecdf519f52f854131a9505ca8bd37063735c27db6957ad9c142864548a2b26\", \"heading_path\": [\"향후 영업정지된 저축은행의 진행사항은 어떻게 되나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_010\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 10, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"현재 세금우대, 비과세저축으로 가입되어 있는데 다른 금융기관에서 적용받기 위해 세제혜택 배제신청이 가능한가요? 또한 가지급금을 받으면 세금우대, 비과세저축의 세제혜택은 없어지는 건가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 현재 세금우대, 비과세저축으로 가입되어 있는데 다른 금융기관에서 적용받기 위해 세제혜택 배제신청이 가능한가요? 또한 가지급금을 받으면 세금우대, 비과세저축의 세제혜택은 없어지는 건가요?\\n\\n□ 다른 금융기관에서 세금우대 및 비과세저축을 적용받기 위해서는 해당 영업정지 저축은행에 방문하시어 비과세 또는 세금우대배제신청을 하시면 됩니다. 세금우대 및 생계형 저축의 비과세혜택 적용은 배제신청 접수 전일까지는 해지된 저축은행 가입분에 적용되고 해지 이후에는 신규 가입한 금융기관 가입분에 적용됩니다. ㅇ 또한 가지급금을 받았다고 해서 세금우대 및 비과세저축의 세제혜택이 없어지는 것이 아니기 때문에, 가지급금 신청시 해당 저축은행에 방문하시어 비과세 또는 세금우대배제신청을 하셔야 합니다.\", \"content_hash\": \"d4d966ac788a462a4779f6d83f41766382b84131422a6831d12d049f6e7d618c\", \"heading_path\": [\"현재 세금우대, 비과세저축으로 가입되어 있는데 다른 금융기관에서 적용받기 위해 세제혜택 배제신청이 가능한가요? 또한 가지급금을 받으면 세금우대, 비과세저축의 세제혜택은 없어지는 건가요?\"]}\n{\"chunk_id\": \"DP-005_chunk_011\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 11, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"만기가 아직 도래되지 않은 정기적금 및 장기주택마련 저축의 경우, 계약이전시 미불입금액을 계속하여 불입할 수 있는지요? (가지급금 수령후 남은 금액에 대하여 계속 유지 가능 여부 포함)\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 만기가 아직 도래되지 않은 정기적금 및 장기주택마련 저축의 경우, 계약이전시 미불입금액을 계속하여 불입할 수 있는지요? (가지급금 수령후 남은 금액에 대하여 계속 유지 가능 여부 포함)\\n\\n□ 계약이전 대상 예·적금에 대한 예금자의 권리와 의무는 계약이전시 동일한 내용으로 이전되어 가입당시 계약내용에 따라 거래할 수 있습니다. ㅇ 다만, 적금의 경우 계약조건에 따라 불입 회차 부족으로 인하여 자동해지 되는 경우가 있으니 계약내용 등을 확인하시어 잔여회차 미불입으로 인한 피해가 없도록 가지급금을 수령하시거나 영업재개 이후 잔여 회차 불입에 주의를 기울여 주시기 바랍니다.\", \"content_hash\": \"d7cf4ceecbfa15853f6add9474a49995dbfd3462b7a8bfaf64d007e920cd1ae6\", \"heading_path\": [\"만기가 아직 도래되지 않은 정기적금 및 장기주택마련 저축의 경우, 계약이전시 미불입금액을 계속하여 불입할 수 있는지요? (가지급금 수령후 남은 금액에 대하여 계속 유지 가능 여부 포함)\"]}\n{\"chunk_id\": \"DP-005_chunk_012\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 12, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금보험공사가 예금보험금을 지급하는 경우, 예금 및 적금에 대하여 이자적용은 어떻게 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금보험공사가 예금보험금을 지급하는 경우, 예금 및 적금에 대하여 이자적용은 어떻게 하나요?\\n\\n□ 계약이전되지 않거나, 저축은행이 파산되어 예금보험금을 지급하는 경우에 예금의 미지급이자 기산일부터 예금보험금 지급공고일까지 공사의 예금보험금 공시이율과 영업정지된 저축은행과의 예금 약정이율 중 낮은 이율을 적용하여 이자를 지급받으시게 됩니다. ㅇ 다만, 저축은행이 자체정상화가 되거나 계약이전될 경우 예금의 가입당시 해당 저축은행이 약속했던 이자(약정이자)를, 만기 이후의 기간은 해당 저축은행이 약속했던 만기후 이자에 의하여 거래가 재개됩니다.\", \"content_hash\": \"9a0c8054314b864412d273f828bfb58d8b67c6c2ead885581223e6e3b85378ef\", \"heading_path\": [\"예금보험공사가 예금보험금을 지급하는 경우, 예금 및 적금에 대하여 이자적용은 어떻게 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_013\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 13, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"정기적금의 월 납입금을 자동이체로 납부중인데 영업정지 이후에는 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 정기적금의 월 납입금을 자동이체로 납부중인데 영업정지 이후에는 어떻게 되나요?\\n\\n□ 정기적금의 납부는 영업이 정지되는 업무 범위에 속합니다. 따라서 영업정지 이후, 자동이체를 통한 정기적금의 납부는 저축은행에서 중단 처리하게 되며 별도로 자동이체 해지 등의 조치는 취할 필요가 없습니다. ㅇ 다만, 영업정지 직전 영업정지를 알지 못하는 저축은행의 요청에 의거 타 금융회사의 고객계좌에서 정기적금의 납부금액이 인출될 수 있으나, 그 금액은 인출된 타 금융회사의 고객계좌로 다시 반환 처리하게 됩니다.\", \"content_hash\": \"36854d741c5a9094f5fe023e4ad5e63243c8a9467b5243568670f443b737942f\", \"heading_path\": [\"정기적금의 월 납입금을 자동이체로 납부중인데 영업정지 이후에는 어떻게 되나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_014\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 14, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"영업정지가 되면 내 대출거래는 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 영업정지가 되면 내 대출거래는 어떻게 되나요?\\n\\n□ 영업정지 이후 저축은행은 예금의 입·출금 업무를 할 수 없으나, 대출관련 업무는 신규 취급을 제외한 대출금 상환, 이자 수납, 만기 연장 등은 수행하고 있습니다. ㅇ 따라서, 대출 원리금은 정상적으로 상환하시면 되고 기일 도래한 대출은 기한연장이 불가한 대출을 제외하고는 기한을 연장할 수 있으므로 영업점에 오셔서 평소와 같이 협의하실 수 있습니다. □ 대출금 이자를 타 금융기관의 고객계좌에서 납부하는 경우, 기존에 납부하시던 계좌로 현행처럼 자동이체 등을 통해 납부하시면 됩니다. ㅇ 그러나 해당 저축은행의 고객계좌에서 자동이체하는 경우, 예금의 입·출금업무를 할 수 없으므로 해당 저축은행에서 지정하는 별도의 계좌에 입금하여 납부하시면 됩니다. 보다 자세한 사항은 해당 저축은행에 문의하여 안내를 받으시기 바랍니다.\", \"content_hash\": \"d78f0c759c3dee909922f4e3913561a21b5de1dede39560d4d365e4b42ca061f\", \"heading_path\": [\"영업정지가 되면 내 대출거래는 어떻게 되나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_015\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 15, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"채권 채무 잔액조회서를 통지받았는데 어떻게 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 채권 채무 잔액조회서를 통지받았는데 어떻게 해야 하나요?\\n\\n□ 채권·채무 잔액조회서는 재산 실사 과정에서 저축은행의 자산 및 부채에 대한 정확한 파악을 위해 모든 채권·채무자에게 발송하고 있습니다. ㅇ 조회서를 받으신 분은 잔액조회서 상의 금액과 실제 계좌잔액 등과 대조·확인하시고, 이상이 있을 경우 이의사항을 기재하시어 해당 저축은행에 우편 혹은 직접 내방하여 제출하시면 됩니다.\", \"content_hash\": \"8283d2756ee4e09505c4a69f5e8dfdaa185142f7c405bf30684594874eb1579f\", \"heading_path\": [\"채권 채무 잔액조회서를 통지받았는데 어떻게 해야 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_016\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 16, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금담보대출은 얼마나 가능하며 어떻게 신청하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금담보대출은 얼마나 가능하며 어떻게 신청하나요?\\n\\n□ 부실저축은행의 예금자는 예금담보대출 취급 기관으로 지정된 농협·우리·국민·기업·신한·하나은행의 영업점에서 대출을 받으실 수 있습니다. ㅇ 통상 대출한도는 부실저축은행 예금액의 95%와 보호한도의 90% 중 작은 금액에서 가지급금 수령액, 대출 및 보증채무, 기타 지급제한금액을 차감하여 설정됩니다. ㅇ 가지급금 수령 후에도 추가로 자금이 필요하신 예금자는 영업정지 저축은행에서 예금 잔액증명서를 발급받으신 후, 주민등록증 등 본인증명 서류 지참하시고 대출 은행을 방문하시면 간편한 절차를 통해 대출을 받으실 수 있습니다. ※ 구체적인 예금담보대출 지급방안은 실제 지급사유 발생시 별도 안내될 예정이며, 위 내용과 차이가 있을 수 있습니다.\", \"content_hash\": \"74e12922c05bbe24fa59f446a89e7c56dda50accec433c7288c1adcbb044469c\", \"heading_path\": [\"예금담보대출은 얼마나 가능하며 어떻게 신청하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_017\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 17, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"해당 저축은행에 보증채무를 지고 있는 예금자의 지급보류된 예금은 언제 찾을 수 있나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 해당 저축은행에 보증채무를 지고 있는 예금자의 지급보류된 예금은 언제 찾을 수 있나요?\\n\\n□ 주채무자가 채무를 완전히 상환하거나 보증인이 보증채무를 대위변제하여 보증채무가 해소된 후에야 가지급금(또는 예금보험금)을 지급 받을 수 있습니다.\", \"content_hash\": \"76abbeb51c8e2b309c94d08040bf052a0affaf9926b1d8603ebd64ecec9332eb\", \"heading_path\": [\"해당 저축은행에 보증채무를 지고 있는 예금자의 지급보류된 예금은 언제 찾을 수 있나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_018\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 18, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"통장과 거래인감을 분실하였는데 어떻게 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 통장과 거래인감을 분실하였는데 어떻게 해야 하나요?\\n\\n□ 통장과 인감이 없어도 주민등록증 등 본인증명 서류를 소지하여 해당 저축은행 또는 지급대행지점을 방문하시면 본인확인 후 가지급금과 예금보험금을 수령하실 수 있습니다. 또는 공사 금융안심포털(fins.kdic.or.kr)에 접속하여(법인 및 미성년자 제외) 예금자 본인의 본인인증을 거쳐 신청할 수 있습니다.\", \"content_hash\": \"4dc2557eead9a04325eb5e7e4e329754229650825c2a3367ef51e726776ce101\", \"heading_path\": [\"통장과 거래인감을 분실하였는데 어떻게 해야 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_019\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 19, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"개명 또는 상호를 변경하였을 경우 예금보험금 청구는 어떻게 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 개명 또는 상호를 변경하였을 경우 예금보험금 청구는 어떻게 하나요?\\n\\n□ 개명을 한 개인의 경우에는 해당 영업정지 저축은행을 방문하여 가족관계등록부*와 함께 명의변경신청서를 작성하시어 제출하시면 확인 절차를 거쳐 예금보험금 지급이 가능합니다. * 가족관계등록부에 개명에 대한 사항이 기재되어 있지 않을 경우, 주민등록초본 제출 ㅇ 법인이나 개인사업자의 경우 법인은 법인 등기부등본, 개인사업자는 상호가 바뀐 새로운 사업자등록증 사본을 해당 영업정지 저축은행에 제출하시면 됩니다.\", \"content_hash\": \"dfb48adbf82f68c248da22e05338a277ba1bdc1f579388d738995df05528ed31\", \"heading_path\": [\"개명 또는 상호를 변경하였을 경우 예금보험금 청구는 어떻게 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_020\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 20, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금자가 단체 또는 법인인 경우, 가지급금(또는 예금보험금) 신청시 필요한 서류는 무엇인가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금자가 단체 또는 법인인 경우, 가지급금(또는 예금보험금) 신청시 필요한 서류는 무엇인가요?\\n\\n□ 예금자가 법인 또는 사업자번호로 거래한 경우 신청시 구비서류는 ①예금자 본인 도장(도장은 통장의 거래도장과 관계없음, 서명가능) ②(대표자 본인이 찾아올 경우) 신분증 및 사업자등록증, (대리인이 찾아올 경우) 신분증, 사업자등록증, 위임장, 법인인감증명서가 필요합니다.\", \"content_hash\": \"a923274095ccaeedbbe62a7bc9451bb198afe97e140726096ede27ae68b4975c\", \"heading_path\": [\"예금자가 단체 또는 법인인 경우, 가지급금(또는 예금보험금) 신청시 필요한 서류는 무엇인가요?\"]}\n{\"chunk_id\": \"DP-005_chunk_021\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 21, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금자가 사망하였을 경우 가지급금(또는 예금보험금)은 어떻게 청구하면 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금자가 사망하였을 경우 가지급금(또는 예금보험금)은 어떻게 청구하면 되나요?\\n\\n□ 예금자가 사망하였을 경우에는 다음의 서류를 구비하시어 영업정지된 해당 저축은행을 방문하시면 됩니다. ㅇ 상속인의 주민등록증 등 본인증명 서류 ㅇ 상속인임을 확인할 수 있는 피상속인의 가족관계증명서(상세) 또는 피상속인의 제적등본(필요시) ㅇ 상속인 전원이 연서한 “(공동·상속)예금등 지분신고서 및 수령권한 위임동의서”, “상속포기각서”와 상속인 각자의 인감증명서(동의서 상의 도장과 인감증명서 인감 일치) ㅇ 예금자가 사망한 경우에는 우선적으로 해당 저축은행을 방문하여 상속예금의 지급에 관한 상세한 안내를 받으시기 바랍니다. □ 다만, 예금보험금의 경우 상속 총액이 3백만원 이하인 경우에는 소액 상속 간편 지급이 가능합니다. ㅇ 즉, “상속인 전원이 연서한 (공동·상속)예금등 지분신고서 및 수령권한 위임동의서, 상속포기각서와 상속인 각자의 인감증명서” 대신 “손해담보약정서”를 구비하시면 상속인 1인의 요청으로 예금보험금 청구가 가능합니다. 단, 상속인간 분쟁이 예상될 경우 지급이 거절될 수 있습니다. ㅇ 소액 상속 간편 지급의 경우에는 우선적으로 공사를 통해 상세한 안내를 받으시기 바랍니다.\", \"content_hash\": \"9d375c1ff17efbcbf28b2ff8149448b51731a18e0a594dfb85a1288d64707aa0\", \"heading_path\": [\"예금자가 사망하였을 경우 가지급금(또는 예금보험금)은 어떻게 청구하면 되나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_022\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 22, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"군복무 중인 자녀 명의의 예금에 대한 가지급금(또는 예금보험금)을 지급받기 위해서는 어떻게 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 군복무 중인 자녀 명의의 예금에 대한 가지급금(또는 예금보험금)을 지급받기 위해서는 어떻게 해야 하나요?\\n\\n□ 군복무 중인 예금자를 대리하여 가지급금과 예금보험금을 수령하고자 하는 경우에는 대리인 주민등록증 등 본인증명 서류, 소속 부대장의 확인 및 직인이 날인된 예금자의 위임장*과 해당 군부대에서 발급된 군복무확인서가 필요합니다(인감증명서 불필요). * 예시) 위와 같이 위임한 사실을 확인합니다. 제○○○○부대장 직인\", \"content_hash\": \"f42beefd45b535e5e152a6e504c1cd5a875943283931ad228e1866b3cf6a3a53\", \"heading_path\": [\"군복무 중인 자녀 명의의 예금에 대한 가지급금(또는 예금보험금)을 지급받기 위해서는 어떻게 해야 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_023\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 23, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"외국 시민권자가 본인의 가지급금(또는 예금보험금)을 찾기 위해서는 어떻게 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 외국 시민권자가 본인의 가지급금(또는 예금보험금)을 찾기 위해서는 어떻게 해야 하나요?\\n\\n□ 본인이 직접 지급대행지점을 방문(여권 또는 외국인등록증 지참)하시거나, 인터넷뱅킹 및 본인인증이 가능한 경우 공사 금융안심포털(fins.kdic.or.kr)에서 신청하실 수 있습니다. ※ 공사 금융안심포털(PC·모바일) 접속을 통한 신청방법 - fins.kdic.or.kr ⇒ 미수령금 통합신청 ⇒ 통합신청 ⇒ 성명 및 주민등록번호 입력 ⇒ 본인인증 ⇒ 미수령금 신청 □ 한국에 있는 대리인이 외국 시민권자의 가지급금과 예금보험금을 대리로 수령하기 위해서는, ㅇ 외국 주재 한국영사관(또는 대사관) 홈페이지에 시민권자를 위한 위임장 양식이 게재되어 있는바 참고하시어 해당 국가 관청에서 위임사실을 확인받거나 공증사무소 등에서 공증을 받으시면 위임장에 기재된 대리인을 통하여 가지급금(또는 예금보험금)을 수령할 수 있습니다. - 이 경우 해당 국가 관청의 확인 또는 공증사무소에서 공증된 예금자 본인의 위임장(원본)과 대리인의 주민등록증 등 본인증명 서류 등이 필요합니다.\", \"content_hash\": \"53f5e8d6702ed1b6ea7323a011ec537d02dd1ba49678a25fc56b5ab7a802b7ee\", \"heading_path\": [\"외국 시민권자가 본인의 가지급금(또는 예금보험금)을 찾기 위해서는 어떻게 해야 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_024\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 24, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"외국에 거주하는 예금자(유학생, 장기 체류자 등)가 가지급금(또는 예금보험금) 등을 지급 받기 위해서는 어떻게 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 외국에 거주하는 예금자(유학생, 장기 체류자 등)가 가지급금(또는 예금보험금) 등을 지급 받기 위해서는 어떻게 해야 하나요?\\n\\n□ 외국거주 예금자가 가지급금과 예금보험금을 지급받기 위하여는 대리인을 통하여 지급받을 수 있으며, 이 경우 체류국 한국대사관(영사관) 등에 방문하여 영사 등이 확인한 예금자 본인의 자필 위임장*(원본)과 대리인의 주민등록증 등 본인증명 서류 등이 필요합니다. * 현지 대사관의 공증을 받거나 해당국이 발급한 아포스티유를 첨부한 예금자 본인 명의의 위임장 ㅇ 또는, 인터넷뱅킹 및 본인인증이 가능한 경우, 공사 금융안심포털(fins.kdic.or.kr)에서 예금보험금을 신청하실 수 있습니다. ※ 공사 금융안심포털(PC·모바일) 접속을 통한 신청방법 - fins.kdic.or.kr ⇒ 미수령금 통합신청 ⇒ 통합신청 ⇒ 성명 및 주민등록번호 입력 ⇒ 본인인증 ⇒ 미수령금 신청\", \"content_hash\": \"c73f1bf0c6f371b7e85b922f4b373c1d6432f4fb42bea5b5885e57c8f9726231\", \"heading_path\": [\"외국에 거주하는 예금자(유학생, 장기 체류자 등)가 가지급금(또는 예금보험금) 등을 지급 받기 위해서는 어떻게 해야 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_025\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 25, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"손자(孫子: 미성년자) 명의의 예금에 대한 가지급금(또는 예금보험금)을 조부모(祖父母) 등이 대리인 자격으로 수령하고 싶은데 어떻게 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 손자(孫子: 미성년자) 명의의 예금에 대한 가지급금(또는 예금보험금)을 조부모(祖父母) 등이 대리인 자격으로 수령하고 싶은데 어떻게 해야 하나요?\\n\\n□ 미성년자 예금에 대하여는 친권자인 부·모가 공동으로 친권을 행사하여야 하므로 조부모처럼 친권자가 아닌 제3자가 대리인의 자격으로 가지급금을 수령하기 위해서는 친권자로부터 각각 위임을 받아 손자 명의의 예금에 대한 가지급금과 예금보험금을 대리 수령할 수 있습니다. ㅇ 즉, 미성년자 예금에 대한 예금보험금을 조부모 등 제3자가 대리인의 자격으로 수령하고자 할 경우에는, - 대리인의 주민등록증 등 본인증명 서류, 친권자합의서(소정서식, 인감 날인 필요), 위임장(친권자합의서 상에서 친권행사를 위임받은 자의 인감날인 필요), 부모의 인감증명서 각 1부, 가족관계증명서 및 미성년자명의의 기본증명서가 필요합니다.\", \"content_hash\": \"48212d8f5c1ffdcdfa3c1ffa4dd1552df6002c425c51039c814bfe68d4d321ef\", \"heading_path\": [\"손자(孫子: 미성년자) 명의의 예금에 대한 가지급금(또는 예금보험금)을 조부모(祖父母) 등이 대리인 자격으로 수령하고 싶은데 어떻게 해야 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_026\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 26, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"미성년자에 대한 예금은 친권자가 친권을 행사하여 찾을 수 있다던데 부모 중 한명이 친권을 행사하면 가지급금(또는 예금보험금)을 찾을 수 있는 것 아닌가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 미성년자에 대한 예금은 친권자가 친권을 행사하여 찾을 수 있다던데 부모 중 한명이 친권을 행사하면 가지급금(또는 예금보험금)을 찾을 수 있는 것 아닌가요?\\n\\n□ 예금자가 미성년자인 경우에는 친권자가 공동으로 혹은 후견인이 가지급금과 예금보험금을 수령해야 합니다. 친권은 부모가 혼인 중일 때는 부모가 공동으로 행사(민법 제909조 제2항)하여야 하기 때문입니다. ㅇ 따라서, 가지급금(또는 예금보험금) 수령시 부·모 중 한분이 친권을 행사하고자 하는 경우에는 나머지 한분으로부터 친권행사행위를 위임받으셔야 합니다. - 부모 중 한 분만 지급대행지점에 방문하시는 경우에는 부모 중 방문하는 분의 주민등록증 등 본인증명 서류, 친권자합의서(소정서식, 부모 중 방문하지 않는 분의 인감 날인 필요), 부모 중 방문하지 않는 분의 인감증명서, 가족관계증명서 및 미성년자 명의의 기본증명서가 필요합니다.\", \"content_hash\": \"bd4350f76fb19a2ac7294ce74a008acf39539424d8c8bb7275059a5df8b66e3e\", \"heading_path\": [\"미성년자에 대한 예금은 친권자가 친권을 행사하여 찾을 수 있다던데 부모 중 한명이 친권을 행사하면 가지급금(또는 예금보험금)을 찾을 수 있는 것 아닌가요?\"]}\n{\"chunk_id\": \"DP-005_chunk_027\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 27, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금과 대출을 모두 보유하고 있는 경우에 1억원 초과여부 판단은 어떻게 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금과 대출을 모두 보유하고 있는 경우에 1억원 초과여부 판단은 어떻게 하나요?\\n\\n□ 예금자가 예금과 대출을 모두 보유하고 계신 경우에는 예금에서 대출금을 차감한 금액(순예금) 기준으로 판단합니다. ㅇ 예를 들어, 1억2천만원의 예금을 보유하신 예금자가 3천만원의 대출채무를 지고 있는 경우 해당 예금자의 순예금은 예금 1억2천만원에서 대출 3천만원을 차감한 9천만원이 됩니다.\", \"content_hash\": \"350915cfd246dd374cd579139c59a68f14bc06cb094328c55e075fc1651ef0ba\", \"heading_path\": [\"예금과 대출을 모두 보유하고 있는 경우에 1억원 초과여부 판단은 어떻게 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_028\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 28, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"자체정상화가 이루어지지 않을 경우 예금액 중에서 예금보호한도를 초과하는 부분은 전혀 돌려받지 못하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 자체정상화가 이루어지지 않을 경우 예금액 중에서 예금보호한도를 초과하는 부분은 전혀 돌려받지 못하나요?\\n\\n□ 저축은행의 예금자가 해당 저축은행에 보유하고 있는 예금 중 보호한도를 초과하여 예금보험금으로 지급받지 못하는 금액에 대해서는 향후 파산배당금으로 일부를 수령하게 됩니다. ㅇ 그러나, 파산배당의 경우 상당히 장기간*에 걸쳐 여러 번에 나누어서 지급됨에 따라 예금자의 경제적 불편이 지속될 수 있습니다. * 경험적으로 보아 저축은행 파산재단은 영업정지 후 1차 배당까지 약 2년, 2차 배당까지는 약 3년, 종결배당까지는 약 9년 정도가 소요됨 ㅇ 공사는 이러한 장기간에 걸친 파산절차로 인한 예금자의 불편을 해소해드리기 위해 예금자가 향후 파산배당으로 받게될 예상배당률을 고려하여 예금자의 예금등 채권을 예금자의 청구에 의하여 공사가 매입하고, 그 매입의 대가로 예금자에게 금전을 지급하는 개산지급금 제도를 시행하고 있습니다. - 개산지급금을 수령하지 않은 예금자께서는 향후 해당 금융회사의 파산절차에 따라 파산배당금으로 보호한도를 초과하는 예금등 채권의 일부를 수령하시게 됩니다.\", \"content_hash\": \"8f3bf1defdf9fecea24f1257dc79ba196a6b274cfc4a95544eb67f635a188861\", \"heading_path\": [\"자체정상화가 이루어지지 않을 경우 예금액 중에서 예금보호한도를 초과하는 부분은 전혀 돌려받지 못하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_029\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 29, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"지급받은 가지급금은 자체정상화 또는 제3자에게 계약이전 되거나 보험금이 지급되는 경우 공사에 상환해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 지급받은 가지급금은 자체정상화 또는 제3자에게 계약이전 되거나 보험금이 지급되는 경우 공사에 상환해야 하나요?\\n\\n□ 예금자가 이미 수령한 가지급금은 예금자가 직접 공사에 상환하는 것이 아닙니다. ㅇ 저축은행이 자체정상화되거나 해당 예금자의 예금이 계약이전 되는 경우 향후 해당 저축은행 또는 예금이 이전된 금융기관에서 예금을 인출할 때 동 금액만큼 차감하여 지급받게 됩니다. ㅇ 자체정상화가 이루어지지 않거나 예금이 계약이전되지 않고 공사가 예금보험금을 지급하는 경우에는 예금보험금지급액에서 가지급금을 공제한 금액을 지급합니다.\", \"content_hash\": \"7813b71c382e11433c0a5fe6105799f75ceda926c6b39af7f09b7a37fffcca2c\", \"heading_path\": [\"지급받은 가지급금은 자체정상화 또는 제3자에게 계약이전 되거나 보험금이 지급되는 경우 공사에 상환해야 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_030\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 30, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금의 일부를 가지급금으로 수령할 경우 예금에 적용될 이자율이 변경되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금의 일부를 가지급금으로 수령할 경우 예금에 적용될 이자율이 변경되나요?\\n\\n□ 가지급금은 예금의 중도해지가 아니라 원금의 일부(이자 미포함)를 인출하여 지급하는 것으로 가지급금을 수령하였다고 해서 예금의 당초 약정이율이 변경되지는 않습니다. ㅇ 다만, 향후 고객의 예금이 다른 저축은행에 이전될 것인지의 여부에 따라 예금에 적용될 이율이 달라지는데 이는 해당 저축은행의 정리방식에 의하여 결정됩니다. - 먼저, 저축은행이 자체정상화되거나 고객의 예금이 다른 저축은행에 이전될 경우 영업정지된 저축은행과 당초 약정한 약정이율(만기 경과 기간에 대하여는 만기후 이율, 이하 같음)이 그대로 유지됩니다. - 그러나 저축은행이 자체정상화가 이루어지지 않거나 고객의 예금이 다른 저축은행에 이전되지 않아 공사가 보험금으로 대신 지급할 경우에는 영업정지된 저축은행과의 약정이율과 공사의 소정이율 중 낮은 이율을 미지급이자 기산일로부터 적용하여 이자를 지급받게 됩니다.\", \"content_hash\": \"7521759f8060773a2a7b51e132edeb7318e5cba62e7299e57ff8f16287a6335b\", \"heading_path\": [\"예금의 일부를 가지급금으로 수령할 경우 예금에 적용될 이자율이 변경되나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_031\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 31, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금보험금 지급시 이자계산은 어떻게 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금보험금 지급시 이자계산은 어떻게 하나요?\\n\\n□ 예금의 이자 기산일부터 예금보험금 지급공고일까지의 기간에 대하여 공사의 예금보험금 공시이율과 영업정지된 저축은행의 예금이율 중 낮은 이율인 소정이율을 적용하여 지급합니다. * 부보금융회사의 1년만기 정기예금의 평균이자율을 고려하여 위원회가 정하는 이자율과 당행 부보금융회사의 약정이율 중 낮은 이율\", \"content_hash\": \"87521e58372693225f09a50f2b21cd700137585c81105af2288ae12abba9ceba\", \"heading_path\": [\"예금보험금 지급시 이자계산은 어떻게 하나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_032\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 32, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"가지급금(또는 예금보험금) 지급에 관하여 예금자에게 개별 통보해 주나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 가지급금(또는 예금보험금) 지급에 관하여 예금자에게 개별 통보해 주나요?\\n\\n□ 가지급금과 예금보험금 지급시기 및 절차 등에 대하여 예금자에게 개별적으로 안내문을 해당 저축은행에 등록된 주소(영업정지일 기준)로 발송할 계획입니다. ㅇ 아울러, 경제신문 및 해당 지역 일간지에 1회 공고하며, 해당 저축은행 및 공사 홈페이지에도 안내문이 게시됩니다.\", \"content_hash\": \"04b5edd65daefeafedb98c81b88a3202f8c0800bb9f858b3cacf2246d9cca655\", \"heading_path\": [\"가지급금(또는 예금보험금) 지급에 관하여 예금자에게 개별 통보해 주나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_033\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 33, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금보험금은 어떻게 신청하면 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금보험금은 어떻게 신청하면 되나요?\\n\\n□ 예금보험금을 수령하고자 하는 예금자께서는 공사가 지정한 지급대행지점을 직접 방문하시거나 공사 금융안심포털(fins.kdic.or.kr)을 통해 인터넷(PC·모바일)로 신청하여 수령하실 수 있으며, 신청하신 당일 또는 익일 지정하신 계좌로 입금됩니다. ㅇ 공사는 예금자 여러분의 편의를 위하여 해당 저축은행의 본·지점에서 가장 가까운 곳에 위치하고 있는 지급대행지점을 선정하여 예금보험금 지급업무를 대행하도록 하고 있사오니, 예금자 여러분께서는 해당 지급대행지점을 방문하시면 됩니다. - 지급대행지점을 직접 방문하시는 경우 주민등록증 등 본인증명 서류*를 지참하시어 지급대행지점에 비치된 신청서를 작성·제출하시면 됩니다. * 주민등록증, 경로우대증, 운전면허증, 여권 등 공공기관에서 발행한 사진이 들어간 본인임을 확인할 수 있는 증명. 학생인 경우 학생증 ㅇ 공사의 금융안심포털(fins.kdic.or.kr)에 접속하여 인터넷으로 신청하시는 경우(법인 및 미성년자 제외)에는 예금자 본인의 본인인증이 필요하며, 예금보험금 지급개시일부터 신청이 가능합니다. ※ 공사 금융안심포털(PC·모바일) 접속을 통한 신청방법 - fins.kdic.or.kr ⇒ 미수령금 통합신청 ⇒ 통합신청 ⇒ 성명 및 주민등록번호 입력 ⇒ 본인인증 ⇒ 미수령금 신청\", \"content_hash\": \"1dc64fd5fcfde09614757193a2e1ac4e41ddd1d0b0dd5f5a17fea8916eb12a52\", \"heading_path\": [\"예금보험금은 어떻게 신청하면 되나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_034\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 34, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"가지급금 신청은 아무 때나 가능한가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 가지급금 신청은 아무 때나 가능한가요?\\n\\n□ 가지급금 신청은 가지급금 지급을 개시한 이후부터 지급 기간 내에 언제라도 가능하나 지급개시일 이후 약 2주간은 가지급금 지급 요청이 일시에 쇄도함에 따라 객장이 매우 혼잡하고 대기시간 또한 상당히 지체될 수 있습니다. ㅇ 창구 혼잡을 덜기 위하여 번호표를 배부하여 정하여진 날짜에 지급하여 드리고 있으며, 인터넷(PC·모바일)을 통해 신청하시면 기다리는 시간 없이 바로 처리하실 수 있으니 이 점 참고하시기 바랍니다. ㅇ 다만, 인터넷 신청시 접속이 집중되는 가지급금 지급 첫날 오전은 가급적 신청을 자제해주실 것을 당부드립니다.\", \"content_hash\": \"533a406cddb438a6bc8544cf83234e31ea19faf9f68917182e1c3885ff219b97\", \"heading_path\": [\"가지급금 신청은 아무 때나 가능한가요?\"]}\n{\"chunk_id\": \"DP-005_chunk_035\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 35, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"가지급금을 수령한 후 예금에 대한 미지급이자는 언제 받나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 가지급금을 수령한 후 예금에 대한 미지급이자는 언제 받나요?\\n\\n□ 예금의 미지급이자 기산일부터 가지급금 수령일까지의 가지급금에 대한 미지급이자는 경영정상화 또는 계약이전이 되어 영업을 재개할 때 받습니다. ㅇ 통상적으로 계약이전에 따른 영업재개일과 예금보험금 지급개시일은 동일합니다.\", \"content_hash\": \"88e8f2b51c03c6351adeb5f1146a3152872bf93d42647be3674766e72a01e384\", \"heading_path\": [\"가지급금을 수령한 후 예금에 대한 미지급이자는 언제 받나요?\"]}\n{\"chunk_id\": \"DP-005_chunk_036\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 36, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"가지급금을 인터넷으로 신청할 경우 유리한 점은 무엇인가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 가지급금을 인터넷으로 신청할 경우 유리한 점은 무엇인가요?\\n\\n□ 가지급금을 오프라인 창구에서 신청할 경우, 일시에 많은 예금자들이 몰려 해당 저축은행이나 지급대행점에 2번 이상 방문해야 하거나 지급요청 대기시간이 매우 길어질 수 있습니다. 그러나, 인터넷으로 신청할 경우 대기시간 없이 빠른 신청이 가능하므로 시간이 매우 절약되는 이점이 있습니다. ㅇ 다만, 인터넷 신청시 접속이 집중되는 가지급금 지급 첫날 오전은 가급적 신청을 자제해주실 것을 당부드립니다.\", \"content_hash\": \"050789b3da7ed5268d7c15e33544aafc2bdd3a91706198b6936a0a21706f1462\", \"heading_path\": [\"가지급금을 인터넷으로 신청할 경우 유리한 점은 무엇인가요?\"]}\n{\"chunk_id\": \"DP-005_chunk_037\", \"parent_doc_id\": \"DP-005\", \"document_id\": \"DP-005\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 37, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"가지급금 지급시기 및 금액, 수령 방법은 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://fins.kdic.or.kr/cm/bbs/selectFaqNramtAply.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 가지급금 지급시기 및 금액, 수령 방법은 어떻게 되나요?\\n\\n□ 해당 저축은행 예금자에 대한 가지급금은 대출금보다 예금이 많은 예금자가 지급대상이며, 통상 보호한도의 40% 한도로 지급해왔으나 구체적인 가지급금 지급방안은 실제 지급사유 발생시 별도 안내될 예정입니다. ㅇ 보호한도가 5천만원인 과거에는 1인당 예금원금 기준 2천만원 한도로 가지급금을 지급하되 5천만원 초과 예금자에 대해서는 5천만원 한도내에서 원금의 40%까지 2개월간 지급한 바 있습니다. ㅇ 가지급금을 수령하고자 하는 예금자께서는 예금보험공사 금융안심포털(fins.kdic.or.kr)을 통해 인터넷(PC·모바일)로 신청하시거나 해당 저축은행 영업점(본점 또는 지점) 또는 지정된 농협·우리·국민·기업·신한·하나은행 대행지점을 방문하여 신청하실 수 있으며, 신청하신 당일 또는 익일에 지정하신 계좌로 입금됩니다. ㅇ 저축은행이나 금융기관 지급대행지점을 직접 방문할 경우에는 주민등록증 등 본인증명 서류*를 지참하시고 창구에서 제시하는 신청서를 작성·접수하시면 됩니다. * 주민등록증, 경로우대증, 운전면허증, 여권 등 공공기관에서 발행한 사진이 들어간 본인임을 확인할 수 있는 증명. 학생인 경우 학생증 ㅇ 인터넷으로 신청하시는 경우\u003c법인 및 미성년자 제외>에는 본인인증이 필요하며 가지급금 지급개시일부터 신청이 가능합니다. ※ 공사 금융안심포털(PC·모바일) 접속을 통한 신청방법 - fins.kdic.or.kr ⇒ 미수령금 통합신청 ⇒ 통합신청 ⇒ 성명 및 주민등록번호 입력 ⇒ 본인인증 ⇒ 미수령금 신청\", \"content_hash\": \"fac466840aedd45ebf834b7df80a3230e7173ff4e4e00a20fb98b4ec4ba8ccfa\", \"heading_path\": [\"가지급금 지급시기 및 금액, 수령 방법은 어떻게 되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_000\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금보호한도 1억원은 언제부터 적용되었나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금보호한도 1억원은 언제부터 적용되었나요?\\n\\n2025년 9월 1일부터 예금보호한도 1억원이 적용되고 있습니다. 예금 가입시점에 상관없이, ’25.9.1. 이전에 가입한 예금도 1억원까지 보호됩니다.\", \"content_hash\": \"f62a73b26589c474b02a64ad122616efce827901432a5fbfbba089217d25452c\", \"heading_path\": [\"예금보호한도 1억원은 언제부터 적용되었나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_001\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 1, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"1억원을 보호 받기 위해 별도로 신청을 해야 하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 1억원을 보호 받기 위해 별도로 신청을 해야 하나요?\\n\\n상향된 예금보호한도 적용을 위해 별도의 신청 절차는 필요하지 않으며, 예금 등을 보유하고 있는 모든 고객에게 9월 1일 이후 자동으로 상향된 한도가 적용되고 있습니다.\\n\\n※ 금융회사를 사칭하여 한도 상향을 사유로 개인･신용정보를 요구하거나, 문자에 포함된 URL 접속을 유도하는 등 금융사기가 발생할 가능성이 있으니 주의하시기 바랍니다.\", \"content_hash\": \"bc1863e130bda0eb87aac0243512e65b90750c1e278b23b09fbf34824b21111a\", \"heading_path\": [\"1억원을 보호 받기 위해 별도로 신청을 해야 하나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_002\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 2, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"어떤 금융회사의 예금이 보호되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 어떤 금융회사의 예금이 보호되나요?\\n\\n☞ 예금보험공사 홈페이지 > 제도·정책 > 예금자보호제도 > 보호대상 > 금융회사\\n\\n예금보험공사가 보호하는 금융회사는 은행*, 보험회사(생명보험, 손해보험), 투자매매·투자중개업자, 상호저축은행입니다.\\n\\n* 국내법에 따라 인가를 받은 외국 금융회사(은행·보험·증권) 국내지점 포함\\n\\n※ 참고로, 농·수협 지역조합, 신용협동조합, 새마을금고, 산림조합 등의 상호금융업권과 우체국은 개별 법령에 근거하여 자체 기금으로 보호하고 있어 예금보험공사가 보호하지 않습니다.\", \"content_hash\": \"52e1a28c2f66a495fc7f83a4aca375adab379c019218ae0cf1a798e089685d2e\", \"heading_path\": [\"어떤 금융회사의 예금이 보호되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_003\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 3, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"어떤 금융상품이 보호되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 어떤 금융상품이 보호되나요?\\n\\n☞ 예금보험공사 홈페이지 > 제도·정책 > 예금자보호제도 > 보호대상 > 금융상품\\n\\n보호대상 금융회사가 취급하는 예금 등 원금 지급이 보장되는 금융상품*이 보호됩니다.\\n\\n* 예·적금(은행, 저축은행), 보험계약의 해약환급금(보험회사), 투자자예탁금(증권회사) 등\\n\\n퇴직연금(DC형·IRP) 및 개인종합자산관리계좌(ISA)는 예금 등 보호상품으로 운용되는 경우에 한하여 보호됩니다.\\n\\n※ (사례) DC형 퇴직연금 적립금 1억 5천만원이 ❶예금(보호상품) 7천만원, ❷주식․ 채권 혼합형 펀드(비보호 상품) 8천만원으로 나누어 운용되는 경우, → 예금으로 운용되는 7천만원만 보호됩니다.\", \"content_hash\": \"67afc43a8ea9c41aad18c9dfb191972ca40830ea186161379fd3f5805fb2c0e5\", \"heading_path\": [\"어떤 금융상품이 보호되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_004\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 4, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"어떤 금융상품이 보호되지 않나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 어떤 금융상품이 보호되지 않나요?\\n\\n운용실적에 따라 지급액이 변동되는 금융상품*은 보호되지 않습니다.\\n\\n* (예) 펀드 등 금융투자상품, 실적배당형상품, 증권사 CMA, 후순위채권, 변액보험의 최저보증을 제외한 주계약 등\", \"content_hash\": \"da104a070891a8f4dec886d8903425302be5baabeca09e74fff6829f0b75cf1c\", \"heading_path\": [\"어떤 금융상품이 보호되지 않나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_005\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 5, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"외화예금도 보호되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 외화예금도 보호되나요?\\n\\n네. 외화예금도 1억원까지 보호됩니다.\\n\\n※ 예금보험금 지급공고일 기준 당해 금융회사의 최초 전신환매입율을 적용하여 원화로 환산한 후 1억원까지 보호\", \"content_hash\": \"ddde4df9d812b1c4f5231cd2156b0487a44367d1127ac8a13e993c1f6c523b99\", \"heading_path\": [\"외화예금도 보호되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_006\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 6, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"보험계약은 어떻게 보호되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 보험계약은 어떻게 보호되나요?\\n\\n예금보험금을 지급하는 시점에 보험약관에서 정한 보험사고가 발생하지 않았다면, 해약환급금*이 1억원까지 보호됩니다.\\n\\n* 계약자배당준비금 등이 있을 경우 해당 금액 포함\\n\\n만약, 영업정지 전에 받지 못한 사고보험금이 있다면 해약환급금과 별도로 사고보험금도 1억원까지 보호됩니다.\", \"content_hash\": \"7aebca64612135a4a88aaa8f86938d687a6d870c4b1138a2ee906058afe7bc87\", \"heading_path\": [\"보험계약은 어떻게 보호되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_007\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 7, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"금융회사에 어떤 일이 발생했을 때 예금보험공사가 1억원까지 보호하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 금융회사에 어떤 일이 발생했을 때 예금보험공사가 1억원까지 보호하나요?\\n\\n금융회사가 2025년 9월 1일 이후 영업정지·파산 등*으로 예금 등을 돌려줄 수 없을 때, 예금보험공사가 1억원까지 보호합니다.\\n\\n* 예금자보호법 제2조 제8호의 보험사고\", \"content_hash\": \"a9908f57345717bb361a1e0a5dd31f8ec88176223ad6ce62b7c85c8e2db303b7\", \"heading_path\": [\"금융회사에 어떤 일이 발생했을 때 예금보험공사가 1억원까지 보호하나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_008\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 8, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"원금뿐만 아니라 이자도 보호되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 원금뿐만 아니라 이자도 보호되나요?\\n\\n은행·저축은행 예·적금의 경우, 예·적금 원금과 이자를 합쳐 1억원까지 보호됩니다.\\n\\n또한, 금융투자회사 증권 관련 투자자예탁금의 경우, 예탁금 원금과 이자(예탁금 이용료)를 합하여 1억원까지 보호됩니다.\\n\\n다만, 이자는 고객이 가입한 금융상품의 약정이율과 예금보험공사가 정하는 공시이율* 중 낮은 이율을 적용하여 산정합니다.\\n\\n* (예) 은행·저축은행은 은행 1년 만기 정기예금 평균이자율\", \"content_hash\": \"ae0b0b0fc16588b0b6b604559259b3a58aa2d528cd79a680164b8052945a3c80\", \"heading_path\": [\"원금뿐만 아니라 이자도 보호되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_009\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 9, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"한 금융회사에 여러 개의 예·적금 계좌를 보유하고 있는 경우, 어떻게 보호되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 한 금융회사에 여러 개의 예·적금 계좌를 보유하고 있는 경우, 어떻게 보호되나요?\\n\\n예금자가 하나의 금융회사에 보유하고 있는 모든 예·적금의 원금과 소정의 이자를 합쳐 1억원까지 보호됩니다.\\n\\n※ (사례) 예금자 홍길동이 A은행에 3천만원, 4천만원, 5천만원의 예금 계좌를 각각 보유 중이라면, 총 1억 2천만원 중 1억원이 보호됩니다.\\n\\n- 1억원을 초과하는 금액, 즉 2천만원에 대해서는 법원의 파산절차에 참여하여 일부 금액을 배당받을 수 있습니다.\", \"content_hash\": \"0d68be1f0ae2ee3a7d50d192add718c392f7e35a27c3b0459e1a62face21d16f\", \"heading_path\": [\"한 금융회사에 여러 개의 예·적금 계좌를 보유하고 있는 경우, 어떻게 보호되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_010\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 10, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"서로 다른 금융회사에 각각 예·적금 계좌를 보유하고 있는 경우, 어떻게 보호되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 서로 다른 금융회사에 각각 예·적금 계좌를 보유하고 있는 경우, 어떻게 보호되나요?\\n\\n서로 다른 금융회사에 가입한 예·적금에 대해서는 금융회사별로 각각 원금과 소정의 이자를 합쳐 1억원까지 보호됩니다.\\n\\n※ (사례) 홍길동이 A은행에 9천만원, B은행에 8천만원 예금을 각각 가지고 있는 경우, A은행 9천만원, B은행 8천만원 각각 전부 보호받을 수 있습니다.\", \"content_hash\": \"16bfa6163fa5124bf5ad21ef6c92e031dfa4b5b732dec633d206c486f0e899f6\", \"heading_path\": [\"서로 다른 금융회사에 각각 예·적금 계좌를 보유하고 있는 경우, 어떻게 보호되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_011\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 11, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"퇴직연금, 연금저축, 사고보험금에 대한 별도보호한도 1억원은 어떻게 적용되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 퇴직연금, 연금저축, 사고보험금에 대한 별도보호한도 1억원은 어떻게 적용되나요?\\n\\n※ 별도 보호한도란?\\n\\n1. 국민의 노후 소득 보장 등 정책적 목적에 따라 사회적 보장 성격이 강한 상품에 대한 예금보호한도를 일반 예금과 별도로 각각 보호한도를 적용하는 것을 의미합니다.\\n\\n아래 상품들은 동일한 금융회사 내에서도 일반 예금 또는 해약환급금(보험계약)과 별도로 각각 1억원까지 보호됩니다. (①,②,③ 각 1억원)\\n\\n① DC형·개인형(IRP) 퇴직연금, 중소기업퇴직연금기금의 적립금 중 예금 등 보호상품으로 운용되는 금액\\n\\n② 연금저축신탁·연금저축보험\\n\\n③ 사고보험금* * 영업정지 전에 보험금 지급사유가 발생했으나 미지급된 보험금\\n\\n※ (사례) 홍길동이 A은행에 ➊예금 6천만원, ➋연금저축신탁 1억 2천만원, ➌DC형 퇴직연금 중 예금으로 운용되는 적립금 1억 5천만원을 보유한 경우, → ➊예금 6천만원, ➋연금저축신탁 1억원, ➌DC형 퇴직연금 적립금 1억원 각각 보호됩니다.\", \"content_hash\": \"5dfe35a7dbbe3383c31ed0bc07715a2d6bbaa5ed3125ba025b6de5c82718ebe8\", \"heading_path\": [\"퇴직연금, 연금저축, 사고보험금에 대한 별도보호한도 1억원은 어떻게 적용되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_012\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 12, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"법인의 예금도 보호되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 법인의 예금도 보호되나요?\\n\\n네. 기업 등 법인의 예금도 개인예금과 마찬가지로 법인별 1억원까지 보호됩니다. 다만, 정부·지방자치단체·한국은행·금융감독원·예금보험공사 및 부보금융회사*의 예금은 보호대상에서 제외됩니다.\\n\\n참고로, 보험계약자 및 보험료납부자가 법인인 보험계약의 경우 보호대상에서 제외됩니다.\\n\\n*예금보험의 적용을 받는 금융회사\", \"content_hash\": \"2305b23ccfd7899952bbd6d621f533f25d750e4ff509d8fc4ba64c3a8faa6e71\", \"heading_path\": [\"법인의 예금도 보호되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_013\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 13, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금보호한도 1억원은 세전인가요 아니면 세후인가요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금보호한도 1억원은 세전인가요 아니면 세후인가요?\\n\\n예금보험금 지급은 세전 기준으로 적용됩니다. 예금보험금을 수령한 고객은 지급받은 예금보험금 가운데 이자부분에 대해서는 이자소득세와 주민세등 관련세금을 납부해야 합니다.\", \"content_hash\": \"bd71a7f2a5cc06b4b690e4f7a3f916e98445dbe2611266b10ccd11cfacfd5c8f\", \"heading_path\": [\"예금보호한도 1억원은 세전인가요 아니면 세후인가요?\"]}\n{\"chunk_id\": \"DP-006_chunk_014\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 14, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"보험사고가 발생한 부보금융회사에 예금 등 채권과 대출금이 동시에 있으면 예금보험금은 어떻게 되며, 타인의 대출을 위한 지급보증도 있다면 어떻게 되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 보험사고가 발생한 부보금융회사에 예금 등 채권과 대출금이 동시에 있으면 예금보험금은 어떻게 되며, 타인의 대출을 위한 지급보증도 있다면 어떻게 되나요?\\n\\n- 예금등 채권과 대출금이 동시에 있을 경우\\n\\n- 예금 등 채권에서 대출금을 공제한 금액을 예금보험금으로 지급합니다. 또한, 타인의 대출을 위한 지급 보증이 있다면 주 채무자가 대출금을 상환할 때까지 대출금 만큼의 예금보험금 지급이 보류됩니다.\\n- [예1] '갑' 금융회사에 예금등 채권이 1억5천만원, 대출금이 3천만원 있는데 해당 부보금융회사에 보험사고가 발생한 경우 예금등 채권액 1억5천만원에서 대출액 3천만원을 공제한 1억2천만원 중 예금보호한도가 예금자 1인당 최고 1억원이므로 1억원을 지급받습니다.\\n- [예2] '을' 금융회사에 A가 예금등 채권이 1억원, 대출금이 7천만원, B를 위한 연대보증 3천만원이 있는데 해당 금융회사에 보험사고가 발생한 경우\\n- 예금등 채권액 1억원에서 대출금 7천만원을 공제한 3천만원을 지급받을 수 있지만 주 채무자인 B가 대출금을 상환할 때까지 3천만원은 예금보험금 지급이 보류됩니다.\", \"content_hash\": \"0c5bd2a4044baa1420eb3af0b3e6f10c873054e10d909e292665370f10c90167\", \"heading_path\": [\"보험사고가 발생한 부보금융회사에 예금 등 채권과 대출금이 동시에 있으면 예금보험금은 어떻게 되며, 타인의 대출을 위한 지급보증도 있다면 어떻게 되나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_015\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 15, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"예금액 중에서 예금보호한도 1억원을 넘는 부분은 전혀 돌려 받지 못하나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 예금액 중에서 예금보호한도 1억원을 넘는 부분은 전혀 돌려 받지 못하나요?\\n\\n예금보호한도 1억원을 초과하는 금액은 예금보험공사로부터 예금보험금을 받을 수 없습니다. 그러나 1억원을 초과한 금액에 대하여는 해당 금융회사에 대한 예금채권자로서 다른 채권자와 마찬가지로 동 금융회사(파산재단*) 의 파산 절차 참여를 통해 일부 금액을 배당받을 수 있습니다.\\n\\n파산재단\\n\\n금융회사가 파산했을 때 채권자들이 금융회사의 보유재산을 공평하게 나누기 위해 설립하는 법인체를 말합니다. 재산매각대금은 해당 금융회사의 채권자(예금채권자포함)들이 보유중인 채권의 비율에 따라 분배합니다.\", \"content_hash\": \"3dc22907ba008873697b7abf5b37fe327f122f0915eb357a6d1c0c7183d691de\", \"heading_path\": [\"예금액 중에서 예금보호한도 1억원을 넘는 부분은 전혀 돌려 받지 못하나요?\"]}\n{\"chunk_id\": \"DP-006_chunk_016\", \"parent_doc_id\": \"DP-006\", \"document_id\": \"DP-006\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 16, \"title\": \"예금자보호제도 FAQ\", \"section_title\": \"부보금융회사가 합병되는 경우 예금보호한도는 어떻게 적용되나요?\", \"chunk_type\": \"faq\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"faq\", \"rag_index_mode\": \"full\", \"source_url\": \"https://www.kdic.or.kr/sp/dpstrprot/ProtSystFaq/selectScrn.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"### Q. 부보금융회사가 합병되는 경우 예금보호한도는 어떻게 적용되나요?\\n\\n부보금융회사가 합병되는 경우에 신설, 존속, 소멸하는 금융회사를 각각 별개의 부보금융회사로 간주하여 합병등기일로부터 1년까지는 별도의 예금보호한도가 적용됩니다.\", \"content_hash\": \"d0d9a21d372a732ef2694f00b2803fb1245217fa5dc8f60280f345727149e45f\", \"heading_path\": [\"부보금융회사가 합병되는 경우 예금보호한도는 어떻게 적용되나요?\"]}\n{\"chunk_id\": \"DP-007_chunk_000\", \"parent_doc_id\": \"DP-007\", \"document_id\": \"DP-007\", \"attachment_id\": null, \"record_type\": \"page\", \"chunk_index\": 0, \"title\": \"예금자보호한도(해외)\", \"section_title\": \"\", \"chunk_type\": \"table\", \"resource_group_id\": \"\", \"source_fragment\": \"\", \"business_function\": \"예금자보호제도\", \"target_business_function\": \"예금자보호제도\", \"page_type\": \"reference_comparison\", \"rag_index_mode\": \"reference\", \"source_url\": \"https://www.kdic.or.kr/di/bzpblnt/selectPbcrPblntProtLmtsOvrs.do\", \"official_download_url\": null, \"available_action_types\": [], \"detected_phone_numbers\": [], \"related_links\": [], \"related_documents\": [], \"content\": \"| 구분 | 구분 2 | 한국 | 미국 | 캐나다 | 일본 | 영국 | 독일 |\\n| --- | --- | --- | --- | --- | --- | --- | --- |\\n
